# Caching, split by whether the filename carries its own version.
#
# Without this nginx sends no Cache-Control at all, so browsers apply heuristic
# freshness and a deploy is invisible until they choose to revalidate. That has
# wasted time twice — once on the foundation console, once on the site — and the
# real cost is not the wait: it is that an operator cannot tell "the fix is not
# deployed" from "the fix does not work", which is the diagnosis that burns
# hours.
#
# Hashed bundles are immutable by construction. Vite names them index-HASH.js
# with a hyphen, not name.HASH.js — so a changed file is a changed URL and it
# can be held for a year. Matching on a dot instead of the hyphen is how this
# rule silently matched nothing and every bundle came back no-cache. Everything else revalidates on every request; the ETag makes that a 304
# with no body, so the cost is one round trip and the benefit is that deploying
# is deploying.


# add_header REPLACES, it does not merge. A location that sets one header drops
# every header the server block set, so each of these three has to carry the
# security headers as well or the pages they match are served without them.
#
# What that would have meant here: "/" is an exact-match location and every
# bundle, stylesheet and .html matches the regexes below, so the home page and
# every script on the site would have gone out with no CSP and no X-Frame-Options
# while /keys/ and /explorer/ — which match neither — carried them. The check in
# deploy.sh probed /keys/, so this would have looked deployed.

location ~* "/assets/.+-[0-9a-zA-Z_-]{8,}\.(js|css|woff2?)$" {
    include /etc/nginx/snippets/yamale-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location ~* "\.(html|css|js|svg|json)$" {
    include /etc/nginx/snippets/yamale-headers.conf;
    add_header Cache-Control "no-cache";
}

location = / {
    include /etc/nginx/snippets/yamale-headers.conf;
    add_header Cache-Control "no-cache";
}
