# Security headers, and the argument for each.
#
# Neither host sent any of these until 2026-09-05. The consoles include a
# wallet, a payments app and an in-browser key-generation ceremony at /keys/,
# and it is that last one that makes this worth doing rather than worth noting:
# any script that reaches that origin sees the material as it is generated.
#
# Included from the server block of BOTH hosts, byte-for-byte, for the same
# reason yamale-visibility.conf is — two hosts answering differently is a
# security difference nobody declared.

# HSTS. Both hosts serve HTTPS: the VM through certbot, the Pi through a
# Tailscale Funnel that terminates TLS in front of a plain listener. Six months,
# no preload: preloading is close to irreversible and this is a devnet whose
# hostnames will change.
add_header Strict-Transport-Security "max-age=15552000" always;

# The declared type is the type. Without this a browser may sniff a JSON
# response into HTML and execute it, which turns any endpoint that echoes user
# input into a script host.
add_header X-Content-Type-Options "nosniff" always;

# Nothing here should ever be framed. A wallet in an iframe is a clickjacking
# target, and the key ceremony in one is worse. frame-ancestors in the policy
# below says the same thing to browsers that read CSP; this covers the rest.
add_header X-Frame-Options "DENY" always;

# Addresses and transaction hashes travel in paths on these consoles, so a
# referrer sent off-origin is a disclosure. Nothing here links out in a way that
# needs one.
add_header Referrer-Policy "no-referrer" always;

# None of these consoles use a camera, a microphone or a location, and a page
# that never asks should not be able to.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# The content policy.
#
# connect-src is the line that matters. Every console talks to the node
# same-origin — that is why /api/rest and /api/rpc exist on this host at all and
# why the node never needed CORS opened — so restricting connections to 'self'
# leaves the applications working and removes the exfiltration path that makes
# an injected script on /keys/ worth writing.
#
# 'unsafe-inline' for scripts is a real weakening and is here because the pages
# carry inline bootstrap scripts; it is not the part doing the work. Moving to
# hashes or nonces is worth doing and needs the build to cooperate, so it is
# recorded in docs/scope/gaps.md rather than half-done here.
#
# 'wasm-unsafe-eval' is for /keys/, which runs a Go WASM module. Without it the
# ceremony page fails to start.
#
# fonts.googleapis.com and fonts.gstatic.com are allowed because ten of the
# consoles load a webfont from them. That is a third party seeing which pages
# are opened, which is worth removing by self-hosting the fonts — also recorded
# rather than done, because breaking every console's typography in the same
# change as adding a policy makes it impossible to tell which one broke.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
