# The account service, reachable from a browser — and rate limited, because it
# is not otherwise defensible on a public hostname.
#
# NOT INSTALLED. This file exists so that turning browser enrolment on is one
# reviewed change rather than an improvisation at the moment somebody wants it.
# Nothing includes it yet, and deploy/deploy.sh does not copy it.
#
# # Why it needs a rate limit and the RPC gate does not
#
# From docs/guides/custodian.md, in the service's own list of what it does not
# do:
#
#   No rate limit and no lockout. Argon2id makes each guess cost about 90 ms
#   and that is all that stands between an attacker and an online password
#   attack.
#
# Every endpoint below authenticates with an email and a password, and one of
# them signs. Put that on the open internet unmetered and 90 ms per guess is not
# a defence — it is a throughput figure, about eleven guesses a second per
# connection and as many connections as an attacker cares to open. The service
# is right not to implement the limit itself: it authenticates the account, not
# the network, and says so. This is the network's half.
#
# # The shape of the limit
#
# Two zones, because the two paths have different profiles and sharing one would
# let a signing customer be locked out by an enrolment flood:
#
#   enrol   1 r/m   — creating an account is a once-per-lifetime act, and the
#                     device spends minutes on primes before it even starts. A
#                     person hitting this limit is not a person.
#   sign    12 r/m  — a signature is several round trips, so this is perhaps
#                     two or three signatures a minute per address. Generous for
#                     a human, useless for an online password attack.
#
# `burst` with `nodelay` lets one person's several-message exchange through at
# once while still holding the average. Without it the protocol itself would be
# throttled, and a legitimate signature that takes four round trips would take
# twenty seconds.
#
# Keyed on $binary_remote_addr, which is the honest weakness: an attacker with
# many addresses gets many buckets. It raises the cost, it does not remove it,
# and the real answer is the lockout the service does not have. Said here rather
# than discovered later.
#
# # Installing this
#
# The two zones must be declared in the HTTP context, not in a server block —
# put these in /etc/nginx/conf.d/yamale-account-zones.conf:
#
#   limit_req_zone $binary_remote_addr zone=yamale_enrol:1m rate=1r/m;
#   limit_req_zone $binary_remote_addr zone=yamale_sign:4m  rate=12r/m;
#
# then, in the server block on the public host:
#
#   include /etc/nginx/snippets/yamale-account.conf;
#
# # The two roles are on different hosts, deliberately
#
# custodian on the VM, recovery on the Pi — never both on one, because a host
# holding both shares can sign alone and the whole design is that nothing can.
# The public host is the Pi, so /api/custodian/ crosses the tailnet to the VM
# and /api/recovery/ stays local. The device talks to both and is the only
# participant that does.

location /api/custodian/ {
    limit_req zone=yamale_enrol burst=20 nodelay;
    limit_req_status 429;

    proxy_pass http://100.117.244.96:8099/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Key generation is minutes of safe primes on the device, and the service
    # holds its half of the session open across it. A default 60s read timeout
    # would drop every enrolment at the point it was about to succeed.
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    # The security headers the server block sets are REPLACED by any add_header
    # in a location, not merged with them. See nginx-add-header-replaces in the
    # deployment notes: a location that sets one header drops every header the
    # server block set.
    include /etc/nginx/snippets/yamale-headers.conf;
}

# Signing is the same service and a different budget, so it is matched first and
# separately. nginx picks the longest matching prefix location, so this wins over
# /api/custodian/ for these paths.
location /api/custodian/v1/sign/ {
    limit_req zone=yamale_sign burst=8 nodelay;
    limit_req_status 429;

    proxy_pass http://100.117.244.96:8099/v1/sign/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    include /etc/nginx/snippets/yamale-headers.conf;
}

location /api/recovery/ {
    limit_req zone=yamale_enrol burst=20 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:8100/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    include /etc/nginx/snippets/yamale-headers.conf;
}

# Recovery's own endpoints are NOT exposed here, and that is deliberate.
#
# /v1/recovery/initiate, /approve and /complete are operator actions: two
# approvers from different teams, neither of them the initiator, over a 72-hour
# delay. They are reached from inside, by people whose authority is established
# somewhere other than a password. Publishing them would put the recovery of
# every account behind the same online guess as the account itself, which is the
# one thing recovery exists to be harder than.
#
# What IS exposed above is /v1/enrol/* on the recovery deployment, because
# enrolment needs all three parties and the recovery service holds one of them.
location /api/recovery/v1/recovery/ {
    return 404;
}
