# The routed single-page apps, served under paths on one origin.
#
# try_files per app rather than one shared fallback: a deep link like
# /wallet/faucet has no file behind it and must land on *that app's* index, not
# on the site's. A single root-level fallback would serve the marketing page for
# every unknown path inside every app, which looks like the app is broken rather
# than like the route is wrong.
#
# One origin is also what Funnel needs — it serves a single hostname — so this
# is the layout that survives going public, and the same one a real domain will
# want later.
#
# EVERY app with client-side routing needs a line here. An app that has one and
# is missing from this file works perfectly until somebody refreshes the page or
# opens a shared link, and then answers 404 from a URL the app itself just put in
# the address bar. /rwa/ was in exactly that state until 2026-09-01: its router
# defines /holdings and /v/:assetId, both of which 404'd on reload, on the only
# hostname the public can reach. Nothing failed on the way in — the console
# navigated fine, because client-side routing never asks the server.
#
# The test is one line, and it belongs in deploy.sh rather than in anybody's
# memory: for each app, request a path its router knows and the filesystem does
# not, and require a 200.

location /explorer/ { try_files $uri $uri/ /explorer/index.html; }
location /app/      { try_files $uri $uri/ /app/index.html; }
location /wallet/   { try_files $uri $uri/ /wallet/index.html; }
location /safe/     { try_files $uri $uri/ /safe/index.html; }
location /rwa/      { try_files $uri $uri/ /rwa/index.html; }
