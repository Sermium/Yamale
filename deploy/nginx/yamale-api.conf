# Dangerous CometBFT RPC methods, refused before they reach the node.
# The node, reachable same-origin from every app.
#
# The trailing slash on proxy_pass is load-bearing: it strips the /api/rest
# prefix, so /api/rest/cosmos/bank/... reaches the node as /cosmos/bank/...,
# exactly as the dev server's rewrite does.

include /etc/nginx/snippets/yamale-visibility.conf;


# /api/rpc/ and its websocket both live in yamale-rpc.conf, which points
# them at tools/rpcgate on 26659 rather than at the node on 26657. The
# deny-list regex that used to stand above this was removed with it: it
# matched a URL path, and CometBFT takes the method in the POST body, so
# it refused the GET form of five methods that answered in full over POST.
include /etc/nginx/snippets/yamale-rpc.conf;

# The faucet, same-origin with every app so a "get test funds" button needs no
# CORS and no second hostname.
location /api/faucet/ {
    limit_req zone=yamale_faucet burst=3 nodelay;
    proxy_pass http://127.0.0.1:8085/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
