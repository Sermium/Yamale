# The hosted key ceremony.
#
# Proxied rather than served as files: the ceremony is a process holding the
# state of a live ceremony in memory, and the page it serves is embedded in that
# binary so the hash the custodians verify is the hash of what the process has.
#
# No auth_basic. Both surfaces carry their own single-use tokens — one for the
# coordinator, one per custodian — and adding a shared password in front would
# mean one credential everybody types, which is the opposite of an invite that
# names one person.
#
# 502 when nothing is listening is correct and deliberate: a ceremony is not a
# service that should be up. It runs for an hour and then stops.
location /ceremony/ {
    proxy_pass http://127.0.0.1:8787/ceremony/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A custodian reads twenty-four words off this page and writes them down.
    # A read timeout measured in seconds would drop them mid-transcription.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
