# The public CometBFT RPC, behind a method gate.
#
# # What was wrong with the rule this replaces
#
# yamale-api.conf carried a deny list as an nginx location regex:
#
#   location ~ ^/api/rpc/(broadcast_tx_commit|dump_consensus_state|…) { return 403; }
#
# A location regex matches the URL PATH. CometBFT accepts the same call two
# ways, and the second is the one every CosmJS client uses:
#
#   GET  /api/rpc/net_info                 -> 403, the regex sees it
#   POST /api/rpc/  {"method":"net_info"}  -> full peer map, node ids, listen addrs
#
# So the list never blocked anything. Verified against the live funnel on
# 2026-09-05: all five of its entries answered over POST while their GET form
# returned 403. The rule was not weak, it was decorative.
#
# nginx cannot read a request body without njs or Lua, so the same is true of
# every variation on it — including a path allow-list on abci_query, which was
# the fix the audit proposed. The filter has to be a process that parses
# JSON-RPC, and that is tools/rpcgate: one allow-list, applied to the method
# whichever way it arrives.
#
# # Installing this
#
# Both hosts have a `location /api/rpc/` block and a deny-list regex inside
# /etc/nginx/snippets/yamale-api.conf. Replace BOTH with:
#
#   include /etc/nginx/snippets/yamale-rpc.conf;
#
# then `nginx -t` before reloading. deploy.sh copies this file to both hosts
# and then probes the POST form of every method that is meant to be closed, so
# a half-finished install reports itself rather than looking like success.

# The gate, not the node. rpcgate listens on 26659 and forwards what it permits
# to 26657, which stays bound to localhost and otherwise untouched.
location /api/rpc/ {
    proxy_pass http://127.0.0.1:26659/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # The gate buffers a request body to read the method out of it, and refuses
    # anything over a megabyte. This is the same bound one layer out, so an
    # oversized body is dropped by nginx rather than carried to Go to be
    # dropped there.
    client_max_body_size 1m;

    limit_req zone=yamale_rpc burst=16 nodelay;

    # A signed transaction from a slow connection is an ordinary request. The
    # long read timeout that used to be here was for /websocket, which is no
    # longer proxied — see below.
    proxy_read_timeout 60s;
}

# CometBFT's /websocket is deliberately NOT proxied any more.
#
# It was, with the connection-upgrade dance, on the argument that a subscribing
# client would otherwise fail in a way that looks like the node being down. No
# client here subscribes: clients/land/chain.js and clients/ladoum/chain.js both
# carry a comment saying they poll precisely because a websocket through the
# proxy is one more thing to go wrong, and nothing else opens one.
#
# It is closed rather than left open because a websocket is a JSON-RPC channel
# the method gate cannot see into: the frames arrive after the upgrade, and
# every refusal above could be re-sent through it. An unused hole in a gate is
# still a hole in the gate.
#
# If a subscriber is ever added, this needs the gate to speak websocket, not
# this location to come back.
location = /api/rpc/websocket {
    return 403;
}
