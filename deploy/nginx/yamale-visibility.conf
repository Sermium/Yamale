# Split visibility: public money is public, everything else is closed.
#
# DEFAULT DENY. Only the paths named below are open; anything not listed
# requires supervisor credentials. This is the inversion of the devnet's earlier
# default-allow, and it is the right way round wherever the data is real: a new
# endpoint added to the chain is closed until somebody decides it should be
# open, rather than public until somebody notices it should not be.
#
# The cost is that adding a module means remembering to open its public queries.
# That cost is the point — it forces the decision to be made once, deliberately,
# instead of never.
#
# Every validator still sees everything. This is access control, not
# cryptography, and the guarantee is the composition of the validator set plus
# this file.

# --- OPEN: where the public money went ---------------------------------------
#
# The anti-corruption argument, and the reason the system is worth deploying.
# Anyone, no account, no explanation required.

# Treasury: every shared fund, its balance, its commitments and its spends.
location /api/rest/yamale/blockchain/treasury/ {
    proxy_pass http://127.0.0.1:1317/yamale/blockchain/treasury/;
    proxy_set_header Host $host;
    limit_req zone=yamale_public burst=100 nodelay;
}

# Issuance: who is allowed to create currency, and how much exists.
location /api/rest/yamale/blockchain/stablecoin/ {
    proxy_pass http://127.0.0.1:1317/yamale/blockchain/stablecoin/;
    proxy_set_header Host $host;
    limit_req zone=yamale_public burst=100 nodelay;
