# Split visibility: public money is public, everything else is closed.
#
# DEFAULT DENY. Only the paths named below are open; anything not listed
# requires supervisor credentials. This is the inversion of the devnet's earlier
# default-allow, and it is the right way round wherever the data is real: a new
# endpoint added to the chain is closed until somebody decides it should be
# open, rather than public until somebody notices it should not be.
#
# The cost is that adding a module means remembering to open its public queries.
# That cost is the point — it forces the decision to be made once, deliberately,
# instead of never.
#
# Every validator still sees everything. This is access control, not
# cryptography, and the guarantee is the composition of the validator set plus
# this file.

# --- OPEN: where the public money went ---------------------------------------
#
# The anti-corruption argument, and the reason the system is worth deploying.
# Anyone, no account, no explanation required.

# Treasury: every shared fund, its balance, its commitments and its spends.
location /api/rest/yamale/blockchain/treasury/ {
    proxy_pass http://127.0.0.1:1317/yamale/blockchain/treasury/;
    proxy_set_header Host $host;
    limit_req zone=yamale_public burst=100 nodelay;
}

# Issuance: who is allowed to create currency, and how much exists.
location /api/rest/yamale/blockchain/stablecoin/ {
    proxy_pass http://127.0.0.1:1317/yamale/blockchain/stablecoin/;
    proxy_set_header Host $host;
    limit_req zone=yamale_public burst=100 nodelay;
}
location /api/rest/cosmos/bank/v1beta1/supply {
    proxy_pass http://127.0.0.1:1317/cosmos/bank/v1beta1/supply;
    proxy_set_header Host $host;
    limit_req zone=yamale_public burst=100 nodelay;
}
location /api/rest/cosmos/bank/v1beta1/denoms_metadata {
    proxy_pass http://127.0.0.1:1317/cosmos/bank/v1beta1/denoms_metadata;
    proxy_set_header Host $host;
    limit_req zone=yamale_public burst=100 nodelay;
}

# Custody: are we holding what we owe. Deliberately unauthenticated — a
# solvency figure only anybody with a login can check is not accountability.
location /api/rest/yamale/blockchain/custody/ {
    proxy_pass http://127.0.0.1:1317/yamale/blockchain/custody/;
    proxy_set_header Host $host;
    limit_req zone=yamale_public burst=100 nodelay;
}

# Governance: every proposal, every vote, and who may validate or participate.
location /api/rest/cosmos/gov/ {
    proxy_pass http://127.0.0.1:1317/cosmos/gov/;
    proxy_set_header Host $host;
    limit_req zone=yamale_public burst=100 nodelay;
}
location /api/rest/yamale/blockchain/validatorgov/ {
    proxy_pass http://127.0.0.1:1317/yamale/blockchain/validatorgov/;
    proxy_set_header Host $host;
    limit_req zone=yamale_public burst=100 nodelay;
}

# Enforcement: every case, its grounds, its evidence, and how each validator
# voted — including the cases that failed. A freeze power that is not publicly
# auditable is not a freeze power anyone should accept.
location /api/rest/yamale/blockchain/enforcement/ {
    proxy_pass http://127.0.0.1:1317/yamale/blockchain/enforcement/;
    proxy_set_header Host $host;
    limit_req zone=yamale_public burst=100 nodelay;
}

# Validators and staking: who secures the chain and with how much.
location /api/rest/cosmos/staking/ {
    proxy_pass http://127.0.0.1:1317/cosmos/staking/;
    proxy_set_header Host $host;
    limit_req zone=yamale_public burst=100 nodelay;
}
location /api/rest/cosmos/distribution/ {
    proxy_pass http://127.0.0.1:1317/cosmos/distribution/;
    proxy_set_header Host $host;
    limit_req zone=yamale_public burst=100 nodelay;
}
location /api/rest/cosmos/slashing/ {
    proxy_pass http://127.0.0.1:1317/cosmos/slashing/;
    proxy_set_header Host $host;
    limit_req zone=yamale_public burst=100 nodelay;
}

# Prices, pools, and the chain's own head. Market data and liveness, not
# anybody's business in particular.
location /api/rest/yamale/blockchain/oracle/ {
    proxy_pass http://127.0.0.1:1317/yamale/blockchain/oracle/;
    proxy_set_header Host $host;
    limit_req zone=yamale_public burst=100 nodelay;
}
location /api/rest/yamale/blockchain/amm/ {
    proxy_pass http://127.0.0.1:1317/yamale/blockchain/amm/;
    proxy_set_header Host $host;
    limit_req zone=yamale_public burst=100 nodelay;
}
location /api/rest/yamale/blockchain/emission/ {
    proxy_pass http://127.0.0.1:1317/yamale/blockchain/emission/;
    proxy_set_header Host $host;
    limit_req zone=yamale_public burst=100 nodelay;
}
location /api/rest/cosmos/base/ {
    proxy_pass http://127.0.0.1:1317/cosmos/base/;
    proxy_set_header Host $host;
    limit_req zone=yamale_public burst=100 nodelay;
}

# User ID resolution. Open because a payment cannot be addressed without it,
# and because it discloses only what x/alias holds: an address. No name, no
# document number, nothing that resolves to a person without the state's own
# records.
# Tokenisation is public to read: an offering nobody can inspect is an
# offering nobody should subscribe to, and the records disclose only what a
# prospectus would.
location /api/rest/yamale/blockchain/tokenisation/ {
    proxy_pass http://127.0.0.1:1317/yamale/blockchain/tokenisation/;
    limit_req zone=yamale_public burst=100 nodelay;
}

location /api/rest/yamale/blockchain/alias/ {
    proxy_pass http://127.0.0.1:1317/yamale/blockchain/alias/;
    proxy_set_header Host $host;
    limit_req zone=yamale_public burst=100 nodelay;
}

# --- OPEN, and the one to close next -----------------------------------------
#
# A person's own balance. Open today because the wallet reads it directly; under
# the account model this moves behind the account service, which authenticates
# the user and returns only their own. Recorded here so the gap is deliberate
# and visible rather than forgotten.
# Account number and sequence. Every client that signs a transaction must read
# these first, so a gate here does not protect anything -- it just makes signing
# impossible and pops a browser credential box mid-payment. They disclose less
# than the balance endpoint already does.
location /api/rest/cosmos/auth/v1beta1/accounts/ {
    proxy_pass http://127.0.0.1:1317/cosmos/auth/v1beta1/accounts/;
    limit_req zone=yamale_public burst=100 nodelay;
}

# Simulation, used to estimate gas before signing.
location /api/rest/cosmos/tx/v1beta1/ {
    proxy_pass http://127.0.0.1:1317/cosmos/tx/v1beta1/;
    limit_req zone=yamale_rest burst=30 nodelay;
}

location /api/rest/cosmos/bank/v1beta1/balances/ {
    proxy_pass http://127.0.0.1:1317/cosmos/bank/v1beta1/balances/;
    proxy_set_header Host $host;
    limit_req zone=yamale_public burst=100 nodelay;
}

# The registry of institutions permitted to move money.
#
# Public because the public capabilities page counts it, and because a register
# of licensed payment participants is the kind of list a regulator publishes
# rather than guards — validators, treasuries and enforcement cases are already
# open here, and closing this one while those are open was inconsistent rather
# than careful.
#
# It was not deliberately closed: it fell through to the catch-all below, which
# answers with a WWW-Authenticate challenge, which a browser renders as a
# credential dialog on a page that has no business asking for one.
location /api/rest/yamale/blockchain/paymsg/v1/approved_participant {
    proxy_pass http://127.0.0.1:1317/yamale/blockchain/paymsg/v1/approved_participant;
    proxy_set_header Host $host;
    limit_req zone=yamale_rest burst=20 nodelay;
}

location /api/rest/yamale/blockchain/paymsg/v1/participant {
    proxy_pass http://127.0.0.1:1317/yamale/blockchain/paymsg/v1/participant;
    proxy_set_header Host $host;
    limit_req zone=yamale_rest burst=20 nodelay;
}

# Who is sponsoring an account fees.
#
# The wallet shows this on every account page — "nobody is sponsoring this
# account and it holds no YML, so it cannot send anything yet" is the single
# most useful thing that page says to a new user. Behind the supervisor gate it
# answered 401 with a WWW-Authenticate challenge, which the browser rendered as
# a username/password box on a page that has no login.
#
# Safe to publish: a fee grant is a public relationship between two addresses,
# already visible in the transaction that created it.
location /api/rest/cosmos/feegrant/ {
    proxy_pass http://127.0.0.1:1317/cosmos/feegrant/;
    proxy_set_header Host $host;
    limit_req zone=yamale_public burst=100 nodelay;
}

# --- OPEN: who holds the recovered assets, and by what rule --------------------
#
# The foundation is the 3-of-5 x/group account named as enforcement.recovery_
# destination, so every seized asset on this chain ends up in it. The argument
# that opens /enforcement/ applies with more force here: a power to take money
# that is publicly auditable, feeding an account that is not, moves the opacity
# one step down the pipe rather than removing it.
#
# What this discloses is already public. The group, its five members, their
# weights and the threshold are written into genesis, and genesis is a file
# anybody joining downloads and is told to hash.
location /api/rest/cosmos/group/ {
    proxy_pass http://127.0.0.1:1317/cosmos/group/;
    proxy_set_header Host $host;
}

# The invariants themselves: the concentration ceilings, the seizure threshold,
# the custodian count, the recovery destination. Fixed at genesis and refused to
# governance, which is a claim worth nothing if it cannot be checked from
# outside.
location /api/rest/yamale/blockchain/constitution/ {
    proxy_pass http://127.0.0.1:1317/yamale/blockchain/constitution/;
    proxy_set_header Host $host;
}

# Transaction search. Needed because x/group DELETES a proposal once it executes
# successfully, so the record of what the foundation actually did exists only in
# the transaction log.
#
# This opens no data that was not already reachable: CometBFT tx_search is not
# in the RPC blocklist, so the same transactions are already served in their
# undecoded form on /api/rpc/. Closing this while leaving that open would be a
# lock on the front door of a building with no back wall.
location /api/rest/cosmos/tx/ {
    proxy_pass http://127.0.0.1:1317/cosmos/tx/;
    proxy_set_header Host $host;
}

# --- Everything else: supervisor credentials ---------------------------------
#
# Transaction search, payment records, account enumeration, and any endpoint a
# future module adds. Closed by default.
location /api/rest/ {
    auth_basic "Yamale — supervisor access";
    auth_basic_user_file /etc/nginx/yamale-supervisors;
    proxy_pass http://127.0.0.1:1317/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
    limit_req zone=yamale_rest burst=40 nodelay;
    # Under a split-visibility policy the access log is the accountability
    # record, so authenticated reads are kept apart from ordinary traffic.
    access_log /var/log/nginx/yamale-supervisor.log;
}
