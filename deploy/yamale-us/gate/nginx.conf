# The chain's gates on yamale-us: the same nginx snippets the VM ran, behind Caddy.
#
# Caddy is the only listener on 80/443 there (yamale-platform), so this nginx
# listens on loopback alone, on the port PORTS.md reserves, and serves only the
# /api/ routes. The snippets are deploy/nginx/*.conf unchanged, apart from the
# account routes, whose upstreams deploy-gate.sh rewrites for this host.

worker_processes 2;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    server_tokens off;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Every zone the snippets name. Copied from the VM's nginx.conf and
    # yamale-account-zones.conf, which is where they lived there.
    limit_req_zone $binary_remote_addr zone=yamale_rpc:10m rate=600r/m;
    limit_req_zone $binary_remote_addr zone=yamale_rest:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=yamale_public:10m rate=600r/m;
    limit_req_zone $binary_remote_addr zone=yamale_faucet:10m rate=6r/m;
    limit_req_zone $binary_remote_addr zone=yamale_enrol:1m rate=1r/m;
    limit_req_zone $binary_remote_addr zone=yamale_sign:4m rate=12r/m;
    map $http_upgrade $yamale_connection_upgrade { default upgrade; '' close; }

    # traceability.yamaletech.com. The key is empty for methods that write nothing,
    # and an empty key is not limited.
    map $request_method $traceability_write_key { POST $binary_remote_addr; PUT $binary_remote_addr; default ""; }
    map $request_method $traceability_sponsor_key { POST $binary_remote_addr; default ""; }
    limit_req_zone $traceability_write_key zone=yamale_traceability_write:4m rate=30r/m;
    limit_req_zone $traceability_sponsor_key zone=yamale_traceability_sponsor:4m rate=2r/m;

    server {
        listen 127.0.0.1:8081;
        server_name _;

        # Every request arrives from Caddy on 127.0.0.1. Without this, every
        # visitor in the world shares one rate-limit bucket, keyed on Caddy's
        # address. Caddy writes the client's address into X-Forwarded-For and
        # does not trust one sent by the client, so the header is believed
        # only from loopback.
        set_real_ip_from 127.0.0.1;
        set_real_ip_from ::1;
        real_ip_header X-Forwarded-For;

        # The apps, served as the VM served them: the same tree, the same SPA
        # fallbacks, the same headers. Caddy decides which subdomain lands on
        # which app; everything under a subdomain is answered here.
        root /srv/chain;
        index index.html;
        include /etc/nginx/snippets/yamale-headers.conf;
        include /etc/nginx/snippets/yamale-apps.conf;
        include /etc/nginx/snippets/yamale-api.conf;
        include /etc/nginx/snippets/yamale-account.conf;
        # Routes that carry a credential and so are not in git: the ops signer
        # (/api/ops/), whose locations inject its service password. They live in
        # /etc/yamale/gate/private on the host, root-only. A glob, so a host with
        # none of them still loads.
        include /etc/nginx/private/*.conf;

        location / { try_files $uri $uri/ =404; }
    }

    # traceability.yamaletech.com, at the root of its own host (see snippets/traceability.conf).
    # yamale-rpc.conf and yamale-account.conf name only zones declared above
    # (yamale_rpc, yamale_enrol, yamale_sign, yamale_public) and need nothing
    # from yamale-api.conf or yamale-visibility.conf, so those are not included.
    server {
        listen 127.0.0.1:8082;
        server_name _;
        set_real_ip_from 127.0.0.1;
        set_real_ip_from ::1;
        real_ip_header X-Forwarded-For;

        root /srv/traceability;
        index index.html;
        include /etc/nginx/snippets/yamale-headers.conf;
        include /etc/nginx/snippets/yamale-rpc.conf;
        include /etc/nginx/snippets/yamale-account.conf;
        include /etc/nginx/snippets/traceability.conf;
    }
}
