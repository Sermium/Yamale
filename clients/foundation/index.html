<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yamale · Foundation custodians</title>
<!-- The typefaces, before the stylesheet, so the request starts as early as the
     parser can start it. Every stack in the block below names real fallbacks, so
     a blocked font host — or an air-gapped machine, which is where some of these
     custodians read this — degrades to something chosen rather than to Times. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<!--
  The console for the foundation: the 3-of-5 x/group account that is the
  recovery destination for every seizure on this chain.

  Until this page existed the most consequential account on the network could
  only be operated by hand-assembling protobuf JSON at a command line, which in
  practice means it would not have been operated at all. "The foundation cannot
  actually spend" is the worst thing to find out after a deployment, and the
  second worst is finding out that it can, but that nobody could tell what they
  were approving.

  Three decisions shape everything below.

  ONE. It does not sign. Commands are composed here and run where the key is.
  That is the same choice the validator console and the land registry made, and
  the reason is sharper here: the wallet's approval screen decodes a signing
  request only as far as its message *type URLs* — it says so itself, in as many
  words — so it cannot show an amount, a recipient or a proposal id. Signing in
  the browser would mean this page hand-rolling protobuf encoding with no build
  step, and a mistake in that encoding would be checked by nothing: the page
  would say "pay 5,000 YML to Amara" and the wallet would say
  "/cosmos.group.v1.MsgSubmitProposal", and a custodian approving the second on
  the strength of the first has verified nothing at all. A CLI command is parsed
  by the binary that owns the message, in front of the person who can still stop
  it. See the note above the commands for what would have to change.

  TWO. A proposal's effect is stated in words, and where it cannot be, the page
  refuses to help rather than falling back to JSON. A custodian moving seized
  property must not be reading a type URL to work out what they are agreeing to,
  and an interface that prints the raw message and lets somebody vote yes on it
  has done none of the work while appearing to.

  THREE. Passing and executing are two states and are never merged. A proposal
  that has been agreed and not carried out has moved nothing, and that is the
  shape of the failure this page is most likely to be the only witness to:
  everybody believes the money moved, and it is sitting still.

  FOUR, and it arrived later than the other three: the foundation's second job is
  not spending. It grants and revokes the country-scoped roles that make a country
  operational, which is the power to decide who administers a perimeter — and that
  had no interface at all, only hand-composed protobuf JSON. The consequence of
  that was not caution. A live run of the country ceremony granted a role to the
  foundation's own address instead of the office it meant, because an x/group
  policy address comes from a sequence number alone and both were sequence 1. So
  the grant form does not show an address and ask for a signature: it shows the
  office's membership and threshold, read from the chain, and refuses a holder
  that is not a group before anybody votes rather than after.

  Read-only against /api/rest and /api/rpc. One file, no build step, no
  dependencies — this page gets opened when something is wrong, often on a bad
  connection, and a console that needs npm install first is a console that will
  not be open when it matters.
-->
<style>
  /* ==========================================================================
     THE SHARED VISUAL SYSTEM — copied from clients/shared/yamale.css.
     THE CANONICAL COPY LIVES THERE. Do not evolve this block on its own.

     Inlined rather than linked because this console is deliberately one file
     with no build step: it gets opened when something is wrong, often on a bad
     connection, and a page that needs a second request before it can say
     whether a proposal has been carried out is a page that will render as
     unstyled text at the moment it matters.

     The declarations below are byte-identical to that file, in the same order,
     so a change there is a mechanical paste into all four consoles —
     clients/foundation, clients/governance, clients/land, clients/validator —
     rather than a hunt. Only the long reasoning comments are left behind; they
     stay in the canonical file so there is one place to read them.
     ========================================================================== */

  :root {
    --font-display: Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --font-sans: 'IBM Plex Sans', 'IBM Plex Sans Arabic', system-ui, -apple-system,
      'Segoe UI', Roboto, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

    --step--1: 0.8125rem;
    --step-0: 0.9375rem;
    --step-1: 1.0625rem;
    --step-2: 1.25rem;
    --step-3: clamp(1.4rem, 2.2vw, 1.6rem);
    --step-4: clamp(1.75rem, 3.2vw, 2.15rem);
    --step-5: clamp(2.1rem, 4.6vw, 3rem);
    --step-6: clamp(2.5rem, 6vw, 3.9rem);

    --sp-1: 0.25rem;
    --sp-2: 0.5rem;
    --sp-3: 0.75rem;
    --sp-4: 1rem;
    --sp-5: 1.5rem;
    --sp-6: 2rem;
    --sp-7: 3rem;
    --sp-8: 4.5rem;

    --radius: 5px;
    --radius-lg: 8px;
    --measure: 68ch;

    --navy: #12253f;
    --ink: #0b1523;
    --brass: #a87b3c;
    --paper: #f6f7f9;
    --mist: #e3e7ee;
    --slate: #5c6e88;

    --bg: var(--paper);
    --surface: #ffffff;
    --surface-2: #f1f4f8;
    --surface-3: #e9eef5;
    --border: var(--mist);
    --rule: #d3dae6;

    --text: var(--ink);
    --text-muted: #526178;
    --text-faint: #8798af;
    --accent: var(--navy);
    --accent-ink: #ffffff;
    --focus: #1f6feb;

    --ok: #0c6d42;
    --warn: #a8791b;
    --bad: #ac2924;
    --wash-ok: rgba(13, 122, 74, .10);
    --wash-warn: rgba(168, 121, 27, .12);
    --wash-bad: rgba(176, 42, 37, .10);
    --wash-mute: rgba(92, 110, 136, .10);
    --wash-brass: rgba(168, 123, 60, .12);

    /* Brass and amber as *type* do not clear 4.5:1 in the light palette:
       measured 3.77:1 for a brass link on white, 3.31:1 and 3.38:1 for the
       two chips on their own washes. Darkened along the same hue, and only
       where the colour carries words. Dark already passes, measured. */
    --brass-ink: #78582b;
    --warn-ink: #795814;

    --shadow-1: 0 1px 2px rgba(11, 21, 35, .06), 0 1px 1px rgba(11, 21, 35, .04);
    --shadow-2: 0 2px 6px rgba(11, 21, 35, .07), 0 8px 24px rgba(11, 21, 35, .05);
  }

  /* Only tokens are redefined for dark — never a component rule, because a
     colour whose sole definition sits inside a media query never applies in the
     un-stamped state. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --bg: var(--ink);
      --surface: #101f34;
      --surface-2: #162943;
      --surface-3: #1d3352;
      --border: #24405f;
      --rule: #2c4a6b;

      --text: #e8eef7;
      --text-muted: #8fa4c4;
      --text-faint: #6b83a6;
      --accent: #4d8fd6;
      --accent-ink: #08111d;
      --brass: #c49856;
      --focus: #6ea8ff;

      --ok: #6fbfa5;
      --warn: #d2a65e;
      --bad: #ef8a85;
      --wash-ok: rgba(111, 191, 165, .12);
      --wash-warn: rgba(210, 166, 94, .14);
      --wash-bad: rgba(239, 138, 133, .13);
      --wash-mute: rgba(143, 164, 196, .12);
      --wash-brass: rgba(196, 152, 86, .16);
      --brass-ink: #c79d5e;
      --warn-ink: var(--warn);

      --shadow-1: 0 1px 2px rgba(0, 0, 0, .35);
      --shadow-2: 0 2px 8px rgba(0, 0, 0, .4), 0 12px 32px rgba(0, 0, 0, .3);
    }
  }

  :root[data-theme='dark'] {
    --bg: var(--ink);
    --surface: #101f34;
    --surface-2: #162943;
    --surface-3: #1d3352;
    --border: #24405f;
    --rule: #2c4a6b;

    --text: #e8eef7;
    --text-muted: #8fa4c4;
    --text-faint: #6b83a6;
    --accent: #4d8fd6;
    --accent-ink: #08111d;
    --brass: #c49856;
    --focus: #6ea8ff;

    --ok: #6fbfa5;
    --warn: #d2a65e;
    --bad: #ef8a85;
    --wash-ok: rgba(111, 191, 165, .12);
    --wash-warn: rgba(210, 166, 94, .14);
    --wash-bad: rgba(239, 138, 133, .13);
    --wash-mute: rgba(143, 164, 196, .12);
    --wash-brass: rgba(196, 152, 86, .16);
    --brass-ink: #c79d5e;
    --warn-ink: var(--warn);

    --shadow-1: 0 1px 2px rgba(0, 0, 0, .35);
    --shadow-2: 0 2px 8px rgba(0, 0, 0, .4), 0 12px 32px rgba(0, 0, 0, .3);
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: var(--step-0);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  h1, h2, h3, h4 {
    font-family: var(--font-display);
    font-weight: 600;
    line-height: 1.12;
    letter-spacing: -0.018em;
    text-wrap: balance;
    margin: 0;
  }

  h1 { font-size: var(--step-6); }
  h2 { font-size: var(--step-4); }
  h3 { font-size: var(--step-2); letter-spacing: -0.01em; }
  h4 { font-size: var(--step-1); letter-spacing: 0; }

  p { margin: 0; max-width: var(--measure); }

  code, kbd, samp, pre, .y-mono, .y-addr, .y-num {
    font-family: var(--font-mono);
    font-feature-settings: 'zero' 1;
  }
  .y-num, .y-tabular, td.y-num, th.y-num {
    font-variant-numeric: tabular-nums;
  }
  .y-addr { word-break: break-all; font-size: 0.88em; }

  .y-eyebrow {
    font-family: var(--font-mono);
    font-size: var(--step--1);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--brass-ink);
  }

  .y-label {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .y-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-1);
  }

  .y-chip {
    display: inline-flex;
    align-items: center;
    gap: var(--sp-1);
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 0.2rem 0.45rem;
    border-radius: 3px;
    white-space: nowrap;
  }
  .y-chip--ok { background: var(--wash-ok); color: var(--ok); }
  .y-chip--warn { background: var(--wash-warn); color: var(--warn-ink); }
  .y-chip--bad { background: var(--wash-bad); color: var(--bad); }
  .y-chip--mute { background: var(--wash-mute); color: var(--text-muted); }
  .y-chip--brass { background: var(--wash-brass); color: var(--brass-ink); }

  .y-scroll { overflow-x: auto; }

  :where(a, button, input, select, textarea, summary, [tabindex]):focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
    border-radius: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }

  /* ==========================================================================
     THE CONSOLE CHROME — shared by the four operator consoles, and by nothing
     else: clients/foundation, clients/governance, clients/land,
     clients/validator. Kept identical in all four for the same reason as the
     block above, and kept OUT of clients/shared/yamale.css because the citizen
     surfaces are not dense card stacks and should not inherit this density.

     Everything here is expressed in the tokens above. No console defines a
     colour of its own; a value that is not in a token is a value the next
     surface will get slightly wrong.
     ========================================================================== */

  /* The shared reset zeroes paragraph margins, which is right for prose laid
     out with `gap`. These consoles are card stacks with paragraphs in normal
     flow, so the rhythm is restored here rather than by editing several
     thousand lines of template literal. */
  p { margin: 0 0 var(--sp-3); }
  p:last-child { margin-bottom: 0; }
  a { color: var(--brass-ink); }
  a:hover { color: var(--text); }

  /* --- chrome ------------------------------------------------------------ */
  header {
    display: flex; align-items: center; gap: var(--sp-3);
    padding: var(--sp-4) var(--sp-5);
    background: var(--surface); border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header h1 {
    font-size: var(--step-1); letter-spacing: -0.01em; font-weight: 600;
  }
  header h1 a { color: inherit; text-decoration: none; }
  nav { display: flex; gap: var(--sp-1); flex-wrap: wrap; margin-inline-start: auto; }
  nav a {
    font-size: var(--step--1); color: var(--text-muted); text-decoration: none;
    padding: var(--sp-1) var(--sp-3); border-radius: var(--radius);
  }
  nav a:hover { color: var(--text); background: var(--surface-2); }
  nav a[aria-current] {
    color: var(--text); background: var(--surface-2); font-weight: 600;
    box-shadow: inset 0 0 0 1px var(--border);
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: var(--sp-5); }

  h2 { font-size: var(--step-2); margin: var(--sp-6) 0 var(--sp-3); }
  h2:first-child { margin-top: var(--sp-1); }
  h3 { font-size: var(--step-1); letter-spacing: 0; margin: 0 0 var(--sp-2); }

  /* --- panels ------------------------------------------------------------ */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow-1);
    padding: var(--sp-4); margin-bottom: var(--sp-3);
  }
  /* The second elevation step is not decoration and is not spent on headings:
     it marks the one card on a screen that is waiting for a person to act. */
  .card--waiting { border-inline-start: 3px solid var(--brass); background: var(--wash-brass);
                   box-shadow: var(--shadow-2); }
  .card--ok { border-inline-start: 3px solid var(--ok); }
  .card--bad { border-inline-start: 3px solid var(--bad); box-shadow: var(--shadow-2); }
  .card--warn { border-inline-start: 3px solid var(--warn); }

  .grid { display: grid; gap: var(--sp-3); grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); }
  .row { display: flex; justify-content: space-between; gap: var(--sp-4);
         align-items: baseline; flex-wrap: wrap; }

  /* --- text ------------------------------------------------------------- */
  .muted { color: var(--text-muted); font-size: var(--step--1); }
  .small { font-size: var(--step--1); }
  .lede { font-family: var(--font-display); font-size: var(--step-1); font-weight: 600;
          line-height: 1.25; letter-spacing: -0.01em; margin: 0 0 var(--sp-2); }
  .label {
    font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.11em;
    text-transform: uppercase; color: var(--text-muted);
  }
  .stat {
    font-family: var(--font-display); font-size: var(--step-3); font-weight: 600;
    line-height: 1.15; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
    margin-top: var(--sp-1);
  }
  .stat--words { font-size: var(--step-1); letter-spacing: -0.01em; }
  .empty, .spin { color: var(--text-muted); font-size: var(--step--1); padding: var(--sp-3) 0; }

  /* Chips carry state in form as well as in colour: mono, uppercase, and always
     beside a word. `.pill` and `.p-*` are the names the markup already uses. */
  .pill, .y-chip { display: inline-flex; align-items: center; gap: var(--sp-1);
    font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.06em;
    text-transform: uppercase; padding: 0.2rem 0.45rem; border-radius: 3px;
    white-space: nowrap; }
  .p-ok { background: var(--wash-ok); color: var(--ok); }
  .p-warn { background: var(--wash-warn); color: var(--warn-ink); }
  .p-bad { background: var(--wash-bad); color: var(--bad); }
  .p-mute { background: var(--wash-mute); color: var(--text-muted); }
  .p-brass { background: var(--wash-brass); color: var(--brass-ink); }

  code { font-size: 0.86em; word-break: break-all; }
  pre {
    font-size: var(--step--1); background: var(--surface-2); color: var(--text);
    padding: var(--sp-3) var(--sp-4); border-radius: var(--radius);
    border: 1px solid var(--border); overflow-x: auto; white-space: pre;
    margin: var(--sp-2) 0; line-height: 1.5; tab-size: 2;
  }

  /* --- the three boxes that say something is wrong ---------------------- */
  .err, .badbox, .warnbox {
    padding: var(--sp-3) var(--sp-4); border-radius: var(--radius);
    font-size: var(--step--1); margin: var(--sp-2) 0;
    border: 1px solid var(--border); border-inline-start-width: 3px;
  }
  .err { background: var(--wash-bad); border-color: var(--bad); color: var(--text); }
  .badbox { background: var(--wash-bad); border-color: var(--bad); color: var(--text); }
  .warnbox { background: var(--wash-warn); border-color: var(--warn); color: var(--text); }
  .err code, .badbox code, .warnbox code { color: inherit; }
  .err strong, .badbox strong { color: var(--bad); }
  .warnbox strong { color: var(--warn-ink); }

  /* --- controls --------------------------------------------------------- */
  /* Anything interactive looks interactive: a border, a hover, a focus ring
     from the token, and a cursor. */
  button { font: inherit; }
  .btn, .vote, button.primary, .primary {
    font-family: var(--font-sans); font-size: var(--step--1); font-weight: 600;
    padding: var(--sp-2) var(--sp-4); border-radius: var(--radius); cursor: pointer;
    border: 1px solid var(--rule); background: var(--surface); color: var(--text);
  }
  .btn:hover, .vote:hover, .primary:hover { border-color: var(--brass); background: var(--surface-2); }
  .btn.ok, .vote.ok { border-color: var(--ok); color: var(--ok); }
  .btn.bad, .vote.bad { border-color: var(--bad); color: var(--bad); }
  .btn.primary, .primary { border-color: var(--brass); color: var(--brass-ink); }
  .btn:disabled, .vote:disabled, .primary:disabled { opacity: .55; cursor: default; }
  .copy {
    font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.04em;
    text-transform: uppercase; font-weight: 500;
    padding: 0.2rem var(--sp-2); border-radius: 3px; cursor: pointer;
    background: transparent; color: var(--text-muted); border: 1px solid var(--rule);
  }
  .copy:hover { border-color: var(--brass); color: var(--text); }

  label { display: block; font-family: var(--font-mono); font-size: 0.7rem;
          letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted);
          margin: var(--sp-4) 0 var(--sp-1); }
  input, select, textarea {
    font-family: var(--font-sans); font-size: var(--step-0);
    padding: var(--sp-2) var(--sp-3); border-radius: var(--radius);
    border: 1px solid var(--rule); background: var(--surface); color: var(--text);
    width: 100%;
    /* Capped, because a field is as wide as what goes in it and nothing that
       goes in these is a thousand pixels long. A full-bleed input in a wide
       panel reads as an unfinished layout and makes a forty-character address
       harder to check, not easier. */
    max-width: 44rem;
  }
  input:hover, select:hover, textarea:hover { border-color: var(--text-faint); }
  input::placeholder, textarea::placeholder { color: var(--text-faint); }
  textarea { min-height: 3.4rem; resize: vertical; }
  /* An address, a hash or a reference typed into a field is compared character
     by character against a document or a piece of paper, which is not something
     a proportional face lets a person do. */
  input[id$='-to'], input[id$='holder'], input[id$='-addr'], input[id$='-who'],
  input[id$='-ev'], input[id$='-evh'], input[id='geom'], input[id='ref'],
  input[id='sw-in'], input[id='adm-add'] { font-family: var(--font-mono); }
  /* An amount is compared digit by digit and lines up under the last one. */
  input[id$='-amt'], input[id$='-id'] {
    font-family: var(--font-mono); font-variant-numeric: tabular-nums;
  }

  /* The label-and-copy line above a composed command. */
  .cmdhead {
    display: flex; justify-content: space-between; align-items: center;
    gap: var(--sp-2); margin-top: var(--sp-3); flex-wrap: wrap;
  }
  /* The commands are the product of these pages, so a block of them gets the
     width of its panel rather than the measure of a paragraph. */
  pre { max-width: none; }

  details { margin-top: var(--sp-2); }
  summary { cursor: pointer; font-size: var(--step--1); color: var(--text-muted); }
  summary:hover { color: var(--text); }

  table { width: 100%; border-collapse: collapse; }
  /* Digits that line up get tabular figures, and a table is where they line up.
     Proportional numerals in a column are a column a reader cannot compare by
     eye, which on these pages is the operation they perform most. */
  th, td { padding: var(--sp-2) var(--sp-3); text-align: start;
           border-bottom: 1px solid var(--border); font-size: var(--step--1);
           vertical-align: baseline; font-variant-numeric: tabular-nums; }
  th { font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.08em;
       text-transform: uppercase; color: var(--text-muted); font-weight: 500;
       white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: end; font-variant-numeric: tabular-nums; }

  .vrow { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap;
          padding: var(--sp-2) 0; border-top: 1px solid var(--border); }
  .vrow:first-of-type { border-top: 0; }

  /* A proportion is a length before it is a number. */
  .bar { height: 8px; border-radius: 99px; background: var(--wash-mute);
         overflow: hidden; margin: var(--sp-2) 0 var(--sp-1); display: flex; }
  .bar span { display: block; height: 100%; }
  .barwrap { position: relative; }
  .thresh { position: absolute; top: -3px; bottom: -3px; width: 2px;
            background: var(--text); opacity: .55; }

  /* --- identifiers ------------------------------------------------------ */
  /* Mono, truncated, click to reveal, copy beside it. Nobody should have to
     read thirty-nine characters of bech32 to know they are looking at the right
     account, and nobody should be unable to when they need to. */
  .y-id { display: inline-flex; align-items: baseline; gap: var(--sp-1); max-width: 100%; }
  .y-id__text {
    font-family: var(--font-mono); font-feature-settings: 'zero' 1; font-size: 0.86em;
    background: none; border: 0; padding: 0; margin: 0; color: inherit; cursor: pointer;
    text-align: start; text-decoration: underline; text-decoration-style: dotted;
    text-decoration-color: var(--text-faint); text-underline-offset: 3px;
  }
  .y-id__text:hover { text-decoration-color: var(--brass); }
  .y-id--open .y-id__text { word-break: break-all; }
  .y-id__copy {
    font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.06em;
    text-transform: uppercase; padding: 0 var(--sp-1); border-radius: 2px;
    border: 1px solid var(--rule); background: transparent; color: var(--text-muted);
    cursor: pointer; flex: none;
  }
  .y-id__copy:hover { border-color: var(--brass); color: var(--text); }

  /* --- a phone ---------------------------------------------------------- */
  /* The verdict has to arrive before the chrome. */
  @media (max-width: 560px) {
    header { padding: var(--sp-2) var(--sp-3); gap: var(--sp-2); }
    nav { margin-inline-start: 0; width: 100%; gap: 0; }
    nav a { padding: var(--sp-1) var(--sp-2); font-size: 0.76rem; }
    .wrap { padding: var(--sp-3); }
    .card { padding: var(--sp-3); }
    h2 { margin: var(--sp-5) 0 var(--sp-2); }
    pre { font-size: 0.7rem; padding: var(--sp-2); }
  }

  /* ==========================================================================
     Foundation-console only, and nothing above this line is.
     ========================================================================== */

  /* Not in the shared file because it belongs to the page, not to the palette:
     it makes the browser's own furniture — scrollbars, the file picker, a date
     control — follow the theme the tokens above are already following. */
  :root { color-scheme: light dark; }

  /* A checkbox is a control beside its words, not a block label above it — and
     its words are a sentence rather than a mono field name, because what it says
     is a decision and not a label. */
  .check {
    display: flex; align-items: flex-start; gap: var(--sp-2);
    font-family: var(--font-sans); font-size: var(--step--1); letter-spacing: 0;
    text-transform: none; color: var(--text); margin-top: var(--sp-3); cursor: pointer;
  }
  .check input { width: auto; max-width: none; margin: 0.25rem 0 0; flex: none; }

  /* Two small numbers side by side: an M and an N are read as one thing. */
  .shape { display: flex; gap: var(--sp-4); flex-wrap: wrap; align-items: flex-end; }
  .shape > div { flex: 0 0 8rem; }
  .shape label { margin-top: 0; }

  /* A fingerprint exists to be compared against a piece of paper from the
     ceremony, character by character, so it is tracked wider than ordinary
     data and never set in the body face. */
  .fp {
    font-family: var(--font-mono); font-feature-settings: 'zero' 1;
    font-weight: 500; letter-spacing: 0.08em; font-size: var(--step--1);
  }
</style>
</head>
<body>
<header>
  <img src="/mark.svg" alt="" width="26" height="26" style="border-radius:6px">
  <h1><a href="#/">Foundation custodians</a></h1>
  <nav id="nav"></nav>
  <!-- Who this page thinks you are, and what time the *chain* thinks it is.
       Both in the chrome rather than in a screen, because both are true of
       every screen and both change what the page below them means. -->
  <span id="who"></span>
  <span class="label" id="clock"></span>
</header>

<div class="wrap">
  <div id="banner"></div>
  <div id="view"></div>
</div>

<script type="module">
import {
  MAX_METADATA_LEN,
  // reading the group
  auditGroup, toCustodians,
  // judging a proposal
  describeMessage, describeProposal, displayLabel, executability, proposalState,
  staleAgainstGroup, tally,
  // the history x/group deletes
  carriedOut, parseExecutions, parseSubmissions,
  // building one
  auditMessages, parseMessages, swapPlan, toBaseUnits, tooLong,
  // the country-scoped roles
  ROLES, assignedCountries, checkAddress, classifyHolder, grantPlan, officeSummary, revokePlan,
  // the M-of-N a grant pins its office at
  shapeOfGrant, shapeRule,
  // formatting
  formatCoin, groupDigits, relativeTime, shellSafe, short, stalledAtHeight, timestampSeconds,
  // commands
  currentChainId, execCommand, proposalDocument, setChainId, spendMessage, submitCommand,
  swapMessage, voteCommand,
} from './foundation.js';

const REST = '/api/rest';
const RPC = '/api/rpc';

const view = document.getElementById('view');
const banner = document.getElementById('banner');

/** Which custodian this page is acting as. `?as=chris3`, matched on their name. */
const ME = new URLSearchParams(location.search).get('as');

const esc = (s) => String(s ?? '').replace(/[&<>"']/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/**
 * A failed call, carrying the URL and the status.
 *
 * Both, always. "Could not read the chain" at three in the morning is worse than
 * useless, and a 401 in particular has one cause here and one fix — see the
 * banner text — so it is worth telling apart from a node that is down.
 */
class CallFailed extends Error {
  constructor(url, status) {
    super(`${url} → ${status}`);
    this.url = url;
    this.status = status;
  }
}

/**
 * The height every read is pinned to, once the chain is found to have stopped.
 *
 * Null normally, and reset on every route so it heals itself the moment blocks
 * resume — a console still showing Tuesday's state on Thursday because it never
 * un-pinned would be worse than one that admitted it could not read anything.
 */
let pinnedHeight = null;

/** The last block the node has, from the RPC, which answers while halted. */
let lastBlock = { height: null, time: null };

async function get(url) {
  const send = (height) => fetch(url, height
    ? { headers: { 'x-cosmos-block-height': String(height) } }
    : undefined);

  let res;
  try {
    res = await send(pinnedHeight);
  } catch (e) {
    throw new CallFailed(url, 'unreachable');
  }
  if (res.ok) return res.json();

  // A node with no finalised block refuses every query rather than serving
  // stale state, and names the height it is stuck at in the refusal. Ask for
  // that height explicitly and the same query answers perfectly. This is what
  // keeps the page readable during exactly the outage that makes somebody open
  // it.
  const stalled = stalledAtHeight(await res.text().catch(() => ''));
  if (stalled && stalled !== pinnedHeight) {
    pinnedHeight = stalled;
    try {
      res = await send(pinnedHeight);
    } catch {
      throw new CallFailed(url, 'unreachable');
    }
    if (res.ok) return res.json();
  }
  throw new CallFailed(url, res.status);
}

/**
 * Said on every screen while the chain is stopped, because every figure below it
 * is historical and none of them look it.
 */
function stallBanner() {
  if (!pinnedHeight) return '';
  const wall = Math.floor(Date.now() / 1000);
  const since = lastBlock.time ? ` — the last one was ${esc(relativeTime(lastBlock.time - wall))}` : '';
  return `<p class="warnbox"><strong>This chain has stopped producing blocks${since}.</strong><br>
    Everything below is the state at height ${esc(String(pinnedHeight))}, read by asking the node
    for that height explicitly, which is the only thing a halted node will answer. It is accurate
    and it is not current. A proposal can still be signed, and it will not commit until the chain
    moves again — so a vote cast now is a vote nobody has cast yet.</p>`;
}

/** Optional reads: a missing extra should not blank a page that has the essentials. */
const maybe = (p, fallback) => p.catch(() => fallback);

// ------------------------------------------------------------------ chrome

const TABS = [
  ['#/', 'The foundation'],
  ['#/proposals', 'Proposals'],
  ['#/propose', 'Propose'],
];

function renderNav(path) {
  document.getElementById('nav').innerHTML = TABS.map(([h, label]) => {
    const on = h === path || (h === '#/proposals' && path.startsWith('#/proposal/'));
    return `<a href="${h}"${on ? ' aria-current="page"' : ''}>${esc(label)}</a>`;
  }).join('');
}

function setBanner(html) {
  banner.innerHTML = html || '';
}

function failureBanner(e) {
  if (!(e instanceof CallFailed)) return `<p class="err">${esc(e.message)}</p>`;
  // 401 on this chain means the node's REST allowlist does not include the path,
  // not that a password exists somewhere. Saying so saves somebody hunting for
  // credentials that were never issued.
  if (e.status === 401 || e.status === 403) {
    return `<p class="err"><strong>This path is not being served to you:
      <code>${esc(e.url.replace(REST, ''))}</code> (${e.status}).</strong><br>
      This chain's REST surface is allowlisted per module path and denies by default, so a
      ${e.status} here means the path is missing from the allowlist rather than that the data is
      missing or that a password exists. The node's gateway does serve it; the proxy in front is
      dropping it. This console needs three families allowed —
      <code>/cosmos/group/v1/</code>, <code>/yamale/blockchain/constitution/v1/</code> and
      <code>/yamale/blockchain/alias/v1/</code>, the last of these because a role grant cannot be
      composed without reading what the holder already holds — plus
      <code>/cosmos/bank/v1beta1/</code> and <code>/cosmos/tx/v1beta1/</code>.</p>`;
  }
  return `<p class="err"><strong>Could not read <code>${esc(e.url)}</code> — ${esc(String(e.status))}.</strong><br>
    That is the exact call that failed. Nothing after it was attempted, so treat anything
    missing below as unknown rather than as absent.</p>`;
}

/** Chain time, not browser time. A drifted laptop must not decide a deadline. */
let chainNow = Math.floor(Date.now() / 1000);

// ------------------------------------------------------------ chain reading

/**
 * Everything about the foundation, resolved the way the ante decorator resolves
 * it: the constitution names the address, the address names the group.
 *
 * Deriving it rather than hardcoding it is the point. A console with the policy
 * address compiled in would keep rendering confidently after an amendment moved
 * the recovery destination, and would be showing the wrong account.
 */
async function loadFoundation() {
  const invariants = (await get(`${REST}/yamale/blockchain/constitution/v1/invariants`)).invariants;
  const policyAddress = invariants?.enforcement_recovery_destination;
  if (!policyAddress) {
    throw new Error(
      'The constitution names no recovery destination. This chain should not have started: ' +
      'a seizure would have nowhere to send what it took.',
    );
  }

  const policy = (await get(`${REST}/cosmos/group/v1/group_policy_info/${policyAddress}`)).info;
  const groupId = policy?.group_id;
  const [members, groupInfo, balances, registry] = await Promise.all([
    get(`${REST}/cosmos/group/v1/group_members/${groupId}?pagination.limit=100`),
    maybe(get(`${REST}/cosmos/group/v1/group_info/${groupId}`), { info: null }),
    // Explicitly paginated. Without a limit the gateway returns the first
    // hundred denominations and says so only in a field nobody reads — and
    // this is the account every seizure on the chain is sent to, so it is
    // precisely the account that ends up holding a long tail of currencies.
    // A truncated list of what the foundation holds looks exactly like a
    // complete one.
    maybe(get(`${REST}/cosmos/bank/v1beta1/balances/${policyAddress}?pagination.limit=1000`),
      { balances: [] }),
    denomRegistry(),
  ]);

  const custodians = toCustodians(members.members);
  const decision = policy?.decision_policy ?? {};
  const threshold = Number(decision.threshold ?? 0);

  return {
    invariants, policyAddress, groupId, policy, threshold,
    votingPeriodSeconds: durationSeconds(decision.windows?.voting_period),
    minExecutionSeconds: durationSeconds(decision.windows?.min_execution_period),
    decisionType: decision['@type'] ?? '',
    groupInfo: groupInfo.info,
    // Both versions, so a proposal can be checked against the group it was
    // raised under. x/group bumps these on every membership or policy change and
    // aborts any proposal carrying an older pair.
    versions: { groupVersion: groupInfo.info?.version, policyVersion: policy?.version },
    custodians,
    balances: balances.balances ?? [],
    // A next_key means the gateway had more denominations than it returned.
    // Surfaced rather than dropped, because a short list of what this
    // account holds is indistinguishable from a complete one.
    balancesTruncated: Boolean(balances.pagination?.next_key),
    registry,
    names: Object.fromEntries(custodians.filter((c) => c.name).map((c) => [c.address, c.name])),
    memberAddresses: custodians.map((c) => c.address),
  };
}

function durationSeconds(value) {
  if (!value) return 0;
  const n = Number(String(value).replace(/s$/, ''));
  return Number.isFinite(n) ? n : 0;
}

let registryCache = null;
async function denomRegistry() {
  if (registryCache) return registryCache;
  const built = { uyml: { symbol: 'YML', exponent: 6, base: 'uyml' } };
  try {
    const data = await get(`${REST}/cosmos/bank/v1beta1/denoms_metadata?pagination.limit=200`);
    for (const meta of data.metadatas ?? []) {
      const unit = (meta.denom_units ?? []).find((u) => u.denom === meta.display);
      built[meta.base] = {
        base: meta.base,
        symbol: meta.symbol || meta.display || meta.base,
        exponent: Number(unit?.exponent ?? 0),
      };
    }
  } catch {
    // The built-in entry covers the staking denom, which is what the foundation
    // holds. A missing registry costs display polish, not correctness — an
    // unknown denom renders in base units and says so.
  }
  registryCache = built;
  return built;
}

async function loadProposals(f) {
  const data = await get(
    `${REST}/cosmos/group/v1/proposals_by_group_policy/${f.policyAddress}` +
    '?pagination.limit=200&pagination.reverse=true',
  );
  const proposals = data.proposals ?? [];
  // Votes are fetched per proposal because x/group has no bulk vote query, and
  // they are what the page counts — see the note on tally().
  return Promise.all(
    proposals.map(async (p) => {
      const votes = await maybe(
        get(`${REST}/cosmos/group/v1/votes_by_proposal/${p.id}?pagination.limit=100`),
        { votes: [] },
      );
      return { proposal: p, votes: votes.votes ?? [] };
    }),
  );
}

/**
 * The proposals that have already been carried out.
 *
 * From the transaction log, because x/group deletes an executed proposal from
 * state. Two searches and a join — see the note above `parseExecutions`.
 */
async function loadCarriedOut() {
  const search = async (action) => {
    const params = new URLSearchParams({
      query: `message.action='${action}'`,
      'pagination.limit': '50',
      order_by: 'ORDER_BY_DESC',
    });
    return get(`${REST}/cosmos/tx/v1beta1/txs?${params}`);
  };

  try {
    // Both actions, because a proposal can execute two ways. `MsgExec` is the
    // obvious one; `MsgVote --exec 1` carries the execution inside the vote that
    // completed the threshold, and that is the route this console recommends to
    // whoever casts the deciding signature. Searching only for MsgExec would
    // have missed exactly the executions the page encourages.
    const [execs, votes, submits] = await Promise.all([
      search('/cosmos.group.v1.MsgExec'),
      search('/cosmos.group.v1.MsgVote'),
      search('/cosmos.group.v1.MsgSubmitProposal'),
    ]);
    return {
      history: carriedOut(
        parseExecutions([...(execs.tx_responses ?? []), ...(votes.tx_responses ?? [])]),
        parseSubmissions(submits.txs ?? [], submits.tx_responses ?? []),
      ),
      failed: false,
    };
  } catch {
    // The transaction index can be off on a node, and that is worth saying
    // rather than rendering an empty history that reads as "nothing has ever
    // been paid out".
    return { history: [], failed: true };
  }
}

/**
 * A read whose *refusal* is the answer, rather than an exception.
 *
 * `get` above throws a CallFailed and discards the body, which is right for every
 * other read on this page — a failed balance query is a failed balance query. It
 * is wrong for exactly one: the group-policy lookup that decides whether a role's
 * holder is an office or one key answers "not a group" as an HTTP 500 carrying a
 * gRPC status body, so throwing the body away would collapse "this is a plain
 * key" and "the node is down" into the same failure. Those two must never lead to
 * the same screen: the first is a refusal to compose, the second is an admission
 * that the check did not run.
 */
async function probe(url) {
  let res;
  try {
    res = await fetch(url, pinnedHeight
      ? { headers: { 'x-cosmos-block-height': String(pinnedHeight) } }
      : undefined);
  } catch {
    return { status: 'unreachable', body: '' };
  }
  const text = await res.text().catch(() => '');
  let body = text;
  try { body = JSON.parse(text); } catch { /* keep the text; classifyHolder reads either */ }
  return { status: res.status, body };
}

/**
 * Everything the chain says about an account a role is about to be granted to or
 * taken from.
 *
 * Three reads, and each one answers a question the page must not guess at:
 *
 *  1. is it an x/group account — the chain's own check, mirrored so a plain key
 *     is refused before three custodians sign rather than after;
 *  2. if so, who is in it and on how many signatures does it decide — because a
 *     policy address is derived from a sequence number and is therefore not
 *     evidence of who controls the group;
 *  3. what does it already hold — which is what a revocation is chosen from, and
 *     what tells a grant apart from a re-grant.
 *
 * `grants` is null rather than empty when the third read fails. An empty list and
 * a failed query render identically otherwise, and the difference is between "you
 * have nothing to revoke" and "this page does not know what you hold".
 */
async function loadHolder(f, address) {
  const lookup = await probe(
    `${REST}/cosmos/group/v1/group_policy_info/${encodeURIComponent(address)}`,
  );
  const verdict = classifyHolder(lookup);

  let office = null;
  if (verdict.verdict === 'group') {
    const members = await maybe(
      get(`${REST}/cosmos/group/v1/group_members/${verdict.groupId}?pagination.limit=100`),
      { members: [] },
    );
    office = officeSummary({
      policy: lookup.body?.info,
      members: members.members ?? [],
      foundationAddress: f.policyAddress,
    });
  }

  const held = await probe(
    `${REST}/yamale/blockchain/alias/v1/role_grants/${encodeURIComponent(address)}`,
  );
  const grants = Number(held.status) === 200 && Array.isArray(held.body?.grants)
    ? held.body.grants
    : null;

  return { address, verdict, office, grants, grantsStatus: held.status };
}

async function syncClock() {
  try {
    const s = await get(`${RPC}/status`);
    const t = timestampSeconds(s?.result?.sync_info?.latest_block_time);
    if (t) chainNow = t;
    lastBlock = { height: s?.result?.sync_info?.latest_block_height ?? null, time: t ?? null };
    // Every composed command carries this. Taken from the node the page is
    // reading, so a console pointed at a devnet composes devnet commands.
    setChainId(s?.result?.node_info?.network ?? '');
  } catch {
    chainNow = Math.floor(Date.now() / 1000);
  }
}

// -------------------------------------------------------------- components

function copyable(id, text, note) {
  return `<div class="cmdhead">
      <span class="muted small">${esc(note || '')}</span>
      <button class="copy" data-copy="${id}">copy</button>
    </div>
    <pre id="${id}">${esc(text)}</pre>`;
}

/**
 * What `code: 0` does and does not mean, said wherever this page hands somebody a
 * command to run.
 *
 * Four separate bugs in this repository came from believing a clean broadcast
 * meant the thing happened. A broadcast reporting `code: 0` has been **accepted
 * into a mempool** — it has not executed. Worse, `tx group exec` on a proposal
 * that has not reached its threshold returns `code: 0` too: not an authorization
 * error, not a failed transaction, a clean transaction that does nothing at all,
 * whose only signal is an event attribute. And an executed proposal is pruned, so
 * querying it afterwards and getting "not found" is success rather than a fault.
 *
 * So the page never lets a command go out without saying what to read instead.
 */
function executionNote() {
  return `<details>
      <summary>What to check after you run it — <code>code: 0</code> is not "it happened"</summary>
      <p class="muted small">A broadcast that comes back <code>code: 0</code> has been accepted
        into a mempool. It has not executed. Query the transaction by hash and read
        <code>height</code> and <code>code</code> from the queried result, not from the broadcast
        response — a <code>height</code> of 0 means it is still not in a block.</p>
      <p class="muted small">The same trap has a worse version at execution.
        <code>tx group exec</code> on a proposal that has <em>not</em> reached its threshold also
        returns <code>code: 0</code> — a clean transaction that does nothing. The only signal
        anywhere is an event attribute: <code>EventExec.result</code> is
        <code>PROPOSAL_EXECUTOR_RESULT_NOT_RUN</code> on too few votes and
        <code>PROPOSAL_EXECUTOR_RESULT_SUCCESS</code> when it ran. And an executed proposal is
        deleted from state, so <code>q group proposal &lt;id&gt;</code> answering "not found"
        afterwards is success and not a fault.</p>
      <p class="muted small">Do not infer it from the transaction. Read the state the proposal was
        supposed to change.</p>
    </details>`;
}

/**
 * An identifier: truncated, in mono, with the whole of it one click away and a
 * copy button beside it.
 *
 * A full bech32 address printed in the middle of a sentence is not read — it is
 * skipped, and a custodian who skips it is a custodian who has not checked the
 * recipient. Truncated to head and tail it *is* read, because comparing ten
 * characters against ten characters is something a person will actually do. The
 * whole of it stays reachable, because a custodian who cannot audit what they
 * are approving is a custodian who has to trust this page, and this page has not
 * earned that.
 *
 * Two controls rather than one, both keyboard-reachable: the dotted underline
 * reveals, the button copies. One control doing both would mean every reveal
 * silently overwrote somebody's clipboard.
 */
function idHtml(value, opts = {}) {
  const full = String(value ?? '');
  if (!full) return '<span class="muted">—</span>';
  const brief = opts.short ?? short(full);
  const what = opts.label ? `${opts.label}: ` : '';
  return `<span class="y-id"><button type="button" class="y-id__text"
      data-full="${esc(full)}" data-brief="${esc(brief)}"
      title="${esc(full)}"
      aria-label="${esc(what)}${esc(brief)} — show all of it"
    >${esc(brief)}</button><button type="button" class="y-id__copy"
      data-copy-text="${esc(full)}"
      aria-label="Copy ${esc(what)}${esc(full)}">copy</button></span>`;
}

/**
 * One listener for every identifier on the page, installed once.
 *
 * Delegated rather than wired per render, because these are composed into
 * strings and inserted by the caller: anything reaching for the element while
 * composing finds nothing there, and a copy button that silently does nothing is
 * worse than none — the custodian believes they have the address.
 */
document.addEventListener('click', async (e) => {
  const reveal = e.target.closest?.('.y-id__text');
  if (reveal) {
    const box = reveal.closest('.y-id');
    const open = box.classList.toggle('y-id--open');
    reveal.textContent = open ? reveal.dataset.full : reveal.dataset.brief;
    reveal.setAttribute('aria-label', open
      ? `${reveal.dataset.full} — shorten it`
      : `${reveal.dataset.brief} — show all of it`);
    return;
  }
  const copy = e.target.closest?.('[data-copy-text]');
  if (!copy) return;
  // Through shellSafe like everything else this page hands over: an address
  // pasted into a command is as ruined by a carriage return as the command is.
  const text = shellSafe(copy.dataset.copyText);
  const was = copy.textContent;
  try {
    await navigator.clipboard.writeText(text);
    copy.textContent = 'copied';
  } catch {
    copy.textContent = 'no clipboard';
  }
  setTimeout(() => { copy.textContent = was; }, 2000);
});

/**
 * A detail row whose value is an address, sometimes with a qualifier after it.
 *
 * `describeMessage` reports a joining custodian as "yml1… (weight 1)", and the
 * identifier is the part somebody compares and copies while the rest is prose —
 * so the two are separated here rather than by changing the shape the described
 * message has been asserted on for a hundred and forty-five tests.
 */
function idCell(value) {
  const text = String(value ?? '');
  const gap = text.indexOf(' ');
  if (gap < 0) return idHtml(text);
  return `${idHtml(text.slice(0, gap))}
    <span class="muted">${esc(text.slice(gap + 1))}</span>`;
}

function wireCopies() {
  document.querySelectorAll('[data-copy]').forEach((b) => {
    b.onclick = async () => {
      const text = shellSafe(document.getElementById(b.dataset.copy)?.textContent);
      try {
        await navigator.clipboard.writeText(text);
        b.textContent = 'copied';
      } catch {
        // Clipboard access fails on an insecure origin, which is exactly where
        // somebody debugging a node will be. Select it instead of claiming.
        const node = document.getElementById(b.dataset.copy);
        const range = document.createRange();
        range.selectNodeContents(node);
        getSelection().removeAllRanges();
        getSelection().addRange(range);
        b.textContent = 'selected — copy it';
      }
      setTimeout(() => { b.textContent = 'copy'; }, 2500);
    };
  });
}

/** A deadline as a date and a distance, never as a height. */
function deadline(seconds, label) {
  if (seconds === null) return `<span class="muted small">${esc(label)}: not stated</span>`;
  const when = new Date(seconds * 1000);
  const rel = relativeTime(seconds - chainNow);
  return `<span class="small">${esc(label)} <strong>${esc(rel)}</strong>
    <span class="muted">— ${esc(when.toUTCString().replace('GMT', 'UTC'))}</span></span>`;
}

function voteBar(counted) {
  const total = counted.rows.reduce((s, r) => s + r.custodian.weight, 0) || 1;
  const pct = (n) => `${(100 * n / total).toFixed(2)}%`;
  const line = `${(100 * counted.threshold / total).toFixed(2)}%`;
  return `<div class="barwrap">
      <div class="bar">
        <span style="width:${pct(counted.yes)};background:var(--ok)"></span>
        <span style="width:${pct(counted.no + counted.veto)};background:var(--bad)"></span>
        <span style="width:${pct(counted.abstain)};background:var(--muted)"></span>
      </div>
      <div class="thresh" style="left:${line}" title="threshold"></div>
    </div>
    <p class="muted small">${counted.yes} approved of ${counted.threshold} needed ·
      ${counted.no + counted.veto} against · ${counted.abstain} abstained ·
      ${counted.undecided} ${counted.individualVotes ? 'yet to vote' : 'did not vote'}</p>`;
}

const OPTION_WORD = {
  VOTE_OPTION_YES: ['approved', 'p-ok'],
  VOTE_OPTION_NO: ['refused', 'p-bad'],
  VOTE_OPTION_NO_WITH_VETO: ['vetoed', 'p-bad'],
  VOTE_OPTION_ABSTAIN: ['abstained', 'p-mute'],
};

/** Who has voted and who has not, one row per custodian. */
function custodianVotes(counted, f, proposalId, state) {
  // A decided proposal keeps its totals and loses the individual votes. Listing
  // five custodians as "has not voted" under a result they produced would be a
  // straightforward lie, so the rows are not offered at all.
  if (!counted.individualVotes) {
    return `<p class="muted small">The individual votes are no longer on the chain — x/group
      discards them once a proposal is decided, keeping only the totals above. Who voted which
      way is in the transaction log, against each custodian's own account.</p>`;
  }

  const rows = counted.rows.map((r) => {
    const [word, cls] = OPTION_WORD[r.option] ?? ['has not voted', 'p-warn'];
    const isMe = ME && r.custodian.name === ME;
    const canVote = state.phase === 'open' && !r.option && isMe;
    return `<div class="vrow">
        <strong>${esc(r.custodian.name || short(r.custodian.address))}</strong>
        ${r.custodian.fingerprint
          ? `<span class="fp muted">${esc(r.custodian.fingerprint)}</span>` : ''}
        <span class="pill ${cls}">${esc(word)}</span>
        ${isMe ? '<span class="pill p-brass">you</span>' : ''}
        <span style="margin-inline-start:auto" class="small">${
          canVote
            ? `<a href="#/proposal/${esc(proposalId)}">vote</a>`
            : (r.at ? `<span class="muted">${esc(new Date(r.at).toUTCString().slice(5, 16))}</span>` : '')
        }</span>
      </div>`;
  }).join('');

  const stale = counted.stale.length
    ? `<div class="warnbox">${counted.stale.length} vote${counted.stale.length === 1 ? '' : 's'}
        on this proposal came from ${counted.stale.length === 1 ? 'an address' : 'addresses'} that
        ${counted.stale.length === 1 ? 'is' : 'are'} no longer a custodian, so
        ${counted.stale.length === 1 ? 'it does' : 'they do'} not count toward the threshold:
        ${counted.stale.map((v) => idHtml(v.voter, { label: 'former custodian' })).join(', ')}.</div>`
    : '';

  return rows + stale;
}

/**
 * What the proposal does, in words.
 *
 * An undescribable message produces a refusal, not a JSON dump. The raw message
 * is still reachable, behind a summary that says plainly that nothing has
 * checked it — which is a different offer from presenting it as the explanation.
 */
function effect(described) {
  if (described.empty) {
    return `<div class="badbox"><strong>This proposal contains no messages.</strong>
      Approving it would change nothing, which means it is either a mistake or a placeholder
      somebody intends to fill by other means.</div>`;
  }

  return described.messages.map((m) => `
    <div class="${m.understood ? '' : 'badbox'}" style="margin:.5rem 0">
      <p class="lede">${m.understood ? esc(m.headline) : `⚠ ${esc(m.headline)}`}</p>
      ${m.understood ? `<table>${m.detail.map((d) => `<tr>
          <th style="width:11rem">${esc(d.label)}</th>
          <td>${d.address ? idCell(d.value) : esc(d.value)}</td>
        </tr>`).join('')}</table>` : ''}
      ${m.concerns.map((c) => `<div class="badbox">${esc(c)}</div>`).join('')}
      <details>
        <summary>The message as the chain holds it — not checked by this page</summary>
        <pre>${esc(JSON.stringify(m.raw, null, 2))}</pre>
      </details>
    </div>`).join('');
}

// ------------------------------------------------------------ screen: group

async function screenFoundation() {
  const f = await loadFoundation();
  const audit = auditGroup({
    custodians: f.custodians,
    threshold: f.threshold,
    invariants: f.invariants,
  });

  const breaches = audit.findings.filter((x) => x.severity === 'breach');
  const others = audit.findings.filter((x) => x.severity !== 'breach');

  const verdict = breaches.length
    ? `<div class="card card--bad">
        <p class="lede">This is not the group the constitution describes.</p>
        ${breaches.map((b) => `<div class="badbox">${esc(b.text)}</div>`).join('')}
        <p class="muted small">Do not treat the membership below as authoritative until this is
          resolved. One of these two records is wrong and this page cannot tell you which.</p>
      </div>`
    : `<div class="card card--ok">
        <p class="lede">${f.custodians.length} custodians, any
          ${f.threshold} of whom can act — which is what the constitution fixes.</p>
        <p class="muted small">Checked against
          <code>foundation_custodian_count</code> and
          <code>foundation_signature_threshold</code> read from the constitution, not from this

      </div>`;

  const custodianRows = f.custodians.map((c) => `
    <div class="vrow">
      <strong>${esc(c.name || 'unnamed custodian')}</strong>
      ${c.fingerprint
        ? `<span class="fp">${esc(c.fingerprint)}</span>`
        : '<span class="pill p-warn">no fingerprint recorded</span>'}
      ${c.weight === 1 ? '' : `<span class="pill p-warn">weight ${esc(c.weight)}</span>`}
      ${ME === c.name ? '<span class="pill p-brass">you</span>' : ''}
      <span style="margin-inline-start:auto">${idHtml(c.address, { label: 'custodian' })}</span>
    </div>`).join('');

  // Said out loud, because a single row and a truncated list look identical,

  const holdingsNote = f.balances.length
    ? `<p class="muted small" style="margin-bottom:.5rem">${f.balances.length === 1
        ? 'One currency, and this is the whole balance.'
        : `${f.balances.length} currencies, and this is all of them.`}${
        f.balancesTruncated
          ? ' <strong>More than this page requested — the list below is incomplete.</strong>'
          : ''}</p>`
    : '';

  const holdings = f.balances.length
    ? holdingsNote + f.balances.map((b) => `<div class="row" style="padding:.2rem 0">
        <strong class="y-num">${esc(formatCoin(b, { registry: f.registry }))}</strong>
        <span class="muted small y-num">${esc(groupDigits(b.amount))} ${esc(b.denom)}
          <span class="label">base units</span></span>
      </div>`).join('')
    : `<p class="muted small">Nothing. The foundation holds no balance — which for the
        destination of every seizure on this chain means either that nothing has been
        recovered yet, or that what was recovered has already been paid out.</p>`;

  view.innerHTML = `
    <h2>The foundation as it stands</h2>
    ${verdict}
    ${others.map((o) => `<div class="warnbox">${esc(o.text)}</div>`).join('')}

    <div class="grid">
      <div class="card">
        <div class="label">Signatures needed</div>
        <div class="stat">${esc(f.threshold)} of ${esc(f.custodians.length)}</div>
        <div class="muted small">Fixed by the constitution. Changing it takes an amendment —
          weeks in public and a four-fifths ratification — not a vote of the custodians it
          constrains.</div>
      </div>
      <div class="card">
        <div class="label">Voting period</div>
        <div class="stat">${esc(Math.round(f.votingPeriodSeconds / 86400))} days</div>
        <div class="muted small">${
          f.minExecutionSeconds === 0
            ? 'A deadline for votes, not a delay before acting: once the threshold is reached a ' +
              'proposal can be carried out immediately.'
            : `And a minimum wait of ${Math.round(f.minExecutionSeconds / 3600)} hours after
               approval before it can be carried out.`
        }</div>
      </div>
      <div class="card">
        <div class="label">Group</div>
        <div class="stat">#${esc(f.groupId)}</div>
        <div class="muted small">Version ${esc(f.groupInfo?.version ?? '?')} — a proposal raised
          against an older version is void, so a membership change cancels whatever was in
          flight.</div>
      </div>
      <div class="card">
        <div class="label">Administered by</div>
        <div class="stat stat--words">itself</div>
        <div class="muted small">${
          f.policy?.admin === f.policyAddress
            ? 'The group is its own admin, so membership can only change by a vote of the ' +
              'custodians and never by one key.'
