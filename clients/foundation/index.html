    </div>

    <h2>The five custodians</h2>
    <div class="card">${custodianRows}</div>

    <h2>What it holds</h2>
    <div class="card">${holdings}
      <p class="muted small" style="margin-top:.6rem">Account
        ${idHtml(f.policyAddress, { label: 'the foundation account' })}</p>
    </div>

    <h2>The rules that pin this</h2>
    <div class="card">
      <p class="muted small">These are read from <code>x/constitution</code>. An ordinary
        governance proposal cannot change them.</p>
      <table>
        <tr><th>Custodians</th><td>exactly ${esc(audit.expectedCount)}</td></tr>
        <tr><th>Signatures</th><td>${esc(audit.expectedThreshold)} of them</td></tr>
        <tr><th>Seized funds go to</th>
            <td>${idHtml(f.invariants.enforcement_recovery_destination,
                  { label: 'the recovery destination' })}
              ${f.invariants.enforcement_recovery_destination === f.policyAddress
                ? '<span class="pill p-ok">this account</span>'
                : '<span class="pill p-bad">not this account</span>'}</td></tr>
        <tr><th>Seizure threshold</th>
            <td>${(Number(f.invariants.enforcement_threshold_bps || 0) / 100).toFixed(2)}%
              of validator voting power</td></tr>
        <tr><th>Amendment delay</th>
            <td>${groupDigits(f.invariants.amendment_delay_blocks)} blocks before a change to any
              of this can take effect</td></tr>
      </table>
    </div>

    ${identityFooter(f)}`;
  wireCopies();
}

function identityFooter(f) {
  if (ME && f.custodians.some((c) => c.name === ME)) return '';
  const links = f.custodians
    .filter((c) => c.name)
    .map((c) => `<a href="?as=${encodeURIComponent(c.name)}${location.hash}">${esc(c.name)}</a>`)
    .join(' · ');
  return `<div class="card">
      <h3>Acting as somebody</h3>
      <p class="muted small">${ME
        ? `No custodian is named <strong>${esc(ME)}</strong> in this group, so this page is
           read-only.`
        : 'This page is read-only until it knows which custodian is reading it. Opening it as ' +
          'yourself makes every command on it yours, with your address already in place.'}</p>
      <p class="small">${links || 'No named custodians to choose from.'}</p>
    </div>`;
}

// -------------------------------------------------------- screen: proposals

async function screenProposals() {
  const f = await loadFoundation();
  const [all, done] = await Promise.all([loadProposals(f), loadCarriedOut()]);

  const decorated = all.map((entry) => {
    const state = proposalState(entry.proposal, chainNow);
    const counted = tally({
      custodians: f.custodians,
      votes: entry.votes,
      threshold: f.threshold,
      finalTally: entry.proposal.final_tally_result,
    });
    const stale = staleAgainstGroup(entry.proposal, f.versions);
    return { ...entry, state, counted, stale, exec: executability(state, counted, stale) };
  });

  const waiting = decorated.filter((d) => d.exec.can);
  const open = decorated.filter((d) => !d.exec.can && d.state.phase === 'open');
  const settled = decorated.filter((d) => !d.exec.can && d.state.phase !== 'open');

  // The screen this console spends most of its life on, and the one nobody
  // draws. Four "nothing here" lines under four headings reads as a page that
  // failed to load; one statement that the chain answered and there is nothing
  // does not — and the difference matters most on the account every seizure on
  // the chain is paid into.
  if (!decorated.length && !done.history.length && !done.failed) {
    view.innerHTML = `
      <h2>Proposals</h2>
      <div class="card card--ok">
        <p class="lede">Nothing has ever been proposed on this account.</p>
        <p class="muted small">Which is the ordinary state of a custody account rather than a
          sign of trouble: the foundation exists to receive what is seized and to pay
          restitution, and neither happens weekly. Both reads behind this screen
          succeeded — the proposal list and the transaction log — so this is the chain
          answering "none", not this page failing to ask.</p>
        <p class="small" style="margin-top:.7rem"><a href="#/propose">Raise the first one →</a></p>
      </div>
      <div class="card">
        <p class="label">What appears here, and in which order</p>
        <p class="muted small"><strong>Waiting to be carried out</strong> first, because a
          proposal that has the signatures it needs and has not been executed has moved
          nothing while looking finished. Then open for voting, then what was carried out,
          then what was refused.</p>
      </div>`;
    wireCopies();
    return;
  }

  view.innerHTML = `
    ${waiting.length ? `
      <h2>Waiting to be carried out</h2>
      <p class="muted small">These have the signatures they need. Nothing has moved yet —
        a proposal has to be executed, and anybody at all can send that transaction: it needs
        no permission, only that somebody does it.</p>
      ${waiting.map((d) => proposalCard(d, f, true)).join('')}` : ''}

    <h2>Open for voting</h2>
    ${open.length
      ? open.map((d) => proposalCard(d, f, false)).join('')
      : '<p class="empty">Nothing is open for voting.</p>'}

    <h2>Carried out</h2>
    <p class="muted small">x/group deletes a proposal once it has been executed, so these are
      rebuilt from the transaction log rather than read from the proposal list — where they no
      longer appear. A restitution that went through leaves no proposal behind, which is what
      success looks like here and is easy to mistake for something having been lost.</p>
    ${done.failed
      ? `<div class="warnbox">The transaction log could not be searched, so this list is empty
          for a reason that has nothing to do with whether anything was paid out. Do not read it
          as "nothing has ever been carried out".</div>`
      : carriedOutList(done.history, f)}

    <h2>Refused, void or expired</h2>
    ${settled.length
      ? settled.map((d) => proposalCard(d, f, false)).join('')
      : '<p class="empty">Nothing has been refused.</p>'}`;
  wireCopies();
}

function carriedOutList(history, f) {
  if (!history.length) {
    return '<p class="empty">Nothing has been carried out on this account yet.</p>';
  }
  return history.map((h) => {
    const described = h.proposal
      ? describeProposal(h.proposal, {
          policyAddress: f.policyAddress,
          registry: f.registry,
          names: f.names,
          currentMembers: f.memberAddresses,
          expectedCount: Number(f.invariants.foundation_custodian_count ?? 0),
        })
      : null;
    const t = h.tally ?? {};
    return `<div class="card card--ok">
        <div class="row">
          <strong>#${esc(h.proposalId)} ${esc(h.proposal?.title || '(title not recovered)')}</strong>
          <span class="pill p-ok">carried out</span>
        </div>
        ${described
          ? effect(described)
          : `<p class="muted small">The transaction that raised this proposal is outside the
              window searched here, so what it did cannot be shown. It executed successfully —
              the payload is in the log at block ${esc(h.height)}.</p>`}
        <p class="muted small">Approved ${esc(t.yes_count ?? '?')} to
          ${esc(Number(t.no_count ?? 0) + Number(t.no_with_veto_count ?? 0))}${
            Number(t.abstain_count ?? 0) ? `, ${esc(t.abstain_count)} abstaining` : ''
          } · executed at block ${esc(h.height)}${
            h.time ? ` on ${esc(new Date(h.time).toUTCString().replace('GMT', 'UTC'))}` : ''
          }</p>
        <p class="muted small">Transaction ${idHtml(h.hash, { label: 'transaction hash' })}</p>
      </div>`;
  }).join('');
}

/**
 * The warning for a proposal the chain will abort.
 *
 * Stated as strongly as a refusal, because x/group leaves such a proposal
 * looking open: its status is still SUBMITTED and its deadline is still in the
 * future, so the only thing standing between the custodians and a wasted week is
 * this box.
 */
function staleWarning(stale) {
  const why = stale.reasons.join(', and ');
  return `<div class="badbox"><strong>This can never be carried out.</strong>
    ${esc(why.charAt(0).toUpperCase() + why.slice(1))}. x/group will abort it the moment anybody
    counts the votes, whatever they say — so signing it achieves nothing. It has to be proposed
    again against the foundation as it now stands.</div>`;
}

function proposalCard(d, f, highlight) {
  const { proposal: p, state, counted } = d;
  const described = describeProposal(p, {
    policyAddress: f.policyAddress,
    registry: f.registry,
    names: f.names,
    currentMembers: f.memberAddresses,
    expectedCount: Number(f.invariants.foundation_custodian_count ?? 0),
  });

  const stale = d.stale ?? { stale: false, reasons: [] };
  const shown = displayLabel(state, counted, stale);
  const tone = highlight ? 'card--waiting'
    : shown.tone === 'bad' ? 'card--bad'
    : shown.tone === 'ok' ? 'card--ok' : '';

  const dead = state.phase === 'open' && !stale.stale && !counted.couldStillPass;

  return `<div class="card ${tone}">
      <div class="row">
        <strong><a href="#/proposal/${esc(p.id)}" style="color:inherit">#${esc(p.id)}
          ${esc(p.title || '(untitled)')}</a></strong>
        <span class="pill p-${esc(shown.tone)}">${esc(shown.label)}</span>
      </div>
      ${p.summary ? `<p class="muted small">${esc(p.summary)}</p>` : ''}

      ${effect(described)}

      ${stale.stale ? staleWarning(stale) : ''}

      ${dead ? `<div class="badbox"><strong>This can no longer pass.</strong>
        ${counted.no + counted.veto + counted.abstain} of ${counted.rows.length} custodians have
        voted without approving it, so the ${counted.undecided} remaining cannot reach
        ${counted.threshold}. It stays open until its deadline, but the outcome is settled.</div>` : ''}

      ${voteBar(counted)}
      ${state.phase === 'open' && !dead
        ? `<p>${deadline(state.closesAt, 'Voting closes')}</p>` : ''}
      ${state.note ? `<p class="muted small">${esc(state.note)}</p>` : ''}
      ${state.phase === 'awaiting-exec' && state.expiresAt
        ? `<div class="warnbox">${deadline(state.expiresAt,
            'If nobody carries this out it stops being executable')} — and the decision is then
            lost, not merely delayed.</div>` : ''}

      <p class="small" style="margin-top:.6rem">
        <a href="#/proposal/${esc(p.id)}">Open this proposal →</a></p>
    </div>`;
}

// --------------------------------------------------- screen: one proposal

async function screenProposal(id) {
  // The id comes out of the URL fragment, so it is whatever was typed. Checked
  // before it is put in a request path: a proposal id is a uint64 and nothing
  // else, and interpolating an arbitrary string into the query URL would let a
  // crafted link point this page's reads at a path nobody intended.
  if (!/^\d+$/.test(id)) {
    view.innerHTML = `<p class="small"><a href="#/proposals">← every proposal</a></p>
      <div class="card card--bad"><p class="lede">That is not a proposal number.</p>
      <p class="muted small">Proposal ids are whole numbers. Nothing was requested from the
        chain.</p></div>`;
    return;
  }

  const f = await loadFoundation();

  let raw;
  try {
    raw = await get(`${REST}/cosmos/group/v1/proposal/${id}`);
  } catch (e) {
    // Not-found here usually means the proposal did its job: x/group deletes an
    // executed proposal. Saying "not found" to the custodian who approved a
    // restitution would be true and would read as the money having vanished.
    return screenGoneProposal(id, f, e);
  }
  const p = raw.proposal;
  const votes = (await maybe(
    get(`${REST}/cosmos/group/v1/votes_by_proposal/${id}?pagination.limit=100`), { votes: [] },
  )).votes ?? [];

  const state = proposalState(p, chainNow);
  const counted = tally({
    custodians: f.custodians,
    votes,
    threshold: f.threshold,
    finalTally: p.final_tally_result,
  });
  const stale = staleAgainstGroup(p, f.versions);
  const exec = executability(state, counted, stale);
  const described = describeProposal(p, {
    policyAddress: f.policyAddress,
    registry: f.registry,
    names: f.names,
    currentMembers: f.memberAddresses,
    expectedCount: Number(f.invariants.foundation_custodian_count ?? 0),
  });

  const me = f.custodians.find((c) => c.name === ME);
  const myVote = me ? counted.rows.find((r) => r.custodian.address === me.address) : null;
  const dead = state.phase === 'open' && !stale.stale && !counted.couldStillPass;

  const shown = displayLabel(state, counted, stale);

  view.innerHTML = `
    <p class="small"><a href="#/proposals">← every proposal</a></p>
    <div class="card ${shown.tone === 'bad' ? 'card--bad' : exec.can ? 'card--waiting' : ''}">
      <div class="row">
        <strong>#${esc(p.id)} ${esc(p.title || '(untitled)')}</strong>
        <span class="pill p-${esc(shown.tone)}">${esc(shown.label)}</span>
      </div>
      ${p.summary ? `<p class="muted small">${esc(p.summary)}</p>` : ''}
      <p class="muted small">Proposed by
        ${(p.proposers ?? []).map((a) => f.names[a]
          ? `${esc(f.names[a])} ${idHtml(a, { label: 'proposer' })}`
          : idHtml(a, { label: 'proposer' })).join(', ') || 'nobody'}
        ${esc(relativeTime(timestampSeconds(p.submit_time) - chainNow))},
        on ${esc(new Date(p.submit_time).toUTCString().replace('GMT', 'UTC'))}</p>
      ${state.note ? `<p class="muted small">${esc(state.note)}</p>` : ''}
    </div>

    <h2>What this would do</h2>
    ${stale.stale ? staleWarning(stale) : ''}
    ${effect(described)}
    ${described.understood ? '' : `<div class="badbox"><strong>Part of this proposal has not been
      interpreted by this page.</strong> Do not vote on it here. Read it with
      <code>blockchaind q group proposal ${esc(p.id)}</code> and decode the message against the
      module that owns it.</div>`}

    <h2>Who has voted</h2>
    <div class="card">
      ${voteBar(counted)}
      ${custodianVotes(counted, f, p.id, state)}
      ${dead ? `<div class="badbox"><strong>This can no longer pass.</strong> The remaining
        ${counted.undecided} vote${counted.undecided === 1 ? '' : 's'} cannot reach
        ${counted.threshold}.</div>` : ''}
      ${state.phase === 'open' ? `<p style="margin-top:.6rem">
        ${deadline(state.closesAt, 'Voting closes')}</p>
        <p class="muted small">Nothing is final until then unless the threshold is reached
          first — ${counted.reached
            ? 'which it now has.'
            : `${counted.stillNeeded} more signature${counted.stillNeeded === 1 ? '' : 's'} would
               do it.`}</p>` : ''}
    </div>

    ${voteSection(f, p, state, counted, me, myVote, described, stale)}
    ${execSection(f, p, state, exec, me)}`;
  wireCopies();
}

/**
 * A proposal that is no longer in state.
 *
 * Almost always because it executed. The log is searched before anything is
 * claimed, so the page can say which of the two it was instead of reporting the
 * 404 it got and leaving the custodian to guess.
 */
async function screenGoneProposal(id, f, originalError) {
  const done = await loadCarriedOut();
  const hit = done.history.find((h) => h.proposalId === String(id));

  if (hit) {
    view.innerHTML = `
      <p class="small"><a href="#/proposals">← every proposal</a></p>
      <div class="card card--ok">
        <p class="lede">Proposal #${esc(id)} was carried out, and x/group then deleted it.</p>
        <p class="muted small">That deletion is the module's normal behaviour for a proposal that
          executed successfully, not a sign that anything went wrong — but it does mean the
          proposal itself can no longer be looked up. What is below comes from the transaction
          log, which keeps it.</p>
      </div>
      ${carriedOutList([hit], f)}`;
    return;
  }

  view.innerHTML = `
    <p class="small"><a href="#/proposals">← every proposal</a></p>
    <div class="card card--bad">
      <p class="lede">There is no proposal #${esc(id)} on this chain, and no record of one
        having been carried out.</p>
      <p class="muted small">Two things produce this. Either that id was never used — a mistyped
        link — or the proposal executed so long ago that the transaction search here no longer
        reaches it. It is not evidence of anything having been removed: x/group has no way to
        delete a proposal other than executing it.</p>
      <details>
        <summary>What the node actually said</summary>
        <pre>${esc(originalError.message)}</pre>
      </details>
    </div>`;
}

function voteSection(f, p, state, counted, me, myVote, described, stale) {
  if (state.phase !== 'open') {
    return `<h2>Vote</h2><div class="card"><p class="muted small">Voting on this proposal is
      closed.</p></div>`;
  }
  // No command is composed for a proposal the chain will abort. Offering one
  // would be offering a custodian a way to spend a signature on nothing.
  if (stale?.stale) {
    return `<h2>Vote</h2>
      <div class="card card--bad">${staleWarning(stale)}
        <p class="muted small">No voting command is offered for this proposal, because there is
          no vote that would change its outcome.</p></div>`;
  }
  if (!me) {
    return `<h2>Vote</h2><div class="card"><p class="muted small">Open this page as one of the
      custodians to vote. ${f.custodians.filter((c) => c.name).map((c) =>
        `<a href="?as=${encodeURIComponent(c.name)}#/proposal/${esc(p.id)}">${esc(c.name)}</a>`)
        .join(' · ')}</p></div>`;
  }
  if (myVote?.option) {
    const [word] = OPTION_WORD[myVote.option] ?? ['voted'];
    return `<h2>Vote</h2><div class="card"><p class="muted small">You have already
      <strong>${esc(word)}</strong> this proposal. x/group records one vote per custodian and a
      second would be refused.</p></div>`;
  }

  // The deciding vote gets --exec, so the money moves in the same transaction
  // rather than waiting for somebody to remember the second step.
  const deciding = counted.stillNeeded === 1;

  const options = [
    ['VOTE_OPTION_YES', 'Approve', 'ok'],
    ['VOTE_OPTION_NO', 'Refuse', 'bad'],
    ['VOTE_OPTION_ABSTAIN', 'Abstain', ''],
    ['VOTE_OPTION_NO_WITH_VETO', 'Refuse with veto', 'bad'],
  ];

  return `<h2>Vote as ${esc(me.name)}</h2>
    <div class="card">
      ${described.understood ? '' : `<div class="badbox">This page could not describe every
        message in this proposal. It will still compose the command, because refusing to would
        only push you to type it by hand — but do not run it until you have read the proposal
        another way.</div>`}
      ${deciding ? `<div class="warnbox"><strong>Yours would be the deciding signature.</strong>
        The approve command below carries <code>--exec 1</code>, which votes and carries the
        proposal out in the same transaction. Without it the proposal passes and waits for
        somebody to execute it separately.</div>` : ''}
      <p class="muted small">Run this where your key is. Nothing is sent from this page.</p>
      ${options.map(([option, label, cls]) => {
        const cmd = voteCommand({
          proposalId: p.id, voter: me.address, option,
          alsoExecute: deciding && option === 'VOTE_OPTION_YES',
        });
        return `<details${option === 'VOTE_OPTION_YES' ? ' open' : ''}>
            <summary><span class="btn ${cls}">${esc(label)}</span></summary>
            ${copyable(`vote-${option}`, cmd, `${label} proposal #${p.id} as ${me.name}`)}
          </details>`;
      }).join('')}
      ${executionNote()}
      ${offlineNote(me)}
    </div>`;
}

function execSection(f, p, state, exec, me) {
  if (!exec.can) return '';
  const executor = me?.address ?? f.custodians[0]?.address ?? '';
  return `<h2>Carry it out</h2>
    <div class="card card--waiting">
      <p class="lede">${esc(exec.why)}</p>
      <p class="muted small">Executing a proposal needs no membership and no permission — any
        account on the chain can send this, and it pays only the fee. What it does not do is
        happen by itself: until somebody sends it, the decision has changed nothing.</p>
      ${state.expiresAt
        ? `<p>${deadline(state.expiresAt, 'Stops being executable')}</p>` : ''}
      ${copyable('exec-cmd', execCommand({ proposalId: p.id, executor }),
        `Carry out proposal #${p.id}${me ? ` as ${me.name}` : ''}`)}
      ${executionNote()}
    </div>`;
}

/**
 * The path for a custodian whose key is on paper.
 *
 * Not an afterthought: the custodians' keys were produced by an air-gapped
 * ceremony, so for some of them there is no keyring on any machine that can
 * reach a node. A console that only printed a broadcast command would be
 * unusable by exactly the people it is for.
 */
function offlineNote(me) {
  return `<details>
      <summary>My key is on paper, not in a keyring on this machine</summary>
      <p class="muted small">Then the command above cannot sign. Build the transaction on the
        connected machine, carry it to the offline one, sign it there, and carry the signature
        back:</p>
      ${copyable('offline-steps', [
        '# on the connected machine — build it, signing nothing',
        '…the command above… --generate-only > vote.json',
        '',
        '# on the offline machine, where the key is imported from paper',
        `blockchaind tx sign vote.json --from ${me.address} \\`,
        `  --chain-id ${currentChainId() || '<chain-id>'} --offline \\`,
        '  --account-number <N> --sequence <S> > vote-signed.json',
        '',
        '# back on the connected machine',
        'blockchaind tx broadcast vote-signed.json',
      ].join('\n'), 'Offline signing')}
      <p class="muted small">The account number and sequence have to be read from the chain
        first — <code>blockchaind q auth account ${esc(short(me.address))}</code> — because an offline
        signer cannot look them up, and a wrong sequence produces a signature the chain rejects
        without saying why.</p>
    </details>`;
}

// ---------------------------------------------------------- screen: propose

async function screenPropose() {
  const f = await loadFoundation();
  const me = f.custodians.find((c) => c.name === ME);
  const expectedCount = Number(f.invariants.foundation_custodian_count ?? 0);

  if (!me) {
    view.innerHTML = `<h2>Propose</h2>
      <div class="card"><p class="muted small">Only a custodian can raise a proposal on this
        account. Open this page as one of them:
        ${f.custodians.filter((c) => c.name).map((c) =>

    <h2>Pay out</h2>
    <div class="card">
      <p class="muted small">A transfer out of the foundation account — restitution of

      <label for="sp-denom">Currency</label>
      <select id="sp-denom">${denoms.map((d) =>
        `<option value="${esc(d)}">${esc(f.registry[d]?.symbol ?? d)} (${esc(d)})</option>`).join('')}</select>
      <label for="sp-title">Title</label>
      <input id="sp-title" placeholder="Restitution to … / Grant to …" autocomplete="off">
      <label for="sp-why">Why — the custodians will read this before signing</label>
      <textarea id="sp-why" placeholder="What this pays for, and on whose authority. A case number if it is a restitution."></textarea>
      <div id="sp-out" style="margin-top:.7rem"></div>
    </div>

    <h2>Replace a custodian</h2>
    <div class="card">
      <p class="muted small">A departure and a replacement are one decision, and this page can

        ${esc(expectedCount)} custodians and an ante decorator refuses any change that would
        leave it at a different number — so a bare removal is not offered here, because it is not

      <label for="sw-out">Who is leaving</label>
      <select id="sw-out">
        <option value="">—</option>
        ${f.custodians.map((c) => `<option value="${esc(c.address)}">${
          esc(c.name || short(c.address))}${c.fingerprint ? ` · ${esc(c.fingerprint)}` : ''}</option>`).join('')}
      </select>
      <label for="sw-in">Who is joining — their address from the ceremony</label>
      <input id="sw-in" placeholder="yml1…" autocomplete="off">
      <label for="sw-title">Title</label>
      <input id="sw-title" placeholder="Replace … with …" autocomplete="off">
      <label for="sw-why">Why</label>
      <textarea id="sw-why" placeholder="Why this custodian is standing down, and who has verified the incoming key."></textarea>
      <div id="sw-outbox" style="margin-top:.7rem"></div>
    </div>

    <h2>Grant a role in a country</h2>
    <div class="card">
      <p class="muted small">This is how a country becomes operational: an office holds a role, and
        the role is what some module refuses an action without. Admitting a country is the
        foundation's act rather than a governance vote — three of five custodians from five

      <label for="gr-holder">Which office — its <em>group policy</em> address, not an official's key</label>

        </div>
      </div>
      <label class="check" for="gr-shape-none">
        <input type="checkbox" id="gr-shape-none">
        <span>Record no required shape. The office may reduce itself to a single key afterwards
          and keep this authority — which is the state of every grant made before the chain had
          this field.</span>
      </label>
      <div id="gr-shape-note"></div>

      <label for="gr-country">Which country — an assigned ISO 3166-1 alpha-2 code</label>
      <input id="gr-country" list="iso-codes" placeholder="ZA" autocomplete="off"
             spellcheck="false" maxlength="2" style="max-width:9rem;text-transform:uppercase">
      <datalist id="iso-codes">${assignedCountries().map((c) =>
        `<option value="${c}"></option>`).join('')}</datalist>
      <label for="gr-title">Title</label>
      <input id="gr-title" placeholder="Grant … the … role in …" autocomplete="off">
      <label for="gr-why">Why — the custodians will read this before signing</label>
      <textarea id="gr-why" placeholder="Which office this is, who verified its membership against the ceremony record, and what it will be doing with the role."></textarea>

    </div>

    <h2>Revoke a role</h2>
    <div class="card">
      <p class="muted small">Taking a role away is the act that has to be possible on a Sunday, so
        it needs the same three signatures and nothing more — no governance cycle. The foundation
        can remove a grant governance made, deliberately: a rule under which appointing a national
        enforcement authority takes one 3-of-5 vote but removing one takes a full governance cycle
        would make the emergency the expensive case. A grant is removed rather than marked, because

      <label for="rv-holder">Which office is losing a role</label>
      <input id="rv-holder" placeholder="yml1…" autocomplete="off" spellcheck="false">
      <div id="rv-held" style="margin-top:.6rem"></div>
      <label for="rv-grant">Which grant</label>
      <select id="rv-grant"><option value="">—</option></select>
      <label for="rv-title">Title</label>
      <input id="rv-title" placeholder="Revoke … from …" autocomplete="off">
      <label for="rv-why">Why</label>
      <textarea id="rv-why" placeholder="Whether this is a compromised key, an abuse of the authority, or an office being wound up — and who established that."></textarea>
      <div id="rv-out" style="margin-top:.7rem"></div>
    </div>

    <h2>Anything else</h2>
    <div class="card">
      <p class="muted small">The foundation is a multisig account, so it can do anything an
        account can do — delegate a stake, vote in a governance proposal, update a module it
        holds authority over, send several payments at once. The four forms above are shortcuts
        for the cases that recur, not the limit of what this account is. A country enrolment is
        the case that most often needs this one: it is several role grants <em>and</em> a
        jurisdiction record per office, in one proposal, because x/group executes a proposal's
        messages together or not at all — and a country with a payments authority and no
        enforcement authority is money moving in a perimeter nobody can stop.</p>
      <div class="warnbox"><strong>This page cannot tell you what an arbitrary message does.</strong>
        It has no protobuf decoder, so for anything other than a payment, a membership change or a
        role grant it
        can check the shape and not the meaning. Read it yourself, and have a second custodian read
        it independently, before three of you sign. What it <em>can</em> check is below, and those
        checks catch the failure that costs the most: a message the foundation is not the signer
        of passes submission, collects three signatures, waits out the week, and only then fails.</p>
      <label for="gp-msgs">The messages — a proposal document, a list, or one message</label>
      <textarea id="gp-msgs" rows="10" spellcheck="false"
        placeholder='[
  {
    "@type": "/cosmos.staking.v1beta1.MsgDelegate",
    "delegator_address": "&lt;the foundation&gt;",
    "validator_address": "ymlvaloper1…",
    "amount": { "denom": "uyml", "amount": "1000000" }
  }
]'></textarea>
      <label for="gp-title">Title</label>
      <input id="gp-title" placeholder="What this does, in a line" autocomplete="off">
      <label for="gp-why">Why — the custodians will read this before signing</label>
      <textarea id="gp-why" placeholder="What it does, why now, and what you checked. This is the only explanation the other custodians get."></textarea>
      <div id="gp-out" style="margin-top:.7rem"></div>
    </div>`;

  const spend = () => {
    const to = document.getElementById('sp-to').value.trim();
    const whole = document.getElementById('sp-amt').value.trim();
    const denom = document.getElementById('sp-denom').value;
    const title = document.getElementById('sp-title').value.trim();
    const why = document.getElementById('sp-why').value.trim();
    const out = document.getElementById('sp-out');

    const problems = [];
    if (!to.startsWith('yml1') || to.length < 39) problems.push('The recipient is not a Yamale address.');
    if (!/^\d+(\.\d+)?$/.test(whole)) problems.push('Enter an amount as a plain number.');
    if (!title) problems.push('Give it a title — it is what the other custodians see first.');
    if (tooLong(title)) problems.push(`The title is longer than ${MAX_METADATA_LEN} bytes, which x/group refuses.`);
    if (tooLong(why)) problems.push(`The reason is longer than ${MAX_METADATA_LEN} bytes, which x/group refuses.`);
    if (!why) problems.push('Say why. A custodian asked to move money out of this account should not have to guess.');

    if (problems.length) {
      out.innerHTML = problems.map((x) => `<div class="warnbox">${esc(x)}</div>`).join('');
      return;
    }

    // Whole units in, base units out. The exponent comes from the chain's own
    // denom metadata — never from a guess, because a wrong exponent on a
    // restitution payment is a factor of a million.
    const exponent = Number(f.registry[denom]?.exponent ?? 0);
    let base;
    try {
      base = toBaseUnits(whole, exponent);
    } catch (e) {
      out.innerHTML = `<div class="warnbox">${esc(e.message)}</div>`;
      return;
    }
    const messages = [spendMessage({ policyAddress: f.policyAddress, recipient: to, amount: base, denom })];
    const doc = proposalDocument({
      policyAddress: f.policyAddress, proposer: me.address, messages, title, summary: why,
    });

    out.innerHTML = `
      <div class="card card--waiting" style="margin:0">
        <p class="lede">Pay ${esc(formatCoin({ denom, amount: base }, { registry: f.registry }))}
          to ${esc(short(to))}</p>
        <p class="muted small">out of the foundation account, once
          ${esc(f.threshold)} custodians have signed. <code>${esc(base)}</code> ${esc(denom)} in
          base units — check that against the amount you meant.</p>
        ${copyable('sp-doc', doc, 'Write this to proposal.json')}
        ${copyable('sp-cmd', submitCommand({ proposer: me.address }), 'Then submit it')}
        ${executionNote()}
      </div>`;
    wireCopies();
  };

  const swap = () => {
    const outgoing = document.getElementById('sw-out').value;
    const incoming = document.getElementById('sw-in').value.trim();
    const title = document.getElementById('sw-title').value.trim();
    const why = document.getElementById('sw-why').value.trim();
    const box = document.getElementById('sw-outbox');

    const plan = swapPlan({ current: f.memberAddresses, outgoing, incoming, expectedCount });
    const problems = [...plan.problems];
    if (incoming && (!incoming.startsWith('yml1') || incoming.length < 39)) {
      problems.push('The incoming address is not a Yamale address.');
    }
    if (!title) problems.push('Give it a title.');
    if (!why) problems.push('Say why.');
    if (tooLong(title) || tooLong(why)) {
      problems.push(`Titles and reasons are limited to ${MAX_METADATA_LEN} bytes.`);
    }

    if (problems.length) {
      box.innerHTML = problems.map((x) => `<div class="warnbox">${esc(x)}</div>`).join('');
      return;
    }

    const leaving = f.custodians.find((c) => c.address === outgoing);
    const messages = [swapMessage({
      policyAddress: f.policyAddress, groupId: f.groupId, updates: plan.updates,
    })];
    const doc = proposalDocument({
      policyAddress: f.policyAddress, proposer: me.address, messages, title, summary: why,
    });

    box.innerHTML = `
      <div class="card card--waiting" style="margin:0">
        <p class="lede">Replace ${esc(leaving?.name || short(outgoing))} with
          ${esc(short(incoming))}</p>
        <p class="muted small">One message, removing and adding together, leaving the foundation
          at ${esc(plan.resulting)} custodians — which is what the constitution requires. Both
          halves are in the same message on purpose: the chain would refuse them separately.</p>
        <div class="warnbox">Raising this voids every proposal currently open. A membership change
          moves the group to a new version, and an x/group proposal raised against the old one can
          never be executed — so carry out anything outstanding first.</div>
        ${copyable('sw-doc', doc, 'Write this to proposal.json')}
        ${copyable('sw-cmd', submitCommand({ proposer: me.address }), 'Then submit it')}
        ${executionNote()}
      </div>`;
    wireCopies();
  };

  // ---- granting and revoking a country's roles ----
  //
  // Both forms depend on a chain read, which the two above do not, so both hold a
  // little state: the holder the page last looked up and what it found. The read
  // is keyed by address and the result is discarded if the field has moved on, so
  // a slow answer for a half-typed address can never overwrite a fresh one for
  // the address actually in the box.

  /** Chain-verified facts about a holder, per form. Null until one is looked up. */
  const holders = { grant: null, revoke: null };
  const pending = { grant: null, revoke: null };
  const timers = { grant: null, revoke: null };

  const box = (kind, text) => `<div class="${kind}">${esc(text)}</div>`;

  /**
   * The office, as membership and threshold rather than as an address.
   *
   * An x/group policy address comes from the group's sequence number alone, so it
   * is not evidence of who controls the group — two chains, or a chain and a dry
   * run, produce the same address for the same sequence. A live run of the country
   * ceremony predicted an office's address and got the foundation's own for
   * exactly that reason. So this is not a disclosure the custodian can skip.
   */
  const officeCard = (h) => {
    if (!h) return '<p class="muted small">Looking this address up on the chain…</p>';
    if (h.verdict.verdict !== 'group') {
      return `<div class="badbox"><strong>${esc(
        h.verdict.verdict === 'plain-key' ? 'This is not an office.'
          : h.verdict.verdict === 'malformed' ? 'This is not an address.'
            : 'This page could not check the holder.')}</strong><br>${esc(h.verdict.problem)}</div>`;
    }
    const o = h.office;
    const rows = o.members.map((m) => `<tr>
        <td>${esc(m.name || '—')}</td>
        <td class="fp">${esc(m.fingerprint || '—')}</td>
        <td>${idHtml(m.address, { label: 'member' })}</td>
        <td class="num y-num">${esc(m.weight === null ? '?' : String(m.weight))}</td>
      </tr>`).join('');
    return `<div class="card card--ok" style="margin:0">
        <div class="row">
          <span class="lede">Group ${esc(o.groupId ?? '?')} —
            ${esc(o.threshold === null ? '?' : String(o.threshold))} of
            ${esc(String(o.totalWeight))} in weight</span>
          <span class="pill p-ok">an x/group account</span>
        </div>
        <!-- The shape, said in people rather than in weight, because that is
             what the chain measures a pinned grant against. A threshold of three
             over weights of 3,1,1,1,1 is a one-of-five. -->
        <div class="row">
          <span class="small"><strong>As people: ${esc(o.rule ?? shapeRule(o.shape))}</strong>
            — ${o.shape?.signatures === null
              ? 'how many members it takes to act cannot be established'
              : `${esc(String(o.shape.signatures))} of its
                 ${esc(String(o.shape.members))} members can act together`}</span>
          <span class="pill ${o.shape?.signatures === null ? 'p-warn'
            : o.shape.signatures < 2 ? 'p-bad' : 'p-ok'}">${
            o.shape?.signatures === null ? 'shape unknown'
              : o.shape.signatures < 2 ? 'one key can act' : 'an office'}</span>
        </div>
        <p class="muted small">A policy address is derived from the group's sequence number and
          from nothing else, so the address above is not evidence of who controls this office.
          This is. Check it against the ceremony record before you grant it anything.</p>
        <!-- Four columns of data, one of them a bech32 address, on a phone: this
             scrolls inside its own box rather than clipping the weight column,
             which is the column that says whether the threshold means anything. -->
        <div class="y-scroll">
          <table><thead><tr><th>Member</th><th>Fingerprint</th><th>Address</th><th class="num">Weight</th></tr></thead>
            <tbody>${rows}</tbody></table>
        </div>
        ${o.concerns.map((c) => box('badbox', c)).join('')}
      </div>`;
  };

  /** Look a holder up, once the address is worth a round trip. */
  const lookUp = (which, address, onDone) => {
    if (checkAddress(address).problem) {
      clearTimeout(timers[which]);
      holders[which] = null;
      pending[which] = null;
      onDone();
      return;
    }
    // A second call for an address already in flight leaves the armed timer
    // alone. It used to clear the timer FIRST and then return here, which meant
    // any repeat call inside the debounce window destroyed the pending lookup and
    // never rearmed it — and the page then sat on "Looking this address up on the
    // chain…" for ever while grantPlan refused to compose anything, because
    // pending was set and nothing was going to resolve it.
    //
    // The repeat call is not hypothetical: both handlers are wired, to `input`
    // and to `change`, so pasting an address and then leaving the field fires
    // both within a few milliseconds. Typing it character by character worked,
    // pasting it did not, and the difference was invisible.
    if (holders[which]?.address === address || pending[which] === address) {
      onDone();
      return;
    }
    clearTimeout(timers[which]);
    pending[which] = address;
    holders[which] = null;
    onDone();
    // Debounced, because this fires on every keystroke and an address is 39
    // characters. Three reads per character would be three reads too many.
    timers[which] = setTimeout(async () => {
      const found = await loadHolder(f, address);
      // Discarded if the field moved on. A slow answer for a half-typed address
      // overwriting a fresh one is how a custodian ends up reading the wrong
      // office's membership beside the right office's address.
      if (pending[which] !== address) return;
      holders[which] = found;
      onDone();
    }, 350);
  };

  /**
   * Whether the custodian has touched the shape fields.
   *
   * The prefill has to stop the moment somebody types, or a slow chain read would
   * overwrite the number they just entered with the office's own — silently, on
   * the field that decides whether the office can vote itself down to one key.
   */
  let shapeTouched = false;

  const grant = () => {
    const holderAddr = document.getElementById('gr-holder').value.trim();
    const role = document.getElementById('gr-role').value;
    const country = document.getElementById('gr-country').value.trim();
    const title = document.getElementById('gr-title').value.trim();
    const why = document.getElementById('gr-why').value.trim();
    const out = document.getElementById('gr-out');
    const officeBox = document.getElementById('gr-office');
    const sigField = document.getElementById('gr-shape-sig');
    const memField = document.getElementById('gr-shape-mem');
    const noneField = document.getElementById('gr-shape-none');
    const shapeNote = document.getElementById('gr-shape-note');

    const h = holders.grant;
    officeBox.innerHTML = holderAddr && !checkAddress(holderAddr).problem ? officeCard(h) : '';

    // Prefilled from what the office IS, once and only until somebody types. The
    // chain refuses a requirement the office does not already meet, so its own
    // shape is the only value that is certain to compose — and it is put in front
    // of the custodian as two numbers rather than applied behind them.
    const known = h?.office?.shape;
    if (!shapeTouched && known && known.signatures !== null) {
      sigField.value = String(known.signatures);
      memField.value = String(known.members);
    }
    sigField.disabled = noneField.checked;
    memField.disabled = noneField.checked;

    const sig = sigField.value.trim();
    const mem = memField.value.trim();
    let requiredShape = null;
    let shapeProblem = null;
    if (!noneField.checked) {
      if (!/^\d+$/.test(sig) || !/^\d+$/.test(mem)) {
        shapeProblem = 'Say what shape this office has to keep — two whole numbers — or tick the '
          + 'box to record none. A grant with no recorded shape is one the office can keep after '
          + 'voting itself down to a single key, and that has to be a decision rather than an '
          + 'empty field.';
      } else {
        requiredShape = { signatures: Number(sig), members: Number(mem) };
      }
    }
    shapeNote.innerHTML = noneField.checked
      ? box('warnbox', 'Nothing will hold this office to its membership. Every action this role '
        + 'permits will keep working however few people are left in the office.')
      : (requiredShape && known && known.signatures !== null
        && (requiredShape.signatures > known.signatures || requiredShape.members > known.members)
        ? box('badbox', `This office is ${shapeRule(known)} today, so a requirement of `
          + `${shapeRule(requiredShape)} is one it does not meet. The chain refuses the grant `
          + 'outright rather than writing one that permits nothing.')
        : '');

    const plan = grantPlan({
      policyAddress: f.policyAddress,
      holder: holderAddr,
      role,
      jurisdiction: country,
      holderVerdict: h?.verdict ?? null,
      office: h?.office ?? null,
      existingGrants: h?.grants ?? null,
      requiredShape,
    });

    // Anything already stated against the office above is not restated here.
    // Both the verdict on the holder and the findings about its membership are
    // rendered beside the address they are about, which is where a custodian is
    // looking; repeating them under the form would make one mistake read as two
    // and bury the ones that are only said once.
    const saidAbove = new Set([
      ...(h?.office?.concerns ?? []),
      ...(h?.verdict?.problem ? [h.verdict.problem] : []),
    ]);

    const problems = plan.problems.filter((p) => !saidAbove.has(p));
    if (shapeProblem) problems.push(shapeProblem);
    if (!title) problems.push('Give it a title — it is what the other custodians see first.');
    if (!why) {
      problems.push('Say why. Nobody should be handed a national authority on an undescribed ' +
        'proposal.');
    }
    if (tooLong(title) || tooLong(why)) {
      problems.push(`Titles and reasons are limited to ${MAX_METADATA_LEN} bytes.`);
    }
    // While the shape fields are empty nothing has been chosen yet, so the plan's
    // warning about a grant that records no shape would be telling a custodian
    // off for not having finished typing. The demand to choose is already in
    // `problems`; this is the same deduplication as `saidAbove` and, like it, it
    // is presentation only — `plan.ready` still gates the composition.
    const notes = plan.concerns
      .filter((c) => !saidAbove.has(c))
      .filter((c) => !(shapeProblem && /records NO required shape/.test(c)))
      .map((c) => box('warnbox', c)).join('');

    // `plan.ready` gates the composition, not the length of the list above. The
    // filtering is presentation, and a presentation choice must never be the
    // thing that decides whether a proposal gets composed — that is how a
    // deduplication becomes a bypass.
    if (!plan.ready || problems.length) {
      out.innerHTML = problems.map((x) => box('warnbox', x)).join('') + notes;
      return;
    }

    const doc = proposalDocument({
      policyAddress: f.policyAddress, proposer: me.address, messages: plan.messages, title,
      summary: why,
    });

    out.innerHTML = `${notes}
      <div class="card card--waiting" style="margin:0">
        <p class="lede">Grant ${esc(plan.role.label)} in ${esc(plan.scope)} to
          ${esc(short(plan.holder))}${plan.requiredShape
            ? `, pinned at ${esc(shapeRule(plan.requiredShape))}` : ', unpinned'}</p>
        <p class="muted small">${esc(plan.role.office)} What consults it:
          ${esc(plan.role.consumer)} Once ${esc(f.threshold)} custodians have signed, this office
          can act inside ${esc(plan.scope)} and nowhere else.</p>
        <p class="muted small">${plan.requiredShape
          ? `The grant records ${esc(shapeRule(plan.requiredShape))}, and the chain re-checks it on
             every action the role permits: if this office later falls below
             ${esc(String(plan.requiredShape.signatures))} signatures or
             ${esc(String(plan.requiredShape.members))} members it loses the authority until it
             restores itself, which it can do by its own vote and without the foundation.`
          : 'The grant records <strong>no required shape</strong>. This office can vote itself down '
            + 'to a single key afterwards and keep the authority.'}</p>
        ${copyable('gr-doc', doc, 'Write this to proposal.json')}
        ${copyable('gr-cmd', submitCommand({ proposer: me.address }), 'Then submit it')}
        ${plan.requiredShape ? `<details>
          <summary>If the command answers <code>unknown field "required_shape"</code></summary>
          <p class="muted small">Then the binary you are running it against predates this field, and
            it is refusing to parse the document rather than refusing the proposal. Nothing was
            submitted and nothing was signed. The fix is the node, not the document: a chain whose
            <code>x/alias</code> does not know <code>required_shape</code> also cannot enforce one,
            so a grant made from that binary is unpinned however it is composed. Upgrade the node,
            or tick "record no required shape" above and accept what that means.</p>
        </details>` : ''}
        ${executionNote()}
      </div>`;
    wireCopies();
  };

  const revoke = () => {
    const holderAddr = document.getElementById('rv-holder').value.trim();
    const title = document.getElementById('rv-title').value.trim();
    const why = document.getElementById('rv-why').value.trim();
    const out = document.getElementById('rv-out');
    const heldBox = document.getElementById('rv-held');
    const picker = document.getElementById('rv-grant');

    const h = holders.revoke;
    const wellFormed = holderAddr && !checkAddress(holderAddr).problem;

    // The grants are listed from the chain and picked, not typed. A revocation
    // names the whole triple — holder, role, country — because a holder may hold
    // the same role in several countries, and "revoke their supervisor role"
    // would be ambiguous between one perimeter and all of them.
    let options = '<option value="">—</option>';
    if (wellFormed && h) {
      if (h.grants === null) {
        heldBox.innerHTML = box('badbox',
          `This page could not read what ${short(holderAddr)} holds (${h.grantsStatus}). An empty ` +
          'list and a failed query look identical, so nothing is offered here rather than ' +
          'offering you a choice from a list that may be short.');
      } else if (!h.grants.length) {
        heldBox.innerHTML = box('warnbox',
          `${short(holderAddr)} holds no role grants, in any country. There is nothing to revoke.`);
      } else {
        heldBox.innerHTML = `<p class="muted small">${esc(String(h.grants.length))} grant${
          h.grants.length === 1 ? '' : 's'}, read from the chain just now.</p>`;
        options += h.grants.map((g) => {
          const value = `${g.role}|${g.jurisdiction}`;
          const by = g.granted_by === f.policyAddress ? 'this foundation' : short(g.granted_by ?? '');
          // The pin each grant records, in the picker, because it is part of what
          // is being removed and because it is the only place a custodian can see
          // which of an office's grants hold it to its membership and which do
          // not.
          const pinned = shapeOfGrant(g);
          return `<option value="${esc(value)}">${esc(g.role)} in ${esc(g.jurisdiction)} — ${
            pinned ? `pinned at ${esc(shapeRule(pinned))}` : 'no required shape'}, granted by ${
            esc(by)} at height ${esc(String(g.granted_at_height ?? '?'))}</option>`;
        }).join('');
      }
    } else {
      heldBox.innerHTML = wellFormed
        ? '<p class="muted small">Reading what this account holds…</p>'
        : '';
    }

    // Rebuilt only when the set of options actually changed, so re-rendering on
    // every keystroke in the title field does not throw away the selection.
    const chosen = picker.value;
    if (picker.dataset.built !== options) {
      picker.innerHTML = options;
      picker.dataset.built = options;
      if (options.includes(`value="${chosen}"`)) picker.value = chosen;
    }

    const [role = '', jurisdiction = ''] = (picker.value || '').split('|');
    const plan = revokePlan({
      policyAddress: f.policyAddress,
      holder: holderAddr,
      role,
      jurisdiction,
      existingGrants: h?.grants ?? null,
    });

    // The state of the grants lookup is reported against the address above, so
    // the plan's own version of it is not repeated under the form.
    const problems = plan.problems.filter(
      (p) => !(wellFormed && /Waiting on this holder's grants/.test(p)),
    );
    if (!title) problems.push('Give it a title.');
    if (!why) {
      problems.push('Say why. Removing an authority is the act least likely to be questioned and ' +
        'the one whose record matters most.');
    }
    if (tooLong(title) || tooLong(why)) {
      problems.push(`Titles and reasons are limited to ${MAX_METADATA_LEN} bytes.`);
    }

    const notes = plan.concerns.map((c) => box('warnbox', c)).join('');
    // Nothing to choose from is not a mistake the custodian can correct, and the
    // box above has already said so. Asking them to choose a grant that does not
    // exist would be the page arguing with itself.
    if (wellFormed && h && Array.isArray(h.grants) && !h.grants.length) {
      out.innerHTML = '';
      return;
    }
    // As on the grant: `plan.ready` gates the composition, never the length of
    // the displayed list.
    if (!plan.ready || problems.length) {
      out.innerHTML = problems.map((x) => box('warnbox', x)).join('') + notes;
      return;
    }

    const doc = proposalDocument({
      policyAddress: f.policyAddress, proposer: me.address, messages: plan.messages, title,
      summary: why,
    });

    out.innerHTML = `${notes}
      <div class="card card--waiting" style="margin:0">
        <p class="lede">Revoke ${esc(plan.role.label)} in ${esc(plan.scope)} from
          ${esc(short(plan.holder))}</p>
        <p class="muted small">The grant is removed, not marked. Afterwards this office holds
          nothing in ${esc(plan.scope)} for this role, and every action that consults it
          — ${esc(plan.role.consumer)} — refuses them there.</p>
        ${copyable('rv-doc', doc, 'Write this to proposal.json')}
        ${copyable('rv-cmd', submitCommand({ proposer: me.address }), 'Then submit it')}
        ${executionNote()}
      </div>`;
    wireCopies();
  };

  const general = () => {
    const text = document.getElementById('gp-msgs').value;
    const title = document.getElementById('gp-title').value.trim();
    const why = document.getElementById('gp-why').value.trim();
    const out = document.getElementById('gp-out');

    const { messages, error } = parseMessages(text);
    if (error) {
      out.innerHTML = text.trim()
        ? `<div class="warnbox">${esc(error)}</div>`
        : '';
      return;
    }

    const problems = [];
    if (!title) problems.push('Give it a title — it is what the other custodians see first.');
    if (!why) problems.push('Say what this does. Nobody should be asked to sign an undescribed message.');
    if (tooLong(title) || tooLong(why)) {
      problems.push(`Titles and reasons are limited to ${MAX_METADATA_LEN} bytes.`);
    }

    const audit = auditMessages(messages, { policyAddress: f.policyAddress });
    const fatal = audit.flatMap((a) => a.problems);

    // What each message is, where the page can say — so pasting a payment or a
    // membership change still gets described in words rather than being treated
    // as unknowable just because it arrived through the general form.
    // What each message is, and what is wrong with it. Both, and the second half
    // was missing: this form used the headline and threw the concerns away, so a
    // pasted grant of the chain-wide scope — which only governance may make, and
    // which fails at execution after collecting three signatures — composed in
    // silence. This is the form the other three point people at when they refuse
    // something, so it is the last place that can afford to say less than it
    // knows.
    const decoded = [];
    const described = messages.map((m, i) => {
      // registry included, so an amount renders as 2.5 YML and not as
      // 2,500,000 uyml. Every other place on this page converts; a custodian
      // should never be the one doing a factor of a million in their head,
      // least of all on the form that cannot explain the rest of the message.
      const d = describeMessage(m, {
        policyAddress: f.policyAddress, names: f.names, registry: f.registry,
        currentMembers: f.memberAddresses,
      });
      decoded.push(d);
      const label = `Message ${i + 1}`;
      if (d.understood) {
        return `<div class="row" style="padding:.3rem 0"><strong>${esc(label)}:</strong>
          ${esc(d.headline)}</div>`;
      }
      return `<div class="row" style="padding:.3rem 0"><strong>${esc(label)}:</strong>
        <code>${esc(audit[i].typeUrl || 'no type')}</code>
        <span class="muted small">— this page cannot say what this does.</span></div>`;
    }).join('');

    // De-duplicated against the shape audit, which raises its own version of "the
    // authority is not the foundation" for the same message, and against itself,
    // because a proposal granting one office three roles would otherwise repeat
    // the same caveat three times. One mistake, one sentence.
    const seen = new Set(audit.flatMap((a) => [...a.problems, ...a.concerns]));
    const decodedConcerns = [];
    for (const concern of decoded.flatMap((d) => d.concerns)) {
      if (seen.has(concern)) continue;
      seen.add(concern);
      decodedConcerns.push(concern);
    }

    const notes = [
      ...problems.map((x) => `<div class="warnbox">${esc(x)}</div>`),
      ...fatal.map((x) => `<div class="badbox">${esc(x)}</div>`),
      ...audit.flatMap((a) => a.concerns).map((x) => `<div class="warnbox">${esc(x)}</div>`),
      ...decodedConcerns.map((x) => `<div class="warnbox">${esc(x)}</div>`),
    ].join('');

    if (problems.length || fatal.length) {
      out.innerHTML = `<div class="card" style="margin:0">${described}</div>${notes}`;
      return;
    }

    const doc = proposalDocument({
      policyAddress: f.policyAddress, proposer: me.address, messages, title, summary: why,
    });
    out.innerHTML = `${notes}
      <div class="card card--waiting" style="margin:0">
        <p class="lede">${esc(messages.length)} message${messages.length === 1 ? '' : 's'},
          signed as the foundation once ${esc(f.threshold)} custodians agree</p>
        ${described}
        ${copyable('gp-doc', doc, 'Write this to proposal.json')}
        ${copyable('gp-cmd', submitCommand({ proposer: me.address }), 'Then submit it')}
        ${executionNote()}
      </div>`;
    wireCopies();
  };

  ['gp-msgs', 'gp-title', 'gp-why'].forEach((id) => {
    const el = document.getElementById(id);
    el.addEventListener('input', general);
    el.addEventListener('change', general);
  });
  ['sp-to', 'sp-amt', 'sp-denom', 'sp-title', 'sp-why'].forEach((id) => {
    const el = document.getElementById(id);
    el.addEventListener('input', spend);
    el.addEventListener('change', spend);
  });
  ['sw-out', 'sw-in', 'sw-title', 'sw-why'].forEach((id) => {
    const el = document.getElementById(id);
    el.addEventListener('input', swap);
    el.addEventListener('change', swap);
  });
  ['gr-role', 'gr-country', 'gr-title', 'gr-why', 'gr-shape-none'].forEach((id) => {
    const el = document.getElementById(id);
    el.addEventListener('input', grant);
    el.addEventListener('change', grant);
  });
  // The two shape fields also stop the prefill, permanently. A chain read
  // arriving after somebody typed must not overwrite what they typed on the
  // field that decides whether the office can reduce itself to one key.
  ['gr-shape-sig', 'gr-shape-mem'].forEach((id) => {
    const el = document.getElementById(id);
    const typed = () => { shapeTouched = true; grant(); };
    el.addEventListener('input', typed);
    el.addEventListener('change', typed);
  });
  ['rv-grant', 'rv-title', 'rv-why'].forEach((id) => {
    const el = document.getElementById(id);
    el.addEventListener('input', revoke);
    el.addEventListener('change', revoke);
  });
  // The two holder fields go through the lookup, which re-renders when the chain
  // answers. Nothing about a role grant is composed from a typed address alone.
  const grHolder = document.getElementById('gr-holder');
  grHolder.addEventListener('input', () => lookUp('grant', grHolder.value.trim(), grant));
  grHolder.addEventListener('change', () => lookUp('grant', grHolder.value.trim(), grant));
  const rvHolder = document.getElementById('rv-holder');
  rvHolder.addEventListener('input', () => lookUp('revoke', rvHolder.value.trim(), revoke));
  rvHolder.addEventListener('change', () => lookUp('revoke', rvHolder.value.trim(), revoke));
}

// ------------------------------------------------------------------- router

async function route() {
  const path = (location.hash || '#/').split('?')[0];
  renderNav(path);
  setBanner('');
  // Cleared per route rather than held, so a chain that comes back is noticed
  // without a reload. The cost is one refused request per screen while it is
  // down, which is the cheapest possible way to keep this honest.
  pinnedHeight = null;
  window.scrollTo(0, 0);
  // The pending state, drawn rather than left as a word. Nothing on this page
  // resolves in one read — the constitution names the account, the account names
  // the group, the group names its members — and on the connection this gets
  // opened on that is several seconds of a screen that must not look empty,
  // because an empty custody account and an unread one look identical.
  view.innerHTML = `
    <p class="y-eyebrow">Reading the chain</p>
    <div class="card">
      <p class="muted small">Asking <code>x/constitution</code> which account the foundation is,
        then asking that account who its custodians are. Nothing below is drawn until both
        answer, so that a blank screen never gets to mean "empty".</p>
    </div>`;

  await syncClock();
  // `ME` is a query parameter, so it is escaped even though it is only ever a
  // custodian's name: the value is whatever was in the link somebody was sent.
  document.getElementById('who').innerHTML = ME
    ? `<span class="pill p-brass">acting as ${esc(ME)}</span>`
    : '<span class="pill p-mute">read only</span>';

  try {
    if (path.startsWith('#/proposal/')) await screenProposal(path.slice(11));
    else if (path === '#/proposals') await screenProposals();
    else if (path === '#/propose') await screenPropose();
    else await screenFoundation();
    // The chain's height, not the browser's clock, because that is what the
    // page's deadlines were computed against.
    document.getElementById('clock').textContent =
      `chain time ${new Date(chainNow * 1000).toUTCString().slice(17, 22)} UTC`;
    setBanner(stallBanner());
  } catch (e) {
    setBanner(stallBanner() + failureBanner(e));
    document.getElementById('clock').textContent = '';
    view.innerHTML = `<p class="empty">This screen could not be built, so nothing below it was
      attempted. Treat the foundation's state as unknown rather than as empty — an account that
      renders blank looks identical to one that has been emptied.</p>`;
  }
}

window.addEventListener('hashchange', route);
route();

// Polled slowly, and not at all when nobody is looking.
//
// A custodian leaves this open for a week, and almost nothing here changes
// faster than that: the voting period is seven days. The proposals screen costs
// three transaction searches per refresh to rebuild the executed-proposal
// history, and the node serving it may be a Raspberry Pi with under two
// gigabytes of memory — so a tab left open in the background should not spend
// that all day. The propose screen never refreshes, because reloading it would
// discard a half-typed proposal.
setInterval(() => {
  if (document.hidden) return;
  if (location.hash.startsWith('#/propose')) return;
  route();
}, 60000);

// Catching up the moment somebody looks, so the slow poll is not felt.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && !location.hash.startsWith('#/propose')) route();
});
</script>
</body>
</html>
