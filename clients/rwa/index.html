<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yamale Vehicles</title>
    <meta
      name="description"
      content="Real-world-asset vehicles on Yamale: what each one is over, what protects a holder, and what a holding is earning."
    />
    <link rel="icon" type="image/svg+xml" href="/mark.svg" />
    <meta name="theme-color" content="#12253f" />
    <!--
      Typefaces in the document head rather than through an @import in the
      stylesheet, so the request starts as soon as the parser reaches this line
      instead of after a stylesheet has been fetched and parsed. Every stack in
      yamale.css names real fallbacks, so a blocked font host degrades to
      something chosen rather than to Times.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
