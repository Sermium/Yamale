<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Yamale Pay</title>
    <meta name="description" content="Hold and watch money on Yamale. Your recovery phrase never leaves this page." />
    <link rel="icon" type="image/svg+xml" href="/mark.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#12253f" />
    <!-- iOS ignores the manifest; these are what make it open standalone there. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Yamale" />
    <link rel="apple-touch-icon" href="mark.svg" />
    <!--
      Typefaces in the document head rather than through an @import in the
      stylesheet, so the request starts as soon as the parser reaches this line
      instead of after a stylesheet has been fetched and parsed. Plex carries
      the interface and its Arabic companion carries ar; Archivo carries the
      display line. Every stack in yamale.css names real fallbacks, so a blocked
      font host degrades to something chosen rather than to Times.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
