<!--
  Oversight: what x/enforcement has frozen, what it refuses, and where
  x/netting's settlement window stands.

  These are the two mechanisms on this chain that have never had an interface.
  That matters differently for each. Enforcement is the most politically
  sensitive thing the chain does — a state can freeze and then take a citizen's
  money — and until now there was no way to see it, audit it, or demonstrate
  that it is constrained. Netting is the settlement plumbing a central bank
  asks about first. Both were built and tested and invisible, and a constraint
  nobody can see is not a constraint anybody is relying on.

  WHO THIS IS FOR, AND WHAT THAT DECIDES

  A supervisor, a journalist, a central bank's operations desk, and the person
  whose account has been frozen. None of them holds a key that matters here and
  all of them need the same thing: the ability to check. So this console reads
  and never writes. See oversight.js SIGNING for the per-message reasoning —
  the short version is that every authority in x/enforcement is a validator
  operator key or an x/group policy account, and a freeze button in a web page
  collapses an office's procedure into a click nobody can audit afterwards.

  THE EMPTY STATE IS THE DESIGN

  There are no cases on this chain, no freezes, and netting is switched off, so
  an empty page is what a visitor gets today — and an empty page that renders
  perfectly while the queries behind it are failing is a failure this project
  has already had. Every panel therefore distinguishes three things that look
  identical on a blank screen: nothing has happened, the chain did not answer,
  and this console cannot read that. The panels also fail independently: a
  netting query that errors must not blank the enforcement half.

  What fills the space instead is the arithmetic. The asymmetry at the top is
  computed from the live validator set and the live threshold parameter, not
  asserted, because the claim that one validator can stop money and two thirds
  are needed to take it is the product — and a page that asserts it without
  showing the numbers is asking to be believed.

  Deliberately one file plus three modules, no build step, like the land,
  governance, foundation and validator consoles. This gets opened when
  something is wrong.
-->
<style>
  /* ==========================================================================
     THE SHARED VISUAL SYSTEM — copied from clients/shared/yamale.css.
     THE CANONICAL COPY LIVES THERE. Do not evolve this block on its own.

     Inlined rather than linked because this console is deliberately one file
     with no build step: it gets opened when something is wrong, often on a bad
     connection, and a page that needs a second request before it can say
     whether a proposal has been carried out is a page that will render as
     unstyled text at the moment it matters.

     The declarations below are byte-identical to that file, in the same order,
     so a change there is a mechanical paste into all four consoles —
     clients/foundation, clients/governance, clients/land, clients/validator —
     rather than a hunt. Only the long reasoning comments are left behind; they
     stay in the canonical file so there is one place to read them.
     ========================================================================== */

  :root {
    --font-display: Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --font-sans: 'IBM Plex Sans', 'IBM Plex Sans Arabic', system-ui, -apple-system,
      'Segoe UI', Roboto, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

    --step--1: 0.8125rem;
    --step-0: 0.9375rem;
    --step-1: 1.0625rem;
    --step-2: 1.25rem;
    --step-3: clamp(1.4rem, 2.2vw, 1.6rem);
    --step-4: clamp(1.75rem, 3.2vw, 2.15rem);
    --step-5: clamp(2.1rem, 4.6vw, 3rem);
    --step-6: clamp(2.5rem, 6vw, 3.9rem);

    --sp-1: 0.25rem;
    --sp-2: 0.5rem;
    --sp-3: 0.75rem;
    --sp-4: 1rem;
    --sp-5: 1.5rem;
    --sp-6: 2rem;
    --sp-7: 3rem;
    --sp-8: 4.5rem;

    --radius: 5px;
    --radius-lg: 8px;
    --measure: 68ch;

    --navy: #12253f;
    --ink: #0b1523;
    --brass: #a87b3c;
    --paper: #f6f7f9;
    --mist: #e3e7ee;
    --slate: #5c6e88;

    --bg: var(--paper);
    --surface: #ffffff;
    --surface-2: #f1f4f8;
    --surface-3: #e9eef5;
    --border: var(--mist);
    --rule: #d3dae6;

    --text: var(--ink);
    --text-muted: #526178;
    --text-faint: #8798af;
    --accent: var(--navy);
    --accent-ink: #ffffff;
    --focus: #1f6feb;

    --ok: #0c6d42;
    --warn: #a8791b;
    --bad: #ac2924;
    --wash-ok: rgba(13, 122, 74, .10);
    --wash-warn: rgba(168, 121, 27, .12);
    --wash-bad: rgba(176, 42, 37, .10);
    --wash-mute: rgba(92, 110, 136, .10);
    --wash-brass: rgba(168, 123, 60, .12);

    /* Brass and amber are brand colours before they are type, and as type neither
       clears 4.5:1 in the light palette. Measured in a browser at 1600px:
       3.77:1 for a brass link on white, 3.31:1 for a brass chip on its own wash,
       3.38:1 for an amber chip on its own. Darkened along the same hue rather
       than replaced, and used only where the colour carries words — a border or a
       rule at 3.3:1 is doing a different job and reads correctly there. The dark
       palette needs no equivalent: both already pass, also measured. */
    --brass-ink: #78582b;
    --warn-ink: #795814;

    --shadow-1: 0 1px 2px rgba(11, 21, 35, .06), 0 1px 1px rgba(11, 21, 35, .04);
    --shadow-2: 0 2px 6px rgba(11, 21, 35, .07), 0 8px 24px rgba(11, 21, 35, .05);
  }

  /* Only tokens are redefined for dark — never a component rule, because a
     colour whose sole definition sits inside a media query never applies in the
     un-stamped state. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --bg: var(--ink);
      --surface: #101f34;
      --surface-2: #162943;
      --surface-3: #1d3352;
      --border: #24405f;
      --rule: #2c4a6b;

      --text: #e8eef7;
      --text-muted: #8fa4c4;
      --text-faint: #6b83a6;
      --accent: #4d8fd6;
      --accent-ink: #08111d;
      --brass: #c49856;
      --focus: #6ea8ff;

      --ok: #6fbfa5;
      --warn: #d2a65e;
      --bad: #ef8a85;
      --wash-ok: rgba(111, 191, 165, .12);
      --wash-warn: rgba(210, 166, 94, .14);
      --wash-bad: rgba(239, 138, 133, .13);
      --wash-mute: rgba(143, 164, 196, .12);
      --wash-brass: rgba(196, 152, 86, .16);
      --brass-ink: #c79d5e;
      --warn-ink: var(--warn);

      --shadow-1: 0 1px 2px rgba(0, 0, 0, .35);
      --shadow-2: 0 2px 8px rgba(0, 0, 0, .4), 0 12px 32px rgba(0, 0, 0, .3);
    }
  }

  :root[data-theme='dark'] {
    --bg: var(--ink);
    --surface: #101f34;
    --surface-2: #162943;
    --surface-3: #1d3352;
    --border: #24405f;
    --rule: #2c4a6b;

    --text: #e8eef7;
    --text-muted: #8fa4c4;
    --text-faint: #6b83a6;
    --accent: #4d8fd6;
    --accent-ink: #08111d;
    --brass: #c49856;
    --focus: #6ea8ff;

    --ok: #6fbfa5;
    --warn: #d2a65e;
    --bad: #ef8a85;
    --wash-ok: rgba(111, 191, 165, .12);
    --wash-warn: rgba(210, 166, 94, .14);
    --wash-bad: rgba(239, 138, 133, .13);
    --wash-mute: rgba(143, 164, 196, .12);
    --wash-brass: rgba(196, 152, 86, .16);
    --brass-ink: #c79d5e;
    --warn-ink: var(--warn);

    --shadow-1: 0 1px 2px rgba(0, 0, 0, .35);
    --shadow-2: 0 2px 8px rgba(0, 0, 0, .4), 0 12px 32px rgba(0, 0, 0, .3);
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: var(--step-0);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  h1, h2, h3, h4 {
    font-family: var(--font-display);
    font-weight: 600;
    line-height: 1.12;
    letter-spacing: -0.018em;
    text-wrap: balance;
    margin: 0;
  }

  h1 { font-size: var(--step-6); }
  h2 { font-size: var(--step-4); }
  h3 { font-size: var(--step-2); letter-spacing: -0.01em; }
  h4 { font-size: var(--step-1); letter-spacing: 0; }

  p { margin: 0; max-width: var(--measure); }

  code, kbd, samp, pre, .y-mono, .y-addr, .y-num {
    font-family: var(--font-mono);
    font-feature-settings: 'zero' 1;
  }
  .y-num, .y-tabular, td.y-num, th.y-num {
    font-variant-numeric: tabular-nums;
  }
  /* Tabular digits align a column only if the column is aligned. `.y-num` gave
     the digits equal width and left every cell ragged against a left edge, so a
     cap and the amount remaining under it could not be compared down the page —
     which is the only reason to put figures in a column at all.
     Scoped to table cells on purpose: `.y-num` is also on inline spans in four
     consoles, and right-aligning a number inside a sentence would be wrong. */
  td.y-num, th.y-num { text-align: end; }
  .y-addr { word-break: break-all; font-size: 0.88em; }

  .y-eyebrow {
    font-family: var(--font-mono);
    font-size: var(--step--1);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--brass-ink);
  }

  .y-label {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .y-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-1);
  }

  .y-chip {
    display: inline-flex;
    align-items: center;
    gap: var(--sp-1);
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 0.2rem 0.45rem;
    border-radius: 3px;
    white-space: nowrap;
  }
  .y-chip--ok { background: var(--wash-ok); color: var(--ok); }
  .y-chip--warn { background: var(--wash-warn); color: var(--warn-ink); }
  .y-chip--bad { background: var(--wash-bad); color: var(--bad); }
  .y-chip--mute { background: var(--wash-mute); color: var(--text-muted); }
  .y-chip--brass { background: var(--wash-brass); color: var(--brass-ink); }

  .y-scroll { overflow-x: auto; }

  :where(a, button, input, select, textarea, summary, [tabindex]):focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
    border-radius: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }

  /* ==========================================================================
     INFORMATION DESIGN — copied from clients/shared/yamale.css, same as the block
     above. The reasoning for each pattern is in that file; what is here is the
     declarations, byte-identical and in the same order.
     ========================================================================== */

  /* --- The figures a reader came for, before the prose explaining them ----- */

  .y-kpis {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr));
    gap: var(--sp-3);
    margin: var(--sp-4) 0 var(--sp-5);
  }

  .y-kpi {
    padding: var(--sp-3) var(--sp-4);
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    border-inline-start: 3px solid var(--rule);
  }
  .y-kpi--ok   { border-inline-start-color: var(--ok); }
  .y-kpi--warn { border-inline-start-color: var(--warn); }
  .y-kpi--bad  { border-inline-start-color: var(--bad); }
  .y-kpi--mute { border-inline-start-color: var(--text-faint); }

  .y-kpi__label {
    margin: 0;
    font-size: var(--step--1);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .y-kpi__value {
    margin: var(--sp-1) 0 0;
    font-size: var(--step-2);
    line-height: 1.15;
    font-variant-numeric: tabular-nums;
    /* A figure NEVER breaks across lines. `overflow-wrap: anywhere` shipped once
       and rendered 100,000,000 as "100,000,0" above "00" — a number split in two
       is not a smaller number, it is a different one. The unit may drop; the
       digits may not. */
    white-space: normal;
    word-break: keep-all;
    overflow-wrap: normal;
  }
  .y-kpi__unit { margin-inline-start: 0.3em; font-size: var(--step-0); color: var(--text-muted); }

  /* Where a figure's limit goes. Some are exact and some are not, and a band
     that spoke about all of them in one voice would claim a precision the chain
     does not have. Clamped, because a paragraph under every tile makes the band
     taller than the content it introduces. */
  .y-kpi__hint {
    margin: var(--sp-2) 0 0;
    font-size: var(--step--1);
    color: var(--text-muted);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* --- Folders, because one scrolling column is not a document ------------- */

  .y-folders {
    display: flex;
    flex-wrap: wrap;
    gap: var(--sp-1);
    border-bottom: 1px solid var(--rule);
    margin-bottom: var(--sp-4);
  }
  .y-folder {
    appearance: none;
    background: none;
    border: 1px solid transparent;
    border-bottom: none;
    border-radius: var(--radius) var(--radius) 0 0;
    padding: var(--sp-2) var(--sp-4);
    font: inherit;
    font-size: var(--step--1);
    color: var(--text-muted);
    cursor: pointer;
    /* The open folder sits ON the rule rather than above it, so the area below
       reads as the inside of the folder rather than as a separate box. */
    margin-bottom: -1px;
  }
  .y-folder:hover { color: var(--text); }
  .y-folder[aria-selected='true'], .y-folder--on {
    background: var(--surface);
    border-color: var(--rule);
    border-bottom: 1px solid var(--surface);
    color: var(--text);
    font-weight: 600;
  }
  .y-folder__count { margin-inline-start: 0.45em; font-variant-numeric: tabular-nums; color: var(--text-faint); }

  /* --- Data tables that can actually be read ------------------------------ */

  .y-data { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .y-data th {
    text-align: start;
    font-size: var(--step--1);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 600;
    padding: var(--sp-2) var(--sp-3) var(--sp-2) 0;
    border-bottom: 1px solid var(--rule);
    white-space: nowrap;
  }
  .y-data td {
    padding: var(--sp-2) var(--sp-3) var(--sp-2) 0;
    border-bottom: 1px solid var(--rule);
    vertical-align: baseline;
  }
  /* Numbers right, words left.
     `padding-inline-end: 0` used to be unconditional here, which is right only
     for a LAST column: three numeric columns in the governance table are not
     last, and an id ran straight into the title beside it ("20A supply ceiling
     for the dollar"). The trailing padding is dropped only where there is
     nothing after it. */
  .y-data .num, .y-data th.num { text-align: end; }
  .y-data td.num:last-child, .y-data th.num:last-child { padding-inline-end: 0; }
  .y-data tbody tr:hover { background: var(--surface-2); }
  .y-data__self td { font-weight: 600; }
  .y-data caption {
    caption-side: bottom;
    text-align: start;
    padding-top: var(--sp-2);
    font-size: var(--step--1);
    color: var(--text-muted);
  }

  /* Wide content scrolls INSIDE its own box; the page never scrolls sideways. */
  .y-scrollx { overflow-x: auto; }

  /* --- A proportion, drawn ------------------------------------------------- */

  .y-ring { width: 100%; height: auto; max-width: 15rem; }
  .y-ring__track { stroke: var(--surface-2); }

  .y-split {
    display: grid;
    grid-template-columns: minmax(9rem, 15rem) 1fr;
    gap: var(--sp-5);
    align-items: start;
  }
  @media (max-width: 40rem) { .y-split { grid-template-columns: 1fr; } }

  .y-swatch {
    display: inline-block;
    width: 0.7em; height: 0.7em;
    border-radius: 2px;
    margin-inline-end: 0.5em;
    vertical-align: baseline;
  }

  /* ==========================================================================
     THIS CONSOLE.

     Everything below is scoped to this page and kept OUT of the shared file.
     The theming rule the shared block establishes is followed here too and is
     worth restating because breaking it has shipped on this project before:
     every colour gets its full LIGHT definition on bare :root, and the dark
     blocks redefine TOKENS ONLY. A colour whose sole definition sits inside a
     media query or a [data-theme] block renders one theme's text on the other
     theme's ground in the un-stamped, system-preference state.
     ========================================================================== */

  /* ------------------------------------------- where the contrast repair went

     This console used to carry four ink tokens of its own — --brass-ink,
     --warn-ink, --mute-ink and --ok-ink — because four of the shared palette's
     colours did not clear 4.5:1 in the LIGHT theme at chip and eyebrow sizes,
     and a shared palette change did not belong in one page. Measured then,
     compositing each wash against what is really behind it rather than treating
     it as opaque, which is the mistake that reported 1.00 on this project once:

        .y-chip--brass  (--brass on --wash-brass)       3.31 : 1
        .y-chip--warn   (--warn on --wash-warn)         3.38 : 1
        .y-chip--mute   (--text-muted on --wash-mute)   4.28 : 1
        .y-chip--ok     (--ok on --wash-ok)             4.39 : 1

     The shared file has since fixed all four, and the block above is that fix:
     --brass-ink and --warn-ink are shared tokens now, and --text-muted and --ok
     were darkened at source, which removes the need for --mute-ink and --ok-ink
     entirely. Re-measured against the shared values on the darkest light ground
     the page uses (--surface-3), every one of the four now clears: brass 4.94,
     amber 4.94, muted 4.79, ok 4.82.

     So the local copies are gone. Keeping them as well would be two rules for
     one decision, and the next person would fix the one that is not rendering.
     `.y-eyebrow`, `.y-chip--warn`, `.y-chip--brass`, `.y-chip--mute` and
     `.y-chip--ok` all take their colour from the shared block above now.

     One warning kept from what stood here, because it cost two diagnoses: a
     comment terminator written by accident inside a paragraph like this one
     closes the comment early, and everything after it becomes CSS the parser
     discards up to the next block — which last time was the :root that defined
     these very tokens, so the documented fix was the one thing not applied. */

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 var(--sp-5) var(--sp-8);
  }

  /* --------------------------------------------------------------- header */

  header.top {
    border-bottom: 1px solid var(--rule);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .top__in {
    max-width: 1180px;

    flex-wrap: wrap;

  .brand a { color: inherit; text-decoration: none; }
  .brand a:hover { text-decoration: underline; }
  .brand {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: var(--step-1);
    letter-spacing: -0.02em;
    margin-right: auto;
  }
  /* --brass-ink, not --brass: the wordmark's second word is display type on

  .brand span { color: var(--brass-ink); }

  .top__meta {
    display: flex;
    align-items: center;
    gap: var(--sp-3);
    flex-wrap: wrap;
    font-family: var(--font-mono);

  }

  .btn {
    font-family: var(--font-mono);
    font-size: var(--step--1);
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.3rem 0.6rem;
    cursor: pointer;
  }
  .btn:hover { background: var(--surface-3); }

  /* ----------------------------------------------------------------- tabs */

  nav.tabs {
    display: flex;
    gap: var(--sp-1);
    border-bottom: 1px solid var(--rule);
    margin: 0 0 var(--sp-6);
    padding-top: var(--sp-5);

  }
  .tab {
    appearance: none;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-muted);
    font-family: var(--font-sans);
    font-size: var(--step-0);
    font-weight: 500;
    padding: var(--sp-2) var(--sp-4);
    cursor: pointer;
    white-space: nowrap;
  }
  .tab[aria-selected='true'] {
    color: var(--text);
    border-bottom-color: var(--brass);
  }

  /* --------------------------------------------------------------- layout */

  section.block { margin-bottom: var(--sp-7); }
  section.block > h2 { margin-bottom: var(--sp-2); }
  section.block > p.lede {
    color: var(--text-muted);
    margin-bottom: var(--sp-4);
    max-width: var(--measure);
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-1);
    padding: var(--sp-4) var(--sp-5);
  }
  .card + .card { margin-top: var(--sp-3); }

  .grid {
    display: grid;
    gap: var(--sp-3);
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  }

  .muted { color: var(--text-muted); }
  .small { font-size: var(--step--1); }
  .mono { font-family: var(--font-mono); }

  /* ------------------------------------------------------------ the hero */
  /* The asymmetry. Two facts side by side, because the whole point is the gap
     between them, and a reader who has to scroll from one to the other has to
     hold the first in their head to see it. */

  .asym {
    display: grid;
    gap: var(--sp-3);
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  }
  .asym__cell {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--rule);
    border-radius: var(--radius);
    box-shadow: var(--shadow-1);
    padding: var(--sp-4) var(--sp-5);
  }
  .asym__cell--stop { border-left-color: var(--warn); }
  .asym__cell--take { border-left-color: var(--bad); }

  .asym__n {
    font-family: var(--font-display);
    font-size: var(--step-5);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
    margin: var(--sp-2) 0 var(--sp-1);
  }
  .asym__cell--stop .asym__n { color: var(--warn); }
  .asym__cell--take .asym__n { color: var(--bad); }
  .asym__u { font-size: var(--step-1); color: var(--text-muted); font-weight: 500; }

  /* The digit-group gap, drawn rather than typed. See bigAmount() for the
     measurement that made this necessary. */
  .grp { display: inline-block; width: 0.26em; }

  /* ---------------------------------------------------------- power meter */

  .meter {
    position: relative;
    height: 20px;
    background: var(--surface-3);
    border-radius: 3px;
    overflow: hidden;
    margin: var(--sp-2) 0;
  }
  .meter__seg {
    position: absolute;
    top: 0;
    bottom: 0;
    border-right: 1px solid var(--surface);
  }
  .meter__mark {
    position: absolute;
    top: -4px;
    bottom: -4px;
    width: 2px;
    background: var(--text);
    z-index: 2;
  }
  .meter__wrap { position: relative; padding-top: 6px; }
  .meter__marklabel {
    position: absolute;
    top: -2px;
    transform: translateX(-50%);
    font-family: var(--font-mono);
    font-size: 0.62rem;
    letter-spacing: 0.06em;
    color: var(--text);
    white-space: nowrap;
  }

  /* A vote bar: yes / no / abstain against the bar the chain applies. */
  .vote { position: relative; height: 14px; background: var(--surface-3); border-radius: 3px; overflow: hidden; }
  .vote__yes { position: absolute; top: 0; bottom: 0; left: 0; background: var(--ok); }
  .vote__no { position: absolute; top: 0; bottom: 0; background: var(--bad); }
  .vote__abstain { position: absolute; top: 0; bottom: 0; background: var(--text-faint); }

  /* ---------------------------------------------------------- empty state */
  /* The most important component on the page today, and the one most likely to
     be mistaken for a bug. It says what IS true, not what is missing. */

  .empty {
    background: var(--surface-2);
    border: 1px dashed var(--rule);
    border-radius: var(--radius);
    padding: var(--sp-4) var(--sp-5);
  }
  .empty h4 { margin-bottom: var(--sp-1); }
  .empty p { color: var(--text-muted); font-size: var(--step--1); }
  .empty p + p { margin-top: var(--sp-2); }

  /* A failed read is NOT an empty state and must never look like one. */
  .failed {
    background: var(--wash-bad);
    border: 1px solid var(--bad);
    border-radius: var(--radius);
    padding: var(--sp-3) var(--sp-4);
    color: var(--text);
  }
  /* `/blockchain.enforcement.v1.Query/SeizureWindow` is 45 unbroken characters
     — about 351px of mono at this size, which takes a 375px layout sideways on
     its own. Found by watching the devnet 503 on a phone-width viewport, and
     worth recording HOW: an element-rectangle scan does not catch it, because
     overflowing text does not widen its block's box. Compare
     documentElement.scrollWidth against clientWidth instead. */
  .failed .why { font-family: var(--font-mono); font-size: var(--step--1); color: var(--bad);
    overflow-wrap: anywhere; }

  .notice {
    background: var(--wash-warn);
    border-left: 3px solid var(--warn);
    border-radius: var(--radius);
    padding: var(--sp-3) var(--sp-4);
  }
  .notice--bad { background: var(--wash-bad); border-left-color: var(--bad); }
  .notice--ok { background: var(--wash-ok); border-left-color: var(--ok); }

  /* --------------------------------------------------------------- tables */

  table { border-collapse: collapse; width: 100%; font-size: var(--step--1); }
  th {
    text-align: left;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 500;
    padding: var(--sp-2) var(--sp-3) var(--sp-2) 0;
    border-bottom: 1px solid var(--rule);
    white-space: nowrap;
  }
  td {
    padding: var(--sp-3) var(--sp-3) var(--sp-3) 0;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  tr:last-child td { border-bottom: none; }

  /* -------------------------------------------------------------- refusals */

  .refusal {
    border-left: 3px solid var(--ok);
    padding: var(--sp-1) 0 var(--sp-1) var(--sp-4);
    margin-bottom: var(--sp-4);
  }
  .refusal--soft { border-left-color: var(--text-faint); }
  .refusal h4 { margin-bottom: var(--sp-1); }
  .refusal p { font-size: var(--step--1); color: var(--text-muted); }
  .refusal .pin { margin-top: var(--sp-2); }
  /* A file path and a type URL contain no spaces, so on a narrow screen they
     take the whole layout sideways with them — measured at 375px, where the
     document scrolled to 392px on the strength of one keeper path. These are
     reference strings rather than data to be compared by eye, so breaking them
     mid-token costs nothing; the addresses that DO get compared keep their own
     .y-addr treatment. */
  .refusal .pin span, .small.mono { overflow-wrap: anywhere; }

  /* ---------------------------------------------------------------- lookup */

  .lookup { display: flex; gap: var(--sp-2); flex-wrap: wrap; margin-bottom: var(--sp-3); }
  .lookup input {
    flex: 1 1 320px;
    min-width: 0;
    font-family: var(--font-mono);
    font-size: var(--step--1);
    padding: 0.45rem 0.6rem;
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .lookup input::placeholder { color: var(--text-faint); }

  /* ---------------------------------------------------------------- misc */

  dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: var(--sp-2) var(--sp-4); margin: 0; }
  dl.facts dt { font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--text-muted); }
  dl.facts dd { margin: 0; font-size: var(--step--1); }

  code.cmd {
    display: block;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: var(--sp-2) var(--sp-3);
    font-size: var(--step--1);
    overflow-x: auto;
    white-space: pre;
  }

  footer.foot {
    border-top: 1px solid var(--rule);
    margin-top: var(--sp-8);
    padding-top: var(--sp-4);
    color: var(--text-muted);
    font-size: var(--step--1);
  }

  [hidden] { display: none !important; }

  /* --- local additions to the shared information-design block --------------
     Kept here and labelled rather than pushed into clients/shared/yamale.css,
     because neither has a second consumer yet.

     A KPI whose honest answer is a phrase — "none", "not read", "nothing" —
     set at the size of a seizure total makes an ordinary week look like an
     event, and on this page "not read" set large would shout the one thing
     that is not a measurement at all.

     The blind-spots table is three columns of sentences rather than figures,
     so its cells need a top baseline and a measure. Left alone they inherit
     the shared baseline alignment, which puts three paragraphs of different
     lengths on one invisible line and makes the row impossible to read
     across. */
  .y-kpi__value--words { font-size: var(--step-1); letter-spacing: -0.01em; }


  .y-data td { vertical-align: top; }
  .y-data td.small, .y-data td .small { max-width: 32rem; }

  @media (max-width: 640px) {
    .wrap { padding-left: var(--sp-4); padding-right: var(--sp-4); }
    .top__in { padding-left: var(--sp-4); padding-right: var(--sp-4); }
    dl.facts { grid-template-columns: 1fr; gap: var(--sp-1) 0; }
    dl.facts dd { margin-bottom: var(--sp-2); }
  }

  /* ========================================================================== */
  /*  THE MOBILE SHELL                                                          */
  /* ========================================================================== */
  /*
   * A phone on a desk, for every surface a PERSON uses.
   *
   * Yamale Pay was designed as a phone and is the one surface here nobody has
   * complained about. The rest were laid out as dashboards — folders, KPI bands,
   * wide tables — which is the right shape for somebody supervising a registry at
   * a desk and the wrong one for somebody checking what they own on the way to
   * work. This is Pay's shape, extracted so the others can wear it.
   *
   * # Why a frame and not just a narrow column
   *
   * The frame is the point. It says "this is what a citizen holds", and it stops
   * a reader comparing a payments app to a web page and finding it sparse. A
   * 390-pixel column floating in a white browser looks unfinished; the same
   * column in a phone on a dark desk looks like a product.
   *
   * On an actual phone the conceit is dropped entirely — below 430px the frame
   * becomes the page. A device drawing a picture of a device is a joke that costs
   * screen height on the screen that has least.
   *
   * # What this does NOT replace
   *
   * The operator consoles. A foundation custodian reconciling a seizure, a
   * registrar walking a pedigree, a supervisor reading forty-one executions: none
   * of that belongs in a 390-pixel column, and forcing it there would be the same
   * mistake in the other direction. Those keep .y-folders and .y-data.
   *
   * Pay itself is deliberately untouched and keeps its own copy. It was designed
   * first, the user asked for it to be left alone, and re-pointing a working
   * surface at a new abstraction to save duplication is how a working surface
   * stops working.
   */

  /* The desk. Fixed navy in both themes on purpose: a phone photographed on white
     reads as a screenshot of a website rather than as a device. */
  .y-stage {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 var(--sp-4) var(--sp-6);
    background: linear-gradient(160deg, #12253f, #0b1523);
  }

  /* Ink chosen against the desk, never against the page ground, and declared at
     :root rather than inside a media query — a colour defined only under
     prefers-color-scheme is undefined in the un-stamped state most readers are
     actually in. */
  :root {
    --desk-ink: #e8eef7;
    --desk-ink-mute: #a9bcd4;
    --stage-w: 1060px;
  }

  .y-stage__bar {
    width: 100%;
    max-width: var(--stage-w);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-4);
    padding: var(--sp-4) var(--sp-1) var(--sp-5);
    color: var(--desk-ink);
  }
  .y-stage__bar a { color: inherit; text-decoration: none; }
  .y-stage__title {
    font-family: var(--font-mono);
    font-size: var(--step--1);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--desk-ink-mute);
  }

  .y-phone {
    width: 390px;
    height: 780px;
    max-height: 92vh;
    background: var(--bg);
    border-radius: 38px;
    border: 10px solid #05090f;
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.45);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .y-phone__notch {
    position: absolute;
    inset-inline-start: 50%;
    transform: translateX(-50%);
    top: 0;
    width: 140px;
    height: 24px;
    background: #05090f;
    border-end-start-radius: 14px;
    border-end-end-radius: 14px;
    z-index: 5;
  }
  .y-phone__screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    color: var(--text);
    overflow: hidden;
  }

  @media (max-width: 430px) {
    /* Below the frame's own width there is no room for a conceit. */
    .y-stage { padding: 0; }
    .y-stage__bar { display: none; }
    .y-phone {
      width: 100%;
      max-height: none;
      height: 100vh;
      height: 100dvh;
      border: 0;
      border-radius: 0;
    }
    .y-phone__notch { display: none; }
  }

  /* --- the bar at the top of the screen --- */

  .y-appbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-2);
    /* The top padding clears the notch. */
    padding: 2.2rem var(--sp-4) var(--sp-3);
    border-bottom: 1px solid var(--rule);
    background: var(--surface);
  }
  .y-appbar__mark { flex: 0 0 auto; margin-inline-end: var(--sp-2); }
  .y-appbar__eyebrow {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .y-appbar__name { font-weight: 600; }
  .y-appbar__right {
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    margin-inline-start: auto;
  }

  /* --- one screen, one job --- */

  .y-screen {
    flex: 1;
    overflow-y: auto;
    padding: var(--sp-4) var(--sp-4) var(--sp-5);
  }
  .y-screen__title {
    font-family: var(--font-display);
    font-size: var(--step-2);
    letter-spacing: -0.01em;
    margin: var(--sp-1) 0 var(--sp-4);
    text-wrap: balance;
  }
  .y-screen__sub {
    font-size: var(--step-1);
    font-family: var(--font-display);
    margin: var(--sp-5) 0 var(--sp-1);
  }
  .y-screen__lede {
    color: var(--text-muted);
    margin: calc(var(--sp-4) * -1) 0 var(--sp-4);
  }

  /* --- the bar at the bottom --- */

  .y-tabbar {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    border-top: 1px solid var(--rule);
    background: var(--surface);
    padding-bottom: var(--sp-2);
  }
  .y-tab {
    font: inherit;
    font-size: var(--step--1);
    background: none;
    border: 0;
    color: var(--text-muted);
    padding: var(--sp-2) var(--sp-1);
    cursor: pointer;
    display: grid;
    justify-items: center;
    gap: 0.18rem;
    text-decoration: none;
  }
  .y-tab__icon { width: 20px; height: 20px; }
  /* The label shrinks on a 390px screen and must not vanish. An unlabelled glyph
     is a guess, and a wrong guess on these surfaces spends money. */
  .y-tab__label { font-size: 0.62rem; line-height: 1.1; }
  .y-tab--on { color: var(--accent); box-shadow: inset 0 2px 0 var(--brass); }

  /* --- a card, which is what a table becomes on a phone --- */

  .y-cards { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--sp-2); }
  .y-card {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 14px;
    box-shadow: var(--shadow-1);
    padding: var(--sp-4);
  }
  /* A brass edge marks the row that is about money, which is the one a reader is
     looking for. */
  .y-card--money { border-inline-start: 3px solid var(--brass); }
  .y-card--danger { border-color: var(--bad); }
  .y-card__head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: var(--sp-2);
  }
  .y-card__amount {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: var(--step-2);
    font-weight: 500;
    /* A number never breaks across two lines. See the note on .y-kpi__value. */
    white-space: normal;
    word-break: keep-all;
    overflow-wrap: normal;
  }
  .y-card__note { color: var(--text-muted); font-size: var(--step--1); margin: var(--sp-1) 0 0; }

  /* A row that leads somewhere, which on a phone is most rows. */
  .y-row {
    display: flex;
    align-items: center;
    gap: var(--sp-3);
    width: 100%;
    text-align: start;
    font: inherit;
    color: inherit;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: var(--sp-3) var(--sp-4);
    cursor: pointer;
    text-decoration: none;
  }
  .y-row:hover { background: var(--surface-2); }
  .y-row__main { flex: 1; min-inline-size: 0; }
  .y-row__title { font-weight: 600; }
  .y-row__sub { color: var(--text-muted); font-size: var(--step--1); }
  .y-row__end { text-align: end; flex: 0 0 auto; }
  .y-row__chev { color: var(--text-faint); flex: 0 0 auto; }
</style>
</head>
<body>

<header class="top">
  <div class="top__in">
    <div class="brand"><a href="/" title="Retour à Yamale" style="display:inline-flex;align-items:center;gap:.5rem"><img src="/mark.svg" alt="" width="20" height="20" style="border-radius:5px;display:block;flex:none" onerror="this.style.display='none'">Yamale</a> <span>·</span> Oversight</div>
    <div class="top__meta" id="meta">
      <span class="y-chip y-chip--mute" id="chip-chain">reading…</span>
    </div>
    <button class="btn" id="theme" type="button">Theme</button>
  </div>
</header>

<div class="wrap">
  <nav class="tabs" role="tablist" aria-label="Mechanism">
    <button class="tab" role="tab" id="tab-enf" aria-selected="true" aria-controls="view-enf" type="button">
      Freezing and seizing
    </button>
    <button class="tab" role="tab" id="tab-net" aria-selected="false" aria-controls="view-net" type="button">
      Tiered settlement
    </button>
  </nav>

  <!-- Drawn rather than left blank. "Nothing is frozen" and "this page has not
       read the chain yet" are opposite facts that look identical on an empty
       screen. -->
  <div id="boot" class="empty">
    <h4>Reading the chain</h4>
    <p>Nothing below is drawn until x/enforcement and x/netting answer. An empty page
      is not an answer.</p>
  </div>

  <main id="view-enf" role="tabpanel" aria-labelledby="tab-enf" hidden></main>
  <main id="view-net" role="tabpanel" aria-labelledby="tab-net" hidden></main>

  <footer class="foot">
    <p>Read over ABCI at <code id="foot-rpc" class="mono"></code>, unauthenticated, with no key
      and no account. This console cannot sign anything — see “who may sign what”.</p>
  </footer>
</div>

<script type="module">
import * as C from './chain.js';
import * as O from './oversight.js';
import { CYCLE_STATUS, DENOM_STATUS } from './proto.js';

// ---------------------------------------------------------------------------
// Where the node is.
//
// Overridable with ?rpc= so this page can be pointed at a local node or a
// different network. A console with the endpoint compiled in reads one chain
// and claims to be reading whichever one you opened it against.
// ---------------------------------------------------------------------------
const RPC = new URLSearchParams(location.search).get('rpc') || C.DEFAULT_RPC;
document.getElementById('foot-rpc').textContent = RPC;
const opts = { rpc: RPC };

const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;');

const $ = (id) => document.getElementById(id);

/** An address, shown whole in a monospace face. These get compared by eye and
 *  copied into commands; truncating one to look tidy is how somebody freezes
 *  the wrong account. */
const addr = (a) => a
  ? `<span class="y-addr mono">${esc(a)}</span>`
  : '<span class="muted">—</span>';

const chip = (tone, text) => `<span class="y-chip y-chip--${tone}">${esc(text)}</span>`;

/**
 * A grouped number for the display face, with the group gap drawn rather than
 * typed.
 *
 * MEASURED: the narrow no-break space that groups digits everywhere else is
 * 0.165 em wide in Archivo and 0.50 em in IBM Plex Mono. In a table at 13px
 * that is a visible gap; in the hero at 46px it is 4.7px against a 28.6px
 * digit, which reads as no gap at all — so the single most important number on
 * the page, the voting power needed to take somebody's money, was rendering as
 * an unbroken run of six digits.
 *
 * Fixed by making the separator an element with an em-relative width instead of
 * a character, so it is the same fraction of the type size in any face. The
 * data function keeps returning the real space: this is a rendering concern and
 * belongs here, not in oversight.js.
 */
const bigAmount = (n) => esc(O.amount({ amount: String(n) }))
  .split(O.GROUP_SEPARATOR)
  .join('<span class="grp"></span>');

/**
 * A read that failed, rendered as a failure.
 *
 * Never as an empty state. The distinction is the whole reason this console is
 * trustworthy: a supervisor who cannot tell "nothing is frozen" from "the
 * query did not answer" has learned nothing by opening the page.
 */
function failure(what, err) {
  const kind = {
    unreachable: 'The node could not be reached.',
    http: 'The node answered with an HTTP error.',
    rpc: 'The node refused the query.',
    abci: 'The module refused the query.',
    decode: 'The answer could not be decoded.',
  }[err && err.kind] || 'The query failed.';
  return `<div class="failed">
    <h4>${esc(what)} could not be read.</h4>
    <p class="small">${esc(kind)} This is not the same as “there is nothing to show”, and
      this console will not pretend it is.</p>
    <p class="why">${esc(err && err.message ? err.message : String(err))}</p>
  </div>`;
}

/**
 * The banner on a panel whose answer is real but no longer fresh.
 *
 * It names the height the answer was actually read at, because "a while ago"
 * is not a unit anybody can act on and the height is the chain's own clock.
 */
function staleNote(read) {
  if (!read || !read.stale) return '';
  return `<div class="notice" style="margin-bottom:var(--sp-3)">
    <strong>Read at height ${esc(String(read.at))}, and not since.</strong>
    <p class="small" style="margin-top:var(--sp-1)">The node has stopped answering this query, so
      what follows is the last answer it gave rather than a statement about now. It is kept
      because losing it to one refused request would be worse — but it is not current, and on this
      page that distinction is the point.</p>
    <p class="why small mono" style="margin-top:var(--sp-1);color:var(--bad)">${
      esc(read.staleError && read.staleError.message ? read.staleError.message : '')}</p>
  </div>`;
}

// ---------------------------------------------------------------------------
// State.
// ---------------------------------------------------------------------------

const state = {
  status: null,
  validators: [],
  secondsPerBlock: 0,
  reads: {},
  tab: 'enf',
  // Which folder is open in each mechanism. Held here rather than read off the
  // DOM because both panels are re-rendered wholesale every thirty seconds, and
  // a folder that sprang back to the default each half minute would move the
  // page under a supervisor mid-sentence.
  folder: { enf: 'asymmetry', net: 'window' },
};

// ---------------------------------------------------------------------------
// The figures.
//
// A band of numbers at the top of each mechanism, above the argument that
// explains them. Every tile is one chain read, and the three states this whole
// console exists to keep apart are kept apart in the band as well: a query that
// failed, a query that answered with nothing, and an answer that is no longer
// fresh are three different tiles. A band that printed 0 for all three would be
// the exact failure the rest of the page is built to prevent.
// ---------------------------------------------------------------------------

/**
 * One tile.
 *
 * `value` carries the digits and nothing else; `unit` is separate and set
 * small, so a narrow column drops the unit rather than splitting the number.
 * `words` is for a tile whose honest answer is not a figure — "none", "not
 * read" — which must not be set at the size of a seizure total.
 */
function kpi({ label, value, unit, hint, tone, words }) {
  return `<div class="y-kpi${tone ? ` y-kpi--${tone}` : ''}">
      <p class="y-kpi__label">${esc(label)}</p>
      <p class="y-kpi__value${words ? ' y-kpi__value--words' : ''}">${value}${
        unit ? `<span class="y-kpi__unit">${esc(unit)}</span>` : ''}</p>
      ${hint ? `<p class="y-kpi__hint">${hint}</p>` : ''}
    </div>`;
}

/**
 * A tile whose figure comes from one read, with that read's state in it.
 *
 * `figure(read.value)` is only ever called on a read that succeeded. A failed
 * read never reaches it: the tile says "not read", takes the bad edge, and
 * names what could not be answered — because on this page the difference
 * between "no account is frozen" and "the freeze register did not answer" is
 * the difference between a supervisor being informed and being misled.
 */
function kpiRead(read, { label, figure, missing }) {
  if (!read || !read.ok) {
    return kpi({
      label, tone: 'bad', value: 'not read', words: true,
      hint: `${esc(missing)} This tile is the absence of an answer, not a count of nothing.`,
    });
  }
  const f = figure(read.value);
  return kpi({
    label,
    tone: read.stale ? 'warn' : f.tone,
    value: f.value, unit: f.unit, words: f.words,
    hint: read.stale
      ? `<strong>Read at height ${esc(String(read.at))}, and not since.</strong> ${f.hint}`
      : f.hint,
  });
}

// ---------------------------------------------------------------------------
// Folders.
//
// Each mechanism was one column of six sections, so reading what the chain
// refuses meant scrolling past every case it has ever opened. These are areas a
// supervisor chooses between; the panes are all rendered and only hidden, so
// switching costs nothing and never re-reads the chain.
// ---------------------------------------------------------------------------

function folders(group, panes) {
  const open = panes.some((p) => p.id === state.folder[group]) ? state.folder[group] : panes[0].id;
  state.folder[group] = open;
  return `<div class="y-folders" role="tablist" aria-label="Areas">
      ${panes.map((p) => `<button type="button" role="tab" class="y-folder${
        p.id === open ? ' y-folder--on' : ''}" aria-selected="${p.id === open}"
        data-folder-group="${esc(group)}" data-folder="${esc(p.id)}"
        >${esc(p.label)}${p.count === undefined || p.count === null ? ''
          : ` <span class="y-folder__count">${esc(String(p.count))}</span>`}</button>`).join('')}
    </div>
    ${panes.map((p) => `<div data-folder-group="${esc(group)}" data-folder="${esc(p.id)}"
      role="tabpanel"${p.id === open ? '' : ' hidden'}>${p.html}</div>`).join('')}`;
}

function applyFolder(group) {
  for (const el of document.querySelectorAll(`[data-folder-group="${group}"]`)) {
    const on = el.dataset.folder === state.folder[group];
    if (el.getAttribute('role') === 'tab') {
      el.setAttribute('aria-selected', String(on));
      el.classList.toggle('y-folder--on', on);
    } else {
      el.hidden = !on;
    }
  }
}

// Delegated, and installed once: both panels are replaced every thirty seconds,
// and a handler bound to a button that has since been thrown away is a folder
// that stops opening after the first refresh.
document.addEventListener('click', (e) => {
  const btn = e.target.closest?.('[data-folder-group][role="tab"]');
  if (!btn) return;
  const group = btn.dataset.folderGroup;
  state.folder[group] = btn.dataset.folder;
  try { localStorage.setItem(`yamale.oversight.folder.${group}`, btn.dataset.folder); } catch {
    /* private window */
  }
  applyFolder(group);
});

/**
 * The measured block interval.
 *
 * Two block timestamps a thousand blocks apart, divided. Measured rather than
 * assumed, because every duration this page states is derived from it, and an
 * assumed five-second block turns "your account is frozen for another 12
 * hours" into a number nobody checked.
 */
async function measureBlockInterval(height) {
  const span = Math.min(1000, Math.max(1, height - 2));
  const [a, b] = await Promise.all([
    C.blockTime(height - span, RPC), C.blockTime(height - 1, RPC),
  ]);
  if (!a || !b) return 0;
  const secs = (Date.parse(b) - Date.parse(a)) / 1000 / (span - 1);
  return Number.isFinite(secs) && secs > 0 ? secs : 0;
}

function renderMeta() {
  const s = state.status;
  if (!s) {
    $('meta').innerHTML = chip('bad', 'the node did not answer');
    return;
  }
  const secs = state.secondsPerBlock;
  $('meta').innerHTML = [
    chip('brass', s.chainId),
    `<span>height <strong class="y-num">${esc(String(s.height))}</strong></span>`,
    secs ? `<span>${esc(secs.toFixed(2))}s per block, measured</span>` : '',
    s.catchingUp ? chip('warn', 'node is catching up') : '',
  ].filter(Boolean).join('');
}

// ---------------------------------------------------------------------------
// The asymmetry. The most important thing on the page.
// ---------------------------------------------------------------------------

function asymmetryHtml(params) {
  const c = O.seizureCoalition(state.validators, params.threshold_bps);
  const total = c.totalPower;

  // Each validator drawn as a segment of the bonded total, with the threshold
  // marked where the chain applies it. This is what turns "two thirds" from a
  // phrase into something a reader can see two validators failing to reach
  // separately and reaching together.
  let acc = 0;
  const segs = state.validators.map((v, i) => {
    const left = total > 0 ? (acc / total) * 100 : 0;
    const width = total > 0 ? (v.power / total) * 100 : 0;
    acc += v.power;
    const tone = i === 0 ? 'var(--accent)' : 'var(--slate)';
    return `<span class="meter__seg" style="left:${left}%;width:${width}%;background:${tone}"
      title="${esc(v.address)} — ${esc(String(v.power))}"></span>`;
  }).join('');

  const markPct = Math.min(100, c.thresholdBps / 100);

  const seizeLine = c.minimumToSeize === null
    ? 'No combination of the current validator set reaches the threshold.'
    : c.largestCanSeizeAlone
      ? `<strong>One validator alone holds enough power to reach it.</strong>
         The threshold is doing less work than it looks like it is doing, and that is a
         fact about this validator set rather than about the module.`
      : `The smallest group that could reach it is
         <strong>${esc(String(c.minimumToSeize))} of ${esc(String(c.validators))}</strong>
         — taking the largest first, which is the most favourable arithmetic a
         coalition could hope for.`;

  return `
  <section class="block">
    <p class="y-eyebrow">The asymmetry</p>
    <h2>One signature stops money. Taking it needs two thirds.</h2>
    <p class="lede">Everything below is computed from the validator set and the threshold
      parameter this chain is running right now, not from a description of how the module
      is supposed to work.</p>

    <div class="asym">
      <div class="asym__cell asym__cell--stop">
        <p class="y-label">To stop money moving</p>
        <div class="asym__n">${esc(String(c.toFreeze))} <span class="asym__u">signature${c.toFreeze === 1 ? '' : 's'}</span></div>
        <p class="small muted">Any one bonded validator can open a case, and opening a case
          freezes the target in the same block. So can a holder of the enforcement authority
          role for the country the account is recorded in. The freeze is provisional: it lapses
          by itself after ${esc(String(params.provisional_freeze_blocks))} blocks
          ${estimate(params.provisional_freeze_blocks)} unless the validators confirm it, and it
          can never take anything.</p>
      </div>
      <div class="asym__cell asym__cell--take">
        <p class="y-label">To take it</p>
        <div class="asym__n">${bigAmount(c.required)}
          <span class="asym__u">of ${bigAmount(total)}</span></div>
        <p class="small muted">${esc(O.bpsPercent(c.thresholdBps))} of the voting power bonded when
          the case opened — measured against the bonded total, not against whoever turned up to
          vote, because “most of those who voted” is a bar two validators clear on a quiet night.
          ${seizeLine}</p>
      </div>
    </div>

    <div class="card" style="margin-top:var(--sp-3)">
      <p class="y-label">Bonded voting power, and where the bar sits</p>
      <div class="meter__wrap">
        <span class="meter__marklabel" style="left:${markPct}%">${esc(O.bpsPercent(c.thresholdBps))}</span>
        <div class="meter">
          ${segs}
          <span class="meter__mark" style="left:${markPct}%"></span>
        </div>
      </div>
      <div class="y-scroll">
        <table>
          <thead><tr><th>Validator</th><th class="y-num">Power</th><th class="y-num">Share</th>
            <th>Alone, could it…</th></tr></thead>
          <tbody>${state.validators.map((v) => {
            const share = total > 0 ? Math.round((v.power * 10000) / total) : 0;
            return `<tr>
              <td>${addr(v.address)}</td>
              <td class="y-num mono">${esc(O.amount({ amount: String(v.power) }))}</td>
              <td class="y-num mono">${esc(O.bpsPercent(share))}</td>
              <td>${chip('warn', 'freeze — yes')}
                  ${v.power >= c.required ? chip('bad', 'seize — yes') : chip('ok', 'seize — no')}</td>
            </tr>`;
          }).join('')}</tbody>
        </table>
      </div>
      <p class="small muted" style="margin-top:var(--sp-3)">Consensus voting power, read from the
        node at height ${esc(String(state.status ? state.status.height : '—'))}. The module measures a
        case against the power bonded at the moment that case opened, so a case opened today would
        use these figures; a case opened last week carries its own.</p>
    </div>
  </section>`;
}

function estimate(blocks) {
  const d = O.blocksAsDuration(blocks, state.secondsPerBlock);
  return d ? `(${esc(d)})` : '';
}

function freezesHtml(read, params) {
  if (!read.ok) return failure('The list of frozen accounts', read.error);
  const list = read.value.freeze || [];
  const h = state.status ? state.status.height : 0;

  if (!list.length) {
    return `<div class="empty">
      <h4>No account is frozen.</h4>
      <p>The chain answered at height ${esc(String(read.at))} and returned an empty freeze
        register. That is a positive answer, not a missing one: this panel is drawn from
        <code class="mono">ListFreeze</code>, which enumerates every freeze the module holds.</p>
      <p>If an account were frozen it would appear here with the case that froze it, the height
        it was frozen at, and how long it has left before it lapses on its own.</p>
    </div>`;
  }

  return `<div class="y-scroll"><table>
    <thead><tr><th>Account</th><th>Under case</th><th class="y-num">Frozen at</th>
      <th>Lapses</th></tr></thead>
    <tbody>${list.map((f) => {
      const cd = O.freezeCountdown(f, h, state.secondsPerBlock);
      const left = cd.permanent
        ? `${chip('bad', 'permanent')} <span class="small muted">A case passed, so this freeze
            no longer expires by itself.</span>`
        : cd.lapsed
          ? `${chip('warn', 'due to lift')} <span class="small muted">Past height
              ${esc(String(f.expires_at_height))}; the end blocker lifts it at or before this block.</span>`
          : `<strong class="y-num mono">${esc(O.amount({ amount: String(cd.blocksLeft) }))}</strong>
             blocks <span class="small muted">${esc(O.blocksAsDuration(cd.blocksLeft, state.secondsPerBlock) || '')}</span>`;
      return `<tr>
        <td>${addr(f.address)}</td>
        <td>${O.freezeHasCase(f)
          ? `<span class="mono">case ${esc(String(f.case_id))}</span>`
          : `${chip('bad', 'no case')} <span class="small muted">Case ids start at 1, so a
              zero here means this freeze names no case at all.</span>`}</td>
        <td class="y-num mono">${esc(String(f.frozen_at_height))}</td>
        <td>${left}</td>
      </tr>`;
    }).join('')}</tbody></table></div>`;
}

function caseCard(c, params) {
  const s = O.caseStanding(c, params);
  const w = (bps) => `${Math.min(100, bps / 100)}%`;
  const markPct = Math.min(100, s.thresholdBps / 100);

  const verdict = s.met
    ? chip('bad', 'threshold reached')
    : !s.reachable
      ? chip('ok', 'threshold no longer reachable')
      : chip('warn', `short by ${O.amount({ amount: String(s.shortBy) })}`);

  return `<div class="card">
    <div style="display:flex;gap:var(--sp-3);align-items:baseline;flex-wrap:wrap">
      <h3>Case ${esc(String(c.id))}</h3>
      ${chip(O.statusTone(c.status), O.statusName(c.status))}
      ${chip(c.action === 2 ? 'bad' : 'warn', O.actionName(c.action))}
      ${c.emergency ? chip('bad', 'emergency') : ''}
    </div>
    <dl class="facts" style="margin-top:var(--sp-3)">
      <dt>Against</dt><dd>${addr(c.target)}</dd>
      <dt>Opened by</dt><dd>${addr(c.opener)}</dd>
      <dt>Opened at</dt><dd class="mono">height ${esc(String(c.opened_at_height))}</dd>
      <dt>Voting ends</dt><dd class="mono">height ${esc(String(c.voting_ends_at_height))}</dd>
      ${c.reason ? `<dt>Stated grounds</dt><dd>${esc(c.reason)}</dd>` : ''}
      ${c.evidence_uri ? `<dt>Evidence</dt><dd class="y-addr mono">${esc(c.evidence_uri)}</dd>` : ''}
      ${c.execute_at_height ? `<dt>Executes at</dt><dd class="mono">height
        ${esc(String(c.execute_at_height))} ${estimate(c.execute_at_height - (state.status ? state.status.height : 0))}</dd>` : ''}
      ${(c.assessed_value || []).length ? `<dt>Assessed</dt><dd class="mono">${
        c.assessed_value.map((x) => esc(O.amount(x))).join(', ')}</dd>` : ''}
      ${(c.recovered || []).length ? `<dt>Taken</dt><dd class="mono">${
        c.recovered.map((x) => esc(O.amount(x))).join(', ')}</dd>` : ''}
    </dl>

    <div style="margin-top:var(--sp-4)">
      <div style="display:flex;justify-content:space-between;gap:var(--sp-3);flex-wrap:wrap">
        <span class="y-label">Against the two-thirds bar</span>${verdict}
      </div>
      <div class="meter__wrap">
        <span class="meter__marklabel" style="left:${markPct}%">${esc(O.bpsPercent(s.thresholdBps))}</span>
        <div class="vote" style="margin-top:8px">
          <span class="vote__yes" style="width:${w(s.yesBps)}"></span>
          <span class="vote__no" style="left:${w(s.yesBps)};width:${w(s.noBps)}"></span>
          <span class="vote__abstain" style="left:${w(s.yesBps + s.noBps)};width:${w(s.abstainBps)}"></span>
          <span class="meter__mark" style="left:${markPct}%"></span>
        </div>
      </div>
      <p class="small muted">
        ${esc(O.amount({ amount: String(s.yes) }))} for,
        ${esc(O.amount({ amount: String(s.no) }))} against,
        ${esc(O.amount({ amount: String(s.abstain) }))} abstaining, of
        ${esc(O.amount({ amount: String(s.total) }))} bonded when the case opened.
        ${esc(O.amount({ amount: String(s.required) }))} is needed.
        ${!s.reachable && !s.met
          ? ' Enough power has been spent against or abstained that the bar can no longer be reached — the chain rejects a case at this point rather than letting it run.'
          : ''}</p>
    </div>
  </div>`;
}

function casesHtml(open, held, all, recovered, params) {
  if (!open.ok) return failure('Open enforcement cases', open.error);

  const live = open.value.case || [];
  const waiting = held.ok ? (held.value.case || []) : [];
  const everOpened = recovered.ok ? Number(recovered.value.cases_opened) : null;

  if (!live.length && !waiting.length) {
    const history = all.ok ? (all.value.case || []) : [];
    const never = everOpened === 0;
    return `<div class="empty">
      <h4>${never ? 'No enforcement case has ever been opened on this chain.'
                   : 'No case is open.'}</h4>
      <p>The chain answered at height ${esc(String(open.at))}.
        ${everOpened === null ? ''
          : `<code class="mono">Recovered</code> reports
             <strong>${esc(String(everOpened))}</strong> case${everOpened === 1 ? '' : 's'} opened
             and <strong>${esc(String(recovered.value.cases_passed))}</strong> passed since genesis.`}
        ${history.length ? `The register holds ${esc(String(history.length))} closed
          case${history.length === 1 ? '' : 's'}, listed below.` : ''}</p>
      <p>Nothing has been seized: the recovery total is
        ${recovered.ok && (recovered.value.total || []).length
          ? esc(recovered.value.total.map((t) => O.amount(t)).join(', '))
          : 'empty'}.
        ${never ? 'The machinery below has never been exercised on this network, which is worth '
                + 'knowing when reading the parameters as a promise.' : ''}</p>
    </div>${history.length ? `<div style="margin-top:var(--sp-3)">${
      history.map((c) => caseCard(c, params)).join('')}</div>` : ''}`;
  }

  return [
    waiting.length ? `<div class="notice notice--bad" style="margin-bottom:var(--sp-3)">
      <strong>${esc(String(waiting.length))} seizure${waiting.length === 1 ? ' has' : 's have'}
      been decided and ${waiting.length === 1 ? 'is' : 'are'} waiting out the delay.</strong>
      <p class="small">Nothing has moved yet. Until the execution height passes, the decision can
      still be undone at no cost to anybody — that window is what the delay is for.</p></div>` : '',
    ...waiting.map((c) => caseCard(c, params)),
    ...live.map((c) => caseCard(c, params)),
  ].join('');
}

    </dl>

      <table>

          <td class="mono">${esc(d.denom)}</td>

        </tr>`).join('')}
        ${h.uncapped.map((u) => `<tr>
          <td class="mono">${esc(u.denom)} ${chip('warn', 'no value cap')}</td>
          <td class="y-num mono">${esc(O.amount({ amount: u.seized }))}</td>
          <td colspan="2" class="small muted">This currency is not named in the cap, so it is
            limited only by the count of seizures — which binds every currency, including one
            issued after the parameters were last set.</td>
        </tr>`).join('')}</tbody>
      </table>
    </div>
    <p class="small muted" style="margin-top:var(--sp-3)">Rolling, not periodic. A window that reset

      carried out rather than when it is decided — so a decision that would breach the cap is

  </div>`;
}
