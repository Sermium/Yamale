      </div>
      ${r.pinNote ? `<p class="small" style="margin-top:var(--sp-1)">${esc(r.pinNote)}</p>` : ''}
    </div>`).join('');
}

/**
 * What this console cannot show, and which kind of "cannot" it is.
 *
 * The most dangerous thing a supervisory screen can do is let an absence pass
 * for an answer. Three of those absences are visible elsewhere on this page as
 * footnotes under the panel that happens to be affected, which is where a
 * reader finds them only if they were already looking. They are facts about
 * what this console can and cannot know, so they are stated together, as a
 * structure, in a folder of their own.
 *
 * Each row says what is not visible, why it is not, and — the part that makes
 * it useful rather than an apology — where it can be got instead. "Nowhere"
 * is an acceptable answer and is given as one.
 *
 * Every entry here is checked against the module source, not against the
 * documentation. An invented limit is as misleading as a hidden one.
 */
const BLIND_SPOTS = {
  enforcement: [
    {
      what: 'A freeze that has already been lifted.',
      why: 'The freeze register holds live freezes only. unfreeze() removes the record in all '
        + 'three cases: a provisional freeze lapsing in the end blocker, a case resolving without '
        + 'a seizure, and governance reversing one. An account frozen for a week and released '
        + 'leaves no row in it.',
      where: 'The case register, which keeps every case including the resolved ones — every '
        + 'freeze on this chain is imposed with a case. And the block events: EventCaseOpened at '
        + 'the height it was imposed, EventFreezeLifted at the height it was lifted.',
      cite: 'x/enforcement/keeper/keeper.go — unfreeze()',
    },
    {
      what: 'What became of seized funds after they arrived.',
      why: 'x/enforcement records what it took and where it sent it. It has no record of what '
        + 'the recovery destination did next, because that is not its business — the destination '
        + 'is a 3-of-5 custody account and paying restitution out of it is its own decision, with '
        + 'its own signatures.',
      where: 'The foundation console, which reads that account and rebuilds its payment history '
        + 'from the transaction log.',
      cite: 'x/enforcement/keeper/execute.go',
    },
    {
      what: 'Whether the bar drawn on the bonded total above is the bar a past case faced.',
      why: 'It is not. A case is measured against the power bonded at the moment it opened, and '
        + 'carries that total in its own record. The chart above is what a case opened right now '
        + 'would face, computed from the validator set as it is at this height.',
      where: 'Each case card states its own denominator, which is the one the chain applied.',
      cite: 'x/enforcement/keeper/msg_server_case.go',
    },
  ],
  netting: [
    {
      what: 'The list of participants.',
      why: 'x/netting\'s query service has no call that enumerates them. Every query it offers '
        + 'about a participant takes one as an argument, so this console can answer about an '
        + 'address you name and cannot produce the set.',
      where: 'Nowhere, over this interface. The approvals are held by the module that grants '
        + 'them, not by x/netting.',
      cite: 'proto/blockchain/netting/v1/query.proto',
    },
    {
      what: 'Whether an address is an approved participant at all.',
      why: 'The position query answers about balances. An address with no collateral posted and '
        + 'an address that was never approved produce the same empty answer, and nothing in the '
        + 'response distinguishes them.',
      where: 'Nowhere, over this interface — which is why the lookup on this page says so in '
        + 'place of an answer rather than reporting "no position".',
      cite: 'proto/blockchain/netting/v1/query.proto — Position',
    },
    {
      what: 'Why a held slice is still held.',
      why: 'The reason recorded is the one from the first failure. A retry that fails again does '
        + 'not overwrite it, so the text describes why the slice was held originally and not why '
        + 'it is held now.',
      where: 'The events emitted at each retry, at the cycle boundaries since.',
      cite: 'x/netting/keeper',
    },
  ],
};

function blindSpotsHtml(module) {
  const rows = BLIND_SPOTS[module] ?? [];
  return `<div class="card">
    <p class="lede">These are absences, not empty results.</p>
    <p class="small muted">Everything else on this page is something the chain answered. Each of
      the following is something it does not hold, or does not distinguish, or does not publish
      over this interface — and a screen that let any of them render as "nothing to show" would
      have told a supervisor the opposite of the truth.</p>
    <div class="y-scroll" style="margin-top:var(--sp-4)">
      <table class="y-data">
        <thead><tr><th>Not visible here</th><th>Why</th><th>Where it can be got</th></tr></thead>
        <tbody>${rows.map((r) => `<tr>
          <td><strong>${esc(r.what)}</strong>
            <p class="small muted mono" style="margin-top:var(--sp-1)">${esc(r.cite)}</p></td>
          <td class="small">${esc(r.why)}</td>
          <td class="small">${esc(r.where)}</td>
        </tr>`).join('')}</tbody>
      </table>
    </div>
  </div>`;
}

function signingHtml(module) {
  const rows = O.SIGNING.filter((s) => s.type.includes(`.${module}.`));
  return rows.map((s) => `<div class="card">
    <div style="display:flex;gap:var(--sp-2);align-items:baseline;flex-wrap:wrap">
      <code class="mono">${esc(s.type.split('.').pop())}</code>
      ${chip(s.decision === 'propose' ? 'brass' : 'mute',
        s.decision === 'propose' ? 'governance proposal' : 'command, not a button')}
      <span class="small muted mono">signer: ${esc(s.signer)}</span>
    </div>
    <p class="small" style="margin-top:var(--sp-2)"><strong>${esc(s.who)}</strong></p>
    <p class="small muted" style="margin-top:var(--sp-1)">${esc(s.why)}</p>
    <code class="cmd" style="margin-top:var(--sp-2)">${esc(s.command)}</code>
  </div>`).join('');
}

// ---------------------------------------------------------------------------
// Settlement.
// ---------------------------------------------------------------------------

function nettingHtml(reads) {
  const { netParams, cycle, slices } = reads;
  if (!netParams.ok) return failure('The netting parameters', netParams.error);
  if (!cycle.ok) return failure('The current settlement cycle', cycle.error);

  const params = netParams.value.params;
  const cy = cycle.value.cycle;
  const held = slices.ok ? (slices.value.held || []) : [];
  const h = state.status ? state.status.height : 0;

  const w = O.nettingWindowState({
    params, cycle: cy, closesAtHeight: cycle.value.closes_at_height, held, height: h,
  });

  const tone = { off: 'notice', open: 'notice notice--ok', held: 'notice notice--bad', stalled: 'notice notice--bad' }[w.state];

  const banner = `<div class="${tone}">
    <h3>${esc(w.headline)}</h3>
    <p class="small" style="margin-top:var(--sp-2)">${esc(w.detail)}</p>
    ${w.state === 'stalled' ? `<p class="small" style="margin-top:var(--sp-2)">
      Open for <strong class="y-num">${esc(String(w.stalledForBlocks))}</strong> blocks and counting.
      ${w.trappedDenoms.length ? `Trapped: <span class="mono">${esc(w.trappedDenoms.join(', '))}</span>.` : ''}
      ${w.frozenHeldSlices ? `${esc(String(w.frozenHeldSlices))} held slice(s) are no longer being retried.` : ''}
      </p>` : ''}
  </div>`;

  // The gap this console exists partly to make visible. Shown whether or not
  // the chain is currently in it, because a reader needs to know the console
  // would catch it — a warning that only ever appears when it is too late is a
  // warning nobody has calibrated.
  const gap = `<div class="card" style="margin-top:var(--sp-3)">
    <p class="y-label">The state this console is watching for</p>
    <p class="small muted" style="margin-top:var(--sp-2)">Setting <code class="mono">cycle_blocks</code>
      to zero makes the end blocker return before it closes anything. If it is set to zero while a
      window has obligations in it, that window never settles, held slices stop being retried, and
      every participant in it has an exposure with no settlement date until a second proposal passes.
      This is recorded as an open question in <code class="mono">docs/scope/gaps.md</code> and is
      deliberately undecided — the choice is between refusing the proposal and closing the window
      immediately, and it is a settlement-policy call.</p>
    <p class="small muted" style="margin-top:var(--sp-2)">The detection is not the obvious one. An end
      height in the past is not evidence: when netting is off the query reports zero rather than a
      computed height, and when it is on, shortening the cycle mid-window legitimately produces a
      height already passed. What separates a stall from a clean shutdown is whether the frozen window
      has anything trapped in it.</p>
    <p class="small" style="margin-top:var(--sp-2)">${w.state === 'stalled'
      ? `${chip('bad', 'the chain is in this state')}`
      : w.state === 'off'
        ? `${chip('ok', 'not in this state')} Netting is off and the open window holds no
           obligations, so nothing is trapped.`
        : `${chip('ok', 'not in this state')} Netting is running.`}</p>
  </div>`;

  const cycleCard = `<div class="card">
    <dl class="facts">
      <dt>Cycle</dt><dd class="mono">${esc(String(cy.id))}
        ${chip(Number(cy.status) === 1 ? 'ok' : Number(cy.status) === 3 ? 'bad' : 'mute',
          O.cycleStatusName(cy.status))}
        <span class="small muted">Cycle ids start at 1; cycle 1 exists from genesis and is never
          handed out by the sequence.</span></dd>
      <dt>Opened at</dt><dd class="mono">height ${esc(String(cy.opened_at_height))}</dd>
      <dt>Closes at</dt><dd class="mono">${cycle.value.closes_at_height
        ? `height ${esc(String(cycle.value.closes_at_height))}`
        : `<span class="muted">— netting is off, so the query reports no closing height rather than
           computing one</span>`}</dd>
      <dt>Cycle length</dt><dd class="mono">${params.cycle_blocks
        ? `${esc(String(params.cycle_blocks))} blocks ${estimate(params.cycle_blocks)}`
        : '<span class="muted">0 — netting disabled</span>'}</dd>
    </dl>
    ${(cy.outcomes || []).length ? `<div class="y-scroll" style="margin-top:var(--sp-3)">
      <table><thead><tr><th>Currency</th><th>State</th><th class="y-num">Gross</th>
        <th class="y-num">Net</th><th class="y-num">Obligations</th><th>Why held</th></tr></thead>
        <tbody>${cy.outcomes.map((o) => `<tr>
          <td class="mono">${esc(o.denom)}</td>
          <td>${chip(Number(o.status) === 3 ? 'bad' : Number(o.status) === 2 ? 'ok' : 'mute',
            O.denomStatusName(o.status))}</td>
          <td class="y-num mono">${esc(O.amount({ amount: o.gross_amount }))}</td>
          <td class="y-num mono">${esc(O.amount({ amount: o.net_amount }))}</td>
          <td class="y-num mono">${esc(String(o.obligation_count))}</td>
          <td class="small">${esc(o.hold_reason || '')}</td>
        </tr>`).join('')}</tbody></table></div>`
      : `<div class="empty" style="margin-top:var(--sp-3)">
          <h4>No obligation has entered this window.</h4>
          <p>The cycle record holds no per-currency outcome, which means nothing has been submitted
            for netting into it. With netting off, every obligation submitted settles gross out of
            the sender's own balance instead, and takes no part in a cycle.</p>
        </div>`}
  </div>`;

  const policies = `<div class="card">
    <p class="y-label">Which currencies are netted</p>
    ${(params.denom_policies || []).length
      ? `<div class="y-scroll" style="margin-top:var(--sp-2)"><table>
          <thead><tr><th>Currency</th><th class="y-num">Gross above</th><th></th></tr></thead>
          <tbody>${params.denom_policies.map((p) => `<tr>
            <td class="mono">${esc(p.denom)}</td>
            <td class="y-num mono">${esc(O.amount({ amount: p.gross_threshold }))}</td>
            <td class="small muted">At or above this the payment settles one by one; below it, it
              joins the netting cycle.</td></tr>`).join('')}</tbody></table></div>`
      : `<div class="empty" style="margin-top:var(--sp-2)">
          <h4>No currency is configured for netting.</h4>
          <p>The parameter list is empty, so every payment settles gross. Enabling netting per
            currency is a deliberate decision: no policy means gross, and the chain will not infer
            one. The sender never chooses the tier — the chain decides from the policy and the
            amount, and reports which it used.</p>
        </div>`}
  </div>`;

  const heldCard = held.length
    ? `<div class="y-scroll"><table>
        <thead><tr><th class="y-num">Cycle</th><th>Currency</th><th class="y-num">Held since</th>
          <th>Reason given</th></tr></thead>
        <tbody>${held.map((s) => `<tr>
          <td class="y-num mono">${esc(String(s.cycle_id))}</td>
          <td class="mono">${esc(s.denom)}</td>
          <td class="y-num mono">${esc(String(s.held_since_height))}
            <span class="small muted">${esc(O.blocksAsDuration(h - s.held_since_height, state.secondsPerBlock) || '')} ago</span></td>
          <td class="small">${esc(s.reason)}</td>
        </tr>`).join('')}</tbody></table>
        <p class="small muted" style="margin-top:var(--sp-3)">The reason shown is the one recorded
          when the slice first failed. A retry that fails again does not overwrite it, so this text
          describes the original failure rather than the most recent one.</p></div>`
    : !slices.ok ? failure('Held settlement slices', slices.error)
    : `<div class="empty">
        <h4>No settlement slice is held.</h4>
        <p>The chain answered at height ${esc(String(slices.at))} with an empty held set — which is
          what a healthy chain shows. A slice is held when its currency's positions cannot be
          settled, most often because a participant's reserve does not cover what they owe.</p>
        <p>A held slice is retried unchanged at every cycle boundary. It is never recomputed,
          reassigned or cancelled, and there is no path that gives up on it.</p>
      </div>`;

  // The obligations that have actually entered the open window, summed across
  // currencies. Counted rather than assumed: an outcome list with entries and
  // an outcome list without them are the difference between a window that is
  // holding money and one that is not, and the banner above does not say which.
  const obligations = (cy.outcomes || [])
    .reduce((n, o) => n + Number(o.obligation_count || 0), 0);

  const band = `<div class="y-kpis">
    ${kpi({
      label: 'Current cycle', tone: Number(cy.status) === 3 ? 'bad' : 'mute',
      value: `#${esc(String(cy.id))}`, unit: O.cycleStatusName(cy.status),
      hint: `opened at height ${esc(String(cy.opened_at_height))}. ${cycle.value.closes_at_height
        ? `Closes at height ${esc(String(cycle.value.closes_at_height))}.`
        : 'Netting is off, so the query reports no closing height rather than computing one.'}`,
    })}
    ${kpi({
      label: 'Cycle length', tone: params.cycle_blocks ? 'ok' : 'warn',
      value: params.cycle_blocks ? esc(String(params.cycle_blocks)) : 'off',
      unit: params.cycle_blocks ? 'blocks' : '', words: !params.cycle_blocks,
      hint: params.cycle_blocks
        ? `${estimate(params.cycle_blocks)} between closes`
        : 'cycle_blocks is zero, so the end blocker returns before it closes anything and every '
          + 'payment settles gross out of the sender\'s own balance',
    })}
    ${kpi({
      label: 'Currencies netted', tone: (params.denom_policies || []).length ? 'ok' : 'mute',
      value: (params.denom_policies || []).length || 'none',
      words: !(params.denom_policies || []).length,
      hint: (params.denom_policies || []).length
        ? 'each with its own threshold, above which a payment settles gross instead'
        : 'no policy means gross, and the chain will not infer one',
    })}
    ${kpi({
      label: 'Obligations in this window', tone: obligations ? 'warn' : 'mute',
      value: obligations || 'none', words: !obligations,
      hint: obligations
        ? 'submitted for netting into the open cycle and not yet settled'
        : 'the cycle record holds no per-currency outcome, so nothing has been submitted into it',
    })}
    ${kpiRead(slices, {
      label: 'Held slices',
      missing: 'HeldSlices did not answer, so this console cannot say whether a currency\'s '
        + 'positions have failed to settle.',
      figure: (v) => {
        const n = (v.held || []).length;
        return {
          value: n || 'none', words: !n, tone: n ? 'bad' : 'ok',
          hint: n
            ? 'retried unchanged at every cycle boundary; nothing gives up on one'
            : 'an empty held set, which is what a healthy chain shows',
        };
      },
    })}
  </div>`;

  return `
    <section class="block">
      <p class="y-eyebrow">The settlement window</p>
      <h2>Where the cycle stands</h2>
      ${staleNote(netParams)}${staleNote(cycle)}
    </section>
    ${band}
    ${folders('net', [
      {
        // Not "Where the cycle stands" — that is the heading above the band and
        // a folder repeating it reads as the same thing twice.
        id: 'window', label: 'The window now',
        html: `<section class="block">${banner}${gap}</section>`,
      },
      {
        id: 'cycle', label: 'The current cycle',
        html: `<section class="block"><h2>The current cycle</h2>${cycleCard}</section>`,
      },
      {
        id: 'tiers', label: 'Tiers',
        count: (params.denom_policies || []).length,
        html: `<section class="block">
          <h2>Tiers</h2>
          <p class="lede">Two tiers, and the sender never picks. A payment at or above the
            threshold for its currency settles gross, immediately, out of the sender's own balance.
            Below it, the payment joins the cycle and settles net against everything else at the
            close.</p>
          ${policies}
        </section>`,
      },
      {
        id: 'collateral', label: 'Collateral and exposure',
        html: `<section class="block">
          <h2>Collateral and exposure</h2>
          <p class="lede">Collateral is posted before anything can be owed, and what a participant
            may owe is bounded by what they have posted. The cap is on the net position rather than
            on the individual payment.</p>
          <div class="card">
            <form class="lookup" id="pos-form">
              <input id="pos-input" type="text" spellcheck="false"
                placeholder="A participant address, to read their posted collateral and exposure"
                aria-label="Participant address">
              <button class="btn" type="submit">Read position</button>
            </form>
            <div id="pos-out"><p class="small muted">Nothing is read until an address is given.
              There is no participant directory in this module's query service, so this console
              cannot list them — it can only answer about one you name. That limit, and the two
              others like it, are set out under “Limits of this view”.</p></div>
          </div>
        </section>`,
      },
      {
        id: 'held', label: 'The day a window does not clear',
        count: slices.ok ? (slices.value.held || []).length : '?',
        html: `<section class="block">
          <h2>The day a window does not clear</h2>
          ${staleNote(slices)}${heldCard}
        </section>`,
      },
      {
        id: 'limits', label: 'Limits of this view',
        count: (BLIND_SPOTS.netting || []).length,
        html: `<section class="block">
          <h2>What the chain refuses</h2>
          ${refusalsHtml('netting')}
        </section>

        <section class="block">
          <h2>What this console cannot show you</h2>
          ${blindSpotsHtml('netting')}
        </section>

        <section class="block">
          <h2>Who may sign what</h2>
          <p class="lede">This console reads and never writes.</p>
          ${signingHtml('netting')}
        </section>`,
      },
    ])}`;
}

// Lookups.
// ---------------------------------------------------------------------------

async function lookupFreeze(address) {
  const out = $('frz-out');
  out.innerHTML = '<p class="small muted">Asking the chain…</p>';
  try {
    const { value, at } = await C.enforcement.freezeStatus(address, opts);
    if (!value.frozen) {
      out.innerHTML = `<div class="notice notice--ok">
        <strong>This account is not frozen.</strong>
        <p class="small" style="margin-top:var(--sp-1)">Answered at height ${esc(String(at))}.
          Note that the module always emits the freeze and case records alongside the answer, so a
          console reading their presence instead of the <code class="mono">frozen</code> flag would
          report every account as frozen. This one reads the flag.</p></div>`;
      return;
    }
    const cd = O.freezeCountdown(value.freeze, state.status.height, state.secondsPerBlock);
    out.innerHTML = `<div class="notice notice--bad">
      <strong>This account is frozen.</strong>
      <p class="small" style="margin-top:var(--sp-1)">Frozen at height
        ${esc(String(value.freeze.frozen_at_height))} under case
        ${esc(String(value.freeze.case_id))}.
        ${cd.permanent ? 'It does not expire by itself: a case has passed.'
          : `It lapses at height ${esc(String(value.freeze.expires_at_height))} —
             ${esc(String(cd.blocksLeft))} blocks
             ${esc(O.blocksAsDuration(cd.blocksLeft, state.secondsPerBlock) || '')}.`}</p>
      <p class="small" style="margin-top:var(--sp-1)">A frozen account cannot send. It can still be
        paid: the restriction blocks sending only.</p></div>
      ${value.case && Number(value.case.id) ? caseCard(value.case, state.reads.enfParams.value.params) : ''}`;
  } catch (e) {
    out.innerHTML = failure('The freeze status of that account', e);
  }
}

async function lookupPosition(participant) {
  const out = $('pos-out');
  out.innerHTML = '<p class="small muted">Asking the chain…</p>';
  try {
    const { value, at } = await C.netting.position(participant, opts);
    const rows = O.exposure(value.entries);
    if (!rows.length) {
      out.innerHTML = `<div class="empty">
        <h4>This address holds no netting position.</h4>
        <p>Answered at height ${esc(String(at))}. Either no collateral has been posted under it, or
          it is not an approved participant. Those are different facts and this query cannot tell
          them apart — the position query answers about balances, not about approval.</p></div>`;
      return;
    }
    out.innerHTML = `<div class="y-scroll"><table>
      <thead><tr><th>Currency</th><th class="y-num">Posted</th><th class="y-num">Committed</th>
        <th class="y-num">Free to withdraw</th><th class="y-num">Net position</th></tr></thead>
      <tbody>${rows.map((r) => (r.unreadable ? `<tr>
        <td class="mono">${esc(r.denom)}</td>
        <td colspan="4">${chip('bad', 'could not be read')}
          <span class="small muted">The chain returned an amount in this currency that is not a
          decimal integer. It is shown as unreadable rather than as zero — those are opposite
          answers to the only question this table is asked.</span></td>
      </tr>` : `<tr>
        <td class="mono">${esc(r.denom)}</td>
        <td class="y-num mono">${esc(O.amount({ amount: r.reserve }))}</td>
        <td class="y-num mono">${esc(O.amount({ amount: r.locked }))}
          <span class="small muted">${esc(O.bpsPercent(r.utilisationBps))}</span>
          ${r.fullyCommitted ? chip('bad', 'fully committed') : ''}</td>
        <td class="y-num mono">${esc(O.amount({ amount: r.available }))}</td>
        <td class="y-num mono">${esc(O.amount({ amount: r.net }))}
          ${r.owes ? chip('warn', 'owes') : ''}</td>
      </tr>`)).join('')}</tbody></table>
      <p class="small muted" style="margin-top:var(--sp-3)">Read at height ${esc(String(at))}.
        Committed collateral is released as a position improves, not at the close, so a participant
        whose counterparties pay them gets their headroom back immediately.</p></div>`;
  } catch (e) {
    out.innerHTML = failure('That participant\'s position', e);
  }
}

// ---------------------------------------------------------------------------
// Rendering.
// ---------------------------------------------------------------------------

/**
 * The state of the two registers, as figures, above the argument.
 *
 * Five reads, five tiles, and each tile carries the state of its own read. The
 * seizure count is the one that matters most and the one most easily
 * misreported: "0 of 3 this window" and "the window query did not answer" are
 * opposite facts about whether anybody could take anything today.
 */
function enforcementBand(r, params) {
  return `<div class="y-kpis">
    ${kpiRead(r.freezes, {
      label: 'Accounts frozen now',
      missing: 'ListFreeze did not answer, so this console cannot say whether any account is '
        + 'stopped from moving its own money.',
      figure: (v) => {
        const n = (v.freeze || []).length;
        return {
          value: n || 'none', words: !n, tone: n ? 'warn' : 'ok',
          hint: n
            ? 'each stopped from sending and still able to receive; a freeze never takes anything'
            : 'the register answered and holds no freeze order',
        };
      },
    })}
    ${kpiRead(r.open, {
      label: 'Cases open',
      missing: 'OpenCases did not answer, so this console cannot say whether anybody\'s funds are '
        + 'being voted on.',
      figure: (v) => {
        const n = (v.case || []).length;
        return {
          value: n || 'none', words: !n, tone: n ? 'bad' : 'ok',
          hint: n ? 'being voted on right now' : 'nobody\'s funds are being voted on',
        };
      },
    })}
    ${kpiRead(r.window, {
      label: 'Seizures this window',
      missing: 'SeizureWindow did not answer, so this console cannot say how much headroom the '
        + 'rolling cap has left — which is the figure that decides whether a seizure could be '
        + 'carried out at all today.',
      figure: (v) => {
        const h = O.windowHeadroom(v);
        return {
          value: String(h.count), unit: `of ${h.maxCount}`,
          tone: h.countExhausted ? 'bad' : 'ok',
          hint: `in the last ${esc(String(params.seizure_window_blocks))} blocks
            ${estimate(params.seizure_window_blocks)}, rolling. ${h.countExhausted
              ? 'Exhausted: a seizure decided now waits for the window to move.'
              : 'The count cap binds every currency, including one issued after the parameters '
                + 'were last set.'}`,
        };
      },
    })}
    ${kpiRead(r.recovered, {
      label: 'Cases ever opened',
      missing: 'Recovered did not answer, so this console cannot say whether the machinery has '
        + 'ever been used.',
      figure: (v) => {
        const opened = Number(v.cases_opened);
        return {
          value: opened || 'none', words: !opened, tone: 'mute',
          hint: opened
            ? `since genesis, of which ${esc(String(v.cases_passed))} passed`
            : 'the machinery below has never been exercised on this network, which is worth '
              + 'knowing when reading the parameters as a promise',
        };
      },
    })}
    ${kpiRead(r.recovered, {
      label: 'Taken since genesis',
      missing: 'Recovered did not answer, so this console cannot say whether anything has ever '
        + 'been seized.',
      figure: (v) => {
        const coins = v.total || [];
        if (!coins.length) {
          return {
            value: 'nothing', words: true, tone: 'ok',
            hint: 'the recovery total is empty: no seizure has ever moved anything on this chain',
          };
        }
        if (coins.length === 1) {
          return {
            value: esc(O.amount({ amount: coins[0].amount })), unit: coins[0].denom, tone: 'bad',
            hint: 'all of it sent to the recovery destination, which is the only address the '
              + 'module can pay',
          };
        }
        return {
          value: String(coins.length), unit: 'currencies', tone: 'bad',
          hint: esc(coins.map((c) => O.amount(c)).join(', ')),
        };
      },
    })}
  </div>`;
}

function renderEnforcement() {
  const r = state.reads;
  if (!r.enfParams.ok) {
    $('view-enf').innerHTML = `<section class="block">${
      failure('The enforcement parameters', r.enfParams.error)}
      <p class="lede" style="margin-top:var(--sp-3)">Without the parameters this console cannot state
        the threshold, the delays or where seized funds go, and it will not guess at them: a
        plausible default printed as this chain's rule is worse than no page.</p></section>`;
    return;
  }
  const params = r.enfParams.value.params;

  $('view-enf').innerHTML = `
    ${enforcementBand(r, params)}
    ${folders('enf', [
      {
        id: 'asymmetry', label: 'The asymmetry',
        html: asymmetryHtml(params),
      },
      {
        id: 'frozen', label: 'Frozen now',
        count: r.freezes.ok ? (r.freezes.value.freeze || []).length : '?',
        html: `<section class="block">
          <h2>What is frozen right now</h2>
          <p class="lede">A freeze stops an account sending. It does not stop it receiving, and it
            never takes anything.</p>
          ${staleNote(r.freezes)}${freezesHtml(r.freezes, params)}
          <div class="card" style="margin-top:var(--sp-3)">
            <form class="lookup" id="frz-form">
              <input id="frz-input" type="text" spellcheck="false"
                placeholder="Check any account address" aria-label="Account address">
              <button class="btn" type="submit">Check</button>
            </form>
            <div id="frz-out"><p class="small muted">Anyone can check any account, without a key
              and without an account. The register of who has been stopped from moving their own
              money is not a thing this chain keeps private.</p></div>
          </div>
        </section>`,
      },
      {
        id: 'cases', label: 'Cases',
        count: r.open.ok ? (r.open.value.case || []).length : '?',
        html: `<section class="block">
          <h2>Cases, and where each stands</h2>
          <p class="lede">Opening a case freezes the target immediately. Whether anything is taken
            is decided by the validators afterwards, against the bar in each card.</p>
          ${staleNote(r.open)}${casesHtml(r.open, r.held, r.cases, r.recovered, params)}
        </section>`,
      },
      {
        id: 'cap', label: 'The rolling cap',
        html: `<section class="block">
          <h2>The rolling cap</h2>
          <p class="lede">The limit that makes mass expropriation arithmetically impossible rather
            than merely unpopular.</p>
          ${staleNote(r.window)}${windowHtml(r.window, params)}
        </section>`,
      },
      {
        id: 'offices', label: 'Offices and parameters',
        html: `<section class="block">
          <h2>The offices, and the parameters that bind them</h2>
          ${staleNote(r.enfParams)}${officesHtml(params)}
        </section>`,
      },
      {
        // The refusals are the product of this console, so they get a folder
        // with a name that says what a reader will find in it rather than one
        // that sounds like an appendix. Three different kinds of "you will not
        // see that here" live in it, and they are three separate areas inside
        // it because they are not the same claim: the chain refuses to do a
        // thing, the chain does not publish a thing, and this console will not
        // sign a thing.
        id: 'limits', label: 'Limits of this view',
        count: (BLIND_SPOTS.enforcement || []).length,
        html: `<section class="block">
          <h2>What the chain refuses</h2>
          <p class="lede">Each of these is enforced somewhere specific, and the badge says how
            strongly. A rule pinned to x/constitution cannot be moved by a governance proposal; a
            module rule can be changed by a binary upgrade, and a parameter by a vote. Flattening
            those into “the chain refuses” would overstate the weakest of them.</p>
          ${refusalsHtml('enforcement')}
        </section>

        <section class="block">
          <h2>What this console cannot show you</h2>
          ${blindSpotsHtml('enforcement')}
        </section>

        <section class="block">
          <h2>Who may sign what</h2>
          <p class="lede">This console reads and never writes. Every authority here is a
            validator's operator key or an x/group policy account, and a button in a web page
            collapses an office's procedure into a click nobody can audit afterwards.</p>
          ${signingHtml('enforcement')}
        </section>`,
      },
    ])}`;

  const f = $('frz-form');
  if (f) f.addEventListener('submit', (e) => {
    e.preventDefault();
    const v = $('frz-input').value.trim();
    if (v) lookupFreeze(v);
  });
}

function renderNetting() {
  $('view-net').innerHTML = nettingHtml(state.reads);
  const f = $('pos-form');
  if (f) f.addEventListener('submit', (e) => {
    e.preventDefault();
    const v = $('pos-input').value.trim();
    if (v) lookupPosition(v);
  });
}

function showTab(which) {
  state.tab = which;
  $('tab-enf').setAttribute('aria-selected', String(which === 'enf'));
  $('tab-net').setAttribute('aria-selected', String(which === 'net'));
  $('view-enf').hidden = which !== 'enf';
  $('view-net').hidden = which !== 'net';
  try { localStorage.setItem('yamale.oversight.tab', which); } catch { /* private window */ }
}

$('tab-enf').addEventListener('click', () => showTab('enf'));
$('tab-net').addEventListener('click', () => showTab('net'));

// The folder each mechanism was left on, restored before the first render so a
// supervisor who reloads the page lands where they were rather than back at the
// argument they have already read. Guarded like every other storage access on
// this page: a private window throws rather than returning null.
(() => {
  for (const group of ['enf', 'net']) {
    try {
      const saved = localStorage.getItem(`yamale.oversight.folder.${group}`);
      if (saved) state.folder[group] = saved;
    } catch { /* private window */ }
  }
})();

// ---------------------------------------------------------------------------
// Theme. Three states: the explicit choice in either direction, and the
// system preference when nothing is stamped.
// ---------------------------------------------------------------------------
(() => {
  let saved = null;
  try { saved = localStorage.getItem('yamale.oversight.theme'); } catch { /* blocked */ }
  if (saved === 'dark' || saved === 'light') document.documentElement.dataset.theme = saved;
  $('theme').addEventListener('click', () => {
    const dark = document.documentElement.dataset.theme === 'dark'
      || (!document.documentElement.dataset.theme
          && window.matchMedia('(prefers-color-scheme: dark)').matches);
    const next = dark ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('yamale.oversight.theme', next); } catch { /* blocked */ }
  });
})();

// ---------------------------------------------------------------------------
// Load.
// ---------------------------------------------------------------------------

/**
 * A refresh must not wipe what the reader was looking at.
 *
 * The panels are re-rendered wholesale every thirty seconds, which throws away
 * the result of any lookup the reader has run. Somebody who has just checked
 * whether an account is frozen watches the answer disappear half a minute
 * later, on a page whose entire job is to answer that question. So the lookup
 * panes are lifted out before the re-render and put back after.
 */
function keepLookups(fn) {
  const ids = ['frz-input', 'frz-out', 'pos-input', 'pos-out'];
  const saved = {};
  for (const id of ids) {
    const el = $(id);
    if (!el) continue;
    saved[id] = el.tagName === 'INPUT' ? el.value : el.innerHTML;
  }
  fn();
  for (const id of ids) {
    const el = $(id);
    if (!el || saved[id] === undefined) continue;
    if (el.tagName === 'INPUT') el.value = saved[id];
    else if (saved[id]) el.innerHTML = saved[id];
  }
}

async function load() {
  try {
    state.status = await C.status(RPC);
  } catch (e) {
    // Reset rather than keep the last good height. A page that goes on showing
    // a height from four minutes ago while the node is unreachable is telling
    // the reader that the register is live when it is not — and on this page
    // "nothing is frozen" being four minutes stale is the whole problem.
    //
    // The boot panel is un-hidden here because after the first successful load
    // it is hidden, and writing a failure into a hidden element is how an
    // outage becomes invisible. This one was found by watching the devnet halt
    // for its scheduled upgrade with the console open.
    state.status = null;
    const boot = $('boot');
    boot.hidden = false;
    boot.className = 'failed';
    boot.innerHTML = `<h4>The node is not answering.</h4>
      <p class="small">Everything below was last read successfully some time ago and may no longer
        be true. Nothing on this page can be refreshed without the node, and nothing will be
        invented to fill the space.</p><p class="why">${esc(e.message)}</p>`;
    renderMeta();
    return;
  }
  // The node answered again. Put the boot panel back to its reading state, but
  // leave it visible until the module reads land — on a first visit the mains
  // are still empty at this point, and hiding it here would show a blank page
  // in the gap.
  if ($('boot').className === 'failed') {
    $('boot').className = 'empty';
    $('boot').innerHTML = '<h4>Reading the chain</h4><p>The node is answering again. '
      + 'Re-reading x/enforcement and x/netting.</p>';
  }

  // Independent, deliberately. A netting query that fails must not blank the
  // enforcement half, and vice versa.
  const [vals, secs, reads] = await Promise.all([
    C.validators(RPC).catch(() => []),
    measureBlockInterval(state.status.height).catch(() => 0),
    C.settleAll({
      enfParams: C.enforcement.params(opts),
      open: C.enforcement.openCases(opts),
      held: C.enforcement.heldCases(opts),
      recovered: C.enforcement.recovered(opts),
      window: C.enforcement.seizureWindow(opts),
      cases: C.enforcement.listCases(20, opts),
      freezes: C.enforcement.listFreezes(100, opts),
      netParams: C.netting.params(opts),
      cycle: C.netting.currentCycle(opts),
      slices: C.netting.heldSlices(opts),
    }),
  ]);

  // Keep the last good measurement of each. A transient failure on the block
  // or validator queries would otherwise drop the block interval to zero and
  // the validator set to empty — which silently removes every duration from
  // the page and reports the asymmetry as "0 of 0". A stale interval is a fine
  // basis for an estimate that is labelled as one; a missing interval quietly
  // deletes information the reader had a moment ago.
  if (vals.length) state.validators = vals;
  if (secs > 0) state.secondsPerBlock = secs;

  /*
   * Keep the last good answer per panel, and say that it is old.
   *
   * MEASURED on this deployment: thirteen concurrent queries all returned 200
   * while a SEQUENTIAL run of the same ten started failing at the fourth and
   * stayed failing. So the node flaps in and out on a multi-second cycle, and
   * it is not a burst limit — the concurrent burst is the one that succeeds.
   *
   * That makes blanking a panel on a single refusal the wrong behaviour here.
   * The reader loses the freeze register they were reading because one request
   * in ten landed in a bad two seconds, on a page whose whole job is to have
   * an answer available when somebody needs one.
   *
   * The honest middle is to keep the answer and label it: the panel still
   * carries the height it was actually read at, and a notice says the node has
   * stopped answering since. That is strictly better than a blank, and it is
   * still not a claim about now — which matters more on this page than any
   * other, because "nothing is frozen" going quietly stale is the failure the
   * whole console exists to prevent.
   *
   * A read that has NEVER succeeded still renders as a failure. There is
   * nothing to keep, and inventing an empty result would be the lie.
   */
  for (const key of Object.keys(reads)) {
    const now = reads[key];
    const before = state.reads[key];
    if (!now.ok && before && before.ok) {
      reads[key] = { ...before, stale: true, staleError: now.error };
    }
  }
  state.reads = reads;

  renderMeta();
  $('boot').hidden = true;
  keepLookups(() => { renderEnforcement(); renderNetting(); });

  let tab = 'enf';
  try { tab = localStorage.getItem('yamale.oversight.tab') || 'enf'; } catch { /* blocked */ }
  showTab(tab === 'net' ? 'net' : 'enf');
}

load();

// Re-read on a timer. The height in the header is the honest signal that this
// is a live register rather than a screenshot of one, which is the difference
// that matters when the answer is "nothing is frozen".
setInterval(() => { load(); }, 30000);
</script>
</body>
</html>
