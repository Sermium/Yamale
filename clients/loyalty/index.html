<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` because this runs full-bleed on a phone below 430px,
      where the shared shell drops the device frame and the screen becomes the
      page. Without it the action bar sits above the home indicator on a notched
      device and the primary control moves out from under the thumb.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Yamale Jewels</title>
    <meta
      name="description"
      content="Check a jewel's record, hold it, and pass it on."
    />
    <link rel="icon" type="image/png" href="/mark.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#12253f" />
    <!--
      Typefaces in the head rather than through an @import in the stylesheet, so
      the request starts as soon as the parser reaches this line. Every stack in
      yamale.css names real fallbacks, so a field device with no route to the
      font host degrades to something chosen rather than to Times.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
