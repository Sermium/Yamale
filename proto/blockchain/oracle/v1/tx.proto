syntax = "proto3";

package blockchain.oracle.v1;

import "amino/amino.proto";
import "blockchain/oracle/v1/params.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "yamale/blockchain/x/oracle/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams defines a (governance) operation for updating the module
  // parameters. The authority defaults to the x/gov module account.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // SubmitExchangeRates reports one validator's observed prices for the
  // current voting round.
  rpc SubmitExchangeRates(MsgSubmitExchangeRates) returns (MsgSubmitExchangeRatesResponse);

  // DelegateFeeder nominates a hot key to submit a validator's votes.
  rpc DelegateFeeder(MsgDelegateFeeder) returns (MsgDelegateFeederResponse);

  // ApplyAppraiser asks to be admitted as an independent valuer.
  rpc ApplyAppraiser(MsgApplyAppraiser) returns (MsgApplyAppraiserResponse);

  // ApproveAppraiser records governance's decision on an application.
  rpc ApproveAppraiser(MsgApproveAppraiser) returns (MsgApproveAppraiserResponse);

  // RevokeAppraiser withdraws an approved valuer's authority.
  rpc RevokeAppraiser(MsgRevokeAppraiser) returns (MsgRevokeAppraiserResponse);

  // SubmitAppraisal records a signed valuation of a tokenised asset.
  rpc SubmitAppraisal(MsgSubmitAppraisal) returns (MsgSubmitAppraisalResponse);
}

// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "blockchain/x/oracle/MsgUpdateParams";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the module parameters to update.

  // NOTE: All parameters must be supplied.
  Params params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}

// RateVote is one reported price within a submission.
message RateVote {
  string denom = 1;
  string rate = 2;
}

// MsgSubmitExchangeRates reports prices for the current voting round.
//
// Signed by the feeder, which is either the validator's own account or the hot
// key it delegated to. Submitting twice in one round replaces the earlier
// report rather than counting twice.
message MsgSubmitExchangeRates {
  option (cosmos.msg.v1.signer) = "feeder";
  string feeder = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // validator is the operator this report is on behalf of.
  string validator = 2;
  repeated RateVote rates = 3 [(gogoproto.nullable) = false];
}

// MsgSubmitExchangeRatesResponse defines the MsgSubmitExchangeRatesResponse message.
message MsgSubmitExchangeRatesResponse {}

// MsgDelegateFeeder nominates the account allowed to vote for a validator.
message MsgDelegateFeeder {
  option (cosmos.msg.v1.signer) = "operator";
  // operator is the validator's own account, and the only signer that may
  // change who votes on its behalf.
  string operator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string validator = 2;
  string feeder = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgDelegateFeederResponse defines the MsgDelegateFeederResponse message.
message MsgDelegateFeederResponse {}

// MsgApplyAppraiser records a pending application to become a valuer. Anyone
// may apply; only governance can approve.
message MsgApplyAppraiser {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string name = 2;
  string credentials = 3;
  repeated string class_ids = 4;
}

// MsgApplyAppraiserResponse defines the MsgApplyAppraiserResponse message.
message MsgApplyAppraiserResponse {}

// MsgApproveAppraiser is executed by the governance module account once a
// proposal to admit or refuse a valuer has passed.
message MsgApproveAppraiser {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "blockchain/x/oracle/MsgApproveAppraiser";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string appraiser = 2;
  bool approve = 3;
  // class_ids may narrow the scope the applicant asked for. Governance
  // admitting somebody to value less than they requested should not require
  // them to reapply.
  repeated string class_ids = 4;
}

// MsgApproveAppraiserResponse defines the MsgApproveAppraiserResponse message.
message MsgApproveAppraiserResponse {}

// MsgRevokeAppraiser withdraws a valuer's authority.
//
// Existing appraisals are left in place: they were validly signed at the time,
// and deleting them would rewrite the record rather than correct it. What
// revocation stops is new ones.
message MsgRevokeAppraiser {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "blockchain/x/oracle/MsgRevokeAppraiser";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string appraiser = 2;
  string reason = 3;
}

// MsgRevokeAppraiserResponse defines the MsgRevokeAppraiserResponse message.
message MsgRevokeAppraiserResponse {}

// MsgSubmitAppraisal records a signed valuation of one tokenised asset.
message MsgSubmitAppraisal {
  option (cosmos.msg.v1.signer) = "appraiser";
  string appraiser = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string class_id = 2;
  string nft_id = 3;
  string value = 4;
  string value_denom = 5;
  // valued_at is the date the valuation reflects, not the date it was sent.
  int64 valued_at = 6;
  string method = 7;
  string report_uri = 8;
  string report_hash = 9;
}

// MsgSubmitAppraisalResponse defines the MsgSubmitAppraisalResponse message.
message MsgSubmitAppraisalResponse {}
