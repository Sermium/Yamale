syntax = "proto3";

package blockchain.land.v1;

import "blockchain/land/v1/params.proto";
import "blockchain/land/v1/parcel.proto";
import "gogoproto/gogo.proto";

option go_package = "yamale/blockchain/x/land/types";

// GenesisState carries the whole registry across an export and back.
//
// The counters are exported explicitly rather than derived from the longest id
// present. A derived counter changes behaviour after an export whenever the
// highest-numbered record has been removed, and on this chain the exported
// state must match byte for byte or the import is not the same registry.
message GenesisState {
  Params params = 1 [(gogoproto.nullable) = false];

  repeated Authority authorities = 2 [(gogoproto.nullable) = false];
  repeated Parcel parcels = 3 [(gogoproto.nullable) = false];
  repeated Transfer transfers = 4 [(gogoproto.nullable) = false];

  uint64 next_parcel_id = 5;
  uint64 next_transfer_id = 6;

  // Fractionalisation permissions, including the withdrawn and the expired.
  //
  // Carried rather than dropped because x/tokenisation enforces against them:
  // an export that kept the parcels but lost their authorisations would import
  // a registry in which every vehicle already opened over land had lost the
  // permission that made it lawful.
  repeated FractionalisationAuthority fractionalisation_authorities = 7 [(gogoproto.nullable) = false];
}
