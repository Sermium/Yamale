syntax = "proto3";
package blockchain.jewel.v1;

import "blockchain/jewel/v1/jewel.proto";
import "blockchain/jewel/v1/params.proto";
import "gogoproto/gogo.proto";

option go_package = "yamale/blockchain/x/jewel/types";

// UsedNonce is a voucher already spent.
message UsedNonce {
  // benefit_id is the benefit the voucher was for.
  uint64 benefit_id = 1;
  // nonce is the voucher's single-use nonce.
  string nonce = 2;
}

// GenesisState carries the whole register. Indexes are rebuilt from it. The
// counters are exported rather than derived, so an import keeps its numbering.
message GenesisState {
  // params are the register's settings.
  Params params = 1 [(gogoproto.nullable) = false];
  // jewelers are every admitted jeweler, suspended ones included.
  repeated Jeweler jewelers = 2 [(gogoproto.nullable) = false];
  // jewels are every registered jewel; their owners are x/nft's.
  repeated Jewel jewels = 3 [(gogoproto.nullable) = false];
  // offers are the open offers, at most one per jewel.
  repeated Offer offers = 4 [(gogoproto.nullable) = false];
  // benefits are every attached benefit, with its uses.
  repeated Benefit benefits = 5 [(gogoproto.nullable) = false];
  // used_nonces are the vouchers already spent.
  repeated UsedNonce used_nonces = 6 [(gogoproto.nullable) = false];
  // reassignments are the pending reassignments, at most one per jewel.
  repeated Reassignment reassignments = 7 [(gogoproto.nullable) = false];
  // next_jeweler_id is the next jeweler id the chain will assign.
  uint64 next_jeweler_id = 8;
  // next_jewel_id is the next jewel id the chain will assign.
  uint64 next_jewel_id = 9;
  // next_benefit_id is the next benefit id the chain will assign.
  uint64 next_benefit_id = 10;
  // cards are the jewels' ownership cards, at most one per jewel.
  repeated GenesisCard cards = 11 [(gogoproto.nullable) = false];
  // claims are the pending claims, at most one per jewel. Each must be on a
  // jewel with a card, signed with that card. The per-jeweler index of claims
  // is rebuilt from them, never exported.
  repeated GenesisClaim claims = 12 [(gogoproto.nullable) = false];
}

// GenesisCard is one jewel's ownership card.
message GenesisCard {
  // jewel_id is the jewel the card is for.
  uint64 jewel_id = 1;
  // card is the card.
  Card card = 2 [(gogoproto.nullable) = false];
}

// GenesisClaim is one jewel's pending claim.
message GenesisClaim {
  // jewel_id is the jewel claimed.
  uint64 jewel_id = 1;
  // claim is the claim.
  Claim claim = 2 [(gogoproto.nullable) = false];
}
