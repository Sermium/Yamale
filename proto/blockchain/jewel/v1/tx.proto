syntax = "proto3";
package blockchain.jewel.v1;

import "amino/amino.proto";
import "blockchain/jewel/v1/jewel.proto";
import "blockchain/jewel/v1/params.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "yamale/blockchain/x/jewel/types";

// Msg is the write side of the jewel register.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams sets the settings and appoints the office. Governance only;
  // the office must be a group account.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
  // AdmitJeweler admits a business and opens its collection. Office only.
  rpc AdmitJeweler(MsgAdmitJeweler) returns (MsgAdmitJewelerResponse);
  // SuspendJeweler stops a jeweler acting: no registration, no sale of its stock, and its staff's offers die. Office only.
  rpc SuspendJeweler(MsgSuspendJeweler) returns (MsgSuspendJewelerResponse);
  // ReinstateJeweler lets a suspended jeweler act again. Office only.
  rpc ReinstateJeweler(MsgReinstateJeweler) returns (MsgReinstateJewelerResponse);
  // SetStaff adds and removes the people who act for a jeweler.
  rpc SetStaff(MsgSetStaff) returns (MsgSetStaffResponse);
  // RegisterJewel mints a jewel into its jeweler's stock.
  rpc RegisterJewel(MsgRegisterJewel) returns (MsgRegisterJewelResponse);
  // AmendJewel appends a correction to a jewel's record.
  rpc AmendJewel(MsgAmendJewel) returns (MsgAmendJewelResponse);
  // OfferJewel opens an offer to an account or a claim key.
  rpc OfferJewel(MsgOfferJewel) returns (MsgOfferJewelResponse);
  // CancelOffer closes an open offer.
  rpc CancelOffer(MsgCancelOffer) returns (MsgCancelOfferResponse);
  // AcceptOffer takes a jewel offered to the signer's account.
  rpc AcceptOffer(MsgAcceptOffer) returns (MsgAcceptOfferResponse);
  // ClaimOffer takes a jewel offered to a claim key.
  rpc ClaimOffer(MsgClaimOffer) returns (MsgClaimOfferResponse);
  // ReportStolen flags a jewel and closes its offer and any pending claim.
  rpc ReportStolen(MsgReportStolen) returns (MsgReportStolenResponse);
  // ClearStolen lifts the flag.
  rpc ClearStolen(MsgClearStolen) returns (MsgClearStolenResponse);
  // AttachBenefit adds a benefit to a jewel.
  rpc AttachBenefit(MsgAttachBenefit) returns (MsgAttachBenefitResponse);
  // RedeemBenefit records one use, with the owner's signed voucher.
  rpc RedeemBenefit(MsgRedeemBenefit) returns (MsgRedeemBenefitResponse);
  // ProposeReassignment opens the public window. Office only.
  rpc ProposeReassignment(MsgProposeReassignment) returns (MsgProposeReassignmentResponse);
  // VetoReassignment closes it. The current owner only.
  rpc VetoReassignment(MsgVetoReassignment) returns (MsgVetoReassignmentResponse);
  // CompleteReassignment moves the jewel once the window has passed. Anyone.
  rpc CompleteReassignment(MsgCompleteReassignment) returns (MsgCompleteReassignmentResponse);
  // IssueCard gives a stock jewel its ownership card, replacing any earlier one.
  rpc IssueCard(MsgIssueCard) returns (MsgIssueCardResponse);
  // FileClaim records a buyer's claim, signed with the card's secret.
  rpc FileClaim(MsgFileClaim) returns (MsgFileClaimResponse);
  // ApproveClaim moves the jewel to the claimer. The shop's staff only.
  rpc ApproveClaim(MsgApproveClaim) returns (MsgApproveClaimResponse);
  // RejectClaim removes a claim; the card stays valid. The shop's staff only.
  rpc RejectClaim(MsgRejectClaim) returns (MsgRejectClaimResponse);
  // WithdrawClaim removes the signer's own claim.
  rpc WithdrawClaim(MsgWithdrawClaim) returns (MsgWithdrawClaimResponse);
  // ProposeBusinessMove names the account the shop's business account is to
  // move to, or withdraws the proposal. The business account only.
  rpc ProposeBusinessMove(MsgProposeBusinessMove) returns (MsgProposeBusinessMoveResponse);
  // AcceptBusinessMove completes it: the named account becomes the business
  // account and receives the stock. That account only.
  rpc AcceptBusinessMove(MsgAcceptBusinessMove) returns (MsgAcceptBusinessMoveResponse);
}

// MsgUpdateParams is the message that carries out UpdateParams.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "blockchain/x/jewel/MsgUpdateParams";
  // authority is the governance module account, the only signer accepted.
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // params replace the settings whole; office must be a group policy account.
  Params params = 2 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}
// MsgUpdateParamsResponse is the result of MsgUpdateParams.
message MsgUpdateParamsResponse {}

// MsgAdmitJeweler is the message that carries out AdmitJeweler.
message MsgAdmitJeweler {
  option (cosmos.msg.v1.signer) = "office";
  option (amino.name) = "blockchain/x/jewel/MsgAdmitJeweler";
  // office is the register's office, the signer.
  string office = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // name is the business's display name.
  string name = 2;
  // business is the account that will hold the stock and manage staff.
  string business = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}
// MsgAdmitJewelerResponse is the result of MsgAdmitJeweler.
message MsgAdmitJewelerResponse {
  // id is the new jeweler's id.
  uint64 id = 1;
}

// MsgSuspendJeweler is the message that carries out SuspendJeweler.
message MsgSuspendJeweler {
  option (cosmos.msg.v1.signer) = "office";
  option (amino.name) = "blockchain/x/jewel/MsgSuspendJeweler";
  // office is the register's office, the signer.
  string office = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // jeweler_id is the jeweler to suspend.
  uint64 jeweler_id = 2;
  // reason is the office's public account of why; required.
  string reason = 3;
}
// MsgSuspendJewelerResponse is the result of MsgSuspendJeweler.
message MsgSuspendJewelerResponse {}

// MsgReinstateJeweler is the message that carries out ReinstateJeweler.
message MsgReinstateJeweler {
  option (cosmos.msg.v1.signer) = "office";
  option (amino.name) = "blockchain/x/jewel/MsgReinstateJeweler";
  // office is the register's office, the signer.
  string office = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // jeweler_id is the jeweler to reinstate.
  uint64 jeweler_id = 2;
}
// MsgReinstateJewelerResponse is the result of MsgReinstateJeweler.
message MsgReinstateJewelerResponse {}

// MsgSetStaff is the message that carries out SetStaff.
message MsgSetStaff {
  option (cosmos.msg.v1.signer) = "business";
  option (amino.name) = "blockchain/x/jewel/MsgSetStaff";
  // business is the jeweler's business account, the signer.
  string business = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // jeweler_id is the jeweler whose staff change.
  uint64 jeweler_id = 2;
  // add are accounts to act for the jeweler; none may work for another.
  repeated string add = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // remove are accounts that stop acting for it, at once.
  repeated string remove = 4 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}
// MsgSetStaffResponse is the result of MsgSetStaff.
message MsgSetStaffResponse {}

// MsgRegisterJewel is the message that carries out RegisterJewel.
message MsgRegisterJewel {
  option (cosmos.msg.v1.signer) = "staff";
  option (amino.name) = "blockchain/x/jewel/MsgRegisterJewel";
  // staff is the staff member registering it, the signer.
  string staff = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // inscription is the laser inscription as typed; separators and case are normalised.
  string inscription = 2;
  // record_hash is the SHA-256, in lower-case hex, of the record file.
  string record_hash = 3;
  // record_uri is where the record file can be fetched; at most 512 characters.
  string record_uri = 4;
}
// MsgRegisterJewelResponse is the result of MsgRegisterJewel.
message MsgRegisterJewelResponse {
  // id is the new jewel's id.
  uint64 id = 1;
}

// MsgAmendJewel is the message that carries out AmendJewel. A jewel carries
// at most 50 amendments, each with a note of at most 500 bytes.
message MsgAmendJewel {
  option (cosmos.msg.v1.signer) = "staff";
  option (amino.name) = "blockchain/x/jewel/MsgAmendJewel";
  // staff is a staff member of the jewel's own jeweler, the signer.
  string staff = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // jewel_id is the jewel to correct.
  uint64 jewel_id = 2;
  // record_hash is the SHA-256, in lower-case hex, of the corrected record file.
  string record_hash = 3;
  // record_uri is where the corrected record file can be fetched; at most 512 characters.
  string record_uri = 4;
  // note says what was corrected; required, at most 500 bytes.
  string note = 5;
}
// MsgAmendJewelResponse is the result of MsgAmendJewel.
message MsgAmendJewelResponse {}

// MsgOfferJewel is the message that carries out OfferJewel.
message MsgOfferJewel {
  option (cosmos.msg.v1.signer) = "owner";
  option (amino.name) = "blockchain/x/jewel/MsgOfferJewel";
  // owner is the jewel's owner, or a staff member while it is stock.
  string owner = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // jewel_id is the jewel to offer.
  uint64 jewel_id = 2;
  // to is the recipient's account; set this or claim_key, not both.
  string to = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // claim_key is a one-time key's compressed secp256k1 public key in hex, for a recipient with no account yet.
  string claim_key = 4;
}
// MsgOfferJewelResponse is the result of MsgOfferJewel.
message MsgOfferJewelResponse {
  // expires_at is when the offer lapses, in unix seconds.
  int64 expires_at = 1;
}

// MsgCancelOffer is the message that carries out CancelOffer.
message MsgCancelOffer {
  option (cosmos.msg.v1.signer) = "owner";
  option (amino.name) = "blockchain/x/jewel/MsgCancelOffer";
  // owner is the jewel's owner, or a staff member while it is stock; the signer.
  string owner = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // jewel_id is the jewel whose offer to close.
  uint64 jewel_id = 2;
}
// MsgCancelOfferResponse is the result of MsgCancelOffer.
message MsgCancelOfferResponse {}

// MsgAcceptOffer is the message that carries out AcceptOffer.
message MsgAcceptOffer {
  option (cosmos.msg.v1.signer) = "recipient";
  option (amino.name) = "blockchain/x/jewel/MsgAcceptOffer";
  // recipient is the account the offer names, the signer.
  string recipient = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // jewel_id is the jewel to take.
  uint64 jewel_id = 2;
}
// MsgAcceptOfferResponse is the result of MsgAcceptOffer.
message MsgAcceptOfferResponse {}

// MsgClaimOffer is the message that carries out ClaimOffer.
message MsgClaimOffer {
  option (cosmos.msg.v1.signer) = "claimer";
  option (amino.name) = "blockchain/x/jewel/MsgClaimOffer";
  // claimer is the account that receives the jewel, the signer.
  string claimer = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // jewel_id is the jewel to claim.
  uint64 jewel_id = 2;
  // claim_pub_key is the compressed secp256k1 public key of the claim key.
  bytes claim_pub_key = 3;
  // claim_signature signs ClaimSignBytes(chain id, jewel id, the offer's
  // expires_at, claimer): "yamale-jewel-claim/v2:<chain>:<jewel>:<expires>:<claimer>".
  bytes claim_signature = 4;
}
// MsgClaimOfferResponse is the result of MsgClaimOffer.
message MsgClaimOfferResponse {}

// MsgReportStolen is the message that carries out ReportStolen.
message MsgReportStolen {
  option (cosmos.msg.v1.signer) = "owner";
  option (amino.name) = "blockchain/x/jewel/MsgReportStolen";
  // owner is the jewel's owner, or a staff member while it is stock; the signer.
  string owner = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // jewel_id is the jewel to flag.
  uint64 jewel_id = 2;
}
// MsgReportStolenResponse is the result of MsgReportStolen.
message MsgReportStolenResponse {}

// MsgClearStolen is the message that carries out ClearStolen.
message MsgClearStolen {
  option (cosmos.msg.v1.signer) = "owner";
  option (amino.name) = "blockchain/x/jewel/MsgClearStolen";
  // owner is the jewel's owner, or a staff member while it is stock; the signer.
  string owner = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // jewel_id is the jewel to clear.
  uint64 jewel_id = 2;
}
// MsgClearStolenResponse is the result of MsgClearStolen.
message MsgClearStolenResponse {}

// MsgAttachBenefit is the message that carries out AttachBenefit.
message MsgAttachBenefit {
  option (cosmos.msg.v1.signer) = "staff";
  option (amino.name) = "blockchain/x/jewel/MsgAttachBenefit";
  // staff is a staff member of the jewel's own jeweler, the signer.
  string staff = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // jewel_id is the jewel to attach it to.
  uint64 jewel_id = 2;
  // kind is the service as the jeweler words it, e.g. "cleaning"; at most 80 characters.
  string kind = 3;
  // allowance is how many uses fit in one period; at least 1.
  uint32 allowance = 4;
  // period is the rolling window the allowance applies to, in seconds; 0 means the whole life.
  int64 period = 5;
  // expires_at is when the benefit ends, in unix seconds; 0 means never.
  int64 expires_at = 6;
}
// MsgAttachBenefitResponse is the result of MsgAttachBenefit.
message MsgAttachBenefitResponse {
  // id is the new benefit's id.
  uint64 id = 1;
}

// MsgRedeemBenefit is the message that carries out RedeemBenefit.
message MsgRedeemBenefit {
  option (cosmos.msg.v1.signer) = "staff";
  option (amino.name) = "blockchain/x/jewel/MsgRedeemBenefit";
  // staff is a staff member of the benefit's jeweler, the signer.
  string staff = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // voucher is what the owner's app signed, shown to staff as a code.
  Voucher voucher = 2 [(gogoproto.nullable) = false];
  // owner_pub_key is the compressed secp256k1 public key of the owner.
  bytes owner_pub_key = 3;
  // owner_signature signs VoucherSignBytes(chain id, voucher).
  bytes owner_signature = 4;
}
// MsgRedeemBenefitResponse is the result of MsgRedeemBenefit.
message MsgRedeemBenefitResponse {}

// MsgProposeReassignment is the message that carries out ProposeReassignment.
message MsgProposeReassignment {
  option (cosmos.msg.v1.signer) = "office";
  // Shortened from the message name: a Ledger accepts at most 39 characters.
  option (amino.name) = "blockchain/x/jewel/MsgProposeReassign";
  // office is the register's office, the signer.
  string office = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // jewel_id is the jewel to move.
  uint64 jewel_id = 2;
  // to is the account to move it to.
  string to = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // reason is the office's public account of why; required.
  string reason = 4;
}
// MsgProposeReassignmentResponse is the result of MsgProposeReassignment.
message MsgProposeReassignmentResponse {
  // window_ends is when the veto window closes, in unix seconds.
  int64 window_ends = 1;
}

// MsgVetoReassignment is the message that carries out VetoReassignment.
message MsgVetoReassignment {
  option (cosmos.msg.v1.signer) = "owner";
  option (amino.name) = "blockchain/x/jewel/MsgVetoReassignment";
  // owner is the jewel's current owner, the signer.
  string owner = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // jewel_id is the jewel whose reassignment to refuse.
  uint64 jewel_id = 2;
}
// MsgVetoReassignmentResponse is the result of MsgVetoReassignment.
message MsgVetoReassignmentResponse {}

// MsgCompleteReassignment is the message that carries out CompleteReassignment.
message MsgCompleteReassignment {
  option (cosmos.msg.v1.signer) = "creator";
  // Shortened from the message name: a Ledger accepts at most 39 characters.
  option (amino.name) = "blockchain/x/jewel/MsgCompleteReassign";
  // creator is any account, the signer; it pays the fee.
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // jewel_id is the jewel whose reassignment to complete.
  uint64 jewel_id = 2;
}
// MsgCompleteReassignmentResponse is the result of MsgCompleteReassignment.
message MsgCompleteReassignmentResponse {}

// MsgIssueCard is the message that carries out IssueCard. It sets the
// jewel's ownership card, replacing any earlier one, and drops a pending claim
// that was signed with the earlier card. Refused unless the jewel is stock of
// an active jeweler and not reported stolen.
message MsgIssueCard {
  option (cosmos.msg.v1.signer) = "staff";
  option (amino.name) = "blockchain/x/jewel/MsgIssueCard";
  // staff is the jeweler's business account or a member of its staff, the signer.
  string staff = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // jewel_id is the stock jewel the card is for.
  uint64 jewel_id = 2;
  // card_key is the card's compressed secp256k1 public key in hex, 66
  // characters. Upper-case hex is accepted and stored in lower case. The
  // secret it belongs to is printed on the card and nowhere else.
  string card_key = 3;
}
// MsgIssueCardResponse is the result of MsgIssueCard.
message MsgIssueCardResponse {}

// MsgFileClaim is the message that carries out FileClaim. It records a
// pending claim for the shop's staff to approve or reject; nothing moves yet.
message MsgFileClaim {
  option (cosmos.msg.v1.signer) = "claimer";
  option (amino.name) = "blockchain/x/jewel/MsgFileClaim";
  // claimer is the account the jewel goes to once the shop approves, the signer.
  string claimer = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // jewel_id is the jewel to claim.
  uint64 jewel_id = 2;
  // card_pub_key is the compressed secp256k1 public key of the card, 33
  // bytes; it must be the jewel's current card.
  bytes card_pub_key = 3;
  // card_signature signs CardClaimSignBytes(chain id, jewel id, card key,
  // claimer): "yamale-jewel-card/v1:<chain>:<jewel>:<card key hex>:<claimer>".
  bytes card_signature = 4;
}
// MsgFileClaimResponse is the result of MsgFileClaim.
message MsgFileClaimResponse {}

// MsgApproveClaim is the message that carries out ApproveClaim. The jewel
// moves to the claimer, and its card and claim are spent.
message MsgApproveClaim {
  option (cosmos.msg.v1.signer) = "staff";
  option (amino.name) = "blockchain/x/jewel/MsgApproveClaim";
  // staff is the jeweler's business account or a member of its staff, the signer.
  string staff = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // jewel_id is the jewel whose pending claim to approve.
  uint64 jewel_id = 2;
}
// MsgApproveClaimResponse is the result of MsgApproveClaim.
message MsgApproveClaimResponse {}

// MsgRejectClaim is the message that carries out RejectClaim. The card stays
// valid, so the real buyer can file with it afterwards.
message MsgRejectClaim {
  option (cosmos.msg.v1.signer) = "staff";
  option (amino.name) = "blockchain/x/jewel/MsgRejectClaim";
  // staff is the jeweler's business account or a member of its staff, the signer.
  string staff = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // jewel_id is the jewel whose pending claim to remove.
  uint64 jewel_id = 2;
}
// MsgRejectClaimResponse is the result of MsgRejectClaim.
message MsgRejectClaimResponse {}

// MsgWithdrawClaim is the message that carries out WithdrawClaim.
message MsgWithdrawClaim {
  option (cosmos.msg.v1.signer) = "claimer";
  option (amino.name) = "blockchain/x/jewel/MsgWithdrawClaim";
  // claimer is the account that filed the claim, the signer.
  string claimer = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // jewel_id is the jewel whose claim to withdraw.
  uint64 jewel_id = 2;
}
// MsgWithdrawClaimResponse is the result of MsgWithdrawClaim.
message MsgWithdrawClaimResponse {}

// MsgProposeBusinessMove is the message that carries out ProposeBusinessMove.
// The shop's business account names the account that is to take its place.
// Nothing moves until that account accepts, within offer_ttl; proposing again
// replaces the proposal, and an empty new_business withdraws it. Refused
// while the jeweler is suspended, and for an account that is already another
// jeweler's business account or staff.
message MsgProposeBusinessMove {
  option (cosmos.msg.v1.signer) = "business";
  option (amino.name) = "blockchain/x/jewel/MsgProposeShopMove";
  // business is the jeweler's current business account, the signer.
  string business = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // jeweler_id is the jeweler whose business account moves.
  uint64 jeweler_id = 2;
  // new_business is the account to move to; empty withdraws the proposal.
  string new_business = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}
// MsgProposeBusinessMoveResponse is the result of MsgProposeBusinessMove.
message MsgProposeBusinessMoveResponse {}

// MsgAcceptBusinessMove is the message that carries out AcceptBusinessMove.
// The proposed account becomes the jeweler's business account, and every
// jewel of this jeweler the old business account holds, its stock, moves to
// it. A stock jewel keeps its ownership card and any pending claim, and loses
// any open offer or pending reassignment, which were made against the old
// account. The old account keeps whatever staff place it had. Refused when the
// new account already owns jewels of this jeweler, which would silently become
// stock.
message MsgAcceptBusinessMove {
  option (cosmos.msg.v1.signer) = "new_business";
  option (amino.name) = "blockchain/x/jewel/MsgAcceptShopMove";
  // new_business is the account named in the proposal, the signer.
  string new_business = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // jeweler_id is the jeweler whose business account moves.
  uint64 jeweler_id = 2;
}
// MsgAcceptBusinessMoveResponse is the result of MsgAcceptBusinessMove.
message MsgAcceptBusinessMoveResponse {
  // jewels is how many stock jewels moved to the new business account.
  uint64 jewels = 1;
}
