syntax = "proto3";
package blockchain.jewel.v1;

import "blockchain/jewel/v1/jewel.proto";
import "blockchain/jewel/v1/params.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";

option go_package = "yamale/blockchain/x/jewel/types";

// Query is the read side, and what the public verification page calls.
service Query {
  // Params returns the settings and the office.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/yamale/blockchain/jewel/v1/params";
  }
  // Jeweler returns one jeweler.
  rpc Jeweler(QueryJewelerRequest) returns (QueryJewelerResponse) {
    option (google.api.http).get = "/yamale/blockchain/jewel/v1/jeweler/{id}";
  }
  // Jewelers lists the jewelers, suspended ones included.
  rpc Jewelers(QueryJewelersRequest) returns (QueryJewelersResponse) {
    option (google.api.http).get = "/yamale/blockchain/jewel/v1/jewelers";
  }
  // Jewel returns one jewel with its owner, open offer, pending reassignment,
  // benefits, whether it has an ownership card, and any pending claim.
  rpc Jewel(QueryJewelRequest) returns (QueryJewelResponse) {
    option (google.api.http).get = "/yamale/blockchain/jewel/v1/jewel/{id}";
  }
  // JewelsByInscription finds every jewel carrying an inscription, whichever
  // jeweler registered it. At most 50.
  rpc JewelsByInscription(QueryJewelsByInscriptionRequest) returns (QueryJewelsByInscriptionResponse) {
    option (google.api.http).get = "/yamale/blockchain/jewel/v1/inscription/{inscription}";
  }
  // ClaimsByJeweler lists a jeweler's pending claims, each with its jewel, in
  // jewel id order: what its staff have to approve or reject.
  rpc ClaimsByJeweler(QueryClaimsByJewelerRequest) returns (QueryClaimsByJewelerResponse) {
    option (google.api.http).get = "/yamale/blockchain/jewel/v1/jewelers/{jeweler_id}/claims";
  }
}

// QueryParamsRequest asks for Params.
message QueryParamsRequest {}
// QueryParamsResponse is the result of QueryParams.
message QueryParamsResponse {
  // params are the register's settings, office included.
  Params params = 1 [(gogoproto.nullable) = false];
}

// QueryJewelerRequest asks for Jeweler.
message QueryJewelerRequest {
  // id is the jeweler to show.
  uint64 id = 1;
}
// QueryJewelerResponse is the result of QueryJeweler.
message QueryJewelerResponse {
  // jeweler is the jeweler asked for.
  Jeweler jeweler = 1 [(gogoproto.nullable) = false];
}

// QueryJewelersRequest asks for Jewelers.
message QueryJewelersRequest {
  // pagination pages through the jewelers in id order.
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}
// QueryJewelersResponse is the result of QueryJewelers.
message QueryJewelersResponse {
  // jewelers are this page of jewelers.
  repeated Jeweler jewelers = 1 [(gogoproto.nullable) = false];
  // pagination is the key to the next page.
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryJewelRequest asks for Jewel.
message QueryJewelRequest {
  // id is the jewel to show.
  uint64 id = 1;
}
// QueryJewelResponse is the result of QueryJewel.
message QueryJewelResponse {
  // jewel is the register's record of it.
  Jewel jewel = 1 [(gogoproto.nullable) = false];
  // owner is its current owner, read from x/nft.
  string owner = 2;
  // offer is set while an offer is open, expired or not.
  Offer offer = 3;
  // reassignment is set while one is pending.
  Reassignment reassignment = 4;
  // benefits are the benefits attached to it.
  repeated Benefit benefits = 5 [(gogoproto.nullable) = false];
  // has_card is set while the jewel has an ownership card. The card's key is
  // not shown here: only the printed card needs it.
  bool has_card = 6;
  // claim is set while a buyer's claim waits for the shop.
  Claim claim = 7;
}

// QueryJewelsByInscriptionRequest asks for JewelsByInscription.
message QueryJewelsByInscriptionRequest {
  // inscription is the code as read off the metal; it is normalised before the search.
  string inscription = 1;
}
// QueryJewelsByInscriptionResponse is the result of QueryJewelsByInscription.
message QueryJewelsByInscriptionResponse {
  // jewels are every jewel carrying it, at most 50.
  repeated Jewel jewels = 1 [(gogoproto.nullable) = false];
}

// QueryClaimsByJewelerRequest asks for ClaimsByJeweler.
message QueryClaimsByJewelerRequest {
  // jeweler_id is the jeweler whose pending claims to list.
  uint64 jeweler_id = 1;
  // pagination pages through the claims in jewel id order.
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
// QueryClaimsByJewelerResponse is the result of QueryClaimsByJeweler.
message QueryClaimsByJewelerResponse {
  // claims are this page of pending claims.
  repeated ClaimEntry claims = 1 [(gogoproto.nullable) = false];
  // pagination is the key to the next page.
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// ClaimEntry is one pending claim with the jewel it is on.
message ClaimEntry {
  // jewel is the register's record of the claimed jewel.
  Jewel jewel = 1 [(gogoproto.nullable) = false];
  // claim is the pending claim.
  Claim claim = 2 [(gogoproto.nullable) = false];
}
