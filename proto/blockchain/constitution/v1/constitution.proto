syntax = "proto3";
package blockchain.constitution.v1;

import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "yamale/blockchain/x/constitution/types";

// Invariants are the values this chain fixes at genesis and will not let an
// ordinary governance proposal change.
//
// Every other parameter on this chain is a mutable gov param, and that was not
// a theoretical weakness: recovery_destination — the single address seized
// assets may be sent to — was found empty on the running devnet, which means a
// seizure carried by two thirds of the validator set would have had nowhere to
// send what it took, and nobody noticed until a console happened to print it.
// A parameter that nothing refuses to change is a parameter nothing is
// checking.
//
// What belongs here is narrow and deliberate: the numbers a majority would have
// an interest in moving in the moment it wanted to act. A chain that can vote
// to lower its own seizure threshold does not have one, and a cap enforced at
// an epoch the same vote can lengthen is not enforced at every epoch — which is
// why the epoch length is in this message and not in x/validatorgov's params.
//
// The values are not duplicated state. x/enforcement still stores its own
// Params; what changed is that both its MsgUpdateParams and its InitGenesis
// refuse anything that disagrees with the copy here. Divergence is therefore
// unrepresentable rather than merely unlikely, and the modules that read these
// values at speed keep reading their own store.
//
// Zero is "unset" for every field. That is why InitGenesis refuses a zero
// rather than substituting a default: an address compiled into a binary is not
// the foundation on somebody else's network, and a cap that defaulted itself
// into existence would be a cap nobody chose.
message Invariants {
  option (gogoproto.equal) = true;

  // max_entity_power_bps is the share of voting power one legal entity may
  // hold, in basis points.
  //
  // Under equal seats this is countable rather than arithmetic: with one seat
  // per admitted validator, 2000 is "no entity holds more than a fifth of the
  // seats", which a supervisor can check against a list without recomputing
  // anything.
  uint64 max_entity_power_bps = 1;

  // max_beneficial_owner_power_bps is the same ceiling applied to the ultimate
  // beneficial owner behind the entities, which is the number that actually
  // matters. Two subsidiaries of one state bank are two entities and one owner,
  // and it is the owner that decides how they both vote.
  uint64 max_beneficial_owner_power_bps = 2;

  // max_jurisdiction_power_bps is the ceiling on the power answering to any one
  // national authority. It is what makes open accession possible: a sovereign
  // is never refused, only admitted at a bounded weight, so balance is kept by
  // arithmetic instead of by a refusal that would be read as exclusion.
  uint64 max_jurisdiction_power_bps = 3;

  // concentration_epoch_blocks is how often the ceilings above are checked and
  // breaches corrected.
  //
  // It is constitutional for the same reason the ceilings are. Concentration is
  // a state, not an event — it changes when a bank acquires a participant, when
  // two members merge, when an operator is nationalised — so the only thing
  // standing between a cap and a dead letter is that the check keeps running.
  // A proposal able to set this to a billion blocks would repeal the caps
  // without appearing to touch them.
  uint64 concentration_epoch_blocks = 4;

  // min_active_validators is the size below which the epoch check stops
  // demoting and starts merely reporting.
  //
  // A cap can be arithmetically unsatisfiable: three validators under three
  // owners cannot all sit below a fifth of the power, and a check that kept
  // demoting until the ceiling held would demote the chain to a halt. So the
  // floor is explicit and a breach it cannot correct is recorded and emitted as
  // an event instead. Enforcement must never be the thing that stops the chain
  // — an uncorrectable breach that everyone can see is strictly better than a
  // network that no longer produces blocks.
  uint32 min_active_validators = 5;

  // enforcement_threshold_bps is x/enforcement's seizure threshold: the share
  // of voting power that must vote yes before assets are taken. It is fixed
  // here because it is the first number a set that wanted to seize something
  // would have an interest in lowering, and lowering it is exactly the move
  // that would be indistinguishable from a routine parameter change.
  uint64 enforcement_threshold_bps = 6;

  // enforcement_recovery_destination is the only address seized assets may be
  // sent to. Fixed here because a mutable destination is the difference between
  // a recovery mechanism and a theft mechanism: the threshold decides whether
  // funds move, this decides who ends up with them.
  //
  // It is an x/group policy account, so the two fields below say what that
  // policy has to look like. Together the three describe the whole custody
  // arrangement: this address, held by exactly foundation_custodian_count
  // people, any foundation_signature_threshold of whom can act.
  string enforcement_recovery_destination = 7 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // enforcement_voting_period_blocks and
  // enforcement_provisional_freeze_blocks are the two delays that make a
  // seizure answerable. Shortening the voting period is how a supermajority
  // becomes whoever was awake; shortening the freeze is how an account is
  // handed back mid-case. Both are the sort of change that reads as
  // housekeeping and is not.
  uint64 enforcement_voting_period_blocks = 8;

  uint64 enforcement_provisional_freeze_blocks = 9;

  // amendment_delay_blocks is how long a proposed amendment sits in public
  // before it can take effect. Weeks, not hours: the delay is the whole
  // protection, because it is the window in which anyone who would be harmed by
  // the change finds out it is coming while they can still act on it.
  uint64 amendment_delay_blocks = 10;

  // amendment_threshold_bps is the share of the voting power recorded when the
  // amendment was proposed that must separately ratify it, in basis points.
  //
  // Separately, because a gov proposal passes on whatever threshold x/gov
  // happens to carry, and x/gov's thresholds are ordinary mutable params — so
  // an amendment ratified only through gov could be ratified by first voting
  // gov's own numbers down. The ratification here is measured against a
  // snapshot taken when the amendment opened, so it cannot be passed by
  // shrinking the electorate either.
  uint64 amendment_threshold_bps = 11;

  // foundation_custodian_count is how many people hold the account seized
  // assets are sent to, and it is an exact number rather than a floor.
  //
  // Exact, because the failure it prevents is a ratchet rather than an event.
  // A custodian leaves and the group drops to four: that is not "one short",
  // it moves the rule from three of five to three of four, so the people who
  // remain each hold more of the authority than the set agreed they should.
  // Lose another and it is three of three, where every custodian holds a veto
  // and one unreachable person freezes the account permanently. Nobody votes
  // for that; it is arrived at by taking two individually reasonable decisions
  // in sequence, months apart, each one obviously fine on its own.
  //
  // So a departure and a replacement are one decision. x/group's
  // MsgUpdateGroupMembers carries adds and removes in the same message, which
  // makes the swap the native operation rather than a convention, and an ante
  // decorator refuses any update that would leave the foundation group at a
  // different size — including MsgLeaveGroup, which is a custodian shrinking
  // the set with nobody's agreement but their own.
  uint32 foundation_custodian_count = 12;

  // foundation_signature_threshold is how many of them must sign.
  //
  // Constitutional rather than an ordinary group decision because the group is
  // its own admin: without this, three custodians could vote to make it two,
  // and the arrangement that took a ceremony to establish would be changed by
  // the people it constrains, in one proposal, with a week's notice. Moving it
  // now costs a proposal, three weeks in public and a four-fifths ratification
  // — which is the right weight for "how many people it takes to move seized
  // property".
  uint32 foundation_signature_threshold = 13;
}

// AmendmentStatus is where an amendment has got to.
enum AmendmentStatus {
  option (gogoproto.goproto_enum_prefix) = false;

  // AMENDMENT_STATUS_UNSPECIFIED is the unset default and is never valid.
  AMENDMENT_STATUS_UNSPECIFIED = 0;

  // AMENDMENT_STATUS_PENDING is proposed, in public, and counting down. It is
  // collecting ratifications and has changed nothing.
  AMENDMENT_STATUS_PENDING = 1;

  // AMENDMENT_STATUS_ENACTED means the delay ran out with enough ratified
  // power behind it and the invariants were replaced.
  AMENDMENT_STATUS_ENACTED = 2;

  // AMENDMENT_STATUS_LAPSED means the delay ran out without enough ratified
  // power. It is deliberately not the same status as withdrawn: lapsed is the
  // record of an amendment the validator set declined to ratify, and that is
  // precisely the history worth keeping.
  AMENDMENT_STATUS_LAPSED = 3;

  // AMENDMENT_STATUS_WITHDRAWN means governance took it back before the delay
  // ran out.
  AMENDMENT_STATUS_WITHDRAWN = 4;
}

// Amendment is one attempt to change the invariants, and everything the chain
// did about it. Amendments are never deleted: an amendment that lapsed is the
// record of somebody having tried to move a ceiling, and a set of amendments
// filtered down to the ones that succeeded would hide exactly the pattern worth
// noticing.
message Amendment {
  // id is numbered from one. Zero is reserved because in proto3 an id of 0 is
  // indistinguishable from an unset field, and "amendment 0" would be a record
  // nobody could look up.
  uint64 id = 1;

  // proposed is the complete replacement set. Whole rather than a delta, so
  // that what the chain will hold after enactment is on the record from the day
  // it was proposed, and nobody has to reconstruct it from a diff against a
  // state that may itself have been amended in between.
  Invariants proposed = 2 [(gogoproto.nullable) = false];

  // reason is the stated grounds, in plain words. Required: a proposal to move
  // the numbers this chain promised not to move should have to say why.
  string reason = 3;

  int64 proposed_at_height = 4;

  // effective_at_height is the earliest height the amendment can take effect.
  // It is fixed when the amendment opens, from the delay in force at that
  // moment, so an amendment that shortens the delay cannot shorten its own.
  int64 effective_at_height = 5;

  // snapshot_power is the total voting power at the moment the amendment
  // opened. Ratification is measured against this and not against the power
  // bonded when the delay runs out, because a threshold measured against the
  // set that remains is passed by jailing everyone who would have voted no.
  int64 snapshot_power = 6;

  // ratified_power is the power that has ratified so far, accumulated as each
  // ratification arrives at the weight the validator carried then. Kept as a
  // running total rather than recomputed at enactment for the same reason: a
  // tally recomputed at the end is a tally that can be changed by changing the
  // set.
  int64 ratified_power = 7;

  AmendmentStatus status = 8;

  int64 resolved_at_height = 9;
}

// Ratification is one validator agreeing to one amendment, at the weight it
// carried when it agreed. Recorded individually rather than only as a total so
// that who ratified a change to the seizure threshold is answerable for it
// afterwards, which is the only sanction available against a set that votes
// itself more power.
message Ratification {
  uint64 amendment_id = 1;

  // validator is the operator address in its account form, matching how every
  // other record in this repository keys a validator.
  string validator = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  int64 power = 3;

  int64 height = 4;
}
