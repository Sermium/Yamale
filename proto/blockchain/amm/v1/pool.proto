syntax = "proto3";
package blockchain.amm.v1;

option go_package = "yamale/blockchain/x/amm/types";

// Pool defines the Pool message.
message Pool {
  uint64 id = 1;
  string denom_a = 2;
  string denom_b = 3;
  string reserve_a = 4;
  string reserve_b = 5;
  string total_shares = 6;
  uint64 swap_fee_bps = 7;
}
