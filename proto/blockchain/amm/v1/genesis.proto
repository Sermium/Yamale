syntax = "proto3";

package blockchain.amm.v1;

import "amino/amino.proto";
import "blockchain/amm/v1/params.proto";
import "blockchain/amm/v1/pool.proto";
import "gogoproto/gogo.proto";

option go_package = "yamale/blockchain/x/amm/types";

// GenesisState defines the amm module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  repeated Pool pool_list = 2 [(gogoproto.nullable) = false];
  uint64 pool_count = 3;
}
