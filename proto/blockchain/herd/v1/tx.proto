syntax = "proto3";

package blockchain.herd.v1;

import "amino/amino.proto";
import "blockchain/herd/v1/herd.proto";
import "blockchain/herd/v1/params.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "yamale/blockchain/x/herd/types";

// Msg is the write side of the national livestock registry: admit an office,
// enrol a herd, identify an animal, certify its parentage, record a health
// campaign, and move an animal from one keeper to another under supervision.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams sets the module parameters. Governance only.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // RegisterAuthority admits a registry office. Governance only, and the
  // office must be a group account: enrolling a herd, certifying parentage and
  // validating a transfer are each a single signature otherwise.
  rpc RegisterAuthority(MsgRegisterAuthority) returns (MsgRegisterAuthorityResponse);

  // EnrolHerd records a herd at level 1 — the level that can actually cover
  // twenty-one million head, because it is costed per herd rather than per
  // animal.
  rpc EnrolHerd(MsgEnrolHerd) returns (MsgEnrolHerdResponse);

  // IdentifyAnimal records one animal at level 2, bound to its record by an
  // ISO 11784/11785 transponder fitted by an accredited agent.
  rpc IdentifyAnimal(MsgIdentifyAnimal) returns (MsgIdentifyAnimalResponse);

  // CertifyAnimal raises an animal to level 3: a DNA profile and photographic
  // biometrics, and a pedigree that refers to records rather than naming
  // names. The registry refuses a line it can prove impossible.
  rpc CertifyAnimal(MsgCertifyAnimal) returns (MsgCertifyAnimalResponse);

  // RecordHealthEvent is what turns a vaccination campaign into verifiable
  // coverage rather than a count of doses administered.
  rpc RecordHealthEvent(MsgRecordHealthEvent) returns (MsgRecordHealthEventResponse);

  // ProposeTransfer opens the supervised handover of an animal. Signed by the
  // current keeper, and it freezes the animal against a second transfer.
  rpc ProposeTransfer(MsgProposeTransfer) returns (MsgProposeTransferResponse);

  // AcceptTransfer is the buyer agreeing. A transfer nobody accepted is a
  // transfer that never happened, and requiring it is what stops a keeper
  // assigning an animal to somebody who never asked for it.
  rpc AcceptTransfer(MsgAcceptTransfer) returns (MsgAcceptTransferResponse);

  // AttestTransfer is the accredited agent or veterinarian swearing that the
  // animal presented is the animal on the record. This is the only claim in
  // the system the chain cannot check for itself, which is why it needs a
  // named person answering for it.
  rpc AttestTransfer(MsgAttestTransfer) returns (MsgAttestTransferResponse);

  // ObjectTransfer stops one. Open to anybody, because the person best placed
  // to notice a stolen animal being sold is rarely a party to the sale.
  rpc ObjectTransfer(MsgObjectTransfer) returns (MsgObjectTransferResponse);

  // CompleteTransfer moves the animal, once the window has run and the
  // attestations are in.
  rpc CompleteTransfer(MsgCompleteTransfer) returns (MsgCompleteTransferResponse);

  // RetireAnimal records a death, a slaughter or a sale out of the country.
  // The record stays: a pedigree refers to its ancestors, and deleting one
  // would silently break every descendant's line.
  rpc RetireAnimal(MsgRetireAnimal) returns (MsgRetireAnimalResponse);
}

// MsgUpdateParams sets the module parameters. Governance only.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "blockchain/x/herd/MsgUpdateParams";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  Params params = 2 [(gogoproto.nullable) = false];
}
// MsgUpdateParamsResponse is empty.
message MsgUpdateParamsResponse {}

// MsgRegisterAuthority admits a registry office.
message MsgRegisterAuthority {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "blockchain/x/herd/MsgRegisterAuthority";

  // x/gov. Offices are admitted by the chain's governance, never by each other.
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string office = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string name = 3;
  string jurisdiction = 4;
  bool active = 5;
}
// MsgRegisterAuthorityResponse is empty.
message MsgRegisterAuthorityResponse {}

// MsgEnrolHerd records a herd, and it is the message that has to be cheap.
message MsgEnrolHerd {
  option (cosmos.msg.v1.signer) = "creator";
  option (amino.name) = "blockchain/x/herd/MsgEnrolHerd";

  // An active registry office.
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // Unique. Two records claiming to be the same file makes reconciliation with
  // the paper world guesswork.
  string reference = 2;

  string keeper = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  Species species = 4;
  uint32 declared_size = 5;
  string locality = 6;
  string location_hash = 7;
}
// MsgEnrolHerdResponse carries the id every later message about this herd
// addresses it by.
message MsgEnrolHerdResponse {
  uint64 id = 1;
}

// MsgIdentifyAnimal records one animal at level 2.
message MsgIdentifyAnimal {
  option (cosmos.msg.v1.signer) = "creator";
  option (amino.name) = "blockchain/x/herd/MsgIdentifyAnimal";

  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 herd_id = 2;

  // The national identifier, in the form the sector already issues:
  // 221/682/021029/L. Unique.
  string national_id = 3;

  // The ISO 11784/11785 transponder code. Unique when present.
  string tag = 4;

  string name = 5;
  Sex sex = 6;
  string coat = 7;
  string born_on = 8;
  string birth_type = 9;
}
// MsgIdentifyAnimalResponse carries the id of the record just created.
message MsgIdentifyAnimalResponse {
  uint64 id = 1;
}

// MsgCertifyAnimal raises an animal to level 3.
//
// The pedigree is given as record ids, not names, and that is the whole
// difference from the certificate the sector issues today. A line of names can
// be neither walked nor contradicted; a line of references can be both.
message MsgCertifyAnimal {
  option (cosmos.msg.v1.signer) = "creator";
  option (amino.name) = "blockchain/x/herd/MsgCertifyAnimal";

  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 animal_id = 2;

  // Zero means unknown, which is honest and common: a founder animal has no
  // recorded parents. It does not mean animal zero, which is never issued.
  uint64 sire_id = 3;
  uint64 dam_id = 4;

  string dna_hash = 5;
  string photo_hash = 6;
}
// MsgCertifyAnimalResponse is empty; the level on the record is the outcome.
message MsgCertifyAnimalResponse {}

// MsgRecordHealthEvent records a treatment against a herd.
message MsgRecordHealthEvent {
  option (cosmos.msg.v1.signer) = "agent";
  option (amino.name) = "blockchain/x/herd/MsgRecordHealthEvent";

  // The accredited agent or veterinarian who administered it. Signed by them
  // rather than by the office, because the signature is the attestation.
  string agent = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  uint64 herd_id = 2;
  string disease = 3;
  string batch = 4;
  uint32 treated = 5;
}
// MsgRecordHealthEventResponse carries the id of the event recorded.
message MsgRecordHealthEventResponse {
  uint64 id = 1;
}

// MsgProposeTransfer opens a supervised handover.
message MsgProposeTransfer {
  option (cosmos.msg.v1.signer) = "creator";
  option (amino.name) = "blockchain/x/herd/MsgProposeTransfer";

  // The current keeper of the animal.
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 animal_id = 2;
  string to = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string price = 4;
}
// MsgProposeTransferResponse carries the transfer id.
message MsgProposeTransferResponse {
  uint64 id = 1;
}

// MsgAcceptTransfer is the buyer agreeing to receive the animal.
message MsgAcceptTransfer {
  option (cosmos.msg.v1.signer) = "buyer";
  option (amino.name) = "blockchain/x/herd/MsgAcceptTransfer";

  string buyer = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 transfer_id = 2;
}
// MsgAcceptTransferResponse is empty.
message MsgAcceptTransferResponse {}

// MsgAttestTransfer is an accredited agent swearing the animal is the animal.
message MsgAttestTransfer {
  option (cosmos.msg.v1.signer) = "attestor";
  option (amino.name) = "blockchain/x/herd/MsgAttestTransfer";

  string attestor = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 transfer_id = 2;

  // What the attestor actually checked — the tag read back, a photograph
  // taken at the time. Recorded so that a false attestation is a specific
  // claim by a named person rather than a shrug.
  string evidence_hash = 3;
}
// MsgAttestTransferResponse is empty.
message MsgAttestTransferResponse {}

// MsgObjectTransfer stops a transfer.
message MsgObjectTransfer {
  option (cosmos.msg.v1.signer) = "objector";
  option (amino.name) = "blockchain/x/herd/MsgObjectTransfer";

  // Anybody. The person best placed to notice a stolen animal being sold is
  // rarely a party to the sale, and a registry that only heard from the
  // parties would hear nothing.
  string objector = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 transfer_id = 2;
  string reason = 3;
}
// MsgObjectTransferResponse is empty. The effect is the stop, which the
// transfer query reports.
message MsgObjectTransferResponse {}

// MsgCompleteTransfer moves the animal.
message MsgCompleteTransfer {
  option (cosmos.msg.v1.signer) = "creator";
  option (amino.name) = "blockchain/x/herd/MsgCompleteTransfer";

  // Permissionless, deliberately. Every condition has already been checked by
  // the chain, so whoever pays the gas is irrelevant — and requiring a
  // particular signer would let that signer sit on a completed sale.
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 transfer_id = 2;
}
// MsgCompleteTransferResponse is empty; the new holder is on the record.
message MsgCompleteTransferResponse {}

// MsgRetireAnimal records that an animal is gone.
message MsgRetireAnimal {
  option (cosmos.msg.v1.signer) = "creator";
  option (amino.name) = "blockchain/x/herd/MsgRetireAnimal";

  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 animal_id = 2;
  string reason = 3;
}
// MsgRetireAnimalResponse is empty.
message MsgRetireAnimalResponse {}
