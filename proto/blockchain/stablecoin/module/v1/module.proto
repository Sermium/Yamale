syntax = "proto3";
package blockchain.stablecoin.module.v1;

import "cosmos/app/v1alpha1/module.proto";

option go_package = "yamale/blockchain/x/stablecoin/types";

// Module is the config object for the module.
message Module {
  option (cosmos.app.v1alpha1.module) = {go_import: "yamale/blockchain/x/stablecoin"};

  // authority defines the custom module authority.
  // If not set, defaults to the governance module.
  string authority = 1;
}
