syntax = "proto3";

package blockchain.stablecoin.v1;

import "amino/amino.proto";
import "blockchain/stablecoin/v1/approved_issuer.proto";
import "blockchain/stablecoin/v1/issuer_application.proto";
import "blockchain/stablecoin/v1/params.proto";
import "gogoproto/gogo.proto";

option go_package = "yamale/blockchain/x/stablecoin/types";

// GenesisState defines the stablecoin module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  repeated IssuerApplication issuer_application_map = 2 [(gogoproto.nullable) = false];
  repeated ApprovedIssuer approved_issuer_map = 3 [(gogoproto.nullable) = false];
}
