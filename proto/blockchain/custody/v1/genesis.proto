syntax = "proto3";
package blockchain.custody.v1;

import "blockchain/custody/v1/custody.proto";
import "blockchain/custody/v1/params.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "yamale/blockchain/x/custody/types";

// GenesisState defines the custody module's genesis state.
message GenesisState {
  Params params = 1 [(gogoproto.nullable) = false];
  repeated Asset assets = 2 [(gogoproto.nullable) = false];
  repeated string attestors = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  repeated Deposit deposits = 4 [(gogoproto.nullable) = false];
  repeated Redemption redemptions = 5 [(gogoproto.nullable) = false];
  // Reserve was carried here until 2026-09-05, when it became derived state:
  // the published figure is now computed from the per-attestor reports
  // below, and carrying both would be two copies of one fact, able to
  // disagree. The reports are the record; the reserve is a reading of it.
  reserved 6;
  repeated ReserveReport reserve_reports = 9 [(gogoproto.nullable) = false];
  // next_deposit and next_redemption carry the sequences, so an exported chain
  // resumes numbering rather than reissuing ids that already exist.
  uint64 next_deposit = 7;
  uint64 next_redemption = 8;
}
