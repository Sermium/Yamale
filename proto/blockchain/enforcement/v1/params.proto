syntax = "proto3";
package blockchain.enforcement.v1;

import "amino/amino.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "yamale/blockchain/x/enforcement/types";

// SeizureDelayTier is one step in the schedule that decides how long a seizure
// waits between being decided and being carried out.
//
// A tier matches when the value the case assessed reaches its threshold in that
// denomination, and a case takes the longest delay of every tier it matches.
// Longest rather than first, so the schedule does not depend on the order
// governance happened to write it in — an ordering bug in a parameter list is
// invisible until the day it lets somebody's life savings move at the speed
// meant for pocket change.
message SeizureDelayTier {
  // Params compares itself field by field, so every message inside it needs to
  // be comparable too.
  option (gogoproto.equal) = true;

  // threshold is the smallest amount, in base units, that falls into this tier.
  cosmos.base.v1beta1.Coin threshold = 1 [(gogoproto.nullable) = false];

  // delay_blocks is how long a case in this tier waits after the vote before
  // anything moves.
  uint64 delay_blocks = 2;
}

// Params defines the parameters for the module.
//
// Every one of these is a limit on a power the chain would rather not need. The
// module can freeze an account and take what is in it, so the parameters are
// written to make that hard to do quietly, hard to do to the wrong person, and
// impossible to do to somebody's benefit other than the recovery destination's.
message Params {
  option (amino.name) = "blockchain/x/enforcement/Params";
  option (gogoproto.equal) = true;

  // voting_period_blocks is how long validators have to vote on a case.
  //
  // It trades two failures against each other. Too short and a case resolves
  // before validators in other timezones have seen it, which is how a
  // supermajority becomes whoever was awake. Too long and a scammer has that
  // long to move funds — which is why opening a case freezes the account
  // immediately rather than at the end of the vote.
  uint64 voting_period_blocks = 1;

  // provisional_freeze_blocks is how long the freeze that comes with opening a
  // case lasts if the case is never resolved.
  //
  // This is the safety valve on the fastest, least deliberated power in the
  // module: one validator can freeze an account, so that freeze has to expire
  // by itself. It should comfortably exceed voting_period_blocks — a freeze
  // that lapsed mid-vote would hand the account back before the chain had
  // decided anything.
  uint64 provisional_freeze_blocks = 2;

  // threshold_bps is the share of bonded voting power, in basis points, that
  // must vote yes for a case to pass. 6667 is two thirds.
  //
  // Measured against the power bonded when the case opened, not against the
  // power that voted: a threshold of "most of those who turned up" is passed
  // by two validators when nobody else votes.
  uint64 threshold_bps = 3;

  // recovery_destination is where seized assets are sent — the foundation
  // account, which holds them so they can be restituted to the people they
  // were taken from. Nothing else in the module can name a destination, so no
  // case can ever move funds to whoever opened it, and changing it takes a
  // governance proposal that everyone can see.
  //
  // It is required. It has no default, because no address compiled into the
  // binary is the foundation on somebody else's network, and a genesis that
  // leaves it empty is refused rather than started: a chain with no
  // destination can still pass a seizure by two thirds of its validators and
  // then have nowhere to send what it took.
  string recovery_destination = 4 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // max_reason_length bounds the stated grounds for a case, and
  // max_evidence_uri_length the link to the evidence held off-chain. Both are
  // stored forever and shown to whoever is being accused.
  uint64 max_reason_length = 5;
  uint64 max_evidence_uri_length = 6;

  // seize_requires_evidence refuses to open a seizure case without an evidence
  // URI and hash. Freezing on suspicion is defensible; taking somebody's assets
  // with nothing on the record is not.
  bool seize_requires_evidence = 7;

  // emergency_authority is an address that can freeze and release immediately,
  // without waiting for the validator vote — in practice a founders' M-of-N
  // group policy.
  //
  // It exists because the validator process has two failure modes that a
  // permissioned network cannot simply wait out: a set too large or too spread
  // out to reach two thirds within the voting period, and a freeze that was
  // plainly wrong sitting on somebody's account until that period expires. The
  // emergency path answers both, and is deliberately bounded to the two actions
  // that cannot end with somebody's assets in a third party's hands: it can
  // stop money and it can let it go again. It can never take any.
  //
  // A freeze it imposes is provisional like any other — it lapses unless the
  // validators confirm it, and it is lifted if they refuse. Fast, then
  // answerable.
  //
  // Empty disables the path entirely, which is the default: a chain that has
  // not named a founders' group has no emergency authority rather than an
  // implicit one.
  string emergency_authority = 8 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // seizure_delay_blocks is the shortest a seizure can ever wait between the
  // validators deciding it and it being carried out. Every seizure waits at
  // least this long, whatever it is worth.
  //
  // The delay is not caution for its own sake, it is the window in which a
  // decision can still be undone at no cost to anybody: the ombudsman's veto
  // and governance's reversal both land here, and before it expires nothing has
  // been taken and nothing has to be given back. A delay of zero is refused
  // because a veto that has no window in which to be cast is not a veto.
  uint64 seizure_delay_blocks = 9;

  // seizure_delay_tiers scales that wait with what is being taken.
  //
  // Taking a market trader's float and taking a family's savings should not
  // move at the same speed, because the cost of getting the second one wrong is
  // not the same and the time somebody needs to notice and object is not the
  // same either. The schedule is a parameter rather than a constant so that a
  // deployment sets it against its own currency and its own idea of what a
  // large sum is; there is no amount that means "large" on every chain this is
  // shipped to.
  //
  // At least one tier is required, and that is the whole point of the field: a
  // chain with no tiers has a constant, and a constant is what this exists to
  // replace.
  repeated SeizureDelayTier seizure_delay_tiers = 10 [(gogoproto.nullable) = false];

  // seizure_window_blocks is the length of the rolling window that the caps
  // below are measured over.
  //
  // Rolling, not periodic. A window that reset on a fixed boundary would let
  // twice the cap through by placing half the seizures either side of it, and
  // whoever was doing that would be doing it on purpose.
  uint64 seizure_window_blocks = 11;

  // seizure_window_cap is the most that may be seized, per denomination, within
  // any window. A denomination with no entry here is not capped by value —
  // only by the count below.
  //
  // This is the limit that makes mass expropriation impossible rather than
  // merely unpopular. A chain that can take a bounded amount per week cannot be
  // turned on its own users in one sitting, whoever has captured the validator
  // set, because the arithmetic refuses before anybody has to.
  repeated cosmos.base.v1beta1.Coin seizure_window_cap = 12 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];

  // max_seizures_per_window is how many seizures may be carried out within one
  // window, whatever they are worth.
  //
  // It is the half of the cap that cannot be walked around by choosing a
  // denomination nobody thought to price. A value cap only binds the
  // denominations it names; a count cap binds everything, including a currency
  // issued the day after the parameters were last set.
  uint64 max_seizures_per_window = 13;

  // ombudsman is an office appointed outside the validator set that can stop a
  // case and can never start one.
  //
  // The asymmetry is the entire point. An office that can only refuse cannot be
  // used to take anything from anybody, so appointing one adds a check without
  // adding a power — which is the only kind of oversight worth having over a
  // module like this one. It is enforced structurally rather than by trust:
  // there is no message in this service that the ombudsman may sign and that
  // opens, votes on, sweeps or otherwise advances a case, and the parameters
  // refuse an ombudsman that is also the emergency authority or the recovery
  // destination, because either of those would hand the same office a way in.
  //
  // Empty means there is no ombudsman, which is the default for the same reason
  // the emergency authority's is: no address compiled into a binary is anybody
  // else's independent office, and an implicit one would be worse than none.
  string ombudsman = 14 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}
