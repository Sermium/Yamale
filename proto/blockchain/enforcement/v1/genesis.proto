syntax = "proto3";

package blockchain.enforcement.v1;

import "amino/amino.proto";
import "blockchain/enforcement/v1/enforcement.proto";
import "blockchain/enforcement/v1/params.proto";
import "gogoproto/gogo.proto";

option go_package = "yamale/blockchain/x/enforcement/types";

// GenesisState defines the enforcement module's genesis state.
//
// Freezes are exported with the cases that justify them, and both are imported
// as they were. A chain that dropped its freezes on export would hand every
// frozen account back at the next upgrade, quietly, at exactly the moment
// nobody is watching balances.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];

  repeated Case cases = 2 [(gogoproto.nullable) = false];
  repeated Vote votes = 3 [(gogoproto.nullable) = false];
  repeated Freeze freezes = 4 [(gogoproto.nullable) = false];

  // case_count is the next id to hand out. Exported explicitly because ids are
  // referenced by freezes and votes, so rebuilding it from the highest case
  // present would collide the moment a case is ever removed.
  uint64 case_count = 5;
}
