syntax = "proto3";

package blockchain.enforcement.v1;

import "amino/amino.proto";
import "blockchain/enforcement/v1/enforcement.proto";
import "blockchain/enforcement/v1/params.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "yamale/blockchain/x/enforcement/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams defines a (governance) operation for updating the module
  // parameters. The authority defaults to the x/gov module account.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // OpenCase accuses an address, and freezes it while the validators decide.
  rpc OpenCase(MsgOpenCase) returns (MsgOpenCaseResponse);

  // VoteCase records one validator's judgement.
  rpc VoteCase(MsgVoteCase) returns (MsgVoteCaseResponse);

  // WithdrawCase takes back a case before the vote ends, lifting its freeze.
  rpc WithdrawCase(MsgWithdrawCase) returns (MsgWithdrawCaseResponse);

  // Sweep collects whatever a passed seizure can now reach. Permissionless and
  // repeatable: funds that were staked arrive later, when unbonding matures,
  // and somebody has to be able to collect them without another vote.
  rpc Sweep(MsgSweep) returns (MsgSweepResponse);

  // EmergencyFreeze lets a country's enforcement authority stop an account in
  // one block, without waiting for a validator to open a case.
  rpc EmergencyFreeze(MsgEmergencyFreeze) returns (MsgEmergencyFreezeResponse);

  // EmergencyRelease lets it let the account go again, just as fast.
  rpc EmergencyRelease(MsgEmergencyRelease) returns (MsgEmergencyReleaseResponse);

  // OmbudsmanVeto stops a case that has not taken anything yet. The only
  // message the ombudsman may sign, and the only thing it can do.
  rpc OmbudsmanVeto(MsgOmbudsmanVeto) returns (MsgOmbudsmanVetoResponse);

  // ReverseCase is governance overturning a passed case: the appeal. It lifts
  // the freeze and records the reversal, and it is deliberately a slower
  // instrument than the one that imposed the freeze, because it is the one used
  // when the chain got it wrong.
  rpc ReverseCase(MsgReverseCase) returns (MsgReverseCaseResponse);
}

// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "blockchain/x/enforcement/MsgUpdateParams";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the module parameters to update.

  // NOTE: All parameters must be supplied.
  Params params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}

// MsgOpenCase opens a case against an address and freezes it immediately.
//
// One signature is enough to open one, which is the point: a scam is drained in
// minutes and a vote takes hours, so the freeze cannot wait for the vote. What
// stops that being an arbitrary power is that the freeze expires by itself, the
// case is public from the first block, and taking anything needs the
// supermajority.
//
// Accusation and decision are separate offices, and this message is only the
// first of them. Two kinds of account may accuse:
//
//   - a bonded validator, exactly as before. This message has never narrowed
//     what a validator may do and does not now.
//   - a holder of ROLE_ENFORCEMENT_AUTHORITY covering the target's country — a
//     national enforcement office, which is an x/group account of two or more
//     people. Before this existed the role could be granted and no message let
//     it be used, so a country's enforcement authority held a grant that did
//     nothing.
//
// Either way the perimeter check runs against the target's recorded country, so
// widening who may accuse does not widen where anybody may accuse. And either
// way the DECISION is unchanged: two thirds of bonded voting power, cast by
// validators, on MsgVoteCase. The opener's own vote is not assumed from opening
// — an office that is not a validator has no vote at all, so a national
// authority can stop money for a day and cannot decide anything.
message MsgOpenCase {
  option (cosmos.msg.v1.signer) = "opener";
  option (amino.name) = "blockchain/x/enforcement/MsgOpenCase";

  // opener is the account that signs: either a bonded validator's account
  // address — the key it signs with, not its operator address — or the account
  // holding ROLE_ENFORCEMENT_AUTHORITY over the target's country.
  //
  // What gets recorded on the case differs, deliberately. A validator is
  // recorded by its operator address, because that is the name the accusation
  // is legible under; an office is recorded by the account itself, which is the
  // group policy address a role-holders query can be read against. Both are
  // identities somebody can look up, which is the property that matters: an
  // accusation with no visible author is not an accusation.
  string opener = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  string target = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  CaseAction action = 3;

  // reason is the grounds, in words the accused can read.
  string reason = 4;

  // evidence_uri and evidence_hash point at and pin the evidence held
  // off-chain. Required for a seizure unless the parameters say otherwise.
  string evidence_uri = 5;
  string evidence_hash = 6;

  // legal_instrument names the external authority the seizure is carried out
  // under and pins its content. Required for a seizure, always, with no
  // parameter that turns it off — a requirement governance can vote away is a
  // default, and this one is meant to be a requirement. Ignored for a freeze,
  // which takes nothing and has to be openable the minute a theft is noticed.
  LegalInstrument legal_instrument = 7 [(gogoproto.nullable) = false];
}

// MsgOpenCaseResponse returns the new case's id.
message MsgOpenCaseResponse {
  uint64 id = 1;
}

// MsgVoteCase records a validator's judgement on an open case.
message MsgVoteCase {
  option (cosmos.msg.v1.signer) = "voter";
  option (amino.name) = "blockchain/x/enforcement/MsgVoteCase";

  // voter is the validator's account address, the key it signs with. Its
  // operator address and its voting power are read from the staking module.
  string voter = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 case_id = 2;
  VoteOption option = 3;
}

// MsgVoteCaseResponse defines the response structure.
message MsgVoteCaseResponse {}

// MsgWithdrawCase withdraws an open case. Only whoever opened it may.
//
// It deliberately asks for nothing but identity. Whoever opened the case may
// take it back even if the grant that let them open it has since been revoked,
// or the validator has since unbonded: withdrawing lifts a freeze, and a rule
// that made de-escalation conditional on still holding a power would leave
// somebody's account frozen because the office that was wrong about them lost
// its authority afterwards.
message MsgWithdrawCase {
  option (cosmos.msg.v1.signer) = "opener";
  option (amino.name) = "blockchain/x/enforcement/MsgWithdrawCase";

  // opener is the account that opened the case: a validator's account address,
  // or the enforcement authority's own address. It is resolved the same way it
  // was when the case was opened, so whichever of the two forms was recorded is
  // the one that matches.
  string opener = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 case_id = 2;
}

// MsgWithdrawCaseResponse defines the response structure.
message MsgWithdrawCaseResponse {}

// MsgSweep collects what a passed seizure can reach right now.
message MsgSweep {
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name) = "blockchain/x/enforcement/MsgSweep";

  // sender pays for the transaction and gets nothing for it. Anyone may send
  // this: the destination is fixed by the parameters, so there is nothing to
  // gain by being the one who calls it and nothing to lose by letting somebody
  // else.
  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 case_id = 2;
}

// MsgSweepResponse reports what this sweep actually collected, which may be
// nothing if the unbonding has not matured yet.
message MsgSweepResponse {
  repeated cosmos.base.v1beta1.Coin collected = 1 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  bool complete = 2;
}

// MsgOmbudsmanVeto stops a case before it takes anything.
//
// This is the only message whose signer is the ombudsman, and stopping a case
// is the only thing it does. There is no companion message that opens one,
// votes on one, or advances one, and there deliberately never will be: an
// office that could do both would be a second way into this module rather than
// a check on the first.
//
// It works on a case still being voted on and on a seizure waiting out its
// delay — both states in which nothing has been taken. It does not work on a
// seizure that has already executed, because a veto cannot un-take money and a
// message that pretended to would be telling the record a lie. Reversing an
// executed case is governance's job, through MsgReverseCase, and even that only
// gives the account back rather than the funds.
//
// A veto is not permanent protection and is not meant to be. Any validator may
// open a fresh case against the same target in the next block; what the veto
// buys is that doing so is a new, public accusation, and stopping it again
// costs the ombudsman another signature on the record.
message MsgOmbudsmanVeto {
  option (cosmos.msg.v1.signer) = "ombudsman";
  option (amino.name) = "blockchain/x/enforcement/MsgOmbudsmanVeto";

  // ombudsman must equal the ombudsman parameter.
  string ombudsman = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  uint64 case_id = 2;

  // reason is why the case was stopped, kept beside the original accusation.
  // Required: an office whose refusals need no grounds is not accountable
  // either, and this one is a check rather than a privilege.
  string reason = 3;
}

// MsgOmbudsmanVetoResponse defines the response structure.
message MsgOmbudsmanVetoResponse {}

// MsgReverseCase overturns a passed case. Governance only.
message MsgReverseCase {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "blockchain/x/enforcement/MsgReverseCase";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 case_id = 2;

  // reason is why it was overturned, kept beside the original accusation.
  string reason = 3;
}

// MsgReverseCaseResponse defines the response structure.
message MsgReverseCaseResponse {}

// MsgEmergencyFreeze freezes an account on an enforcement authority's signature
// alone.
//
// There is no matching emergency seizure, and that is the whole shape of this
// power. Stopping money is recoverable — the account is released and nothing
// was lost but time. Taking it is not, so it stays with the validator
// supermajority no matter who is asking.
//
// The freeze this creates is provisional exactly like a validator's: it opens a
// case, it lapses if nobody confirms it, and the validators can refuse it. The
// authority is faster than the set; it is not above it.
//
// What separates it from MsgOpenCase, now that both accept the same role, is
// what it does NOT require: no bonded validator anywhere in the picture, and no
// legal instrument, because it can only freeze. It is the same act with the
// validator step removed from the front, which is what an emergency is.
message MsgEmergencyFreeze {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "blockchain/x/enforcement/MsgEmergencyFreeze";

  // authority must hold ROLE_ENFORCEMENT_AUTHORITY covering the country the
  // target account is recorded in.
  //
  // It used to be a single address named in the module's parameters, chain-wide,
  // able to freeze anything. The perimeter is the difference: an authority that
  // needs to stop an account outside its own country needs the authority of that
  // country, urgently or otherwise. Skipping the jurisdiction check because the
  // situation is urgent would make the one path that acts on a single signature
  // also the one path with no territorial limit.
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  string target = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // reason is the grounds, in words the accused can read. Required, the same
  // as for a validator's case: acting in an emergency is not a reason to leave
  // the record blank, it is the reason the record matters.
  string reason = 3;

  string evidence_uri = 4;
  string evidence_hash = 5;
}

// MsgEmergencyFreezeResponse returns the new case's id.
message MsgEmergencyFreezeResponse {
  uint64 id = 1;
}

// MsgEmergencyRelease lifts a freeze immediately, whoever imposed it.
//
// This is the half that makes the emergency authority worth having. A freeze
// opened on a misread transaction otherwise sits on somebody's account for the
// whole voting period, and "wait a day, it expires by itself" is not an answer
// anyone can give a customer whose payroll is stuck.
//
// Scoped like the freeze, against the country of the case's TARGET rather than
// of anything named in this message. Releasing is a smaller act than freezing
// and it would have been defensible to leave it chain-wide, but an office able
// to release anywhere could lift the freeze another country's authority had just
// imposed — which is interference in that perimeter, not mercy in its own.
message MsgEmergencyRelease {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "blockchain/x/enforcement/MsgEmergencyRelease";

  // authority must hold ROLE_ENFORCEMENT_AUTHORITY covering the country the
  // case's target is recorded in.
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 case_id = 2;

  // reason is why it was released, kept beside the original accusation. The
  // case is not deleted: a freeze that was lifted as a mistake is part of the
  // record of how this power has been used.
  string reason = 3;
}

// MsgEmergencyReleaseResponse defines the response structure.
message MsgEmergencyReleaseResponse {}
