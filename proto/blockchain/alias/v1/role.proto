syntax = "proto3";
package blockchain.alias.v1;

import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "yamale/blockchain/x/alias/types";

// Role is a power an account may be granted inside a perimeter.
//
// The list is short and closed on purpose. A role is only worth having if some
// module refuses an action without it, so a role nothing consults is a name in
// a registry pretending to be a control — and the way that happens is by
// letting the set grow faster than the checks.
enum Role {
  option (gogoproto.goproto_enum_prefix) = false;

  // ROLE_UNSPECIFIED is the unset default and is never valid.
  //
  // The zero value is reserved rather than given to a real role, and every
  // path refuses it. Proto3 cannot tell a zero from an absent field, so a
  // grant whose role happened to be the first of the list would be
  // indistinguishable from a grant whose role nobody filled in — and the
  // second must never be honoured.
  ROLE_UNSPECIFIED = 0;

  // ROLE_REGISTRY_AUTHORITY is a lands commission or cadastral office:
  // registering a parcel, validating a transfer, freezing land.
  ROLE_REGISTRY_AUTHORITY = 1;

  // ROLE_MONETARY_AUTHORITY is a central bank: admitting the issuer of a
  // currency inside its jurisdiction.
  ROLE_MONETARY_AUTHORITY = 2;

  // ROLE_PAYMENTS_AUTHORITY admits the institutions that may appear on a
  // payment instruction. Separate from the monetary authority because
  // licensing a payment service provider and issuing money are different
  // offices in most of the deployments this chain is built for, and collapsing
  // them here would force one key to hold both.
  ROLE_PAYMENTS_AUTHORITY = 3;

  // ROLE_ENFORCEMENT_AUTHORITY may stop an account: opening a case against it,
  // or freezing it outright.
  ROLE_ENFORCEMENT_AUTHORITY = 4;

  // ROLE_SUPERVISOR is oversight without the power to act — the role held by
  // an auditor or a regulator that watches a perimeter it does not administer.
  // It is granted through the same registry as the rest so that "who is
  // watching this country" has one answer in one place.
  //
  // What it confers is a READING entitlement, and the shape of it is decided by
  // a fact about gRPC rather than by preference: a query carries no signer, so
  // the chain cannot gate a read by role and any design that pretended to would
  // be worse than an empty role. Ordinary read access on a deployment is
  // controlled at the proxy.
  //
  // So the entitlement is over the one body of data the chain does NOT serve to
  // whoever asks: the encrypted payload of a payment. A holder of this role in
  // country X is entitled to be a viewing-key recipient of every payload whose
  // declared settlement jurisdiction is X — the same declaration that decides
  // which authority may act on a cross-border payment, which is what makes it
  // the right field. The set is published by Query/PayloadReaders, so a sender
  // resolves "who must this be sealed to" from the grant registry rather than
  // from a list somebody maintains.
  //
  // Two consequences the chain can actually enforce, and one it cannot:
  //
  //   - a country's appointed regulator must hold this role covering that
  //     country. AppointRegulator refuses otherwise, so the most powerful grant
  //     the confidentiality design makes cannot be handed to an account that
  //     holds nothing in the perimeter registry, and "who is watching this
  //     country" really does have one answer in one place.
  //   - a grant of it is made by governance or by the foundation like any
  //     other, and revoking it removes the holder from every future payload's
  //     recipient set.
  //   - it cannot force a sender to seal to the holder. The envelope is built
  //     off-chain and the chain only ever sees a hash of the plaintext, so a
  //     sender that ignores the published set produces a payload the supervisor
  //     can never open, and nothing on chain detects it. That is a limit of
  //     where the ciphertext lives, not a gap in the registry.
  //
  // And it confers nothing else. A supervisor may not open an enforcement case,
  // freeze, seize, register or validate land, admit an issuer or a participant,
  // grant a role, correct a jurisdiction, or appoint a regulator. Oversight
  // without the power to act, which is what the name says.
  ROLE_SUPERVISOR = 5;

  // ROLE_FOUNDATION_ADMINISTRATOR is the chain-wide authority that places
  // accounts: it may correct an account's recorded country, appoint a country's
  // regulator, grant the time-boxed auditor role, and hold an identifier with no
  // country behind it.
  //
  // It replaces the alias module's foundation_administrators parameter, which
  // was a list of up to eight addresses appointed by MsgUpdateParams. Collapsing
  // the two mechanisms is the point. Enrolling a country needed BOTH the
  // foundation group (to grant roles) and a foundation administrator (to place
  // the offices' own accounts); they were unrelated lists that happened to share
  // a name, and holding one without the other produced a proposal that passed
  // and an office that could not work.
  //
  // It is CHAIN-WIDE OR NOTHING. A grant of it naming a country is refused, and
  // that refusal is what preserves today's authority exactly: by the rule in
  // GrantRole, a chain-wide scope may be granted by governance and by nobody
  // else — which is the same body that could edit the parameter list. The
  // foundation's power to admit a country is untouched and is not widened into
  // the power to appoint the accounts that stand outside every country.
  //
  // A country scope would also be meaningless rather than merely wrong. What the
  // role exempts is the ABSENCE of a national perimeter, so an administrator of
  // one country is an account claiming an exemption from a rule it is already
  // inside.
  //
  // The cap the parameter carried survives the move — see
  // MaxFoundationAdministrators — because the reason for it survives: this is
  // the single exception to "every account has a jurisdiction", and it must not
  // be possible to widen it without somebody seeing.
  ROLE_FOUNDATION_ADMINISTRATOR = 6;
}

// RoleGrant is the triple the whole perimeter is built from: who, what role,
// where.
//
// It is created and removed by governance and by nobody else. A role its own
// holder could grant is not a perimeter, and neither is one another holder of
// the same role could hand out — buying one office would buy the power to
// manufacture the rest.
message RoleGrant {
  // holder is the granted account. Expected to be an x/group account wherever
  // the decision the role carries should be M-of-N rather than one official's
  // key; that expectation is checked at grant time rather than trusted, for
  // the same reason x/land refuses a registry office that is a plain key.
  string holder = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // role is what the holder may do. Never ROLE_UNSPECIFIED.
  Role role = 2;

  // jurisdiction is where the holder may do it: an ISO 3166-1 alpha-2 country
  // code from the assigned list, or "*" for chain-wide.
  //
  // The chain-wide form is the exception and is meant to stay rare. It has its
  // own query endpoint so a governance console can list every one of them
  // without having to know how to spell the wildcard — an exception nobody can
  // enumerate is an exception nobody audits.
  //
  // Note what cannot appear here: the foundation's reserved code. That code
  // marks the *absence* of a national perimeter, so a grant naming it would be
  // a grant over nowhere, and it would read to a human as chain-wide authority
  // while conferring none. Chain-wide is spelled "*" and only "*".
  string jurisdiction = 3;

  // granted_by is the authority that made the grant. Kept because "who says
  // this account may freeze Nigerian accounts" is the question asked when the
  // answer turns out to be wrong, and an unattributed grant cannot answer it.
  string granted_by = 4 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // granted_at_height is when it was written, so a widening of somebody's
  // powers is visible as a change rather than as a fact that was always there.
  int64 granted_at_height = 5;

  // required_shape is the M-of-N the holder's group must keep in order to keep
  // this authority. Absent means no requirement was recorded.
  //
  // Every check reads it: the perimeter functions resolve the holder's group
  // policy and refuse when the office has fallen below what is written here.
  // That is the whole reason the field exists rather than being a rule applied
  // once at grant time. An office is a group that administers itself, so its
  // members can vote to change their own threshold — a country can hold a
  // proper ceremony, stand up a three-of-five enforcement authority, and that
  // office can later vote itself to one-of-one while keeping the power to
  // freeze accounts. Nothing was notified and nothing refused it, because the
  // only thing the chain ever checked was that the holder *was* a group. A
  // jurisdiction stamped once at account creation and never re-examined is an
  // event; a perimeter is a state, and so is an office's shape.
  //
  // It is a message rather than two integers for one reason, and the reason is
  // presence. A message field is either there or it is not, on the wire and in
  // Go, so "no requirement was recorded" and "a requirement of zero" are
  // different states that no reader can confuse. Two bare uint32 fields could
  // not express that: proto3 cannot tell a zero from a field nobody filled in,
  // which is the trap this repository has been caught by four times, and the
  // permissive reading of an ambiguous zero is exactly the reading an attacker
  // wants. Grants written before this field existed decode with it absent and
  // are unchanged in effect — see OfficeShape for what that costs.
  OfficeShape required_shape = 6;
}

// OfficeShape is an M-of-N, written down before the ceremony and held to
// afterwards.
//
// Both numbers are FLOORS, not equalities, and the asymmetry is the design.
// Adding a member to an office is fine: a three-of-five that becomes a
// three-of-six is more people, not fewer, and refusing it would mean an office
// could never grow without the foundation re-granting its roles. Dropping below
// either number is not fine, and it is the same rule the constitution applies to
// the foundation's own group, for the same reason: three-of-five becoming
// three-of-four moves sixty per cent to seventy-five and walks towards
// unanimity, where one unreachable member freezes the office; and a threshold
// falling to one is the single key the whole arrangement exists to abolish.
//
// What it does NOT constrain is an office tightening itself. An office that
// votes three-of-five up to five-of-five satisfies both floors and can then be
// frozen by one absent member — which is self-harm rather than capture, and a
// rule that refused it would be a rule stopping an office from being more
// careful than it was asked to be.
message OfficeShape {
  // signatures is the fewest members that must sign for the office to act.
  //
  // Checked against how many members it would actually TAKE, which is not the
  // same as the policy's threshold number. x/group votes are weighted, so a
  // group with a threshold of 3 whose members weigh 3, 1, 1, 1 and 1 is a
  // one-of-five wearing a three-of-five's clothes: one member reaches the
  // threshold alone. The check therefore takes the members in descending weight
  // and counts how few of them can reach the threshold. For the equal weights
  // every ceremony produces that is exactly the threshold, and for anything else
  // it is the honest answer to "how many people does it take".
  //
  // Zero is refused rather than read as "no requirement". A requirement that
  // requires nothing reads on a record as though it covered something, and the
  // way to say "no requirement" is to omit required_shape entirely.
  uint32 signatures = 1;

  // members is the fewest members the office must have.
  //
  // Counted over members holding a positive weight, because a member who cannot
  // vote is a name on a list rather than a share of an office — and padding a
  // group with weightless members is the obvious way to satisfy a count while
  // shrinking the number of people who actually decide.
  //
  // Must be at least signatures: a requirement of three signatures from two
  // members describes an office that could never act, and a requirement nothing
  // can satisfy is a requirement that will be waived by whoever hits it.
  uint32 members = 2;
}
