syntax = "proto3";
package blockchain.alias.v1;

import "amino/amino.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "yamale/blockchain/x/alias/types";

// Params defines the parameters for the alias module.
//
// One field, and it grants no power to move money: the module assigns
// identifiers and resolves them, and that is all it can do.
//
// It used to carry a second — foundation_administrators, the accounts exempt
// from the rule that every account carries a country. That is now
// ROLE_FOUNDATION_ADMINISTRATOR in the grant registry, so the exemption and the
// perimeter it is an exception to are held in one place under one rule. See
// role.proto for why, and Migrate2to3 for how the addresses already named were
// carried across.
message Params {
  option (amino.name) = "blockchain/x/alias/Params";
  option (gogoproto.equal) = true;

  // Field 2 held foundation_administrators. Reserved rather than deleted so the
  // number is never reused: a chain that has run carries params bytes with a
  // field 2 in them, and a new field wearing that number would decode somebody's
  // old address list as whatever the new field is.
  reserved 2;
  reserved "foundation_administrators";

  // payload_length is how many characters an identifier carries between its
  // country prefix and its check character. Eight gives 32^8 —
  // 1,099,511,627,776 possibilities, which is eleven times the hundred billion
  // this was specified for.
  //
  // Raising it later issues longer identifiers and invalidates none of the
  // existing ones, because every alias stores its own length and the check
  // character is computed over whatever that is. Nobody will exhaust 1.1
  // trillion; the parameter exists so that a future requirement is a config
  // change rather than a migration.
  //
  // Bounded to 8..16 by Validate. Below eight the space stops being large
  // enough to be unguessable; above sixteen nobody can read it aloud, which
  // defeats the point of the module.
  uint32 payload_length = 1;
}
