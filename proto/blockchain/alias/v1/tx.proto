syntax = "proto3";
package blockchain.alias.v1;

import "amino/amino.proto";
import "blockchain/alias/v1/params.proto";
import "blockchain/alias/v1/role.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "yamale/blockchain/x/alias/types";

// Msg defines the alias Msg service.
//
// There is no MsgSetAlias, because identifiers are assigned rather than chosen:
// a chosen handle brings squatting, a resale market, and — the one that costs
// money — impersonation, where YAMALE-PAY and YAMALE-PAY1 look identical in a
// confirmation dialog.
//
// There is no MsgReleaseAlias either. Releasing and re-registering as two
// messages would leave an account unreachable between them, so rotation is one
// atomic message.
//
// There is no MsgClearJurisdiction. Removing a country would put an account
// back into the unclaimed state the perimeter exists to abolish, holding an
// identifier whose prefix names a country the chain no longer records. A
// jurisdiction is corrected, never emptied.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // RegisterAlias issues an identifier to the sending account.
  rpc RegisterAlias(MsgRegisterAlias) returns (MsgRegisterAliasResponse);

  // RotateAlias retires the sender's identifier and issues a new one.
  rpc RotateAlias(MsgRotateAlias) returns (MsgRotateAliasResponse);

  // SetJurisdiction records or corrects the country an account belongs to.
  rpc SetJurisdiction(MsgSetJurisdiction) returns (MsgSetJurisdictionResponse);

  // RegisterViewingKey publishes the sender's X25519 public key, or rotates it.
  rpc RegisterViewingKey(MsgRegisterViewingKey) returns (MsgRegisterViewingKeyResponse);

  // RevokeViewingKey marks one of the sender's key versions compromised.
  rpc RevokeViewingKey(MsgRevokeViewingKey) returns (MsgRevokeViewingKeyResponse);

  // AppointRegulator names the authority holding the viewing key for a country.
  rpc AppointRegulator(MsgAppointRegulator) returns (MsgAppointRegulatorResponse);

  // GrantAuditor grants the time-boxed cross-account reading role.
  rpc GrantAuditor(MsgGrantAuditor) returns (MsgGrantAuditorResponse);

  // GrantRole grants a role inside one jurisdiction. Governance only.
  rpc GrantRole(MsgGrantRole) returns (MsgGrantRoleResponse);

  // RevokeRole removes one such grant. Governance only.
  rpc RevokeRole(MsgRevokeRole) returns (MsgRevokeRoleResponse);

  // UpdateParams sets the module parameters. Governance only.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

// MsgRegisterAlias claims an identifier for the sending account.
//
// It carries no identifier field on purpose, and no country field either. The
// chain derives the identifier from the address and takes the country prefix
// from the jurisdiction already recorded against the account, so there is
// nothing for the sender to choose, nothing for anyone else to squat, and no
// way to be issued a prefix that says somewhere you are not. An account with no
// recorded jurisdiction is refused rather than given a default.
message MsgRegisterAlias {
  option (cosmos.msg.v1.signer) = "account";
  option (amino.name) = "blockchain/x/alias/MsgRegisterAlias";

  string account = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgRegisterAliasResponse returns the identifier the chain assigned.
message MsgRegisterAliasResponse {
  // id is the identifier that was assigned, normalised. The sender cannot know
  // it in advance of the transaction landing, so it comes back here and in the
  // event.
  string id = 1;
}

// MsgRotateAlias retires the sender's current identifier and issues a new one.
//
// For an account whose key was compromised: the old identifier is tombstoned
// and never issued again, so a payment sent to the handle somebody memorised
// arrives nowhere rather than in a stranger's account. That is the whole reason
// retiring is allowed and repointing is not.
message MsgRotateAlias {
  option (cosmos.msg.v1.signer) = "account";
  option (amino.name) = "blockchain/x/alias/MsgRotateAlias";

  string account = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgRotateAliasResponse returns what was tombstoned and what replaced it.
message MsgRotateAliasResponse {
  // retired is the identifier that will never be issued again.
  string retired = 1;
  // id is the replacement.
  string id = 2;
}

// MsgSetJurisdiction records or corrects the country an account belongs to.
//
// The first recording is made by the approved participant that onboarded the
// account, because that is the party that performed the KYC and therefore the
// only one that knows the answer. It is never self-declared: an account that
// could name its own perimeter could name the one with no authority watching
// it.
//
// A correction — somebody moves, a firm redomiciles — is a foundation
// administrator's act, not the participant's. A participant that could rewrite
// a country it had already recorded could move a customer out from under an
// authority mid-investigation.
message MsgSetJurisdiction {
  option (cosmos.msg.v1.signer) = "recorder";
  option (amino.name) = "blockchain/x/alias/MsgSetJurisdiction";

  // recorder is the approved participant that onboarded the account, or a
  // foundation administrator, or governance.
  string recorder = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // account is whose perimeter this is.
  string account = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // country is an ISO 3166-1 alpha-2 code. It must be one ISO has actually
  // assigned: the reserved codes, ZZ among them, are refused here so that the
  // marker the foundation administrators carry cannot be handed to an ordinary
  // account and read as chain-wide authority.
  string country = 3;
}

// MsgSetJurisdictionResponse reports the identifier consequences of the change.
//
// Correcting the country of an account that already holds an identifier retires
// that identifier and issues a replacement in the same message. It has to: the
// prefix would otherwise name a country the chain no longer records, and a
// prefix that can go stale is a prefix that can lie. Rotating it here keeps
// every property intact — the old identifier is tombstoned rather than
// repointed, and is never issued again.
message MsgSetJurisdictionResponse {
  // retired is the identifier the correction gave up, empty when the account
  // held none.
  string retired = 1;

  // id is the replacement identifier, carrying the new country. Empty when the
  // account held none, in which case it will get one when it registers.
  string id = 2;
}

// MsgRegisterViewingKey publishes the sending account's X25519 public key.
//
// Self-signed, unlike the jurisdiction beside it, and the difference is not an
// oversight. A jurisdiction is a claim about somebody that they must not be
// able to make for themselves; a viewing key is a claim only about which key
// can decrypt payloads addressed to the sender, and an account that publishes a
// key it does not hold has locked itself out of its own payment detail and
// nobody else out of anything.
//
// Sending it again rotates: the previous version stays queryable so historical
// envelopes remain openable, and new envelopes wrap to the new version. See
// ViewingKey.version.
message MsgRegisterViewingKey {
  option (cosmos.msg.v1.signer) = "account";
  option (amino.name) = "blockchain/x/alias/MsgRegisterViewingKey";

  string account = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // public_key is 32 bytes of X25519. The private half never leaves the holder,
  // and nothing on this chain has any use for it.
  bytes public_key = 2;
}

// MsgRegisterViewingKeyResponse returns the version that was assigned.
message MsgRegisterViewingKeyResponse {
  // version is what an envelope will name when it wraps to this key. The sender
  // cannot know it before the transaction lands, so it comes back here.
  uint64 version = 1;
}

// MsgRevokeViewingKey marks one of the sender's key versions compromised.
//
// It does not delete the key and does not pretend the payloads wrapped to it
// became unreadable — ciphertext that has been distributed cannot be recalled,
// and a message that implied otherwise would be worse than none. What it does
// is stop senders wrapping to it and let a reader see that a payload they are
// holding was addressed to a key somebody else may also hold. Erasing the
// payload itself is the store's job, not the chain's.
message MsgRevokeViewingKey {
  option (cosmos.msg.v1.signer) = "account";
  option (amino.name) = "blockchain/x/alias/MsgRevokeViewingKey";

  string account = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // version is which registration to mark. Named explicitly rather than
  // defaulting to the newest, because the key an operator wants to revoke is
  // usually the old one they have just rotated away from.
  uint64 version = 2;
}

// MsgRevokeViewingKeyResponse is empty.
message MsgRevokeViewingKeyResponse {}

// MsgAppointRegulator names the authority that holds the third viewing key over
// payments settling in one country.
//
// Authority-gated, because this is the single most powerful grant the
// confidentiality design makes: the appointee can read the ISO 20022 detail of
// every payment that names their country from the moment they are appointed.
// An account that could appoint itself regulator of Ghana would have granted
// itself that by sending one message.
message MsgAppointRegulator {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "blockchain/x/alias/MsgAppointRegulator";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // country is an ISO 3166-1 alpha-2 code. Checked against the assigned list
  // for the same reason a jurisdiction is: a mistyped NX would appoint a
  // regulator of nowhere, and every payment declaring NG would go on being
  // encrypted to nobody while the appointment sat in state looking done.
  string country = 2;

  // address is the appointed authority, expected to be an x/group account
  // wherever the decision to open a payload should be M-of-N rather than one
  // official. The chain does not require that; it records who was named.
  string address = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgAppointRegulatorResponse is empty.
message MsgAppointRegulatorResponse {}

// MsgGrantAuditor grants the time-boxed cross-account reading role.
//
// Authority-gated and bounded in three ways at once — it expires by height, the
// number of live grants is capped, and every grant is recorded with who made
// it. All three exist because this role is the one that reads payment detail
// belonging to people who have no relationship with the holder.
message MsgGrantAuditor {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "blockchain/x/alias/MsgGrantAuditor";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  string address = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // expires_at_height must be in the future. There is no unbounded form of this
  // grant, and no zero-means-forever: a role that can become permanent by
  // leaving a field unset is not time-boxed, it is time-boxed by convention.
  int64 expires_at_height = 3;
}

// MsgGrantAuditorResponse is empty.
message MsgGrantAuditorResponse {}

// MsgGrantRole grants a role inside one jurisdiction.
//
// Governance only, and unlike the appointments above a foundation administrator
// cannot sign it either. The reason is the difference between using a power and
// deciding who holds one: an administrator naming a country's regulator is
// operating the rail governance already put them on, whereas an administrator
// able to grant roles could grant themselves the chain-wide scope and then
// grant it to anyone else. Every widening of who may act therefore goes through
// a vote, in public, one grant at a time.
//
// The holder must be an x/group account. A role is only worth the office that
// holds it, and an office that is one key is one bribe — which is the same
// reasoning that makes x/land refuse a registry office that is not a group.
message MsgGrantRole {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "blockchain/x/alias/MsgGrantRole";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // holder is the account being granted the role.
  string holder = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // role is what they may do. ROLE_UNSPECIFIED is refused: a grant whose role
  // was left unset must never be honoured, and proto3 cannot tell that from a
  // role that happens to be numbered zero.
  Role role = 3;

  // jurisdiction is where: an assigned ISO 3166-1 alpha-2 code, or "*" for
  // chain-wide. The reserved code the foundation's own identifiers carry is
  // refused — it marks the absence of a perimeter, so a grant over it would
  // confer nothing while reading like everything.
  string jurisdiction = 4;
}

// MsgGrantRoleResponse is empty.
message MsgGrantRoleResponse {}

// MsgRevokeRole removes one grant, named exactly.
//
// The jurisdiction is part of what is revoked rather than implied, because a
// holder may hold the same role in several countries and revoking "their
// enforcement role" would be ambiguous between removing one perimeter and
// removing all of them. Governance says which.
message MsgRevokeRole {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "blockchain/x/alias/MsgRevokeRole";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // holder is the account losing the role.
  string holder = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // role is which of the holder's roles to remove. ROLE_UNSPECIFIED is refused
  // here as well as on the grant: "revoke whatever role was left unset" has no
  // meaning, and a message that resolved it to one would revoke something
  // nobody named.
  Role role = 3;

  // jurisdiction is which perimeter to remove it in. Naming one that was never
  // granted is an error rather than a quiet success — "nothing to revoke" is how
  // a proposal that named the wrong country passes while leaving the authority
  // it meant to remove in place.
  string jurisdiction = 4;
}

// MsgRevokeRoleResponse is empty.
message MsgRevokeRoleResponse {}

// MsgUpdateParams sets the module parameters. Governance only.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "blockchain/x/alias/MsgUpdateParams";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  Params params = 2 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

// MsgUpdateParamsResponse is empty.
message MsgUpdateParamsResponse {}
