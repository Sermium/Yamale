syntax = "proto3";
package blockchain.alias.v1;

import "amino/amino.proto";
import "blockchain/alias/v1/params.proto";
import "blockchain/alias/v1/role.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "yamale/blockchain/x/alias/types";

// Msg defines the alias Msg service.
//
// There is no MsgSetAlias, because identifiers are assigned rather than chosen:
// a chosen handle brings squatting, a resale market, and — the one that costs
// money — impersonation, where YAMALE-PAY and YAMALE-PAY1 look identical in a
// confirmation dialog.
//
// There is no MsgReleaseAlias either. Releasing and re-registering as two
// messages would leave an account unreachable between them, so rotation is one
// atomic message.
//
// There is no MsgClearJurisdiction. Removing a country would put an account
// back into the unclaimed state the perimeter exists to abolish, holding an
// identifier whose prefix names a country the chain no longer records. A
// jurisdiction is corrected, never emptied.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // RegisterAlias issues an identifier to the sending account.
  rpc RegisterAlias(MsgRegisterAlias) returns (MsgRegisterAliasResponse);

  // RotateAlias retires the sender's identifier and issues a new one.
  rpc RotateAlias(MsgRotateAlias) returns (MsgRotateAliasResponse);

  // SetJurisdiction records or corrects the country an account belongs to.
  rpc SetJurisdiction(MsgSetJurisdiction) returns (MsgSetJurisdictionResponse);

  // RegisterViewingKey publishes the sender's X25519 public key, or rotates it.
  rpc RegisterViewingKey(MsgRegisterViewingKey) returns (MsgRegisterViewingKeyResponse);

  // RevokeViewingKey marks one of the sender's key versions compromised.
  rpc RevokeViewingKey(MsgRevokeViewingKey) returns (MsgRevokeViewingKeyResponse);

  // AppointRegulator names the authority holding the viewing key for a country.
  rpc AppointRegulator(MsgAppointRegulator) returns (MsgAppointRegulatorResponse);

  // GrantAuditor grants the time-boxed cross-account reading role.
  rpc GrantAuditor(MsgGrantAuditor) returns (MsgGrantAuditorResponse);

  // GrantRole grants a role inside one jurisdiction. Governance, or the
  // foundation for a country; governance alone for the chain-wide scope.
  rpc GrantRole(MsgGrantRole) returns (MsgGrantRoleResponse);

  // RevokeRole removes one such grant. The same signers as GrantRole.
  rpc RevokeRole(MsgRevokeRole) returns (MsgRevokeRoleResponse);

  // UpdateParams sets the module parameters. Governance only.
  //
  // It no longer appoints anybody. Appointing a foundation administrator is now
  // MsgGrantRole with ROLE_FOUNDATION_ADMINISTRATOR and the chain-wide scope —
  // which is still governance and nobody else, because a chain-wide grant is
  // governance's alone, so the authority behind the act did not move. What moved
  // is where it is recorded, and that is the point: the appointment and the role
  // registry are one mechanism rather than two lists that happened to share a
  // name.
  //
  // Three failure modes went with the parameter, and they are worth recording
  // because they are what the move was for. This message REPLACES THE WHOLE
  // Params OBJECT — it is a message, not a field mask — so a proposal composed
  // without reading the current parameters first silently dropped every
  // administrator already appointed, and nothing caught it, because a list
  // shorter than the one before it is a valid list; a grant cannot be dropped by
  // a message about something else. Validate() never checked that an entry was an
  // address, so a mistyped one passed a vote, occupied one of the eight places
  // and granted the exemption to nobody, where MsgGrantRole decodes the holder.
  // And an administrator was a bare address, where a role holder must be an
  // x/group account, so the exemption is now held M-of-N like every other
  // authority.
  //
  // What remains here is payload_length. A value that reads back as 0 means the
  // value is UNKNOWN, not zero — proto3 cannot tell a zero from a field nobody
  // filled in, and Validate() refuses a zero, so no chain holds one.
  // Resubmitting a guess would re-parameterise the chain.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

// MsgRegisterAlias claims an identifier for the sending account.
//
// It carries no identifier field on purpose, and no country field either. The
// chain derives the identifier from the address and takes the country prefix
// from the jurisdiction already recorded against the account, so there is
// nothing for the sender to choose, nothing for anyone else to squat, and no
// way to be issued a prefix that says somewhere you are not. An account with no
// recorded jurisdiction is refused rather than given a default.
message MsgRegisterAlias {
  option (cosmos.msg.v1.signer) = "account";
  option (amino.name) = "blockchain/x/alias/MsgRegisterAlias";

  string account = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgRegisterAliasResponse returns the identifier the chain assigned.
message MsgRegisterAliasResponse {
  // id is the identifier that was assigned, normalised. The sender cannot know
  // it in advance of the transaction landing, so it comes back here and in the
  // event.
  string id = 1;
}

// MsgRotateAlias retires the sender's current identifier and issues a new one.
//
// For an account whose key was compromised: the old identifier is tombstoned
// and never issued again, so a payment sent to the handle somebody memorised
// arrives nowhere rather than in a stranger's account. That is the whole reason
// retiring is allowed and repointing is not.
message MsgRotateAlias {
  option (cosmos.msg.v1.signer) = "account";
  option (amino.name) = "blockchain/x/alias/MsgRotateAlias";

  string account = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgRotateAliasResponse returns what was tombstoned and what replaced it.
message MsgRotateAliasResponse {
  // retired is the identifier that will never be issued again.
  string retired = 1;
  // id is the replacement.
  string id = 2;
}

// MsgSetJurisdiction records or corrects the country an account belongs to.
//
// The first recording is made by the approved participant that onboarded the
// account, because that is the party that performed the KYC and therefore the
// only one that knows the answer. It is never self-declared: an account that
// could name its own perimeter could name the one with no authority watching
// it.
//
// A correction — somebody moves, a firm redomiciles — is a foundation
// administrator's act, not the participant's. A participant that could rewrite
// a country it had already recorded could move a customer out from under an
// authority mid-investigation.
message MsgSetJurisdiction {
  option (cosmos.msg.v1.signer) = "recorder";
  option (amino.name) = "blockchain/x/alias/MsgSetJurisdiction";

  // recorder is the approved participant that onboarded the account, or a
  // foundation administrator, or governance.
  string recorder = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // account is whose perimeter this is.
  string account = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // country is an ISO 3166-1 alpha-2 code. It must be one ISO has actually
  // assigned: the reserved codes, ZZ among them, are refused here so that the
  // marker the foundation administrators carry cannot be handed to an ordinary
  // account and read as chain-wide authority.
  string country = 3;
}

// MsgSetJurisdictionResponse reports the identifier consequences of the change.
//
// Correcting the country of an account that already holds an identifier retires
// that identifier and issues a replacement in the same message. It has to: the
// prefix would otherwise name a country the chain no longer records, and a
// prefix that can go stale is a prefix that can lie. Rotating it here keeps
// every property intact — the old identifier is tombstoned rather than
// repointed, and is never issued again.
message MsgSetJurisdictionResponse {
  // retired is the identifier the correction gave up, empty when the account
  // held none.
  string retired = 1;

  // id is the replacement identifier, carrying the new country. Empty when the
  // account held none, in which case it will get one when it registers.
  string id = 2;
}

// MsgRegisterViewingKey publishes the sending account's X25519 public key.
//
// Self-signed, unlike the jurisdiction beside it, and the difference is not an
// oversight. A jurisdiction is a claim about somebody that they must not be
// able to make for themselves; a viewing key is a claim only about which key
// can decrypt payloads addressed to the sender, and an account that publishes a
// key it does not hold has locked itself out of its own payment detail and
// nobody else out of anything.
//
// Sending it again rotates: the previous version stays queryable so historical
// envelopes remain openable, and new envelopes wrap to the new version. See
// ViewingKey.version.
message MsgRegisterViewingKey {
  option (cosmos.msg.v1.signer) = "account";
  option (amino.name) = "blockchain/x/alias/MsgRegisterViewingKey";

  string account = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // public_key is 32 bytes of X25519. The private half never leaves the holder,
  // and nothing on this chain has any use for it.
  bytes public_key = 2;
}

// MsgRegisterViewingKeyResponse returns the version that was assigned.
message MsgRegisterViewingKeyResponse {
  // version is what an envelope will name when it wraps to this key. The sender
  // cannot know it before the transaction lands, so it comes back here.
  uint64 version = 1;
}

// MsgRevokeViewingKey marks one of the sender's key versions compromised.
//
// It does not delete the key and does not pretend the payloads wrapped to it
// became unreadable — ciphertext that has been distributed cannot be recalled,
// and a message that implied otherwise would be worse than none. What it does
// is stop senders wrapping to it and let a reader see that a payload they are
// holding was addressed to a key somebody else may also hold. Erasing the
// payload itself is the store's job, not the chain's.
message MsgRevokeViewingKey {
  option (cosmos.msg.v1.signer) = "account";
  option (amino.name) = "blockchain/x/alias/MsgRevokeViewingKey";

  string account = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // version is which registration to mark. Named explicitly rather than
  // defaulting to the newest, because the key an operator wants to revoke is
  // usually the old one they have just rotated away from.
  uint64 version = 2;
}

// MsgRevokeViewingKeyResponse is empty.
message MsgRevokeViewingKeyResponse {}

// MsgAppointRegulator names the authority that holds the third viewing key over
// payments settling in one country.
//
// Authority-gated, because this is the single most powerful grant the
// confidentiality design makes: the appointee can read the ISO 20022 detail of
// every payment that names their country from the moment they are appointed.
// An account that could appoint itself regulator of Ghana would have granted
// itself that by sending one message.
//
// The appointee must additionally hold ROLE_SUPERVISOR covering that country —
// granted in it, or chain-wide. That is the one place where this module's two
// answers to "who is watching this country" were reconciled rather than left to
// agree by convention: an appointment is an entry in one map and a role is an
// entry in a registry, and before this check they could name different accounts
// with nothing objecting. Requiring the grant makes the registry the source and
// the appointment the choice of which of its holders also has standing to act.
//
// It also puts the appointment behind the office rules the registry enforces:
// a role holder must be an x/group account, so a regulator is now M-of-N rather
// than possibly one key, and an office that has fallen below the shape its grant
// records cannot be newly appointed.
//
// An appointment already recorded is not revisited. This is a check on the write,
// not a condition re-read on every payment — a country whose regulator was
// appointed before the rule existed keeps it, and revoking the supervisor grant
// of a sitting regulator does not silently unappoint them. Removing a regulator
// is appointing a different one, visibly, which is what the record should show.
message MsgAppointRegulator {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "blockchain/x/alias/MsgAppointRegulator";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // country is an ISO 3166-1 alpha-2 code. Checked against the assigned list
  // for the same reason a jurisdiction is: a mistyped NX would appoint a
  // regulator of nowhere, and every payment declaring NG would go on being
  // encrypted to nobody while the appointment sat in state looking done.
  string country = 2;

  // address is the appointed authority, expected to be an x/group account
  // wherever the decision to open a payload should be M-of-N rather than one
  // official. The chain does not require that; it records who was named.
  string address = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgAppointRegulatorResponse is empty.
message MsgAppointRegulatorResponse {}

// MsgGrantAuditor grants the time-boxed cross-account reading role.
//
// Authority-gated and bounded in three ways at once — it expires by height, the
// number of live grants is capped, and every grant is recorded with who made
// it. All three exist because this role is the one that reads payment detail
// belonging to people who have no relationship with the holder.
message MsgGrantAuditor {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "blockchain/x/alias/MsgGrantAuditor";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  string address = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // expires_at_height must be in the future. There is no unbounded form of this
  // grant, and no zero-means-forever: a role that can become permanent by
  // leaving a field unset is not time-boxed, it is time-boxed by convention.
  int64 expires_at_height = 3;
}

// MsgGrantAuditorResponse is empty.
message MsgGrantAuditorResponse {}

// MsgGrantRole grants a role inside one jurisdiction.
//
// Two signers, and which one is allowed depends on the scope being granted:
//
//   - a **country** scope may be granted by governance or by the foundation;
//   - the **chain-wide** scope may be granted by governance and nobody else.
//
// "The foundation" here means one specific account: the address
// x/constitution pins as enforcement_recovery_destination, which is the 3-of-5
// group produced by the key ceremony and the account every seized asset on the
// chain is sent to. It is deliberately NOT a holder of
// ROLE_FOUNDATION_ADMINISTRATOR, and the difference matters. That role is
// granted by this very message, so reading the foundation out of it would make
// "who may appoint a country's authorities" a set that this message could append
// to — the same circularity a parameter list had, wearing a grant's clothes. An
// invariant cannot be changed without a constitutional amendment.
//
// # Why the foundation, when this used to be governance alone
//
// It was governance-only, and the argument was that there is a difference
// between using a power and deciding who holds one: an administrator naming a
// country's regulator is operating the rail governance already put them on,
// whereas an administrator able to grant roles could grant themselves the
// chain-wide scope and then grant it to anyone. Every widening of who may act
// went through a vote, in public, one grant at a time.
//
// What that did not survive was enrolling a country. Bringing one country onto
// the rail is not one grant: it is an M-of-N group per office, two to five role
// grants across those offices, and the jurisdiction records for the offices' own
// accounts — a sequence that has to land in a particular order. Under
// governance-only, each part was a separate proposal that could pass, fail or
// time out on its own, so the friction was not being paid once per widening of
// authority but several times over for one decision. The outcome of that is a
// bundle proposal nobody reads, or a deployment that seeds its grants in genesis
// and never revisits them.
//
// So admitting a country is the foundation's act: three of five custodians from
// five organisations, attributable on chain in granted_by. What was given up is
// publicity and delay — the validator set no longer has a veto over who
// administers a perimeter, and the appointment no longer sits in public for a
// voting period first.
//
// Three residual consequences, stated rather than discovered. None of them lets
// the foundation reach a state governance could not, and all three are bounded by
// the chain-wide scope staying closed:
//
//  1. The foundation can grant one office the same role in every country, one
//     grant at a time, arriving where a chain-wide grant would by a longer road.
//     Bounded by the assigned country list rather than prevented, and enumerable:
//     every grant is listed by RoleGrants and RoleHolders, and the chain-wide ones
//     have an endpoint of their own.
//  2. It can revoke a country grant GOVERNANCE made — a reduction of the validator
//     set's power, kept because the alternative makes an emergency the expensive
//     case. See MsgRevokeRole.
//  3. It can grant itself a country role. That is permitted on purpose: a country
//     admitted before its offices exist needs an interim authority, and refusing
//     holder == authority would block that while preventing nothing, since the
//     foundation can appoint any group it controls. Re-granting an existing triple
//     also rewrites granted_by, so that field names the last authority to write
//     the grant rather than the first; the events carry the history.
//
// The holder must be an x/group account. A role is only worth the office that
// holds it, and an office that is one key is one bribe — which is the same
// reasoning that makes x/land refuse a registry office that is not a group. That
// applies to the foundation's grants exactly as it applies to governance's: the
// widening is about who may sign and about nothing else.
message MsgGrantRole {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "blockchain/x/alias/MsgGrantRole";

  // authority is the governance account, or the foundation — the address
  // x/constitution pins as enforcement_recovery_destination. Any other signer is
  // refused, and so is the foundation when the jurisdiction below is "*".
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // holder is the account being granted the role.
  string holder = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // role is what they may do. ROLE_UNSPECIFIED is refused: a grant whose role
  // was left unset must never be honoured, and proto3 cannot tell that from a
  // role that happens to be numbered zero.
  Role role = 3;

  // jurisdiction is where: an assigned ISO 3166-1 alpha-2 code, or "*" for
  // chain-wide. The reserved code the foundation's own identifiers carry is
  // refused — it marks the absence of a perimeter, so a grant over it would
  // confer nothing while reading like everything.
  //
  // One role refuses a country here: ROLE_FOUNDATION_ADMINISTRATOR is chain-wide
  // or nothing. What it exempts is the ABSENCE of a national perimeter, so an
  // administrator of one country would be an account claiming an exemption from
  // a rule it is already inside — and, because chain-wide is governance-only,
  // the refusal is also what keeps that appointment exactly as governance-only
  // as the parameter list it replaced.
  //
  // This field also decides who may sign the message, so it is validated before
  // the signer is checked. "*" narrows the acceptable authority to governance
  // alone, and that narrowing happens before the constitution is read: a store
  // failure while resolving the foundation must not be the thing that decides
  // whether the chain-wide scope was allowed.
  string jurisdiction = 4;

  // required_shape is the M-of-N the holder's office must keep in order to keep
  // this role. Omit it and no requirement is recorded, which is what every grant
  // made before this field existed carries.
  //
  // Recorded on the grant and re-checked on every action the grant permits, so
  // an office that reduces itself below the shape it was granted under loses the
  // authority automatically rather than waiting for somebody to notice and
  // revoke. See OfficeShape for why both numbers are floors and why the count of
  // signatures is not the same thing as the policy's threshold.
  //
  // Checked here as well, when the group keeper is available: a grant requiring
  // three-of-five is refused outright to a one-of-one office, rather than being
  // written and then failing on first use. Recording a requirement the holder
  // does not meet is how an office ends up holding a grant that reads correct in
  // every query and permits nothing.
  //
  // The requirement is decided before the ceremony rather than read off whoever
  // turned up to it. `ceremony country` takes it per office in the enrolment
  // config and refuses to assemble an office whose signed group file does not
  // meet it — see docs/guides/country-enrolment.md. A requirement captured from
  // the group that happened to be created would be no requirement at all: it
  // would ratify a one-of-one as readily as a three-of-five.
  OfficeShape required_shape = 5;
}

// MsgGrantRoleResponse is empty.
message MsgGrantRoleResponse {}

// MsgRevokeRole removes one grant, named exactly.
//
// The same signers as MsgGrantRole, and deliberately not a narrower set: whoever
// may appoint a country's authority may also remove it, and only governance may
// touch a chain-wide grant in either direction.
//
// Keeping revocation governance-only while granting was widened was considered
// and rejected, because it puts the slow path on the wrong action. The reason to
// revoke in a hurry is that an office's keys are compromised or its authority is
// being abused, and a rule under which the foundation can appoint a national
// enforcement authority with one 3-of-5 vote but needs a full governance cycle to
// remove one makes the emergency the expensive case. Granting authority is the
// act that wants friction; taking it away is the act that has to be possible on a
// Sunday.
//
// The jurisdiction is part of what is revoked rather than implied, because a
// holder may hold the same role in several countries and revoking "their
// enforcement role" would be ambiguous between removing one perimeter and
// removing all of them. The signer says which.
message MsgRevokeRole {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "blockchain/x/alias/MsgRevokeRole";

  // authority is the governance account, or the foundation. Same rule as
  // MsgGrantRole, including that "*" is governance alone.
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // holder is the account losing the role.
  string holder = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // role is which of the holder's roles to remove. ROLE_UNSPECIFIED is refused
  // here as well as on the grant: "revoke whatever role was left unset" has no
  // meaning, and a message that resolved it to one would revoke something
  // nobody named.
  Role role = 3;

  // jurisdiction is which perimeter to remove it in. Naming one that was never
  // granted is an error rather than a quiet success — "nothing to revoke" is how
  // a proposal that named the wrong country passes while leaving the authority
  // it meant to remove in place.
  //
  // As on the grant, this decides who may sign: "*" is governance alone.
  string jurisdiction = 4;
}

// MsgRevokeRoleResponse is empty.
message MsgRevokeRoleResponse {}

// MsgUpdateParams sets the module parameters. Governance only.
//
// It used to be the only way a foundation administrator was appointed or
// removed, which made it the most consequential message in this module. That
// appointment is now MsgGrantRole with ROLE_FOUNDATION_ADMINISTRATOR and the
// chain-wide scope — still governance and nobody else, because a chain-wide
// grant is governance's alone. What is left here is one parameter.
//
// # It replaces the whole Params object
//
// `params` is a message, not a field mask, and there is no partial update. So
// "appoint one administrator" is really "read the current parameters, add one
// address, and resubmit every parameter" — and the failure mode is not an error.
// A proposal composed without reading the current values passes, and silently
// drops the administrators already appointed or resets payload_length to its
// default. Nothing here catches that: Params.Validate() bounds the list and
// refuses duplicates, and a shorter list than before is a perfectly valid list.
//
// Two consequences worth knowing before composing one by hand:
//
//   - Read `Query/Params` first and carry every field across. A field left out of
//     the message is a field set to its protobuf default, not a field left alone.
//   - A `payload_length` that reads back as 0 means the value is UNKNOWN, not
//     zero: proto3 cannot tell a zero from a field nobody filled in. Resubmitting
//     a guess would re-parameterise the chain. Validate() refuses a zero, so a
//     chain never actually holds one.
//
// clients/governance composes this message with the whole object shown before and
// after, and refuses rather than defaulting when the current parameters cannot be
// read.
//
// Note that this message no longer appoints anybody. Field 2 held
// foundation_administrators and is reserved; the appointment is MsgGrantRole
// with ROLE_FOUNDATION_ADMINISTRATOR and the chain-wide scope, which is
// governance-only for the same reason every chain-wide grant is.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "blockchain/x/alias/MsgUpdateParams";

  // authority is the governance module account. Any other signer is refused, so a
  // proposal naming the wrong address passes its vote and is then refused when it
  // executes — reported in a transaction log nobody is watching.
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params is the COMPLETE parameter set, replacing whatever is there. See above:
  // every field omitted is a field reset, not a field preserved.
  Params params = 2 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

// MsgUpdateParamsResponse is empty.
message MsgUpdateParamsResponse {}
