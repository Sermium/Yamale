syntax = "proto3";
package blockchain.alias.v1;

import "blockchain/alias/v1/alias.proto";
import "blockchain/alias/v1/jurisdiction.proto";
import "blockchain/alias/v1/params.proto";
import "blockchain/alias/v1/role.proto";
import "blockchain/alias/v1/viewing_key.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";

option go_package = "yamale/blockchain/x/alias/types";

// Query defines the alias query service.
//
// There is deliberately no list endpoint. A typable identifier space is
// enumerable in principle — eight characters is 2^40, which is hours of GPU
// time — and no storage trick changes that. What the module can do is refuse to
// hand out the directory as a convenience: walking it should cost an indexer's
// effort, not one paginated request.
//
// The constraint that actually limits the damage is elsewhere: an identifier
// maps to an address and to nothing else. No name, no telephone number, no
// document number lives in this module, so somebody who does enumerate it
// learns which addresses have identifiers — visible on a public chain
// already — and nothing about who owns them.
service Query {
  // Params returns the module parameters.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/yamale/blockchain/alias/v1/params";
  }

  // Alias resolves an identifier to an address. The hot path.
  rpc Alias(QueryAliasRequest) returns (QueryAliasResponse) {
    option (google.api.http).get = "/yamale/blockchain/alias/v1/alias/{id}";
  }

  // AliasOf returns the identifier held by an address, for interfaces that
  // need to show a person their own handle.
  rpc AliasOf(QueryAliasOfRequest) returns (QueryAliasOfResponse) {
    option (google.api.http).get = "/yamale/blockchain/alias/v1/alias_of/{address}";
  }

  // Retired reports whether an identifier has been tombstoned. A client that
  // resolves nothing should be able to tell "never existed" from "existed and
  // was retired", because those mean very different things to somebody about
  // to send money.
  rpc Retired(QueryRetiredRequest) returns (QueryRetiredResponse) {
    option (google.api.http).get = "/yamale/blockchain/alias/v1/retired/{id}";
  }

  // Jurisdiction reports the country recorded against one account.
  rpc Jurisdiction(QueryJurisdictionRequest) returns (QueryJurisdictionResponse) {
    option (google.api.http).get = "/yamale/blockchain/alias/v1/jurisdiction/{address}";
  }

  // Perimeter lists the accounts recorded in one country, so an authority can
  // see the accounts it may act on and no others.
  //
  // This is a list endpoint in a module that deliberately has none, so note
  // what it returns and what it does not: jurisdiction records, never
  // identifiers. Walking it tells you which addresses are recorded in a
  // country — a supervisory fact, and the reason the endpoint exists — and
  // gives no shortcut to the alias directory that is withheld above.
  rpc Perimeter(QueryPerimeterRequest) returns (QueryPerimeterResponse) {
    option (google.api.http).get = "/yamale/blockchain/alias/v1/perimeter/{country}";
  }

  // ViewingKeys returns every version of one account's viewing key, newest
  // first.
  //
  // Every version, not just the live one, because a payload encrypted last year
  // is wrapped to the key that was live last year. A client that could only
  // fetch the current key would report an old but perfectly readable payment as
  // undecryptable, which is the failure the version field exists to prevent.
  rpc ViewingKeys(QueryViewingKeysRequest) returns (QueryViewingKeysResponse) {
    option (google.api.http).get = "/yamale/blockchain/alias/v1/viewing_keys/{address}";
  }

  // Regulator returns the authority appointed over one country, with its
  // current viewing key.
  //
  // Both in one response because the sender needs both and asking separately
  // invites the half-answer: an appointment resolved, a key not fetched, and an
  // envelope built without the regulator on it that looks complete.
  rpc Regulator(QueryRegulatorRequest) returns (QueryRegulatorResponse) {
    option (google.api.http).get = "/yamale/blockchain/alias/v1/regulator/{country}";
  }

  // Auditors lists the grants that have not expired, with their current keys.
  //
  // A list endpoint in a module that avoids them, and it is the right call
  // here: who may read across accounts is a fact the people being read about
  // are entitled to see, and a sender cannot build a correct envelope without
  // the whole set.
  rpc Auditors(QueryAuditorsRequest) returns (QueryAuditorsResponse) {
    option (google.api.http).get = "/yamale/blockchain/alias/v1/auditors";
  }

  // RoleGrants lists every role one account holds, and where.
  //
  // The question an operator actually asks about a key before trusting it, and
  // the question a holder asks to find out what the chain thinks they may do.
  // Empty is a real answer: an account with no grants may act nowhere.
  rpc RoleGrants(QueryRoleGrantsRequest) returns (QueryRoleGrantsResponse) {
    option (google.api.http).get = "/yamale/blockchain/alias/v1/role_grants/{holder}";
  }

  // RoleHolders lists who holds roles inside one jurisdiction.
  //
  // The supervisory view: "who may act on my country's accounts". Chain-wide
  // grants are deliberately *not* folded in — they are listed on their own
  // endpoint — because a country's own list should show what that country
  // granted, and silently mixing in the chain-wide exceptions would hide them
  // among the ordinary entries of every country at once.
  rpc RoleHolders(QueryRoleHoldersRequest) returns (QueryRoleHoldersResponse) {
    option (google.api.http).get = "/yamale/blockchain/alias/v1/role_holders/{jurisdiction}";
  }

  // ChainWideGrants lists every grant whose scope is "*".
  //
  // Its own endpoint, taking no argument, precisely because the chain-wide
  // scope is the exception. An exception that can only be found by knowing to
  // ask for the wildcard is an exception nobody audits, so a governance console
  // can put this on a page and show the whole set of accounts that are not
  // bounded by any border.
  rpc ChainWideGrants(QueryChainWideGrantsRequest) returns (QueryChainWideGrantsResponse) {
    option (google.api.http).get = "/yamale/blockchain/alias/v1/chain_wide_grants";
  }
}

// QueryParamsRequest is the request for the module parameters.
message QueryParamsRequest {}

// QueryParamsResponse carries the module parameters.
message QueryParamsResponse {
  Params params = 1 [(gogoproto.nullable) = false];
}

// QueryAliasRequest asks which address an identifier resolves to.
message QueryAliasRequest {
  // id in any form the client has it: hyphenated, lower case, with the
  // confusable characters unfolded. The module normalises before looking up.
  string id = 1;
}

// QueryAliasResponse carries the binding, or a not-found error when the identifier was never issued.
message QueryAliasResponse {
  Alias alias = 1 [(gogoproto.nullable) = false];
}

// QueryAliasOfRequest asks which identifier an address holds.
message QueryAliasOfRequest {
  string address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// QueryAliasOfResponse carries that binding.
message QueryAliasOfResponse {
  Alias alias = 1 [(gogoproto.nullable) = false];
}

// QueryRetiredRequest asks whether an identifier has been tombstoned.
message QueryRetiredRequest {
  string id = 1;
}

// QueryRetiredResponse distinguishes "retired" from "never existed" — different facts for somebody about to send money.
message QueryRetiredResponse {
  bool retired = 1;
}

// QueryJurisdictionRequest asks which country an account is recorded in.
message QueryJurisdictionRequest {
  string address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// QueryJurisdictionResponse carries that record, or a not-found error.
//
// Not-found is a real answer here rather than a gap: outside the foundation
// administrators, an account with no jurisdiction holds no identifier and never
// will.
message QueryJurisdictionResponse {
  Jurisdiction jurisdiction = 1 [(gogoproto.nullable) = false];
}

// QueryPerimeterRequest asks for the accounts recorded in one country.
message QueryPerimeterRequest {
  // country is an ISO 3166-1 alpha-2 code, in any case.
  string country = 1;

  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

// QueryPerimeterResponse carries one page of that country's accounts.
message QueryPerimeterResponse {
  repeated Jurisdiction jurisdictions = 1 [(gogoproto.nullable) = false];

  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryViewingKeysRequest asks for every version of an account's viewing key.
message QueryViewingKeysRequest {
  string address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// QueryViewingKeysResponse carries them newest first, empty when the account
// has never registered one.
//
// Empty is a real answer and not an error: an account with no viewing key
// cannot be sent an encrypted payload, and a sender needs to learn that as a
// fact it can act on rather than as a failed request it might retry.
message QueryViewingKeysResponse {
  repeated ViewingKey keys = 1 [(gogoproto.nullable) = false];
}

// QueryRegulatorRequest asks who regulates one country.
message QueryRegulatorRequest {
  // country is an ISO 3166-1 alpha-2 code, in any case.
  string country = 1;
}

// QueryRegulatorResponse carries the appointment and the key it can read with.
message QueryRegulatorResponse {
  RegulatorAppointment appointment = 1 [(gogoproto.nullable) = false];

  // key is the appointee's current viewing key. Its public_key is empty when
  // the regulator has been appointed but has not published one — a state a
  // sender has to be able to see, because wrapping to a key of thirty-two zero
  // bytes would produce an envelope that looks addressed to the regulator and
  // opens for nobody.
  ViewingKey key = 2 [(gogoproto.nullable) = false];
}

// QueryAuditorsRequest asks for the live auditor grants.
message QueryAuditorsRequest {}

// QueryAuditorsResponse carries them with the keys they read with.
message QueryAuditorsResponse {
  repeated AuditorEntitlement auditors = 1 [(gogoproto.nullable) = false];
}

// QueryRoleGrantsRequest asks what one account may do, and where.
message QueryRoleGrantsRequest {
  string holder = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// QueryRoleGrantsResponse carries them, chain-wide grants included.
//
// Chain-wide grants belong here even though they are excluded from
// RoleHolders: this is the answer to "what may this account do", and omitting
// the widest grant it holds would make the response actively misleading.
message QueryRoleGrantsResponse {
  repeated RoleGrant grants = 1 [(gogoproto.nullable) = false];
}

// QueryRoleHoldersRequest asks who holds roles inside one jurisdiction.
message QueryRoleHoldersRequest {
  // jurisdiction is an ISO 3166-1 alpha-2 code, in any case.
  string jurisdiction = 1;

  // role narrows the answer to one role. Left unspecified it means every role,
  // which is the only sense in which the zero value is accepted anywhere: here
  // it is a filter that has not been applied, never a grant.
  Role role = 2;

  cosmos.base.query.v1beta1.PageRequest pagination = 3;
}

// QueryRoleHoldersResponse carries one page of that jurisdiction's grants.
message QueryRoleHoldersResponse {
  repeated RoleGrant grants = 1 [(gogoproto.nullable) = false];

  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryChainWideGrantsRequest takes no argument. The exception should be one
// call away.
message QueryChainWideGrantsRequest {}

// QueryChainWideGrantsResponse carries every grant that no border bounds.
//
// Unpaginated, and that is a statement rather than an omission: if this set
// ever grows past what fits in one response, the deployment has stopped
// treating chain-wide authority as an exception and the right fix is fewer
// grants, not another page.
message QueryChainWideGrantsResponse {
  repeated RoleGrant grants = 1 [(gogoproto.nullable) = false];
}

// AuditorEntitlement pairs a grant with the key it reads through.
message AuditorEntitlement {
  AuditorGrant grant = 1 [(gogoproto.nullable) = false];

  // key carries an empty public_key when the auditor has been granted the role
  // but has published no key, for the same reason as on the regulator above.
  ViewingKey key = 2 [(gogoproto.nullable) = false];
}
