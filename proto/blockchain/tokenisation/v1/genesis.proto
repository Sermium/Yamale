syntax = "proto3";
package blockchain.tokenisation.v1;

import "gogoproto/gogo.proto";
import "blockchain/tokenisation/v1/params.proto";
import "blockchain/tokenisation/v1/tokenisation.proto";

option go_package = "yamale/blockchain/x/tokenisation/types";

message GenesisState {
  Params params = 1 [(gogoproto.nullable) = false];
  repeated Collection collections = 2 [(gogoproto.nullable) = false];
  repeated Asset assets = 3 [(gogoproto.nullable) = false];
  repeated Vault vaults = 4 [(gogoproto.nullable) = false];
  repeated Position positions = 5 [(gogoproto.nullable) = false];
  repeated SaleReport sale_reports = 6 [(gogoproto.nullable) = false];

  // Explicit, because derived state must match genesis byte for byte. A
  // counter that recomputes itself from the asset list writes zero where
  // InitGenesis wrote nothing, and the export stops round-tripping.
  uint64 next_asset_id = 7;
}
