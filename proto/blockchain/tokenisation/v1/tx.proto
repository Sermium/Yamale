syntax = "proto3";
package blockchain.tokenisation.v1;

import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "amino/amino.proto";
import "cosmos/base/v1beta1/coin.proto";
import "blockchain/tokenisation/v1/tokenisation.proto";
import "blockchain/tokenisation/v1/params.proto";

option go_package = "yamale/blockchain/x/tokenisation/types";

// Msg is the write side of the closed-end vehicle registry: mint a title,
// fractionalise it, pay income in, report the sale that ends it, and redeem.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // Governance only.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
  // CreateCollection opens a registry. Governance only, because a collection
  // decides how a sale is verified and who may mint into it.
  rpc CreateCollection(MsgCreateCollection) returns (MsgCreateCollectionResponse);
  // SetCollectionAuthority moves who may mint into a collection.
  rpc SetCollectionAuthority(MsgSetCollectionAuthority) returns (MsgSetCollectionAuthorityResponse);
  // Governance appoints who may attest a sale, so that a seller cannot appoint
  // the accounts that check the seller.
  rpc SetCollectionAttestors(MsgSetCollectionAttestors) returns (MsgSetCollectionAttestorsResponse);
  // ResolveDispute is governance deciding a contested figure. An empty
  // corrected price upholds what was reported.
  rpc ResolveDispute(MsgResolveDispute) returns (MsgResolveDisputeResponse);

  // The collection's appointed authority only.
  rpc MintAsset(MsgMintAsset) returns (MsgMintAssetResponse);

  // RecordSubscription states what an investor paid for tokens they hold, so a
  // return can be computed against something rather than assumed.
  rpc RecordSubscription(MsgRecordSubscription) returns (MsgRecordSubscriptionResponse);

  // PublishCovenant files an undertaking against a tokenisation: accounts, a
  // structure change, a dividend notice, an assembly. The digest, never the
  // document.
  rpc PublishCovenant(MsgPublishCovenant) returns (MsgPublishCovenantResponse);

  // Title holder.
  rpc Fractionalise(MsgFractionalise) returns (MsgFractionaliseResponse);
  // TransferAsset moves the title only. The fraction tokens are ordinary
  // balances and stay where they are — selling the vehicle does not sell its
  // shareholders out from under them.
  rpc TransferAsset(MsgTransferAsset) returns (MsgTransferAssetResponse);
  // FundVault pays income in. The holders' share is collected and the rest
  // stays with the funder.
  rpc FundVault(MsgFundVault) returns (MsgFundVaultResponse);
  // ReportSale states what the underlying sold for. It does not open
  // redemption: the figure sits for the collection's challenge window first.
  rpc ReportSale(MsgReportSale) returns (MsgReportSaleResponse);
  // PaySaleProceeds pays the holders' share of a reported sale into the
  // vault, which is what finalisation waits on.
  rpc PaySaleProceeds(MsgPaySaleProceeds) returns (MsgPaySaleProceedsResponse);

  // An attestor appointed by the collection. This used to sit under
  // "permissionless", which made the attestation threshold meetable by anybody
  // and therefore no threshold at all.
  rpc AttestSale(MsgAttestSale) returns (MsgAttestSaleResponse);

  // Permissionless.
  rpc DisputeSale(MsgDisputeSale) returns (MsgDisputeSaleResponse);
  // FinaliseSale is the permissionless crank that opens redemption, once the
  // window has passed and the holders' share has actually been paid in.
  rpc FinaliseSale(MsgFinaliseSale) returns (MsgFinaliseSaleResponse);
  // Claim withdraws accrued income without giving up the shareholding — a
  // coupon should not force an exit. It pays a dividend token, not the stable;
  // ExchangeDividend is the second half.
  rpc Claim(MsgClaim) returns (MsgClaimResponse);
  // ExchangeDividend cashes a dividend token for the stable behind it, 1:1,
  // out of the reserve the claim set aside. Permissionless, and refusable on
  // nothing but the arithmetic: the money is already the holder's.
  rpc ExchangeDividend(MsgExchangeDividend) returns (MsgExchangeDividendResponse);
  // Redeem burns tokens and pays their share in one step. The burn is the
  // claim: burning first and expecting a later claim would strand whoever is
  // slow, asleep or dead.
  rpc Redeem(MsgRedeem) returns (MsgRedeemResponse);
}

// MsgUpdateParams sets the module parameters. Governance only.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "blockchain/x/tokenisation/MsgUpdateParams";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  Params params = 2 [(gogoproto.nullable) = false];
}
// MsgUpdateParamsResponse is empty.
message MsgUpdateParamsResponse {}

// MsgCreateCollection brings a registry into existence. Governance only.
//
// There is deliberately no permissionless counterpart. Every other creation
// path on this chain is apply-then-approve, but here there is no application to
// approve: a registry of deeds is not something a chain grants on request.
message MsgCreateCollection {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "blockchain/x/tokenisation/MsgCreateCollection";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  Collection collection = 2 [(gogoproto.nullable) = false];
}
// MsgCreateCollectionResponse is empty; the collection is addressed by the id it was given.
message MsgCreateCollectionResponse {}

// MsgSetCollectionAuthority appoints or revokes who may mint into a collection.
//
// Revocation stops future mints and touches nothing already issued. Deciding an
// existing asset was wrongly issued is a seizure, and seizures go through
// x/enforcement where two thirds decide -- not through a registry keeper.
message MsgSetCollectionAuthority {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "blockchain/x/tokenisation/MsgSetCollectionAuthority";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string collection_id = 2;
  // Empty revokes. A collection with no authority refuses mints; it does not
  // fall back to governance.
  string new_authority = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}
// MsgSetCollectionAuthorityResponse is empty.
message MsgSetCollectionAuthorityResponse {}

// MsgSetCollectionAttestors replaces the register of accounts that may attest a
// sale reported under this collection.
//
// Governance only, like CreateCollection and SetCollectionAuthority beside it.
// If the seller could appoint the accounts that check the seller, the register
// would restate the problem rather than fix it.
//
// It replaces rather than appends, because a register that could only grow
// would let one careless proposal dilute a careful appointment for good.
//
// Attestations already recorded against a reported sale are not revisited. They
// were made by an appointed attestor at the moment they were made, and rewriting
// history to match a later appointment would let an authority manufacture or
// destroy a quorum after the fact — which is a worse power than the one this
// message exists to constrain.
message MsgSetCollectionAttestors {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "blockchain/x/tokenisation/MsgSetCollectionAttestors";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string collection_id = 2;
  repeated string attestors = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgSetCollectionAttestorsResponse is empty.
message MsgSetCollectionAttestorsResponse {}

// MsgMintAsset records title. Only the collection's appointed authority.
//
// A mint names its recipient, so title is attributed at creation and never
// exists unattributed. There is no self-mint-then-transfer path, because that
// path is where an authority laundering assets to itself stops being
// distinguishable from an authority doing its job.
message MsgMintAsset {
  option (cosmos.msg.v1.signer) = "minter";
  option (amino.name) = "blockchain/x/tokenisation/MsgMintAsset";

  string minter = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string collection_id = 2;
  string owner = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string uri = 4;

  // The x/land parcel this asset is title over, or 0 when it is not land.
  //
  // Checked here as well as at fractionalisation, because it is cheap: a mint
  // naming a parcel that does not exist, or one held by somebody other than
  // the named owner, is refused outright rather than left to fail later when
  // shares are being sold and there is money on the other side of it.
  uint64 parcel_id = 5;

  // What the tokenised thing does. Optional only so that a mint written before
  // this field existed still decodes; a mint that names no sector is accepted
  // and the asset carries SECTOR_UNSPECIFIED, which an interface shows as "not
  // stated" rather than guessing.
  Sector sector = 6;
}
// MsgMintAssetResponse carries the id of the title just created.
message MsgMintAssetResponse {
  uint64 asset_id = 1;
}

// MsgFractionalise mints the shareholding against title.
//
// Supply is fixed here and can never grow. Holding title confers no right to
// mint more: an owner who could dilute shareholders by issuing fractions
// against an asset they had already sold interests in is the whole fraud in one
// message handler.
message MsgFractionalise {
  option (cosmos.msg.v1.signer) = "owner";
  option (amino.name) = "blockchain/x/tokenisation/MsgFractionalise";

  string owner = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 asset_id = 2;
  string symbol = 3;
  string supply = 4 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  // Share of the asset's economics the tokens carry. The sponsor keeps the
  // rest. Never editable afterwards.
  //
  // For an asset over an x/land parcel this is the figure the registry's
  // max_share_bps caps: it is what is being sold, not what is retained.
  uint32 holder_share_bps = 5;
  // Denomination income and proceeds will be paid in.
  string income_denom = 6;
}
// MsgFractionaliseResponse carries the denomination the shares were issued in.
message MsgFractionaliseResponse {
  string fraction_denom = 1;
}

// MsgTransferAsset moves title. The shareholding is untouched.
//
// A buyer takes an encumbered asset subject to its shareholders, and the
// obligation to fund the vault moves with title.
message MsgTransferAsset {
  option (cosmos.msg.v1.signer) = "owner";
  option (amino.name) = "blockchain/x/tokenisation/MsgTransferAsset";

  string owner = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 asset_id = 2;
  string recipient = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}
// MsgTransferAssetResponse is empty; the new holder is on the asset record.
message MsgTransferAssetResponse {}

// MsgFundVault pays income in. holder_share_bps of it reaches the index; the
// remainder is the sponsor's and is never taken from them.
message MsgFundVault {
  option (cosmos.msg.v1.signer) = "funder";
  option (amino.name) = "blockchain/x/tokenisation/MsgFundVault";

  string funder = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 asset_id = 2;

  // The gross income for the period. The chain collects holder_share_bps of
  // it and leaves the rest where it is, which is what the sentence above has
  // always said and what the response reports.
  cosmos.base.v1beta1.Coin amount = 3 [(gogoproto.nullable) = false];
}
// MsgFundVaultResponse reports what was actually taken, which is the holders'
// share of the gross figure the message named rather than the whole of it.
message MsgFundVaultResponse {
  // What was actually taken from the funder.
  cosmos.base.v1beta1.Coin collected = 1 [(gogoproto.nullable) = false];
}

// MsgReportSale states what the asset sold for. It does not open redemption.
//
// The figure is recorded, is public, and sits for the collection's challenge
// window. Verification alone would not be enough: redemption is irreversible,
// so without a window verification only means the theft needed two signatures.
message MsgReportSale {
  option (cosmos.msg.v1.signer) = "reporter";
  option (amino.name) = "blockchain/x/tokenisation/MsgReportSale";

  string reporter = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 asset_id = 2;
  cosmos.base.v1beta1.Coin price = 3 [(gogoproto.nullable) = false];
  string evidence_uri = 4;
}
// MsgReportSaleResponse is empty. The reported figure and the window it must
// sit out are both on the sale record.
message MsgReportSaleResponse {}

// MsgPaySaleProceeds pays the holders' share of a reported price into the
// vault, which is what finalisation waits on.
//
// Anyone may pay: the obligation is the sponsor's, but a sponsor who has gone
// quiet should not be able to strand every holder, and money arriving is never
// the problem. Overpayment is refused rather than accepted and stranded.
message MsgPaySaleProceeds {
  option (cosmos.msg.v1.signer) = "payer";
  option (amino.name) = "blockchain/x/tokenisation/MsgPaySaleProceeds";

  string payer = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 asset_id = 2;
  cosmos.base.v1beta1.Coin amount = 3 [(gogoproto.nullable) = false];
}
// MsgPaySaleProceedsResponse reports what has been paid and what is still
// outstanding, so a payer settling in instalments knows when finalisation
// becomes possible without querying for it.
message MsgPaySaleProceedsResponse {
  // Paid so far against this sale, and what finalisation still waits on.
  cosmos.base.v1beta1.Coin paid = 1 [(gogoproto.nullable) = false];
  cosmos.base.v1beta1.Coin outstanding = 2 [(gogoproto.nullable) = false];
}

// MsgAttestSale signs a reported figure when the collection requires attestors.
message MsgAttestSale {
  option (cosmos.msg.v1.signer) = "attestor";
  option (amino.name) = "blockchain/x/tokenisation/MsgAttestSale";

  string attestor = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 asset_id = 2;
  cosmos.base.v1beta1.Coin price = 3 [(gogoproto.nullable) = false];
}
// MsgAttestSaleResponse is empty; the count of attestors stands on the sale.
message MsgAttestSaleResponse {}

// MsgDisputeSale suspends redemption and refers the figure to governance.
//
// The bond is a basis-point fraction of the reported price -- scaled to the
// vehicle rather than flat, since a flat bond is trivial for a large fraud to
// post and prohibitive for a small holder to raise. Refunded if the dispute
// succeeds; otherwise forfeited to the vault, never to the issuer. Paying the
// issuer would reward provoking weak challenges.
message MsgDisputeSale {
  option (cosmos.msg.v1.signer) = "challenger";
  option (amino.name) = "blockchain/x/tokenisation/MsgDisputeSale";

  string challenger = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 asset_id = 2;
  string reason = 3;
}
// MsgDisputeSaleResponse is empty. The bond posted is recorded on the sale so
// that it can be returned or forfeited when the dispute is decided.
message MsgDisputeSaleResponse {}

// MsgFinaliseSale opens redemption on an asset whose reported price has cleared
// verification and its challenge window.
//
// Anybody may send it, and that is deliberate rather than lax. Every condition
// it checks is already fixed by the report and the clock, so the sender decides
// nothing; what they contribute is the gas. If only the sponsor could finalise,
// a sponsor could decline to — and shareholders unable to exit until the party
// holding their money chooses to let them is the position this whole instrument
// exists to avoid.
//
// A crank rather than an EndBlocker sweep, because iterating every reported sale
// on every block is a denial-of-service surface that grows with usage.
message MsgFinaliseSale {
  option (cosmos.msg.v1.signer) = "caller";
  option (amino.name) = "blockchain/x/tokenisation/MsgFinaliseSale";

  string caller = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 asset_id = 2;
}

// MsgFinaliseSaleResponse is empty; the vehicle reaching REALISED is the
// outcome, and it is what opens redemption.
message MsgFinaliseSaleResponse {}

// MsgResolveDispute is governance deciding the contested figure.
message MsgResolveDispute {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "blockchain/x/tokenisation/MsgResolveDispute";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 asset_id = 2;
  // Empty upholds the reported figure and forfeits the bond.
  cosmos.base.v1beta1.Coin corrected_price = 3;
}
// MsgResolveDisputeResponse is empty.
message MsgResolveDisputeResponse {}

// MsgClaim withdraws accrued income without giving up the shareholding.
//
// It pays a DIVIDEND TOKEN -- div/<asset_id>/<SYMBOL>, one per vehicle --
// rather than the stable itself, and the stable it stands for is moved out of
// the vehicle's spendable ledger into its dividend reserve in the same write.
// MsgExchangeDividend converts it back, 1:1, whenever the holder can take it.
//
// # Why a token at all, rather than just paying the stable
//
// Three things it buys, and one it deliberately does not.
//
// 1. A holder who cannot receive the stable can still be PAID. A stable on this
//    chain may carry its own send restriction -- a KYC gate, a sanctions list,
//    a licence the holder does not have where they live. Paying such a holder
//    directly either fails the whole claim, which leaves them accruing forever
//    against a vehicle that has done nothing wrong, or succeeds into an account
//    that cannot move the money on. The dividend token is issued by this module
//    and gated by nothing, so the entitlement always lands; cashing it is a
//    separate act that can happen later, elsewhere, or through an assignee who
//    is permitted to hold the stable.
//
// 2. The claim becomes AUDITABLE SEPARATELY FROM THE SETTLEMENT. "Declared and
//    not yet cashed", per vehicle, used to be a figure that existed only spread
//    across every holder's accrued balance and could not be read without
//    walking the whole holder set. As a token supply it is one query, it is
//    public, and anybody can check it against the reserve without trusting this
//    module's own accounting.
//
// 3. It separates WHEN a holder is credited from WHEN they are paid, which is
//    what an operating business does anyway. A holder can claim on the record
//    date and cash months later, without the chain holding an unattributed
//    balance in the meantime.
//
// And the thing it deliberately does NOT buy: credit. A dividend token is never
// issued against a declaration that has not been funded. It is fully backed at
// the instant it is minted or it is not minted -- see Vault.dividend_reserve.
// The tempting version of this feature is a token a vehicle can issue when it
// has DECLARED but not yet funded, so holders hold something in the meantime.
// That version is refused here: a token mintable against an unfunded
// declaration is a claim the chain cannot honour, and the first holder to reach
// the exchange would be paid out of a neighbouring vehicle's reserve. What a
// vehicle publishes before the money arrives is a COVENANT_KIND_DIVIDEND_NOTICE
// -- a filing, which is honest about being an announcement.
//
// # Transferable, deliberately
//
// The dividend token is an ordinary bank denomination and this module places no
// restriction on it. If it could not move it would be a ledger row with extra
// steps -- Position.accrued already is one -- and reason 1 above would collapse
// with it: a holder who cannot hold the stable has to be able to ASSIGN the
// claim to somebody who can.
//
// The consequence, stated rather than hidden: a dividend token can be sold, and
// it can be sold below par by somebody who needs the money before they can
// reach the exchange. The chain neither prevents that nor could -- it is the
// same freedom that makes the token useful. What it does guarantee is that the
// discount is never justified by the backing: par is available from the
// reserve, in every status, to whoever holds the token.
//
// Unlike the fraction token it is NOT halted at realisation and is not offered
// to the AMM's restricted-denom classifier. The fraction token halts because at
// realisation it becomes a claim on a fixed pot that a pool would still quote a
// stale price for. A dividend token is a claim on a fixed pot at a fixed 1:1
// rate from the moment it exists and never changes, so there is no stale price
// for anybody to take.
message MsgClaim {
  option (cosmos.msg.v1.signer) = "holder";
  option (amino.name) = "blockchain/x/tokenisation/MsgClaim";

  string holder = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 asset_id = 2;
}
// MsgClaimResponse reports what was paid, which is the income accrued since
// the holder last settled rather than a figure they asked for.
message MsgClaimResponse {
  // The dividend tokens minted to the holder.
  repeated cosmos.base.v1beta1.Coin paid = 1 [(gogoproto.nullable) = false];

  // The stable moved into the vehicle's dividend reserve to back them: equal in
  // amount, in the vault's income denomination.
  //
  // Reported because a caller holding only paid knows what they were given and
  // not what it is worth. The dividend token's denomination says which vehicle
  // owes it and says nothing about the currency behind it, so naming both
  // halves of a 1:1 pair in the receipt is what lets a client show "12,500
  // uusd, claimable" instead of a denom nobody recognises.
  cosmos.base.v1beta1.Coin backing = 2 [(gogoproto.nullable) = false];
}

// MsgExchangeDividend cashes a dividend token for the stable behind it, 1:1.
//
// # Permissionless, and refusable on nothing but the arithmetic
//
// Whoever holds the token exchanges it. There is no role, no admin, no pause
// and no status check, because by the time a dividend token exists the chain
// has already taken the stable out of the vehicle's spendable ledger and set it
// aside under this token's name. Refusing to honour it afterwards would be the
// chain defaulting on a payment it has already reserved the money for.
//
// That is also why it stays open at STATUS_REALISED and at STATUS_CLOSED, when
// the fraction token can no longer move at all. Trading halts because a share
// in a sold vehicle is a claim on a fixed pot a market would misprice; a
// dividend token is a debt that crystallised before the sale and has nothing to
// do with what the vehicle fetched. A holder who claimed in March and had not
// got round to exchanging by the time the warehouse sold in September is paid
// in full in October, out of money that was never available to redemption.
//
// The exchange is NOT routed through x/treasury. See the keeper for why.
message MsgExchangeDividend {
  option (cosmos.msg.v1.signer) = "holder";
  option (amino.name) = "blockchain/x/tokenisation/MsgExchangeDividend";

  // Whoever holds the tokens -- not necessarily the shareholder who claimed
  // them, because the dividend token is transferable on purpose.
  string holder = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 asset_id = 2;

  // How many to cash. Named explicitly rather than inferred from the balance,
  // so a holder cashing part of a position does not have to move the rest out
  // of the way first.
  string amount = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
}

// MsgExchangeDividendResponse reports both legs of the swap.
message MsgExchangeDividendResponse {
  // The stable paid out, in the vault's income denomination.
  cosmos.base.v1beta1.Coin paid = 1 [(gogoproto.nullable) = false];

  // The dividend tokens burned. Equal in amount to paid: the rate is 1:1 and is
  // not a parameter, because a rate somebody could set is a rate that can be
  // set to something other than what the reserve actually holds.
  cosmos.base.v1beta1.Coin burned = 2 [(gogoproto.nullable) = false];
}

// MsgRedeem burns tokens and pays their share in the same step.
//
// The burn *is* the claim. A design that burns and then expects a later claim
// strands the money of everyone slow, asleep or dead, and leaves the chain
// holding funds it can no longer attribute. Supply falls to zero as holders
// claim, and title burns when it reaches zero.
message MsgRedeem {
  option (cosmos.msg.v1.signer) = "holder";
  option (amino.name) = "blockchain/x/tokenisation/MsgRedeem";

  string holder = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 asset_id = 2;
  string amount = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
}
// MsgRedeemResponse reports what the surrendered tokens were worth.
message MsgRedeemResponse {
  repeated cosmos.base.v1beta1.Coin paid = 1 [(gogoproto.nullable) = false];
}

// MsgRecordSubscription records what an investor paid for tokens they hold.
//
// # Why this message has to exist
//
// A token balance says what an account holds and never what it paid. Tokens
// move by ordinary bank send, which carries no price, so without an explicit
// record there is nothing to compute a return against — and an interface then
// either shows no return at all, or invents an entry price, which is worse.
//
// # Who may sign it, and why it is not the investor
//
// The collection's authority: the party that took the money. An investor able
// to state their own cost could state a low one and publish a flattering
// return beside a real balance, on a register whose whole value is that its
// figures are not the holder's word.
//
// # What it does NOT claim
//
// That the money was received, or received in this denomination, or at arm's
// length. It records an assertion by a named, accountable party, dated and
// attributable — the same thing a KYC reference is, and worth the same: not
// proof, but evidence somebody can be asked about.
//
// Additive. Recording a second subscription for the same holder adds to both
// the basis and the quantity, so an investor who subscribed twice at two prices
// carries a weighted average, which is what an average cost is.
message MsgRecordSubscription {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "blockchain/x/tokenisation/MsgRecordSubscription";

  // The collection authority for the asset. Not the investor.
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 asset_id = 2;
  string investor = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // Tokens this subscription covers. Refused above the investor's balance: a
  // basis covering more tokens than exist in the account would report a return
  // on tokens nobody holds.
  string quantity = 4 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];

  // What was paid for them, in the vault's income denomination. The
  // denomination is taken from the vault rather than named here, so a
  // subscription cannot be recorded in a currency the vehicle does not pay in.
  string paid = 5 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
}

// MsgRecordSubscriptionResponse reports the holder's basis after the record.
message MsgRecordSubscriptionResponse {
  string cost_basis = 1 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  string cost_qty = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
}

// MsgPublishCovenant files an undertaking against a tokenisation.
//
// Signed by the collection authority: the party that answers for the vehicle.
// A holder able to publish against it could file an announcement in the
// operator's name, on a register whose value is that its filings are
// attributable.
//
// Accepted in any status. Accounts, resolutions and material events arrive
// after a sale as readily as before one, and a register that stopped accepting
// them at realisation would be missing the filings a later dispute is about.
message MsgPublishCovenant {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "blockchain/x/tokenisation/MsgPublishCovenant";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 asset_id = 2;

  CovenantKind kind = 3;
  string title = 4;

  // Exactly 32 bytes. Not a hex string: two spellings of one digest that do not
  // compare equal are worse than no digest.
  bytes sha256 = 5;

  string uri = 6;

  // The period covered, unix seconds; both zero for a document covering a
  // moment rather than a span.
  int64 period_start = 7;
  int64 period_end = 8;

  // When a holder must have acted by. Zero when nothing is asked of them.
  int64 acts_by = 9;

  // The covenant this corrects. Zero if it corrects nothing. Must belong to the
  // same asset and must not already have been superseded -- two corrections of
  // one filing leave two current versions and no rule for choosing.
  uint64 supersedes = 10;
}

// MsgPublishCovenantResponse carries the id the chain assigned.
message MsgPublishCovenantResponse {
  uint64 id = 1;
}
