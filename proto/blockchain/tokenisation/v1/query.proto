syntax = "proto3";
package blockchain.tokenisation.v1;

import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "cosmos/base/v1beta1/coin.proto";
import "blockchain/tokenisation/v1/params.proto";
import "blockchain/tokenisation/v1/tokenisation.proto";

option go_package = "yamale/blockchain/x/tokenisation/types";

// Query is the read side of the closed-end vehicle registry.
//
// Open to the public on this chain, deliberately: an offering nobody can
// inspect is an offering nobody should subscribe to, and these records disclose
// only what a prospectus would.
service Query {
  // Params returns the module parameters.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/yamale/blockchain/tokenisation/v1/params";
  }
  // Collections lists the registries vehicles are minted into. A collection is
  // who may mint, how a sale is verified, and how long a reported price sits
  // before it can be acted on.
  rpc Collections(QueryCollectionsRequest) returns (QueryCollectionsResponse) {
    option (google.api.http).get = "/yamale/blockchain/tokenisation/v1/collections";
  }
  // Assets lists the vehicles in a collection, or across all of them.
  rpc Assets(QueryAssetsRequest) returns (QueryAssetsResponse) {
    option (google.api.http).get = "/yamale/blockchain/tokenisation/v1/assets";
  }
  // Asset returns one vehicle with its vault and any reported sale, which is
  // everything a holder needs to decide whether to redeem.
  rpc Asset(QueryAssetRequest) returns (QueryAssetResponse) {
    option (google.api.http).get = "/yamale/blockchain/tokenisation/v1/assets/{asset_id}";
  }
  // What an account is owed right now, including income that has accrued since
  // its balance last moved.
  rpc Entitlement(QueryEntitlementRequest) returns (QueryEntitlementResponse) {
    option (google.api.http).get = "/yamale/blockchain/tokenisation/v1/assets/{asset_id}/entitlement/{holder}";
  }

  // Position returns one holder's whole record against a tokenisation.
  //
  // Entitlement answers only "what could they withdraw now", as a single Coin.
  // Everything else a holder needs to see about their own position -- what it
  // cost, how much of it that cost covers, and the time accruing in the
  // current period -- had no query at all, so the console was reading it out of
  // the raw store at /store/tokenisation/key and decoding the key layout by
  // hand. That works and it couples a browser to internal storage: a change to
  // a key prefix, which is an implementation detail nobody would announce,
  // silently breaks every reader.
  rpc Position(QueryPositionRequest) returns (QueryPositionResponse) {
    option (google.api.http).get = "/yamale/blockchain/tokenisation/v1/assets/{asset_id}/position/{holder}";
  }

  // Covenants lists what has been published against one tokenisation.
  rpc Covenants(QueryCovenantsRequest) returns (QueryCovenantsResponse) {
    option (google.api.http).get = "/yamale/blockchain/tokenisation/v1/covenants/{asset_id}";
  }
}

// QueryParamsRequest is the request type for the Params RPC.
message QueryParamsRequest {}
// QueryParamsResponse carries the module parameters.
message QueryParamsResponse {
  Params params = 1 [(gogoproto.nullable) = false];
}

// QueryCollectionsRequest pages through the collections.
message QueryCollectionsRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}
// QueryCollectionsResponse carries a page of collections.
message QueryCollectionsResponse {
  repeated Collection collections = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryAssetsRequest pages through vehicles, narrowed to one collection
// when collection_id is set and across all of them when it is not.
message QueryAssetsRequest {
  string collection_id = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
// QueryAssetsResponse carries a page of vehicles.
message QueryAssetsResponse {
  repeated Asset assets = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryAssetRequest names one vehicle by its chain id.
message QueryAssetRequest {
  uint64 asset_id = 1;
}
// QueryAssetResponse carries the vehicle, its vault and its sale report if
// one has been made. The sale is absent rather than empty when none has,
// so "not sold" and "sold for nothing" cannot be confused.
message QueryAssetResponse {
  Asset asset = 1 [(gogoproto.nullable) = false];
  Vault vault = 2 [(gogoproto.nullable) = false];
  SaleReport sale = 3;
}

// QueryEntitlementRequest names a holder and the vehicle they hold.
message QueryEntitlementRequest {
  uint64 asset_id = 1;
  string holder = 2;
}
// QueryEntitlementResponse is what the holder could withdraw right now,
// settled income included — not the balance of their last settlement.
message QueryEntitlementResponse {
  cosmos.base.v1beta1.Coin owed = 1 [(gogoproto.nullable) = false];
}

// QueryCovenantsRequest asks for one tokenisation's filings.
message QueryCovenantsRequest {
  uint64 asset_id = 1;

  // Omit filings that have been corrected. False by default: what was said at a
  // date is usually the question, and a reader who can only see the current
  // version cannot answer it.
  bool current_only = 2;
}

// QueryCovenantsResponse lists them, oldest first, which is the order the
// vehicle's life happened in.
message QueryCovenantsResponse {
  repeated Covenant covenants = 1 [(gogoproto.nullable) = false];
}

// QueryPositionRequest asks for one holder's record against one tokenisation.
message QueryPositionRequest {
  uint64 asset_id = 1;
  string holder = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// QueryPositionResponse carries the record, plus the two figures that are
// derived rather than stored.
message QueryPositionResponse {
  // Absent when this account has never held a share in this tokenisation.
  // An absence, not a failure: most accounts hold most things not at all.
  Position position = 1 [(gogoproto.nullable) = false];
  bool found = 2;

  // What could be withdrawn right now, settled and unsettled together. The
  // same figure Entitlement returns, carried here so a screen showing a whole
  // position does not need two round trips that could disagree.
  string owed = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];

  // Token-seconds accrued in the CURRENT, undeclared period, brought up to the
  // block being queried.
  //
  // Not money, and deliberately not converted to any. The rate is unknown
  // until the period closes, so a figure in a currency would be a forecast
  // standing beside a settled amount in the same units -- and a reader cannot
  // tell those apart once both are money.
  string pending_token_seconds = 4 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
}
