syntax = "proto3";
package blockchain.tokenisation.v1;

import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "google/protobuf/timestamp.proto";
import "cosmos/base/v1beta1/coin.proto";

option go_package = "yamale/blockchain/x/tokenisation/types";

// Collection is a class of real-world asset the chain will record title for:
// a deeds registry, a warehouse operator's receipts, a vehicle register.
//
// Collections are chain-level constructs. There is no permissionless message
// that creates one, because a registry of deeds is not something a chain grants
// on request -- governance creates it and appoints who may mint into it.
message Collection {
  string id = 1;

  // The only address permitted to mint assets into this collection.
  //
  // An unset or revoked authority does not fall back to governance: the
  // collection refuses mints outright. The failure mode of a permissive default
  // here is unlimited issuance of title to things nobody owns.
  string authority = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // How a sale price reported against assets in this collection is checked.
  VerificationMode verification = 3;

  // Attestor threshold when verification is VERIFY_ATTESTORS. Refused below 2:
  // one attestor is not a threshold, it is a single point of unlimited theft.
  uint32 attestation_threshold = 4;

  // How long a reported sale price sits before redemption opens. Calibrated to
  // the asset class rather than a chain-wide constant -- a bond's redemption
  // was fixed at issuance and needs days, a unique building needs a month.
  // See docs/guides/tokenisation.md.
  int64 challenge_window_seconds = 5;

  // Fraction of the reported sale price a challenger must bond, in basis
  // points. Scales with the vehicle rather than being flat: a flat bond is
  // trivial for a large fraud to post and prohibitive for a small holder.
  uint32 dispute_bond_bps = 6;

  // attestors is the register of accounts that may attest a sale reported
  // under this collection. Required when verification is VERIFY_ATTESTORS, and
  // it must hold at least attestation_threshold entries: a threshold higher
  // than the register is one no honest sale can ever meet, which turns every
  // vehicle in the collection into a one-way door.
  //
  // # Why a register rather than nothing
  //
  // Without one, AttestSale accepts a signature from any address at all, and a
  // sponsor meets any threshold with N fresh keys for the cost of the gas. The
  // threshold is the whole of what stands between a shareholder and a sale
  // reported below what was received, so a threshold anybody can meet is not a
  // protection, it is the appearance of one.
  //
  // # Who sets it, which is the whole of why it works
  //
  // Governance, and only governance — the same signer that creates the
  // collection in the first place. A sponsor cannot appoint their own
  // attestors, so they cannot manufacture a quorum, and that is the difference
  // between this register and a decorative one.
  //
  // What the chain still cannot decide is whether an account governance
  // appointed is genuinely independent of the seller. That is not a fact the
  // chain holds. What it can do is make the appointment a visible, deliberate
  // act by a signer the seller does not control, which is the same arrangement
  // x/land uses for the offices that attest a transfer.
  repeated string attestors = 7 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// VerificationMode is how the chain learns what an asset sold for.
//
// The issuer alone can never set it. An issuer who under-reports steals from
// every shareholder in one transaction, at the moment of maximum value, with no
// further obligation to anybody afterwards.
enum VerificationMode {
  option (gogoproto.goproto_enum_prefix) = false;

  // Unset. A collection must choose how its sales are verified, so this is
  // never a working configuration — it is what an incomplete genesis reads as.
  VERIFICATION_UNSPECIFIED = 0;

  // The appointed independent valuer signs the figure. x/oracle already holds
  // this machinery for appraisals.
  VERIFY_VALUER = 1;

  // m-of-n attestors agree, m >= 2. Same shape as x/custody's deposits.
  VERIFY_ATTESTORS = 2;

  // Voted, with the evidence attached to the proposal.
  VERIFY_GOVERNANCE = 3;

  // The redemption amount was fixed when the vehicle was created -- par plus
  // coupon, on a date -- so there is nothing to appraise and nobody to trust.
  // The chain checks whether the expected amount arrived. This is the sovereign
  // case: a state issuing a bond asks its citizens to trust arithmetic rather
  // than a person.
  VERIFY_SCHEDULE = 4;
}

// Sector is what the tokenised thing DOES, so an investor can filter a market
// by it and a regulator can recognise the description.
//
// ISIC Rev. 4 sections, not a list invented here. A securities offering is
// described to a regulator in a classification they already use, and a bespoke
// list has to be mapped onto one eventually -- by somebody with less context
// than whoever wrote it. The sections are A to U; the names below are the ones
// a reader recognises rather than the standard's own wording.
//
// An enum rather than free text for the reason DocumentKind is an enum: this is
// what a marketplace filters on, and "Timber / timber / Bois / forestry
// products" is four sectors to a machine and one to a person.
enum Sector {
  option (gogoproto.goproto_enum_prefix) = false;

  // Never stored on an asset minted after this field existed. Assets minted
  // before it carry this, and that is an absence rather than a claim: it means
  // the chain was not asked, not that the sector is unknown to anybody.
  SECTOR_UNSPECIFIED = 0;

  // A. Agriculture, forestry and fishing -- including a standing concession.
  SECTOR_AGRICULTURE = 1;
  // B. Mining and quarrying.
  SECTOR_EXTRACTION = 2;
  // C. Manufacturing, which is anything that transforms a material. A sawmill
  // is here rather than in A: what is sold is what leaves the mill.
  SECTOR_MANUFACTURING = 3;
  // D and E. Electricity, gas, water and waste.
  SECTOR_UTILITIES = 4;
  // F. Construction.
  SECTOR_CONSTRUCTION = 5;
  // G. Wholesale and retail trade.
  SECTOR_TRADE = 6;
  // H. Transport and storage.
  SECTOR_TRANSPORT = 7;
  // I. Accommodation and food service.
  SECTOR_HOSPITALITY = 8;
  // J. Information and communication.
  SECTOR_TECHNOLOGY = 9;
  // K. Financial and insurance activities.
  SECTOR_FINANCIAL = 10;
  // L. Real estate. Distinct from an asset being OVER registered land: a
  // warehouse operator is real estate, and a sawmill built on a titled parcel
  // is not.
  SECTOR_REAL_ESTATE = 11;
  // M and N. Professional, scientific, technical and administrative services.
  SECTOR_SERVICES = 12;
  // O to U. Public administration, education, health, arts, and the rest.
  SECTOR_PUBLIC_AND_SOCIAL = 13;
}

// Asset is title to one real-world thing.
//
// Title and shareholding are separate registers. This record says who owns the
// asset; the tokens say who holds the economic interest. They move
// independently, so an asset changing operator is a non-event for shareholders.
message Asset {
  uint64 id = 1;
  string collection_id = 2;

  // Holder of title. Whoever holds it carries the obligation to pay income into
  // the vault -- an obligation, never a balance they could walk away with.
  string owner = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  string uri = 4;

  // The encumbrance. Non-empty means shareholders exist against this asset.
  //
  // It lives on the asset record rather than in an index built beside it, so
  // there is no path where a stale view sells somebody a warehouse that already
  // has shareholders. That is the failure which costs the chain its credibility
  // as a registry rather than merely costing money.
  string fraction_denom = 5;

  // Share of the asset's economics carried by the tokens, in basis points. The
  // sponsor keeps the rest. Fixed at fractionalisation and never editable: an
  // issuer who could revise it would dilute every holder without minting a
  // single token.
  uint32 holder_share_bps = 6;

  Status status = 7;

  // The x/land parcel this vehicle is over, or 0 when the asset is not land.
  //
  // Naming the parcel is what makes the registry's authorisation enforceable:
  // fractionalising an asset with a parcel id is refused unless the registry
  // has a live permission for that parcel, the issued share is inside the
  // ceiling it set, and the sponsor is still the parcel's holder. Zero means
  // none of that applies, so a warehouse receipt or a bond is untouched.
  //
  // The parcel is referenced, never moved. Title stays in x/land held by the
  // same account, which is what keeps a fractionalised parcel governed by the
  // registry rather than by whoever accumulated the tokens.
  uint64 parcel_id = 8;

  // What the tokenised thing does. Set at mint and never edited: a sector an
  // issuer could revise is a sector an issuer revises after the market has
  // priced the first one.
  Sector sector = 9;
}

// Status is the vehicle's life. It ends; this is a closed-end instrument, not a
// perpetual registry.
enum Status {
  option (gogoproto.goproto_enum_prefix) = false;

  // Unset. No asset is ever written in this state; it is what a zero value
  // in a hand-edited genesis looks like.
  STATUS_UNSPECIFIED = 0;

  // Title exists, no shareholders yet.
  STATUS_HELD = 1;

  // Shareholders exist. Income distributes as it arrives.
  STATUS_ACTIVE = 2;

  // A sale price has been reported and is inside its challenge window.
  // Redemption is not open yet.
  STATUS_REPORTED = 3;

  // The price is final. Proceeds distribute exactly like income -- the sale is
  // not a special case in the accounting, it is the last distribution and it is
  // larger.
  //
  // Transfers of the token stop here. Each token is now a claim on a known
  // fixed pot, and a pool still quoting from its reserves is a free lunch that
  // gets taken within a block.
  STATUS_REALISED = 4;

  // Supply reached zero and the title was burned.
  STATUS_CLOSED = 5;

  // A challenge succeeded or the sale fell through. Back to ACTIVE by
  // governance, never automatically.
  STATUS_DISPUTED = 6;
}

// Vault holds what is owed to shareholders and the running index that says how
// much each token has earned.
message Vault {
  uint64 asset_id = 1;

  // Income per token, accumulated over the vehicle's life, scaled by 1e18.
  //
  // An index rather than a snapshot because a snapshot is snipeable: buy from
  // the pool at H-1, be holder of record at H, sell at H+1, and collect a
  // quarter's rent for two blocks of exposure with no capital at risk. An index
  // is time-weighted, so two blocks earn two blocks.
  //
  // It also removes a halt: there is no holder set to iterate.
  string cumulative_per_token = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];

  // Total gross income ever declared against the vehicle, for the solvency
  // view. Larger than what the module holds for it, because only the holders'
  // share is ever collected.
  repeated cosmos.base.v1beta1.Coin funded = 3 [(gogoproto.nullable) = false];

  // The denomination income arrives in.
  string denom = 4;

  // What the module account actually holds on this vehicle's behalf.
  //
  // One module account serves every vehicle, so a balance is not an ownership
  // record: without this ledger a vehicle that funded nothing pays its holders
  // out of a different vehicle's vault, and the bank keeper has no way to
  // object. Every credit is a transfer in, every debit is a payout, and no
  // payout is made that this does not cover.
  repeated cosmos.base.v1beta1.Coin held = 5 [(gogoproto.nullable) = false];
}

// Position is one account's place in the index.
//
// Settled whenever the balance moves, so what is owed is always
// balance * (cumulative_per_token - last_index).
message Position {
  uint64 asset_id = 1;
  string holder = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  string last_index = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];

  // Settled but not yet withdrawn.
  string accrued = 4 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];

  // What this holder PAID, in the vault's income denomination, for the tokens
  // `cost_qty` covers.
  //
  // # Why two fields and not one
  //
  // A holding can be partly covered. Nine million tokens of which five million
  // were subscribed at a recorded price and four million arrived as a plain
  // transfer from somebody with no basis is the ordinary case, not an edge one.
  // With a single field the interface must either average a known cost with an
  // unknown one, or report a return on the whole holding that is only true of
  // part of it. With two it can say: this much returned on this much invested,
  // and this much not covered.
  //
  // # Why it cannot simply be derived
  //
  // A token balance records what an account holds and never what it paid, and
  // tokens move by ordinary bank send, which carries no price. So basis is only
  // as good as the events allowed to write it: a recorded subscription, where
  // the party that took the money states the figure, and a marketplace fill,
  // where the price is in the trade and nobody has to assert anything.
  //
  // # Zero is never assumed
  //
  // A transfer from a holder with no basis leaves the recipient with none, and
  // an interface must show that as COST NOT RECORDED rather than as cost zero.
  // Cost zero reports an infinite return, which is the most flattering and most
  // wrong figure this module could produce.
  string cost_basis = 5 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];

  // How many tokens `cost_basis` was paid for. Never larger than the balance:
  // a transfer out reduces both proportionally.
  string cost_qty = 6 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
}

// SaleReport is a reported price inside or past its challenge window.
message SaleReport {
  uint64 asset_id = 1;
  cosmos.base.v1beta1.Coin price = 2 [(gogoproto.nullable) = false];
  string reporter = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  google.protobuf.Timestamp reported_at = 4 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false];

  // Opens redemption once passed, absent a dispute.
  google.protobuf.Timestamp claimable_at = 5 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false];

  // Attestors who have signed this figure, when the mode requires them.
  repeated string attestors = 6 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  bool disputed = 7;

  // The holders' share of the price, actually paid into the vault.
  //
  // A reported price is a claim about an off-chain sale. Crediting the index
  // from the claim alone distributes money the vehicle never received, and the
  // shared module account makes the shortfall somebody else's. Finalisation
  // waits on this reaching what the holders are owed.
  cosmos.base.v1beta1.Coin proceeds_paid = 8 [(gogoproto.nullable) = false];

  // Who challenged the figure, and what they posted to do it. Held so the bond
  // has somewhere to go: returned when the challenge was right, forfeited to
  // the vault when it was not.
  string challenger = 9 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  cosmos.base.v1beta1.Coin bond = 10 [(gogoproto.nullable) = false];
}
