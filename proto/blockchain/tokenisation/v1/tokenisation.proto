syntax = "proto3";
package blockchain.tokenisation.v1;

import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "google/protobuf/timestamp.proto";
import "cosmos/base/v1beta1/coin.proto";

option go_package = "yamale/blockchain/x/tokenisation/types";

// Collection is a class of real-world asset the chain will record title for:
// a deeds registry, a warehouse operator's receipts, a vehicle register.
//
// Collections are chain-level constructs. There is no permissionless message
// that creates one, because a registry of deeds is not something a chain grants
// on request -- governance creates it and appoints who may mint into it.
message Collection {
  string id = 1;

  // The only address permitted to mint assets into this collection.
  //
  // An unset or revoked authority does not fall back to governance: the
  // collection refuses mints outright. The failure mode of a permissive default
  // here is unlimited issuance of title to things nobody owns.
  string authority = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // How a sale price reported against assets in this collection is checked.
  VerificationMode verification = 3;

  // Attestor threshold when verification is VERIFY_ATTESTORS. Refused below 2:
  // one attestor is not a threshold, it is a single point of unlimited theft.
  uint32 attestation_threshold = 4;

  // How long a reported sale price sits before redemption opens. Calibrated to
  // the asset class rather than a chain-wide constant -- a bond's redemption
  // was fixed at issuance and needs days, a unique building needs a month.
  // See docs/guides/tokenisation.md.
  int64 challenge_window_seconds = 5;

  // Fraction of the reported sale price a challenger must bond, in basis
  // points. Scales with the vehicle rather than being flat: a flat bond is
  // trivial for a large fraud to post and prohibitive for a small holder.
  uint32 dispute_bond_bps = 6;
}

// VerificationMode is how the chain learns what an asset sold for.
//
// The issuer alone can never set it. An issuer who under-reports steals from
// every shareholder in one transaction, at the moment of maximum value, with no
// further obligation to anybody afterwards.
enum VerificationMode {
  option (gogoproto.goproto_enum_prefix) = false;

  VERIFICATION_UNSPECIFIED = 0;

  // The appointed independent valuer signs the figure. x/oracle already holds
  // this machinery for appraisals.
  VERIFY_VALUER = 1;

  // m-of-n attestors agree, m >= 2. Same shape as x/custody's deposits.
  VERIFY_ATTESTORS = 2;

  // Voted, with the evidence attached to the proposal.
  VERIFY_GOVERNANCE = 3;

  // The redemption amount was fixed when the vehicle was created -- par plus
  // coupon, on a date -- so there is nothing to appraise and nobody to trust.
  // The chain checks whether the expected amount arrived. This is the sovereign
  // case: a state issuing a bond asks its citizens to trust arithmetic rather
  // than a person.
  VERIFY_SCHEDULE = 4;
}

// Asset is title to one real-world thing.
//
// Title and shareholding are separate registers. This record says who owns the
// asset; the tokens say who holds the economic interest. They move
// independently, so an asset changing operator is a non-event for shareholders.
message Asset {
  uint64 id = 1;
  string collection_id = 2;

  // Holder of title. Whoever holds it carries the obligation to pay income into
  // the vault -- an obligation, never a balance they could walk away with.
  string owner = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  string uri = 4;

  // The encumbrance. Non-empty means shareholders exist against this asset.
  //
  // It lives on the asset record rather than in an index built beside it, so
  // there is no path where a stale view sells somebody a warehouse that already
  // has shareholders. That is the failure which costs the chain its credibility
  // as a registry rather than merely costing money.
  string fraction_denom = 5;

  // Share of the asset's economics carried by the tokens, in basis points. The
  // sponsor keeps the rest. Fixed at fractionalisation and never editable: an
  // issuer who could revise it would dilute every holder without minting a
  // single token.
  uint32 holder_share_bps = 6;

  Status status = 7;

  // The x/land parcel this vehicle is over, or 0 when the asset is not land.
  //
  // Naming the parcel is what makes the registry's authorisation enforceable:
  // fractionalising an asset with a parcel id is refused unless the registry
  // has a live permission for that parcel, the issued share is inside the
  // ceiling it set, and the sponsor is still the parcel's holder. Zero means
  // none of that applies, so a warehouse receipt or a bond is untouched.
  //
  // The parcel is referenced, never moved. Title stays in x/land held by the
  // same account, which is what keeps a fractionalised parcel governed by the
  // registry rather than by whoever accumulated the tokens.
  uint64 parcel_id = 8;
}

// Status is the vehicle's life. It ends; this is a closed-end instrument, not a
// perpetual registry.
enum Status {
  option (gogoproto.goproto_enum_prefix) = false;

  STATUS_UNSPECIFIED = 0;

  // Title exists, no shareholders yet.
  STATUS_HELD = 1;

  // Shareholders exist. Income distributes as it arrives.
  STATUS_ACTIVE = 2;

  // A sale price has been reported and is inside its challenge window.
  // Redemption is not open yet.
  STATUS_REPORTED = 3;

  // The price is final. Proceeds distribute exactly like income -- the sale is
  // not a special case in the accounting, it is the last distribution and it is
  // larger.
  //
  // Transfers of the token stop here. Each token is now a claim on a known
  // fixed pot, and a pool still quoting from its reserves is a free lunch that
  // gets taken within a block.
  STATUS_REALISED = 4;

  // Supply reached zero and the title was burned.
  STATUS_CLOSED = 5;

  // A challenge succeeded or the sale fell through. Back to ACTIVE by
  // governance, never automatically.
  STATUS_DISPUTED = 6;
}

// Vault holds what is owed to shareholders and the running index that says how
// much each token has earned.
message Vault {
  uint64 asset_id = 1;

  // Income per token, accumulated over the vehicle's life, scaled by 1e18.
  //
  // An index rather than a snapshot because a snapshot is snipeable: buy from
  // the pool at H-1, be holder of record at H, sell at H+1, and collect a
  // quarter's rent for two blocks of exposure with no capital at risk. An index
  // is time-weighted, so two blocks earn two blocks.
  //
  // It also removes a halt: there is no holder set to iterate.
  string cumulative_per_token = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];

  // Total ever paid in, for the solvency view.
  repeated cosmos.base.v1beta1.Coin funded = 3 [(gogoproto.nullable) = false];

  // The denomination income arrives in.
  string denom = 4;
}

// Position is one account's place in the index.
//
// Settled whenever the balance moves, so what is owed is always
// balance * (cumulative_per_token - last_index).
message Position {
  uint64 asset_id = 1;
  string holder = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  string last_index = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];

  // Settled but not yet withdrawn.
  string accrued = 4 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
}

// SaleReport is a reported price inside or past its challenge window.
message SaleReport {
  uint64 asset_id = 1;
  cosmos.base.v1beta1.Coin price = 2 [(gogoproto.nullable) = false];
  string reporter = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  google.protobuf.Timestamp reported_at = 4 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false];

  // Opens redemption once passed, absent a dispute.
  google.protobuf.Timestamp claimable_at = 5 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false];

  // Attestors who have signed this figure, when the mode requires them.
  repeated string attestors = 6 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  bool disputed = 7;
}
