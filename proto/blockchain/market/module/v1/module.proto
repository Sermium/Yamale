syntax = "proto3";

package blockchain.market.module.v1;

import "cosmos/app/v1alpha1/module.proto";

option go_package = "yamale/blockchain/x/market/types";

// Module is the app config object of the secondary market.
message Module {
  option (cosmos.app.v1alpha1.module) = {go_import: "yamale/blockchain/x/market"};

  // authority defines the custom module authority. If not set, defaults to the
  // governance module account.
  string authority = 1;
}
