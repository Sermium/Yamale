syntax = "proto3";

package blockchain.emission.v1;

import "amino/amino.proto";
import "blockchain/emission/v1/emission_state.proto";
import "blockchain/emission/v1/params.proto";
import "gogoproto/gogo.proto";

option go_package = "yamale/blockchain/x/emission/types";

// GenesisState defines the emission module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  EmissionState emission_state = 2;
}
