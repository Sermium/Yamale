syntax = "proto3";

package blockchain.validatorgov.v1;

import "amino/amino.proto";
import "blockchain/validatorgov/v1/params.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "yamale/blockchain/x/validatorgov/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams defines a (governance) operation for updating the module
  // parameters. The authority defaults to the x/gov module account.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // ApplyValidator defines the ApplyValidator RPC.
  rpc ApplyValidator(MsgApplyValidator) returns (MsgApplyValidatorResponse);

  // ApproveValidator defines the ApproveValidator RPC. It is authority-gated
  // (the x/gov module account) and approves or rejects a pending validator
  // application submitted via ApplyValidator.
  rpc ApproveValidator(MsgApproveValidator) returns (MsgApproveValidatorResponse);

  // RotateOperator defines the RotateOperator RPC: the planned path, signed by
  // the operator being replaced.
  rpc RotateOperator(MsgRotateOperator) returns (MsgRotateOperatorResponse);

  // ProposeOperatorRecovery defines the ProposeOperatorRecovery RPC: the
  // recovery path, openable by anybody and inert until approved.
  rpc ProposeOperatorRecovery(MsgProposeOperatorRecovery) returns (MsgProposeOperatorRecoveryResponse);

  // ApproveOperatorRecovery defines the ApproveOperatorRecovery RPC. It is
  // authority-gated by the same account that admits validators, because
  // recovering one should be exactly as hard as admitting one.
  rpc ApproveOperatorRecovery(MsgApproveOperatorRecovery) returns (MsgApproveOperatorRecoveryResponse);

  // CancelOperatorRotation defines the CancelOperatorRotation RPC, which lets
  // the current operator withdraw a rotation before it takes effect.
  rpc CancelOperatorRotation(MsgCancelOperatorRotation) returns (MsgCancelOperatorRotationResponse);

  // AttestOwnership defines the AttestOwnership RPC: the operator re-signing
  // for who is behind it, which is what keeps a declaration from going stale.
  rpc AttestOwnership(MsgAttestOwnership) returns (MsgAttestOwnershipResponse);

  // SetValidatorPower defines the SetValidatorPower RPC. It is authority-gated
  // and moves how many seats one admitted validator holds.
  rpc SetValidatorPower(MsgSetValidatorPower) returns (MsgSetValidatorPowerResponse);
}
// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "blockchain/x/validatorgov/MsgUpdateParams";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the module parameters to update.

  // NOTE: All parameters must be supplied.
  Params params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}

// MsgApplyValidator defines the MsgApplyValidator message.
//
// The three declaration fields are required, and requiring them here rather
// than collecting them later is the point: an admission vote that cannot see
// the owner and the jurisdiction behind a candidate is a vote on a moniker, and
// a set admitted without them can never have a concentration ceiling computed
// over it at all.
message MsgApplyValidator {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string moniker = 2;
  string description = 3;

  // legal_entity_id identifies the applying entity.
  string legal_entity_id = 4;

  // beneficial_owner_id identifies whoever ultimately owns it. Where an entity
  // has no owner above it, this is the entity's own identifier — stated rather
  // than left blank, so that "nobody owns us" is a claim somebody signed.
  string beneficial_owner_id = 5;

  // jurisdiction is an ISO 3166-1 alpha-2 code from the assigned list.
  string jurisdiction = 6;
}

// MsgApplyValidatorResponse defines the MsgApplyValidatorResponse message.
message MsgApplyValidatorResponse {}

// MsgApproveValidator is the Msg/ApproveValidator request type.
message MsgApproveValidator {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "blockchain/x/validatorgov/MsgApproveValidator";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string candidate = 2;
  bool approve = 3;
}

// MsgApproveValidatorResponse defines the MsgApproveValidatorResponse message.
message MsgApproveValidatorResponse {}

// MsgRotateOperator moves a validator's operator key, signed by the operator
// being replaced.
//
// There is nothing to prove here beyond the signature. Anyone who can submit
// this already controls everything the operator address protects, so demanding
// a vote for it would only push operators towards waiting for a loss — and the
// path for a loss is the slow one.
message MsgRotateOperator {
  option (cosmos.msg.v1.signer) = "creator";
  option (amino.name) = "blockchain/x/validatorgov/MsgRotateOperator";

  // creator is the current operator address.
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // new_operator is the address that takes over after the delay.
  string new_operator = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgRotateOperatorResponse returns the id of the rotation that was opened.
message MsgRotateOperatorResponse {
  uint64 rotation_id = 1;
}

// MsgProposeOperatorRecovery opens a claim that an operator's key is gone.
//
// Anybody may submit it, because the person best placed to notice is rarely the
// person who lost the key. It does nothing on its own: the validator is not
// paused and no clock starts until the admission quorum approves it, or a
// single transaction from anybody would be enough to pause any validator on
// the chain.
message MsgProposeOperatorRecovery {
  option (cosmos.msg.v1.signer) = "creator";
  option (amino.name) = "blockchain/x/validatorgov/MsgProposeOperatorRecovery";

  // creator is whoever noticed, which is anybody.
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // current_operator is the operator address whose key is claimed to be lost.
  string current_operator = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // new_operator is the address proposed to take over.
  string new_operator = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // reason is the stated grounds, in plain words. Required: a claim that
  // somebody's key is gone should have to say how that is known.
  string reason = 4;
}

// MsgProposeOperatorRecoveryResponse returns the id of the rotation that was
// opened.
message MsgProposeOperatorRecoveryResponse {
  uint64 rotation_id = 1;
}

// MsgApproveOperatorRecovery is the admission quorum's decision on a recovery.
// Approving it pauses the validator and starts the challenge window; refusing
// it closes the rotation.
message MsgApproveOperatorRecovery {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "blockchain/x/validatorgov/MsgApproveOperatorRecovery";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // rotation_id is the recovery being decided.
  uint64 rotation_id = 2;

  // approve is the decision.
  bool approve = 3;
}

// MsgApproveOperatorRecoveryResponse defines the response structure for
// executing a MsgApproveOperatorRecovery message.
message MsgApproveOperatorRecoveryResponse {}

// MsgCancelOperatorRotation withdraws a rotation before it takes effect,
// signed by the operator being replaced.
//
// On a recovery this is redundant with the veto — signing anything at all ends
// it — and it is offered anyway so that an operator who wants to object
// explicitly has something to sign that says so, rather than having to
// discover that any transaction would have done.
message MsgCancelOperatorRotation {
  option (cosmos.msg.v1.signer) = "creator";
  option (amino.name) = "blockchain/x/validatorgov/MsgCancelOperatorRotation";

  // creator is the current operator address.
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // rotation_id is the rotation being withdrawn.
  uint64 rotation_id = 2;
}

// MsgCancelOperatorRotationResponse defines the response structure for
// executing a MsgCancelOperatorRotation message.
message MsgCancelOperatorRotationResponse {}

// MsgAttestOwnership is the operator re-signing for its own declaration.
//
// It carries the whole declaration rather than only a timestamp, because the
// event it exists to catch is an ownership change: an operator whose owner
// changed and who re-attested the old values has made a false statement on the
// record with its own key, which is a fact a supervisor can act on. A bare
// heartbeat would have let the same operator keep a stale declaration fresh
// without ever restating it.
message MsgAttestOwnership {
  option (cosmos.msg.v1.signer) = "creator";
  option (amino.name) = "blockchain/x/validatorgov/MsgAttestOwnership";

  // creator is the approved operator address, in its account form.
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  string legal_entity_id = 2;
  string beneficial_owner_id = 3;
  string jurisdiction = 4;
}

// MsgAttestOwnershipResponse defines the response structure for executing a
// MsgAttestOwnership message.
message MsgAttestOwnershipResponse {}

// MsgSetValidatorPower sets how many seats an admitted validator holds.
//
// Equal seats is the default a genesis is built with, not a constant the chain
// enforces: admission is already a governance decision, so governance decides
// weight directly rather than leaving it to whoever bonded the most. This
// message is how it does that.
//
// It deliberately does not check the concentration ceilings. A power set above
// a cap is accepted here and trimmed by the epoch check like any other breach,
// for the same reason the caps are enforced at every epoch rather than at
// admission: a ceiling that is only tested when power is granted is not a
// ceiling, and a proposal is one of the ways power arrives. Refusing here as
// well would have made the ceiling look enforced while leaving the path that
// matters — growth, merger, nationalisation — unguarded.
//
// Seats are moved by delegating from the module's own seat reserve and
// undelegating back into it, which is the only path that changes consensus
// power without minting anything and without writing to x/staking behind its
// back. A reserve with too few seats fails the message rather than the block.
message MsgSetValidatorPower {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "blockchain/x/validatorgov/MsgSetValidatorPower";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // validator is the operator address, in its account form.
  string validator = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // seats is the power the validator is to carry. Zero is refused: a validator
  // with no seats is one that has been removed, and removing one should say so
  // rather than arrive as a power update that happens to be empty.
  uint64 seats = 3;
}

// MsgSetValidatorPowerResponse returns the seats the validator holds after the
// message, which is what it asked for unless the reserve could not cover it.
message MsgSetValidatorPowerResponse {
  uint64 seats = 1;
}
