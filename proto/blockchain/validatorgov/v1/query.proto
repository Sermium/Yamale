syntax = "proto3";

package blockchain.validatorgov.v1;

import "amino/amino.proto";
import "blockchain/validatorgov/v1/approved_validator.proto";
import "blockchain/validatorgov/v1/concentration.proto";
import "blockchain/validatorgov/v1/params.proto";
import "blockchain/validatorgov/v1/rotation.proto";
import "blockchain/validatorgov/v1/validator_application.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";

option go_package = "yamale/blockchain/x/validatorgov/types";

// Query defines the gRPC querier service.
service Query {
  // Parameters queries the parameters of the module.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/yamale/blockchain/validatorgov/v1/params";
  }

  // ListValidatorApplication Queries a list of ValidatorApplication items.
  rpc GetValidatorApplication(QueryGetValidatorApplicationRequest) returns (QueryGetValidatorApplicationResponse) {
    option (google.api.http).get = "/yamale/blockchain/validatorgov/v1/validator_application/{candidate}";
  }

  // ListValidatorApplication defines the ListValidatorApplication RPC.
  rpc ListValidatorApplication(QueryAllValidatorApplicationRequest) returns (QueryAllValidatorApplicationResponse) {
    option (google.api.http).get = "/yamale/blockchain/validatorgov/v1/validator_application";
  }

  // ListApprovedValidator Queries a list of ApprovedValidator items.
  rpc GetApprovedValidator(QueryGetApprovedValidatorRequest) returns (QueryGetApprovedValidatorResponse) {
    option (google.api.http).get = "/yamale/blockchain/validatorgov/v1/approved_validator/{candidate}";
  }

  // ListApprovedValidator defines the ListApprovedValidator RPC.
  rpc ListApprovedValidator(QueryAllApprovedValidatorRequest) returns (QueryAllApprovedValidatorResponse) {
    option (google.api.http).get = "/yamale/blockchain/validatorgov/v1/approved_validator";
  }

  // GetOperatorRotation queries one rotation by id.
  rpc GetOperatorRotation(QueryGetOperatorRotationRequest) returns (QueryGetOperatorRotationResponse) {
    option (google.api.http).get = "/yamale/blockchain/validatorgov/v1/operator_rotation/{id}";
  }

  // ListOperatorRotation queries every rotation ever opened.
  rpc ListOperatorRotation(QueryAllOperatorRotationRequest) returns (QueryAllOperatorRotationResponse) {
    option (google.api.http).get = "/yamale/blockchain/validatorgov/v1/operator_rotation";
  }

  // PendingOperatorRotation queries the open rotation against one operator, if
  // there is one. This is the query a delegator runs before deciding whether to
  // undelegate, so it answers from the address they already know rather than
  // from a rotation id they would have to go and find.
  rpc PendingOperatorRotation(QueryPendingOperatorRotationRequest) returns (QueryPendingOperatorRotationResponse) {
    option (google.api.http).get = "/yamale/blockchain/validatorgov/v1/pending_operator_rotation/{current_operator}";
  }

  // Concentration reports what every declared entity, owner and jurisdiction
  // currently holds, against its ceiling.
  //
  // This is the supervisor's query. Under equal seats a ceiling is a count out
  // of a count, so the answer is meant to be checked against a list of admitted
  // validators by somebody who is not recomputing anything — which is the whole
  // argument for declaring ownership on-chain rather than filing it somewhere.
  rpc Concentration(QueryConcentrationRequest) returns (QueryConcentrationResponse) {
    option (google.api.http).get = "/yamale/blockchain/validatorgov/v1/concentration";
  }

  // ListDemotion queries every demotion currently in force.
  rpc ListDemotion(QueryAllDemotionRequest) returns (QueryAllDemotionResponse) {
    option (google.api.http).get = "/yamale/blockchain/validatorgov/v1/demotion";
  }

  // JurisdictionReconciliation sets each approved validator's declared country
  // beside the country the chain has recorded for its operator account, and says
  // whether the two agree.
  //
  // The chain holds that fact twice, and it is not a duplication to be tidied
  // away. A validator declares its jurisdiction when it applies: the declaration
  // is signed by the operator, checked against the assigned country list, and it
  // is what the concentration ceilings group by, because a ceiling on the power
  // answering to one national authority has to be computed over something the
  // applicant is on the record as claiming. The jurisdiction registry in x/alias
  // is the other thing entirely: it is written by the approved participant that
  // onboarded the account and did the know-your-customer work, or corrected by a
  // foundation administrator, and never by the account itself. One is a claim
  // under the claimant's own key. The other is a finding by somebody who looked.
  //
  // So the two are reconciled here and merged nowhere. Overwriting the
  // declaration from the registry would destroy the signature that makes a false
  // declaration an offence rather than a data-entry error; overwriting the
  // registry from the declaration would let a validator place itself in whatever
  // perimeter has the least authority watching it, which is the single thing the
  // registry exists to prevent. Neither registry is the other's source, and the
  // useful product of having both is the disagreement.
  //
  // A disagreement is not by itself a breach and nothing is done to a validator
  // for it. What it means is that one of two things has gone wrong and a human
  // has to find out which: the validator declared a country it does not answer
  // to, or the participant recorded the wrong one. Both are worth knowing, and
  // the second matters more, because the jurisdiction ceiling is being computed
  // over the declaration while every authority acting on that account is being
  // scoped by the record.
  rpc JurisdictionReconciliation(QueryJurisdictionReconciliationRequest) returns (QueryJurisdictionReconciliationResponse) {
    option (google.api.http).get = "/yamale/blockchain/validatorgov/v1/jurisdiction_reconciliation";
  }
}
// QueryParamsRequest is request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is response type for the Query/Params RPC method.
message QueryParamsResponse {
  // params holds all the parameters of this module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryGetValidatorApplicationRequest defines the QueryGetValidatorApplicationRequest message.
message QueryGetValidatorApplicationRequest {
  string candidate = 1;
}

// QueryGetValidatorApplicationResponse defines the QueryGetValidatorApplicationResponse message.
message QueryGetValidatorApplicationResponse {
  ValidatorApplication validator_application = 1 [(gogoproto.nullable) = false];
}

// QueryAllValidatorApplicationRequest defines the QueryAllValidatorApplicationRequest message.
message QueryAllValidatorApplicationRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

// QueryAllValidatorApplicationResponse defines the QueryAllValidatorApplicationResponse message.
message QueryAllValidatorApplicationResponse {
  repeated ValidatorApplication validator_application = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryGetApprovedValidatorRequest defines the QueryGetApprovedValidatorRequest message.
message QueryGetApprovedValidatorRequest {
  string candidate = 1;
}

// QueryGetApprovedValidatorResponse defines the QueryGetApprovedValidatorResponse message.
message QueryGetApprovedValidatorResponse {
  ApprovedValidator approved_validator = 1 [(gogoproto.nullable) = false];
}

// QueryAllApprovedValidatorRequest defines the QueryAllApprovedValidatorRequest message.
message QueryAllApprovedValidatorRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

// QueryAllApprovedValidatorResponse defines the QueryAllApprovedValidatorResponse message.
message QueryAllApprovedValidatorResponse {
  repeated ApprovedValidator approved_validator = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryGetOperatorRotationRequest defines the QueryGetOperatorRotationRequest message.
message QueryGetOperatorRotationRequest {
  uint64 id = 1;
}

// QueryGetOperatorRotationResponse defines the QueryGetOperatorRotationResponse message.
message QueryGetOperatorRotationResponse {
  OperatorRotation operator_rotation = 1 [(gogoproto.nullable) = false];
}

// QueryAllOperatorRotationRequest defines the QueryAllOperatorRotationRequest message.
message QueryAllOperatorRotationRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

// QueryAllOperatorRotationResponse defines the QueryAllOperatorRotationResponse message.
message QueryAllOperatorRotationResponse {
  repeated OperatorRotation operator_rotation = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryPendingOperatorRotationRequest defines the QueryPendingOperatorRotationRequest message.
message QueryPendingOperatorRotationRequest {
  string current_operator = 1;
}

// QueryPendingOperatorRotationResponse defines the QueryPendingOperatorRotationResponse message.
message QueryPendingOperatorRotationResponse {
  // found is false when nothing is pending against the operator. Reported as a
  // field rather than as a not-found error, because "no rotation is pending" is
  // the answer the question has, not a failure to answer it.
  bool found = 1;
  OperatorRotation operator_rotation = 2 [(gogoproto.nullable) = false];
}

// QueryConcentrationRequest defines the QueryConcentrationRequest message.
message QueryConcentrationRequest {}

// QueryConcentrationResponse defines the QueryConcentrationResponse message.
message QueryConcentrationResponse {
  repeated ConcentrationGroup groups = 1 [(gogoproto.nullable) = false];

  // total_power is the denominator every share above was measured against: the
  // power of the validators active right now. Returned alongside so that a
  // reader can check the arithmetic rather than trust it.
  int64 total_power = 2;

  // active_validators and min_active_validators say whether the check is in a
  // position to act at all. A breach reported while these are equal is one the
  // chain has decided not to correct, and that distinction is invisible from
  // the shares alone.
  uint32 active_validators = 3;
  uint32 min_active_validators = 4;
}

// QueryAllDemotionRequest defines the QueryAllDemotionRequest message.
message QueryAllDemotionRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

// QueryAllDemotionResponse defines the QueryAllDemotionResponse message.
message QueryAllDemotionResponse {
  repeated Demotion demotion = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// JurisdictionAgreement is what the two registries say about one validator when
// they are set beside each other.
//
// Three outcomes and not two. "No record" is kept apart from "they agree"
// because collapsing them is how a reconciliation stops reconciling: an account
// nobody has placed would report as agreeing with a declaration nobody has
// checked, and the query would grow quieter exactly as the registry emptied out.
enum JurisdictionAgreement {
  option (gogoproto.goproto_enum_prefix) = false;

  // JURISDICTION_AGREEMENT_UNSPECIFIED is the unset default and is never a
  // finding.
  //
  // The zero value is reserved rather than given to a real outcome, and no
  // reader should treat it as one. Proto3 cannot tell a zero from an absent
  // field, so if the first of these values were AGREE, a row this module failed
  // to fill in would arrive at a supervisor's console indistinguishable from a
  // validator whose country two independent parties concur on — and it is the
  // reassuring reading that must never be the one a bug produces.
  JURISDICTION_AGREEMENT_UNSPECIFIED = 0;

  // JURISDICTION_AGREEMENT_AGREE means the validator declared the country the
  // chain has recorded against its operator account. A self-attested claim and
  // an onboarding participant's finding pointing at the same place, which is the
  // state the register is supposed to be in.
  JURISDICTION_AGREEMENT_AGREE = 1;

  // JURISDICTION_AGREEMENT_DISAGREE means the two name different countries.
  //
  // Reported, never resolved. The chain cannot tell which party is wrong — it
  // has no way to verify either statement — so it publishes both alongside the
  // account that recorded one and the operator that signed the other, and leaves
  // the finding to whoever can actually check.
  JURISDICTION_AGREEMENT_DISAGREE = 2;

  // JURISDICTION_AGREEMENT_UNRECORDED means the validator declared a country and
  // the chain has no jurisdiction record for its operator account at all.
  //
  // Not agreement and not a failure of the query: the declaration stands
  // uncorroborated, which is a distinct and actionable state. It is the ordinary
  // state of a validator that was approved by governance without ever being
  // anybody's onboarded customer, and the remedy is to place the account, not to
  // trust the declaration harder.
  JURISDICTION_AGREEMENT_UNRECORDED = 3;
}

// JurisdictionReconciliation is one approved validator with both countries and
// the finding.
message JurisdictionReconciliation {
  // candidate is the operator address in its account form, matching how the
  // approval allowlist, the rotation records and the jurisdiction registry all
  // key an operator.
  string candidate = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // declared_jurisdiction is the country from the validator's own declaration:
  // an ISO 3166-1 alpha-2 code, signed for at application and re-signed at every
  // attestation. Never empty on an approved validator — a blank one is refused at
  // the message, because a validator belonging to no jurisdiction group would sit
  // outside the one ceiling that keeps a single state below a blocking minority.
  string declared_jurisdiction = 2;

  // recorded_jurisdiction is the country x/alias holds against the same account,
  // and it is empty when there is no record. Empty rather than a placeholder code,
  // because every code that could stand in here means something else: a real
  // country would invent a perimeter, and the foundation's reserved code would
  // claim the account is outside every national perimeter on purpose.
  string recorded_jurisdiction = 3;

  // recorded_by is the participant or foundation administrator that wrote the
  // record, and it is empty when there is none.
  //
  // This is the field the query is for. "Senegal" and "Senegal, according to the
  // bank that onboarded them" are not the same fact, and a reconciliation that
  // reported only the two codes would show a supervisor a mismatch without
  // showing them who to ask about it.
  string recorded_by = 4 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // recorded_at_height is when the record was last written, so a disagreement
  // that appeared because somebody corrected a country is distinguishable from
  // one that has been sitting there since the account was onboarded. Zero when
  // there is no record.
  int64 recorded_at_height = 5;

  // agreement is the finding. Never JURISDICTION_AGREEMENT_UNSPECIFIED.
  JurisdictionAgreement agreement = 6;
}

// QueryJurisdictionReconciliationRequest defines the
// QueryJurisdictionReconciliationRequest message. It takes no arguments: this is
// the supervisory view of the whole register, and narrowing it to one validator
// is what GetApprovedValidator and x/alias's Jurisdiction query already do.
message QueryJurisdictionReconciliationRequest {}

// QueryJurisdictionReconciliationResponse carries every approved validator, not
// only the ones that disagree.
//
// Two reasons for returning the agreements too. A query that answers with an
// empty list when all is well is indistinguishable from one that is broken,
// mis-wired or pointed at an empty registry, and this is precisely the query
// whose silence would be believed. And the denominator is part of the answer:
// "two disagree" means something different out of four validators than out of
// forty, and a caller should not have to run a second query to learn which.
//
// The counts are here so the list does not have to be read to be understood.
// They are over the rows below and nothing else, so they always sum to the
// number of rows.
//
// Applications are deliberately absent. An application is a request, carries no
// consensus power, and its declared country is checked against the assigned list
// at submission and read again by whoever votes on the approval. Mixing the two
// would make the counts uninterpretable — "three disagree" would no longer say
// whether three validators are misplaced or three strangers mistyped a form —
// and it is the approved set the jurisdiction ceiling is actually computed over.
message QueryJurisdictionReconciliationResponse {
  repeated JurisdictionReconciliation records = 1 [(gogoproto.nullable) = false];

  // agree_count, disagree_count and unrecorded_count sum to the number of rows.
  // Returned so an operator sees "three disagree" without scanning, and so that
  // a reader can check the rows against the summary rather than trust it.
  uint32 agree_count = 2;
  uint32 disagree_count = 3;
  uint32 unrecorded_count = 4;
}
