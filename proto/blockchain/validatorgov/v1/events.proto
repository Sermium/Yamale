syntax = "proto3";
package blockchain.validatorgov.v1;

import "blockchain/validatorgov/v1/concentration.proto";
import "blockchain/validatorgov/v1/rotation.proto";
import "cosmos_proto/cosmos.proto";

option go_package = "yamale/blockchain/x/validatorgov/types";

// A pending rotation has to be visible in the block it is proposed in.
// Delegators did not consent to a new operator, and the challenge window is
// their window to undelegate as much as it is the old key's window to object —
// a rotation that only showed up in a query nobody thought to run would take
// that away from both of them.

// EventRotationProposed is emitted when a rotation is opened, by either path.
message EventRotationProposed {
  uint64 rotation_id = 1;
  string current_operator = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string new_operator = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string proposer = 4 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  RotationKind kind = 5;
  string reason = 6;

  // completes_at_height is zero for a recovery that has not been approved yet,
  // because no clock is running on it.
  int64 completes_at_height = 7;
}

// EventRecoveryApproved is emitted when the admission quorum agrees to a
// recovery. This is the moment the validator is paused and the challenge window
// starts, so it is the moment anybody watching needs to hear about.
message EventRecoveryApproved {
  uint64 rotation_id = 1;
  string current_operator = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string new_operator = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  int64 completes_at_height = 4;

  // validator_paused is false when there was no validator to pause — an
  // approved candidate who never created one — or when it was already jailed
  // for something else.
  bool validator_paused = 5;
}

// EventRotationResolved is emitted once, when a rotation reaches its final
// status, including when it is vetoed by the old key signing.
message EventRotationResolved {
  uint64 rotation_id = 1;
  string current_operator = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string new_operator = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  RotationKind kind = 4;
  RotationStatus status = 5;
}

// A demotion has to be visible in the block it happens in. It is the one action
// on this chain that removes a validator's power without anybody proposing it,
// so an operator who found out by noticing it had stopped producing blocks
// would have no way to tell a concentration ceiling from an outage.

// EventValidatorDemoted is emitted when the epoch check takes a validator's
// seats away.
message EventValidatorDemoted {
  string operator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  ConcentrationCap cap = 2;
  string group = 3;
  uint64 group_power_bps = 4;
  uint64 cap_bps = 5;

  // jailed_validator is false when the validator was already jailed for
  // something else, in which case the demotion is recorded but nothing was
  // done to it.
  bool jailed_validator = 6;
}

// EventValidatorRestored is emitted when a breach clears and the seats go back.
// Restoration is automatic and nobody votes on it, so it needs announcing for
// the same reason the demotion did.
message EventValidatorRestored {
  string operator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  ConcentrationCap cap = 2;
  string group = 3;
  bool unjailed_validator = 4;
}

// EventConcentrationUncorrected is emitted when a group is over its ceiling and
// the epoch check will not act, because acting would take the active set below
// the floor.
//
// This is the honest half of the design. A cap can be arithmetically
// unsatisfiable at a given set size, and a check that kept demoting until the
// ceiling held would demote the chain into a halt. So the breach is published
// every epoch instead, which is a problem for governance rather than a problem
// for block production.
message EventConcentrationUncorrected {
  ConcentrationCap cap = 1;
  string group = 2;
  uint64 group_power_bps = 3;
  uint64 cap_bps = 4;
  uint32 active_validators = 5;
  uint32 min_active_validators = 6;
}

// EventDeclarationStale is emitted at each epoch for an approved validator that
// has not re-attested within the interval. Nothing is done about it here; the
// event is the doing. An ownership change that was never declared looks exactly
// like an operator who stopped signing for its own declaration, which is the
// only signal a chain can produce about a statement it cannot verify.
message EventDeclarationStale {
  string operator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  int64 attested_at_height = 2;
  int64 stale_since_height = 3;
}
