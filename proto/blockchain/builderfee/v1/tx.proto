syntax = "proto3";

package blockchain.builderfee.v1;

import "amino/amino.proto";
import "blockchain/builderfee/v1/params.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "yamale/blockchain/x/builderfee/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams defines a (governance) operation for updating the module
  // parameters. The authority defaults to the x/gov module account.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // RegisterBuilder defines the RegisterBuilder RPC.
  rpc RegisterBuilder(MsgRegisterBuilder) returns (MsgRegisterBuilderResponse);

  // ApproveBuilder defines the ApproveBuilder RPC. It is authority-gated
  // (the x/gov module account) and approves or rejects a pending builder
  // registration submitted via MsgRegisterBuilder.
  rpc ApproveBuilder(MsgApproveBuilder) returns (MsgApproveBuilderResponse);
}
// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "blockchain/x/builderfee/MsgUpdateParams";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the module parameters to update.

  // NOTE: All parameters must be supplied.
  Params params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}

// MsgRegisterBuilder defines the MsgRegisterBuilder message.
message MsgRegisterBuilder {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string msg_type_url = 2;
  string payout_address = 3;
}

// MsgRegisterBuilderResponse defines the MsgRegisterBuilderResponse message.
message MsgRegisterBuilderResponse {}

// MsgApproveBuilder is the Msg/ApproveBuilder request type.
message MsgApproveBuilder {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "blockchain/x/builderfee/MsgApproveBuilder";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string msg_type_url = 2;
  bool approve = 3;
}

// MsgApproveBuilderResponse defines the MsgApproveBuilderResponse message.
message MsgApproveBuilderResponse {}
