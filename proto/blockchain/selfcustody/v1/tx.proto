syntax = "proto3";

package blockchain.selfcustody.v1;

import "amino/amino.proto";
import "blockchain/selfcustody/v1/params.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "yamale/blockchain/x/selfcustody/types";

// Msg is the door out: ask, wait, ask again.
//
// Every message here is signed by the ACCOUNT ITSELF. That is the whole
// mechanism. The operator cannot request a disclosure on somebody's behalf,
// cannot refuse one, and cannot accelerate one — and the holder's own signature
// is what makes the record undeniable afterwards.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams sets the delay and the acknowledgement text. Governance only.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // RequestDisclosure starts the waiting period.
  rpc RequestDisclosure(MsgRequestDisclosure) returns (MsgRequestDisclosureResponse);

  // CancelDisclosure stops it. Available to the holder at any time before
  // confirmation, and it is the thing a person whose phone was stolen reaches
  // for once the notice reaches their other devices.
  rpc CancelDisclosure(MsgCancelDisclosure) returns (MsgCancelDisclosureResponse);

  // ConfirmDisclosure ends it. After this the key may be released and the
  // platform's custody obligations over this account are discharged.
  rpc ConfirmDisclosure(MsgConfirmDisclosure) returns (MsgConfirmDisclosureResponse);
}

// MsgUpdateParams sets the delay and the acknowledgement text.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "blockchain/x/selfcustody/MsgUpdateParams";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  Params params = 2 [(gogoproto.nullable) = false];
}
// MsgUpdateParamsResponse is empty.
message MsgUpdateParamsResponse {}

// MsgRequestDisclosure asks for the account's own private key.
//
// Signed by the account, which is the only signature that could mean anything
// here: the request is a statement about the signer's own property, and no
// operator attestation could substitute for it.
//
// The acknowledgement hash must match the one governance published. A request
// naming a different hash is refused rather than recorded, because it means the
// holder was shown some other text — and the entire evidentiary value of this
// record is that we know exactly what they read.
message MsgRequestDisclosure {
  option (cosmos.msg.v1.signer) = "account";
  option (amino.name) = "blockchain/x/selfcustody/MsgRequestDisclosure";

  string account = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string acknowledgement_version = 2;
  string acknowledgement_hash = 3;
}
// MsgRequestDisclosureResponse says when the holder may confirm.
message MsgRequestDisclosureResponse {
  int64 eligible_at = 1;
}

// MsgCancelDisclosure stops a pending request.
message MsgCancelDisclosure {
  option (cosmos.msg.v1.signer) = "account";
  option (amino.name) = "blockchain/x/selfcustody/MsgCancelDisclosure";

  string account = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string reason = 2;
}
// MsgCancelDisclosureResponse is empty.
message MsgCancelDisclosureResponse {}

// MsgConfirmDisclosure completes the pathway.
//
// The acknowledgement is required AGAIN, and deliberately. The holder read the
// warning when they asked; the waiting period exists so they can change their
// mind, and a confirmation that did not re-state what they were agreeing to
// would turn the second step into a formality. If governance has published a
// new warning in the meantime, the old acknowledgement no longer matches and
// they must read the new one — which is the correct outcome, because the terms
// they are accepting have changed.
message MsgConfirmDisclosure {
  option (cosmos.msg.v1.signer) = "account";
  option (amino.name) = "blockchain/x/selfcustody/MsgConfirmDisclosure";

  string account = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string acknowledgement_version = 2;
  string acknowledgement_hash = 3;
}
// MsgConfirmDisclosureResponse is empty. The effect is the permanent record,
// which the Disclosure query reports.
message MsgConfirmDisclosureResponse {}
