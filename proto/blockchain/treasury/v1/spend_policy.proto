syntax = "proto3";
package blockchain.treasury.v1;

option go_package = "yamale/blockchain/x/treasury/types";

// SpendPolicy constrains what a ROLE_SPENDER may move out of a treasury in one
// denom, without needing an admin decision per payment.
//
// The policy is what makes a spender role safe to hand out: it bounds the blast
// radius of a compromised operational key to one period's limit, rather than
// the whole treasury.
message SpendPolicy {
  uint64 treasury_id = 1;
  string denom = 2;

  // per_transaction_limit caps a single spend. Empty means no cap.
  string per_transaction_limit = 3;

  // period_limit caps the total spent within one window, and period_seconds is
  // the window length. Empty period_limit means no cap. The window is fixed,
  // not rolling: it resets when period_seconds elapses since the window opened,
  // which keeps the accounting to a single stored value per denom.
  string period_limit = 4;
  uint64 period_seconds = 5;

  // allowlist restricts destinations. Empty means any destination is allowed;
  // non-empty means only these are.
  repeated string allowlist = 6;

  // blocklist forbids destinations outright. It is checked after the allowlist,
  // so an address in both is denied — the safer reading of a contradiction.
  repeated string blocklist = 7;
}

// SpendWindow tracks consumption of a SpendPolicy's period_limit.
message SpendWindow {
  uint64 treasury_id = 1;
  string denom = 2;
  // spent is the amount already used in the current window.
  string spent = 3;
  // window_start is when the current window opened, in Unix seconds.
  int64 window_start = 4;
}
