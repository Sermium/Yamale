syntax = "proto3";
package blockchain.paymsg.v1;

option go_package = "yamale/blockchain/x/paymsg/types";

// Customer is an account an approved participant acts for.
//
// One participant per customer, mirroring the arrangement it describes: an
// account holder's payment service provider is a single institution, and
// allowing several would reintroduce the ambiguity about who instructed a
// payment that this record exists to remove.
message Customer {
  string customer = 1;
  string participant = 2;
}
