syntax = "proto3";
package blockchain.paymsg.v1;

option go_package = "yamale/blockchain/x/paymsg/types";

// PaymentMetadata is the ISO 20022 detail that used to travel in
// MsgSendPayment's purpose_code and remittance_information fields.
//
// It is never sent to the chain and is never stored by it. The chain sees only
// SHA-256 over this message's encoding, in MsgSendPayment.metadata_hash; the
// message itself is held off-chain by the parties. It is declared here, rather
// than in each client, so that the payer, the payee, the regulator and the node
// all hash the same bytes — three hand-written serialisers in three languages
// would agree until the first field anybody added, and a hash that disagrees
// proves nothing while looking exactly like a hash that works.
//
// Encoding is the protobuf encoding: fields in ascending number, defaults
// omitted. That is the same determinism the chain already stakes transaction
// signing on, so it is not a new assumption.
message PaymentMetadata {
  // salt is 32 random bytes, regenerated for every payment.
  //
  // Without it this whole exercise publishes what it set out to hide. A purpose
  // code is four characters drawn from a published list, so the unsalted hash
  // of one is not a fingerprint — it is a lookup table anybody can build in a
  // second. Remittance text is barely better: invoice numbers and names are
  // guessable, and the ledger is public and permanent, so a guess can be tested
  // for as long as the chain exists.
  //
  // Regenerated per payment, not per account, because a reused salt means two
  // payments carrying the same detail hash to the same value, which tells an
  // observer they are the same detail without ever revealing what it is.
  bytes salt = 1;

  string purpose_code = 2;
  string remittance_information = 3;
}
