# Evaluating DKLs23 as a replacement for tss-lib's GG18.
#
# # Why this runs in CI and not on a host
#
# Neither machine can build Rust. Measured 2026-09-09: the VM has 954 MB of RAM
# with 258 MB available and the Pi has 1837 MB with 261 MB available, and each
# one runs a validator. Both validators hold more than a third of the voting
# power, so losing EITHER drops the chain below the two-thirds it needs and
# block production stops — and a Rust crypto build saturating two cores for
# several minutes can make a node miss consensus timeouts without any process
# being killed. There is 4 GB of NVMe swap on the VM, which makes an actual OOM
# kill unlikely; it does not make a stalled validator unlikely.
#
# Amendment 1 also needs both validators alive to ratify before 2026-09-14.
#
# # Why the probes are JOBS and not steps
#
# Actions logs need authentication to read: /logs answers 403 and the job page
# asks for sign-in. Step names and conclusions are public, so the first attempt
# put one assumption in each step and read the pattern of pass and fail.
#
# That does not work, and the way it fails is worth writing down. A step marked
# `continue-on-error: true` reports its CONCLUSION as success even when it
# failed — the real result is in `outcome`, which the jobs API does not expose
# per step. So five probes all reported success while the spike they were
# diagnosing had not compiled at all. A check that passes regardless of what it
# is checking is worse than no check, and that is what those steps were.
#
# Job conclusions are truthful. So each probe is a matrix leg with
# fail-fast disabled: they run in parallel, each fails honestly, and the
# resulting matrix is readable from the public API.
name: DKLs23 spike

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "silence-laboratories/dkls23 ref to evaluate"
        required: false
        default: "main"

permissions:
  contents: read

jobs:
  evaluate:
    name: Build and run the library's own examples
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the library
        uses: actions/checkout@v4
        with:
          repository: silence-laboratories/dkls23
          ref: ${{ inputs.ref }}
          path: dkls23

      - name: The licence, in full
        # Step one because the audited implementation is under Silence
        # Laboratories' non-commercial licence, which permits government bodies
        # and excludes internal business use. Whether Yamale qualifies is a
        # question for counsel, and counsel needs the text without a toolchain.
        run: cat dkls23/LICENSE || cat dkls23/LICENSE.md || ls dkls23

      - name: What the crate declares
        run: |
          echo "=============== Cargo.toml"
          cat dkls23/Cargo.toml
          echo "=============== rust-toolchain, if pinned"
          cat dkls23/rust-toolchain.toml 2>/dev/null || cat dkls23/rust-toolchain 2>/dev/null || echo "(not pinned)"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            dkls23/target
          key: dkls-${{ runner.os }}-${{ hashFiles('dkls23/Cargo.toml') }}

      - name: The setup API, which could not be read remotely
        working-directory: dkls23
        run: |
          for f in $(find src/setup -type f -name '*.rs' | sort); do
            echo "--------------- $f"
            cat "$f"
          done

      - name: The examples, and the helper the README does not place
        working-directory: dkls23
        run: |
          for f in $(find examples -type f -name '*.rs' 2>/dev/null | sort); do
            echo "--------------- $f"
            cat "$f"
          done

      - name: Build
        working-directory: dkls23
        run: cargo build --release --examples

      - name: Key generation — 2 of 3, and how long it takes
        working-directory: dkls23
        run: |
          start=$(date +%s%3N)
          cargo run --release --example keygen
          echo "keygen wall time: $(( $(date +%s%3N) - start )) ms"
          echo "tss-lib GG18 on the same shape, measured 2026-08-31: 65,000 ms"

      - name: Signing — the number that decides the product question
        working-directory: dkls23
        run: |
          start=$(date +%s%3N)
          cargo run --release --example sign
          echo "sign wall time: $(( $(date +%s%3N) - start )) ms"

      - name: Key refresh — this is the password-reset path
        working-directory: dkls23
        run: |
          start=$(date +%s%3N)
          cargo run --release --example refresh
          echo "refresh wall time: $(( $(date +%s%3N) - start )) ms"
          echo "tss-lib GG18 reshare, measured 2026-08-31: 81,000 ms"

  probe:
    # One assumption per job, so the conclusion is the answer.
    #
    # B and C test the same call two ways deliberately: whichever compiles says
    # what public_key().to_bytes() returns, and if both fail the answer is
    # neither and the type wants as_bytes(). Two legs in one run rather than one
    # leg in two.
    name: "probe: ${{ matrix.probe }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        probe:
          - probe_a_helpers
          - probe_b_pubkey_as_slice
          - probe_c_pubkey_as_ref
          - probe_d_sign_tuple
          - probe_e_sig_bytes

    steps:
      - name: Check out Yamale
        uses: actions/checkout@v4
        with:
          path: yamale

      - name: Check out the library
        uses: actions/checkout@v4
        with:
          repository: silence-laboratories/dkls23
          ref: ${{ inputs.ref }}
          path: dkls23

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            dkls23/target
          key: dkls-${{ runner.os }}-${{ hashFiles('dkls23/Cargo.toml') }}

      - name: Register just this probe
        # Cargo.toml declares its examples explicitly, which turns autodiscovery
        # off — it has to, because examples/common.rs has no main() and would
        # fail to build as an example of its own. So a copied file is not a
        # target until it is named here.
        run: |
          cp "yamale/spike/dkls23/probes/${{ matrix.probe }}.rs" "dkls23/examples/${{ matrix.probe }}.rs"
          printf '\n[[example]]\nname = "%s"\n' "${{ matrix.probe }}" >> dkls23/Cargo.toml

      - name: Compile it
        working-directory: dkls23
        run: cargo build --release --example ${{ matrix.probe }} --message-format=short

  cosmos:
    name: Is a DKLs23 signature usable on this chain?
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Yamale
        uses: actions/checkout@v4
        with:
          path: yamale

      - name: Check out the library
        uses: actions/checkout@v4
        with:
          repository: silence-laboratories/dkls23
          ref: ${{ inputs.ref }}
          path: dkls23

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: yamale/go.mod
          cache-dependency-path: yamale/go.sum

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            dkls23/target
          key: dkls-${{ runner.os }}-${{ hashFiles('dkls23/Cargo.toml') }}

      - name: Graft our example into the library's own examples
        # Built inside their tree rather than as a crate of ours so it resolves
        # the versions the library pins — one k256 in the graph, not two — and
        # so it can use examples/common.rs, which already compiles here.
        run: |
          cp yamale/spike/dkls23/cosmos_spike.rs dkls23/examples/cosmos_spike.rs
          printf '\n[[example]]\nname = "cosmos_spike"\n' >> dkls23/Cargo.toml

      - name: Compile the spike
        # No continue-on-error anywhere in this job. A failure here should stop
        # the job and say so, and the probe matrix is what explains it.
        working-directory: dkls23
        run: cargo build --release --example cosmos_spike --message-format=short

      - name: Sign, and print the three values that decide it
        working-directory: dkls23
        run: |
          cargo run --quiet --release --example cosmos_spike | tee "$RUNNER_TEMP/spike.json"
          test -s "$RUNNER_TEMP/spike.json"

      - name: Verify it against the chain's own derivation
        working-directory: yamale
        env:
          DKLS_SPIKE_JSON: ${{ runner.temp }}/spike.json
        run: go test ./spike/... -run TestDklsSignatureIsUsableOnThisChain -v

      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dkls23-cosmos-spike
          path: ${{ runner.temp }}/spike.json
          if-no-files-found: warn
